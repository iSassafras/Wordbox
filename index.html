    'The genitive plural is a personality test.'
  ];
  var LOADING_QUOTE = LOADING_QUOTES[Math.floor(Math.random() * LOADING_QUOTES.length)];

  var CORRECT_MSGS = [
    'Nailed it!', 'Perfect!', 'Spot on!', 'Yes!', 'Too easy!',
    'You got it!', 'Sharp!', 'Locked in.', 'Clean.'
  ];
  var WRONG_MSGS = [
    'Not quite.', 'Close one.', 'Next time.', 'Almost had it.',
    'Tricky one.', 'It happens.', 'Keep at it.'
  ];
  var STREAK_MSGS = {
    3: 'Three in a row!',
    5: 'Five straight!',
    10: 'Ten! On fire.',
    20: 'Twenty. Unstoppable.'
  };

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  // ---------- SOUND ----------
  // Right/wrong sounds come from two MP3 files next to index.html (see SOUND
  // FILES below). The tones synthesised here with the Web Audio API are the
  // fallback whenever a file hasn't loaded. Either way it stays silent until
  // you've actually tapped something (iOS won't start an audio context
  // before a user gesture anyway).
  var audioCtx = null;
  var audioUnlocked = false;
  var keepAlive = null;

  // Declaring the session type is not itself audio: it starts nothing, plays
  // nothing, and needs no user gesture. So it happens here, at load, before
  // any line below can create a context, an <audio> element or an utterance.
  // Set later, it would be set after iOS had already decided what kind of
  // session this page owns.
  //
  // iOS offers no way to both mix with music and play in silent mode:
  //   'ambient'  mixes with music, but silent mode mutes the app.
  //   'playback' plays in silent mode, but pauses other audio.
  // Georg chose sound in silent mode over music (2026-09-19l). Tested first:
  // with 'ambient', a silent <audio> clip does NOT get past silent mode.
  // To go back to mixing with music, set this to 'ambient' — nothing else
  // needs to change.
  //
  // Declaring the type should pause nothing by itself. Other audio should stop
  // only once the app actually makes sound: starting a lesson with sound or
  // speech on, tapping a speaker button, or switching sound effects on.
  var AUDIO_SESSION_TYPE = 'playback';
  var audioSessionOk = false;
  try {
    if (navigator.audioSession){
      navigator.audioSession.type = AUDIO_SESSION_TYPE;
      audioSessionOk = (navigator.audioSession.type === AUDIO_SESSION_TYPE);
    }
  } catch (e) {}

  function unlockAudio(){
    if (audioUnlocked) return;
    // Never claim the audio session unless sound is actually wanted. With both
    // toggles off the app should be silent AND invisible to other audio apps.
    if (!state.soundOn && !state.speechOn) return;
    audioUnlocked = true;
    try { if (navigator.audioSession) navigator.audioSession.type = AUDIO_SESSION_TYPE; } catch (e) {}
    // Priming the speech engine is what takes the audio session on iOS, so it
    // only happens when speech is actually switched on. Doing it for someone
    // running with speech off was stopping their music for no benefit at all.
    if (state.speechOn){
      try {
        if ('speechSynthesis' in window){
          var prime = new SpeechSynthesisUtterance(' ');
          prime.volume = 0;
          window.speechSynthesis.speak(prime);
        }
      } catch (e) {}
    }
  }

  // Every resume() re-activates the audio session, and every activation is a
  // fresh chance for iOS to interrupt whatever else is playing — which is the
  // likeliest reason a sound on each card stopped the music each time, while
  // speech (one session, held open) only did it once.
  //
  // Where the session type was accepted, the fix is to stop letting the
  // context lapse: a silent source holds it open, so it is activated once and
  // then stays up. (With 'playback' that also means music stays paused while
  // the app is in front, instead of being interrupted again on every card.) Where navigator.audioSession is missing, holding it open
  // would keep other apps ducked indefinitely, so it falls back to the old
  // create-and-resume behaviour rather than risking something worse.
  function ensureCtx(){
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioSessionOk && !keepAlive && audioCtx.createConstantSource){
      try {
        var src = audioCtx.createConstantSource();
        var g = audioCtx.createGain();
        src.offset.value = 0;   // silence, but a running node all the same
        g.gain.value = 0;
        src.connect(g);
        g.connect(audioCtx.destination);
        src.start();
        keepAlive = src;
      } catch (e) { keepAlive = null; }
    }
    if (audioCtx.state === 'suspended'){
      try { audioCtx.resume(); } catch (e) {}
    }
    // Decode any sound files that have arrived; a no-op once they're done.
    try { decodeSounds(audioCtx); } catch (e) {}
    return audioCtx;
  }

  // Let go of the session in the background. There is nothing to play, and an
  // app sitting on the audio session it doesn't need is the whole complaint.
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden || !audioCtx) return;
    try { if (keepAlive){ keepAlive.stop(); keepAlive.disconnect(); } } catch (e) {}
    keepAlive = null;
    try { audioCtx.suspend(); } catch (e) {}
  });

  function playSeq(steps){
    if (!state.soundOn) return;
    try {
      unlockAudio();
      var ctx = ensureCtx();
      if (!ctx) return;
      var t0 = ctx.currentTime;
      steps.forEach(function(st){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = st.type || 'sine';
        osc.frequency.setValueAtTime(st.f, t0 + st.at);
        // Ramped rather than switched on, so it doesn't click.
        gain.gain.setValueAtTime(0.0001, t0 + st.at);
        gain.gain.exponentialRampToValueAtTime(st.v || 0.14, t0 + st.at + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + st.at + st.d);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t0 + st.at);
        osc.stop(t0 + st.at + st.d + 0.03);
      });
    } catch (e) {
      // Audio is a nicety; never let it break an answer.
    }
  }

  // ---------- SOUND FILES ----------
  // The bytes are fetched at load (plain network, no audio involved). They are
  // decoded later, by the app's real audio context, the first time it exists —
  // i.e. on the first tap that plays a sound. Until then the tone plays.
  // The clips play through the same audio context as the tones, deliberately
  // not through <audio> elements, which would take a separate media session.
  var SOUND_FILES = {
    correct: 'wordbox_sound_success.mp3',
    wrong:   'wordbox_sound_failure.mp3'
  };
  // The files are normalised to full scale, much louder than the tones (0.14).
  // One number to tune if they sit too loud or too quiet over music.
  var SOUND_FILE_GAIN = 0.5;
  var soundData = {};
  var soundBuffers = {};
  var currentClip = null;

  (function fetchSounds(){
    if (!window.fetch) return;
    Object.keys(SOUND_FILES).forEach(function(name){
      fetch(SOUND_FILES[name])
        .then(function(r){
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.arrayBuffer();
        })
        .then(function(data){
          soundData[name] = data;
          if (audioCtx) decodeSounds(audioCtx);
        })
        .catch(function(){ /* stays on the fallback tone */ });
    });
  })();

  function decodeSounds(ctx){
    Object.keys(soundData).forEach(function(name){
      var data = soundData[name];
      delete soundData[name];   // decoding consumes the bytes; one attempt each
      new Promise(function(resolve, reject){
        // Callback form as well as the promise: older Safari only has the former.
        var p = ctx.decodeAudioData(data, resolve, reject);
        if (p && p.then) p.then(resolve, reject);
      }).then(function(buf){
        soundBuffers[name] = buf;
      }).catch(function(){ /* stays on the fallback tone */ });
    });
  }

  function playSoundClip(name){
    var buf = soundBuffers[name];
    if (!state.soundOn) return false;
    if (!buf){
      // Still create/resume the context; ensureCtx() decodes pending files.
      try { unlockAudio(); ensureCtx(); } catch (e) {}
      return false;
    }
    try {
      unlockAudio();
      var ctx = ensureCtx();
      if (!ctx) return false;
      // A new answer cuts off the previous clip rather than piling on top.
      if (currentClip){ try { currentClip.stop(); } catch (e) {} currentClip = null; }
      var src = ctx.createBufferSource();
      var g = ctx.createGain();
      src.buffer = buf;
      g.gain.value = SOUND_FILE_GAIN;
      src.connect(g);
      g.connect(ctx.destination);
      src.onended = function(){ if (currentClip === src) currentClip = null; };
      src.start();
      currentClip = src;
      return true;
    } catch (e) {
      return false;
    }
  }

  // ---------- SPEECH ----------
  // Uses the browser's own voices (SpeechSynthesis). Nothing to download, no
  // API, works offline — but which voices exist is entirely up to the device,
  // so everything here degrades quietly if Ukrainian isn't installed.
  // How many Ukrainian voices exist is entirely up to the device. iOS often
  // ships just one; a desktop may have several. Collect all of them and pick
  // at random per utterance, so hearing a word twice doesn't always sound
  // identical — useful for not tying a word to one particular voice.
  var ukVoices = [];
  var voicesReady = false;

  // Higher-quality voices are downloaded separately on iOS, so a device can
  // end up with both the compact default and an Enhanced or Premium version
  // of the same language. The Web Speech API exposes no quality field, but
  // Apple puts the tier in the voice name, so rank on that and keep only the
  // best tier present — otherwise a random pick would serve the robotic one
  // half the time.
  // Rank on voiceURI first. Apple's identifiers look like
  // "com.apple.voice.enhanced.uk-UA.Lesya" and are stable regardless of the
  // phone's display language. The visible name is localised — on a German
  // device the enhanced voice reads "Erweitert" — so matching English words
  // in the name alone silently fails and the compact voice wins.
  function voiceRank(v){
    var id = ((v.voiceURI || '') + ' ' + (v.name || '')).toLowerCase();
    if (id.indexOf('premium') !== -1) return 3;
    if (id.indexOf('enhanced') !== -1) return 2;
    return 1;   // compact / default
  }

  function findUkrainianVoices(){
    if (!('speechSynthesis' in window)) return [];
    var voices = window.speechSynthesis.getVoices() || [];
    if (!voices.length) return [];
    voicesReady = true;

    var uk = voices.filter(function(v){
      return (v.lang || '').toLowerCase().indexOf('uk') === 0;   // uk-UA
    });
    if (!uk.length) return [];

    var best = Math.max.apply(null, uk.map(voiceRank));
    // Several voices of the same tier still get picked between at random.
    return uk.filter(function(v){ return voiceRank(v) === best; });
  }

  function voiceQualityLabel(){
    if (!ukVoices.length) return null;
    var r = voiceRank(ukVoices[0]);
    return r === 3 ? 'premium' : r === 2 ? 'enhanced' : 'standard';
  }

  function initVoices(){
    if (!('speechSynthesis' in window)) return;

    function refresh(){
      var before = ukVoices.length ? voiceRank(ukVoices[0]) : 0;
      ukVoices = findUkrainianVoices();
      var after = ukVoices.length ? voiceRank(ukVoices[0]) : 0;
      // Repaint the Profile if a better voice turned up while it was open.
      if (after !== before && state.loaded && state.view === 'stats') render();
    }

    refresh();
    window.speechSynthesis.onvoiceschanged = refresh;

    // Keep looking for the full window rather than stopping at the first hit.
    // The built-in compact voice is there immediately; a downloaded Enhanced
    // one can register a beat later, and stopping early would lock in the
    // worse of the two.
    var tries = 0;
    var t = setInterval(function(){
      refresh();
      if (tries++ > 14) clearInterval(t);   // ~6 seconds
    }, 400);
  }

  var voicesInited = false;
  function ensureVoices(){
    if (voicesInited || !state.speechOn) return;
    voicesInited = true;
    initVoices();
  }

  function canSpeak(){
    if (!state.speechOn || !('speechSynthesis' in window)) return false;
    ensureVoices();
    return true;
  }

  // Which text is being spoken right now. Held in a variable rather than only
  // as a DOM class so the highlight survives a re-render mid-sentence.
  var speakingText = null;
  var speakingTimeout = null;

  function paintSpeaking(){
    var btns = document.querySelectorAll('.speak-btn');
    for (var i = 0; i < btns.length; i++){
      var match = speakingText !== null && btns[i].getAttribute('data-text') === speakingText;
      btns[i].classList.toggle('speaking', match);
    }
  }

  function setSpeaking(text){
    speakingText = text;
    paintSpeaking();
    clearTimeout(speakingTimeout);
    if (text !== null){
      // onend isn't perfectly reliable on iOS, so make sure the highlight
      // can't get stuck on forever.
      speakingTimeout = setTimeout(function(){ setSpeaking(null); }, 12000);
    }
  }

  // ---------- GOOGLE CLOUD TTS (optional) ----------
  // The key lives in localStorage on this device only. It is deliberately NOT
  // written to config.js (which is public in the repo) and NOT synced to
  // Firestore (which would copy it to every device and into the database).
  var TTS_KEY_STORE = 'wordbox-tts-key';
  var TTS_VOICE = 'uk-UA-Wavenet-A';

  function getTtsKey(){
    try { return localStorage.getItem(TTS_KEY_STORE) || ''; } catch (e) { return ''; }
  }
  function setTtsKey(v){
    try {
      if (v) localStorage.setItem(TTS_KEY_STORE, v);
      else localStorage.removeItem(TTS_KEY_STORE);
    } catch (e) {}
  }

  // Audio is cached permanently, keyed by the word. Each word therefore costs
  // one synthesis request in its lifetime — without this the free allowance
  // would be spent re-generating the same twenty words every lesson.
  var audioDbPromise = null;
  function audioDb(){
    if (audioDbPromise) return audioDbPromise;
    audioDbPromise = new Promise(function(resolve, reject){
      if (!('indexedDB' in window)) return reject();
      var req = indexedDB.open('wordbox-audio', 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore('clips'); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(); };
    }).catch(function(){ return null; });
    return audioDbPromise;
  }

  async function cachedClip(key){
    var db = await audioDb();
    if (!db) return null;
    return new Promise(function(resolve){
      try {
        var r = db.transaction('clips', 'readonly').objectStore('clips').get(key);
        r.onsuccess = function(){ resolve(r.result || null); };
        r.onerror = function(){ resolve(null); };
      } catch (e) { resolve(null); }
    });
  }

  async function storeClip(key, dataUrl){
    var db = await audioDb();
    if (!db) return;
    try { db.transaction('clips', 'readwrite').objectStore('clips').put(dataUrl, key); } catch (e) {}
  }

  var ttsAudio = null;

  function playClip(dataUrl, text){
    try {
      if (ttsAudio){ ttsAudio.pause(); ttsAudio = null; }
      ttsAudio = new Audio(dataUrl);
      ttsAudio.onplay  = function(){ setSpeaking(text); };
      ttsAudio.onended = function(){ setSpeaking(null); };
      ttsAudio.onerror = function(){ setSpeaking(null); speakSystem(text); };
      var p = ttsAudio.play();
      if (p && p.catch) p.catch(function(){ setSpeaking(null); speakSystem(text); });
      return true;
    } catch (e) {
      return false;
    }
  }

  async function speakGoogle(text){
    var cacheKey = TTS_VOICE + '|' + text;
    var hit = await cachedClip(cacheKey);
    if (hit){ playClip(hit, text); return true; }

    if (!navigator.onLine) return false;
    var key = getTtsKey();
    if (!key) return false;

    try {
      var res = await fetch('https://texttospeech.googleapis.com/v1/text:synthesize?key=' + encodeURIComponent(key), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          input: { text: text },
          voice: { languageCode: 'uk-UA', name: TTS_VOICE },
          audioConfig: { audioEncoding: 'MP3', speakingRate: 0.9 }
        })
      });
      if (!res.ok) return false;
      var data = await res.json();
      if (!data.audioContent) return false;
      var url = 'data:audio/mp3;base64,' + data.audioContent;
      storeClip(cacheKey, url);
      playClip(url, text);
      return true;
    } catch (e) {
      return false;   // network, CORS, bad key — fall back quietly
    }
  }

  function speakUkrainian(text){
    if (!canSpeak() || !text) return;

    // No key means no Google path at all, so speak immediately and
    // SYNCHRONOUSLY. This matters more than it looks: iOS only permits
    // speechSynthesis.speak() from inside a user gesture, and awaiting the
    // cache lookup first would push the call into a promise continuation,
    // where iOS silently refuses it.
    if (!getTtsKey()){
      speakSystem(text);
      return;
    }

    // With a key, the async path is fine — Google audio plays through an
    // <audio> element, which the earlier unlock already cleared for
    // programmatic playback.
    speakGoogle(text).then(function(ok){ if (!ok) speakSystem(text); });
  }

  function speakSystem(text){
    if (!canSpeak() || !text) return;
    try {
      unlockAudio();
      window.speechSynthesis.cancel();   // queued calls otherwise stack up
      setSpeaking(null);                 // drop any highlight from the last one
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'uk-UA';
      // Random pick when the device has more than one; with a single voice
      // this simply always selects it.
      if (ukVoices.length) u.voice = ukVoices[Math.floor(Math.random() * ukVoices.length)];
      u.rate = 0.9;                      // a shade slow, it's for learning
      u.onstart = function(){ setSpeaking(text); };
      u.onend   = function(){ setSpeaking(null); };
      u.onerror = function(){ setSpeaking(null); };
      window.speechSynthesis.speak(u);
    } catch (e) {
      setSpeaking(null);
      // Speech is a nicety; never let it interrupt a lesson.
    }
  }

  function speakBtn(text, variant){
    if (!canSpeak()) return '';
    return '<button class="speak-btn' + (variant ? ' ' + variant : '') +
      (speakingText !== null && text === speakingText ? ' speaking' : '') +
      '" data-action="speak" data-text="' + escapeHtml(text) +
      '" aria-label="Hear it">' + ICONS.speaker + '</button>';
  }

  function soundCorrect(){
    if (playSoundClip('correct')) return;
    playSeq([{ f: 659, at: 0, d: 0.10 }, { f: 988, at: 0.085, d: 0.16 }]);
  }
  function soundWrong(){
    if (playSoundClip('wrong')) return;
    playSeq([{ f: 196, at: 0, d: 0.18, type: 'triangle', v: 0.11 }]);
  }

  function reactionFor(correct){
    if (!correct){
      if (state.parkedThisLesson){
        state.parkedThisLesson = false;
        return 'Parking that one for today.';
      }
      return pick(WRONG_MSGS);
    }
    if (STREAK_MSGS[state.streak]) return STREAK_MSGS[state.streak];
    return pick(CORRECT_MSGS);
  }

  // Lightweight confetti — spawns short-lived particles, no libraries.
  function burstConfetti(){
    // Gold, blue and cream — the palette's own colours. Kept in sync by
    // hand because these are set from JS, not CSS.
    var colors = ['#F2C233', '#FFD84D', '#2E6FD9', '#4A8AE8', '#F6F1E7'];
    var layer = document.createElement('div');
    layer.className = 'confetti-layer';
    for (var i = 0; i < 26; i++){
      var p = document.createElement('i');
      var angle = (Math.random() * 120 - 60);
      var dist = 90 + Math.random() * 130;
      p.style.background = colors[i % colors.length];
      p.style.left = (46 + Math.random() * 8) + '%';
      p.style.setProperty('--dx', Math.sin(angle * Math.PI / 180) * dist + 'px');
      p.style.setProperty('--dy', (-Math.abs(Math.cos(angle * Math.PI / 180)) * dist) + 'px');
      p.style.animationDelay = (Math.random() * 0.12) + 's';
      p.style.width = p.style.height = (5 + Math.random() * 5) + 'px';
      if (Math.random() > 0.5) p.style.borderRadius = '50%';
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 1400);
  }

  function resetCardState(){
    state.revealed = false;
    state.checked = false;
    state.wasCorrect = null;
    state.typedValue = '';
    state.typedReaction = null;
    state.chosenOption = null;
    state.hintShown = false;
    state.optionsRevealed = false;
    // Each new card starts in italics again; the upright view is a crutch
    // for one card, not a setting.
    state.baseUpright = false;
  }

  // Correct answers move on by themselves once the celebration has played.
  var advanceTimer = null;
  function autoAdvance(){
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(function(){ applyAnswer(true); }, 950);
  }

  // Shared scoring path for both card types. Feedback is always shown at
  // answer time, so this just banks the result and moves on.
  function applyAnswer(correct){
    clearTimeout(advanceTimer);
    var entry = state.sessionQueue.shift();
    if (!entry) { render(); return; }
    // A word, or a declension pattern's progress record: both carry the same
    // box / due / counts fields, so everything below applies to either.
    var word = lessonItem(entry.id);
    if (state.lessonKind === 'decl'){
      state.lessonDeclShown.push({ id: entry.id, si: entry.si });
      word.si = entry.si;
    }

    // Two guards keep the boxes meaningful. Spaced repetition only tests
    // anything if the interval has actually elapsed, so:
    //
    //   1. A box only moves on the FIRST answer for that word in a lesson.
    //      Otherwise missing a word, seeing it again on the retry and getting
    //      it right would promote it — a miss would cost nothing.
    //   2. Promotion also requires the word to have been genuinely due.
    //      "Practice anyway" pulls words early; drilling one five times in an
    //      afternoon shouldn't walk it up to the top box.
    //
    // Demotion is deliberately not conditional on either. Getting a word
    // wrong is real evidence you don't know it, whenever it happens.
    var firstAnswerThisLesson = !state.answeredThisLesson[entry.id];
    state.answeredThisLesson[entry.id] = true;
    var wasDue = word.due <= todayStr();

    state.lessonAnswered++;
    word.last = todayStr();

    if (correct){
      state.lessonCorrect++;
      word.nRight++;
      if (firstAnswerThisLesson && wasDue){
        word.box = Math.min(word.box + 1, MAX_BOX);
        word.due = addDays(todayStr(), INTERVALS[word.box] || INTERVALS[MAX_BOX]);
      }
    } else {
      word.nWrong++;
      if (firstAnswerThisLesson){
        word.box = 1;
        // Tomorrow, not today: the card still comes back later in THIS lesson
        // for practice (the queue ignores due dates), but it can't be scored
        // again until the interval has actually passed.
        word.due = addDays(todayStr(), 1);
      }
      // Three misses in one lesson means it isn't going in today. Cycling it
      // round a fourth time just pads the lesson and sours the session; it's
      // already reset to box 1 and due tomorrow.
      state.lessonMisses[word.id] = (state.lessonMisses[word.id] || 0) + 1;
      if (state.lessonMisses[word.id] < 3){
        // A missed pattern comes back with the same sentence, so the retry
        // is exactly the card you got wrong.
        state.sessionQueue.push(state.lessonKind === 'decl'
          ? { id: word.id, si: entry.si }
          : { id: word.id, dir: pickMode(word) });
      } else {
        state.parkedThisLesson = true;
      }
    }

    resetCardState();
    state.feedback = null;
    // Deliberately no persist() here. Progress is banked once, at the end of
    // the lesson — so quitting halfway, or the app being killed mid-lesson,
    // leaves your words exactly as they were. It also turns a ten-card lesson
    // into one write instead of ten.

    if (state.sessionQueue.length === 0){
      endLesson(true);
      return;
    }
    render();
  }

  function endLesson(completed){
    clearTimeout(advanceTimer);
    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
    setSpeaking(null);
    // Only a lesson carried through to the end extends the day streak.
    // Bailing out with the X doesn't count.
    if (completed && state.lessonAnswered > 0){
      // Banked only now: word boxes, due dates, per-word counts, the answer
      // streak and the day streak all commit together in a single write.
      state.committedStreak = state.streak;
      state.committedBest = state.bestStreak;
      registerLessonDay();
      state.wordsSnapshot = null;
      state.patternsSnapshot = null;
      persist();
    } else {
      // Abandoned. Restore the words to how they were when the lesson began
      // and put the streak back to the last banked figure. Nothing was
      // written during the lesson, so storage already holds the right data
      // and there's nothing to save.
      if (state.wordsSnapshot){
        state.words = state.wordsSnapshot.map(normalizeWord);
        state.wordsSnapshot = null;
      }
      if (state.patternsSnapshot){
        state.patterns = state.patternsSnapshot.map(normalizePattern);
        state.patternsSnapshot = null;
      }
      state.streak = state.committedStreak;
      state.bestStreak = state.committedBest;
    }
    state.sessionActive = false;
    state.lessonDone = completed && state.lessonAnswered > 0;
    state.sessionQueue = [];
    state.view = 'home';
    resetCardState();
    state.feedback = null;
    render();
  }

  function startLesson(practice, kind){
    state.lessonKind = (kind === 'decl') ? 'decl' : 'vocab';
    // Called straight from a tap, and the only point where audio is about to
    // be needed. iOS requires that first unlock to happen inside a gesture —
    // and the context too, which is why it is opened here rather than at the
    // first tone. One activation at the start of the lesson, not one per card.
    unlockAudio();
    if (state.soundOn) ensureCtx();
    // The streak deliberately carries over. It counts consecutive correct
    // answers, and ending a lesson isn't a wrong answer.
    state.lessonDone = false;
    state.lessonReviewOpen = false;
    resetCardState();
    state.feedback = null;
    buildQueue(practice);
    if (state.sessionQueue.length === 0){ render(); return; }
    // Everything a lesson changes — boxes, due dates, counts — is applied to
    // the live copy but not written anywhere until the lesson is finished.
    // This snapshot is what an abandoned lesson rolls back to.
    state.wordsSnapshot = JSON.parse(JSON.stringify(state.words));
    state.patternsSnapshot = JSON.parse(JSON.stringify(state.patterns));
    state.sessionActive = true;
    state.view = 'home';
    render();
  }

  // A day streak counts consecutive CALENDAR DAYS with a finished lesson —
  // separate from the answer streak, which counts consecutive correct cards.
  function yesterdayStr(){ return addDays(todayStr(), -1); }

  // The stored number is only meaningful next to the day it was last touched.
  // If that day is neither today nor yesterday the run is over, so report 0
  // rather than a stale figure that would claim a streak you've already lost.
  function liveDayStreak(){
    if (!state.lastLessonDay) return 0;
    if (state.lastLessonDay === todayStr() || state.lastLessonDay === yesterdayStr()){
      return state.dayStreak;
    }
    return 0;
  }

  function doneToday(){ return state.lastLessonDay === todayStr(); }

  function registerLessonDay(){
    var today = todayStr();
    if (state.lastLessonDay === today) return;      // already counted today
    if (state.lastLessonDay === yesterdayStr()) state.dayStreak += 1;
    else state.dayStreak = 1;                        // first day, or run broken
    state.lastLessonDay = today;
    if (state.dayStreak > state.bestDayStreak) state.bestDayStreak = state.dayStreak;
  }

  // Streak is bumped before the reaction is chosen so milestone
  // messages ("Five straight!") land on the right answer.
  function scoreStreak(correct){
    if (correct){
      state.streak++;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    } else {
      state.streak = 0;
    }
  }

  // Days until the next review once a word lands in a box. The top box
  // keeps its interval: a correct answer there leaves the word in place and
  // books the next check another 30 days out.
  var MAX_BOX = 6;
  var INTERVALS = { 2: 1, 3: 3, 4: 7, 5: 14, 6: 30 };
  var LESSON_SIZE = 10;

  // Lower boxes alternate at random between the two multiple-choice
  // directions; from box 4 the card is always typed.
  // Multiple choice needs two believable wrong answers drawn from the deck,
  // so it only works once there are 3+ distinct meanings to draw from.
  // Three card types:
  //   'choice-en'  Ukrainian shown, pick the English   (boxes 1-3 only)
  //   'choice-uk'  English shown, pick the Ukrainian   (boxes 1-3 only)
  //   'typing'     English shown, type the Ukrainian   (box 4+, exclusively)
  //
  // Recall is much harder than recognition, so producing the spelling from
  // scratch is held back until a word has already survived a few reviews.
  // From box 4 onward it takes over completely: no more multiple choice in
  // either direction, so every review of a nearly-learned word is the hard
  // version — English prompt, Ukrainian typed out.
  var TYPING_FROM_BOX = 4;

  function pickMode(word){
    if (word.box >= TYPING_FROM_BOX) return 'typing';
    var pool = [];
    if (distinctCount('back') >= 3)  pool.push('choice-en');
    if (distinctCount('front') >= 3) pool.push('choice-uk');
    // A deck of one or two words can't produce distractors, so typing is all
    // that's left regardless of box.
    if (!pool.length) return 'typing';
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function distinctCount(field){
    var seen = {};
    activeWords().forEach(function(w){ seen[normalize(w[field])] = true; });
    return Object.keys(seen).length;
  }

  // Two distractors from other words, deduped by meaning so an option list
  // never shows the same English twice (real decks have synonyms).
  // field is 'back' (English options) or 'front' (Ukrainian options).
  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // field is 'back' (English options) or 'front' (Ukrainian options).
  // Distractors of the same part of speech make a real test: given
  // "green / to walk / milk" the grammar alone gives the answer away, so
  // you're not being asked about the word at all. Same-type candidates come
  // first and only get topped up from other types when there aren't three.
  function buildOptions(word, field){
    var correct = word[field];
    var sameType = [], otherType = [];
    var seen = {};
    seen[normalize(correct)] = true;
    activeWords().forEach(function(w){
      var key = normalize(w[field]);
      if (w.id === word.id || seen[key]) return;
      seen[key] = true;
      (w.type === word.type ? sameType : otherType).push(w[field]);
    });
    var pool = shuffle(sameType).concat(shuffle(otherType));
    var opts = pool.slice(0, 2);
    opts.push(correct);
    for (var k = opts.length - 1; k > 0; k--){
      var m = Math.floor(Math.random() * (k + 1));
      var tmp = opts[k]; opts[k] = opts[m]; opts[m] = tmp;
    }
    return opts;
  }

  // Comparison for typed answers. Beyond case and spacing, this handles two
  // things that come up constantly with Ukrainian:
  //   1. Stress marks (на́вчання) — dictionaries and textbooks add a combining
  //      acute you'd never type. Only U+0300/U+0301 are stripped; the breve in
  //      "й" and the diaeresis in "ї" are part of the letters and must stay.
  //   2. Apostrophes (ім'я, п'ять) — keyboards produce ' or ' or ʼ
  //      interchangeably, so they're all folded to one form.
  var APOSTROPHES = /[\u2018\u2019\u201B\u02B9\u02BB\u02BC\u055A\u2032\uFF07\u0060\u00B4]/g;

  // Stress marks come off in NFD, not NFC. Decomposed first, every accent is a
  // separate combining character and strips cleanly; composed first, a few of
  // them fuse into a precomposed letter and survive \u2014 \u0435 + U+0300 becomes
  // \u0451\u0300 (U+0450) and \u0438 + U+0300 becomes \u045D (U+045D), which no longer match the
  // combining-mark pattern at all. NFC at the end puts \u0439 and \u0457 back together,
  // since NFD had taken their breve and diaeresis apart too.
  //
  // Only the four stress accents are listed. The breve in \u0439 and the diaeresis
  // in \u0457 are part of the letters and must not be touched.
  function stripStress(s){
    return (s || '')
      .normalize('NFD')
      .replace(/[\u0300\u0301\u0340\u0341]/g, '')
      .normalize('NFC');
  }

  function normalize(s){
    return stripStress(s)
      .replace(APOSTROPHES, "'")
      .trim()
      .toLowerCase()
      .replace(/\s+/g, ' ');
  }

  // Grading a typed answer is deliberately more forgiving than normalize(),
  // which also backs duplicate detection and has to keep separate entries
  // apart. Typing a phrase card without its question mark is not a vocabulary
  // mistake, so on top of case and stress marks this drops sentence
  // punctuation, and reads a hyphen as a space.
  //
  // The apostrophe is NOT punctuation in Ukrainian \u2014 it marks that the
  // preceding consonant stays hard (\u0456\u043C\u2019\u044F, \u043F\u2019\u044F\u0442\u044C) \u2014 so it survives here;
  // only its typographic variants are folded together, above.
  function normalizeTyped(s){
    return normalize(s)
      .replace(/[\u002D\u2010-\u2015]/g, ' ')
      .replace(/[.,!?;:\u2026"\u201C\u201D\u201E\u00AB\u00BB()\[\]]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // ---------- PATTERNS AS LIBRARY DATA ----------
  // DECL_PATTERNS above is only the starter set, like the sample words: it's
  // copied into the library once, on the first launch that has no patterns
  // saved, and from then on the library copy is what lessons use. Editing or
  // deleting a pattern never touches the list above, and changing the list
  // above never touches a library that already exists.
  //
  // A pattern carries its own progress (box, due, counts, shelved), the same
  // fields a word has, so the scheduler treats both alike. `si` is the
  // sentence shown last, so the next lesson picks a different one.
  // Sentences: { en, uk, base }, with the gap in uk in [square brackets].
  function sentenceFromRaw(a){
    if (Array.isArray(a)) return { en: (a[0] || '').trim(), uk: (a[1] || '').trim(), base: (a[2] || '').trim() };
    a = a || {};
    return { en: (a.en || '').trim(), uk: (a.uk || '').trim(), base: (a.base || '').trim() };
  }

  // "у / в" -> ['у', 'в']. The accepted spellings when none are given.
  function prepVariants(prep){
    return (prep || '').split(/[\/,]/).map(function(x){ return x.trim(); }).filter(Boolean);
  }

  function normalizePattern(p){
    p = p || {};
    var prep = (p.prep || '').trim();
    var accept = Array.isArray(p.accept)
      ? p.accept.map(function(x){ return (x || '').trim(); }).filter(Boolean) : [];
    if (!accept.length) accept = prepVariants(prep);
    return {
      id: p.id || genId(),
      c: DECL_CASES[p.c] ? p.c : 'gen',
      prep: prep,
      accept: accept,
      meaning: (p.meaning || '').trim(),
      note: (p.note || '').trim(),
      s: (Array.isArray(p.s) ? p.s : []).map(sentenceFromRaw).filter(function(x){ return x.uk; }),
      box: (p.box >= 1 && p.box <= MAX_BOX) ? p.box : 1,
      due: p.due || todayStr(),
      nRight: p.nRight || 0,
      nWrong: p.nWrong || 0,
      last: p.last || null,
      shelved: p.shelved || null,
      si: (typeof p.si === 'number') ? p.si : -1,
      created: p.created || null
    };
  }

  // The one-time import. `progress` is what version 2026-10-29a saved
  // separately (box, due, counts per built-in pattern), so lessons done
  // with that version carry over instead of starting from scratch.
  function seedPatterns(progress){
    return DECL_PATTERNS.map(function(p){
      var r = (progress && progress[p.id]) || {};
      return normalizePattern({
        id: p.id, c: p.c, prep: p.prep, accept: p.accept, meaning: p.meaning, note: p.note, s: p.s,
        box: r.box, due: r.due, nRight: r.nRight, nWrong: r.nWrong, last: r.last, shelved: r.shelved,
        si: (typeof r.s === 'number') ? r.s : -1,
        created: todayStr()
      });
    });
  }

  function patternById(id){
    for (var i = 0; i < state.patterns.length; i++) if (state.patterns[i].id === id) return state.patterns[i];
    return null;
  }

  // "у / в + Locative". Used as the card hint and as the pattern's name.
  function patternLabel(p){
    return (p.prep || '?') + ' + ' + DECL_CASES[p.c].en;
  }

  // Only patterns with at least one sentence can be in a lesson; a freshly
  // added one sits out until its first sentence is in.
  function activePatterns(){
    return state.patterns.filter(function(p){ return !p.shelved && p.s.length > 0; });
  }

  function declDueCount(){
    var t = todayStr();
    return activePatterns().filter(function(p){ return p.due <= t; }).length;
  }

  // What's wrong with a Ukrainian sentence, or '' if it's usable: exactly
  // one [gap], with something in it.
  function gapProblem(uk){
    var open = (uk.match(/\[/g) || []).length, close = (uk.match(/\]/g) || []).length;
    if (!open && !close) return 'Put the part to type in [square brackets].';
    if (open !== 1 || close !== 1) return 'Use exactly one [gap].';
    var m = uk.match(/^([^\[\]]*)\[([^\[\]]*)\]([^\[\]]*)$/);
    if (!m) return 'The [ must come before the ].';
    if (!m[2].split('|')[0].trim()) return 'The gap is empty.';
    return '';
  }

  // Splits "Я живу [у місті|в місті]." into the parts around the gap.
  // Alternatives after a | also count as right; the first one is shown.
  function parseSentence(s){
    if (!s) return null;
    var m = (s.uk || '').match(/^([^\[\]]*)\[([^\[\]]+)\]([^\[\]]*)$/);
    if (!m) return null;
    var answers = m[2].split('|').map(function(a){ return a.trim(); }).filter(Boolean);
    if (!answers.length) return null;
    return { en: s.en, pre: m[1], post: m[3], answers: answers, base: s.base,
      full: m[1] + answers[0] + m[3] };
  }

  // Any sentence of the pattern except the one shown last time, so the
  // same sentence never comes up twice running.
  function pickSentence(p, avoid){
    var n = p.s.length;
    if (n < 2) return 0;
    if (!(avoid >= 0 && avoid < n)) return Math.floor(Math.random() * n);
    var i = Math.floor(Math.random() * (n - 1));
    return i >= avoid ? i + 1 : i;
  }

  // Graded like a typed word (case, punctuation, stress marks and apostrophe
  // style don't matter). On top of that, every accepted spelling of the
  // preposition counts: у or в, з / із / зі, о or об, and any synonyms.
  // Spellings can be several words long, so the longest match comes off first.
  function gradeDecl(typed, p, sent){
    var t = normalizeTyped(typed);
    var ok = p.accept.map(normalizeTyped).filter(Boolean)
      .sort(function(a, b){ return b.length - a.length; });
    function rest(x){
      for (var i = 0; i < ok.length; i++){
        if (x === ok[i]) return '';
        if (x.indexOf(ok[i] + ' ') === 0) return x.slice(ok[i].length + 1);
      }
      return null;
    }
    var tr = rest(t);
    return sent.answers.some(function(a){
      var e = normalizeTyped(a);
      if (t === e) return true;
      var er = rest(e);
      return tr !== null && er !== null && tr === er;
    });
  }

  // The thing a lesson card is about: a word or a pattern. Both carry the
  // same box / due / counts fields.
  function lessonItem(id){
    if (state.lessonKind === 'decl') return patternById(id);
    return state.words.find(function(x){ return x.id === id; });
  }

  // ---------- STORAGE (auto-detects environment) ----------
  // Inside Claude, window.storage persists per-user across sessions.
  // Opened as a plain file in a browser, there is no window.storage,
  // so we fall back to the browser's own localStorage instead.
  var hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
  var LOCAL_PREFIX = 'wordbox-';

  // ---------- SERVICE WORKER ----------
  // Only over http(s): registering from a file:// URL throws, and the
  // standalone copy of this file should keep working when opened directly.
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){
        // No offline support, but the app runs fine online.
      });
    });
  }

  // ---------- FIREBASE (optional cloud sync) ----------
  // Configuration lives in config.js, loaded just before this script, so the
  // only file you ever need to edit is that short one.
  // If config.js is missing (opening this file on its own), the tag 404s
  // harmlessly and the app runs fully local — Claude storage or localStorage,
  // no account, no internet.
  var FIREBASE_CONFIG = window.WORDBOX_CONFIG || { apiKey: '' };

  var useFirebase = !!FIREBASE_CONFIG.apiKey;
  var fbAuth = null, fbDb = null, fbDoc = null, fbGetDoc = null, fbSetDoc = null, fbSignIn = null, fbSignOut = null;
  var fbWaitForPendingWrites = null;
  var currentUser = null;

  // ---------- SYNC STATUS ----------
  // The honest bit: with offline persistence on, setDoc() resolves as soon as
  // the write hits the LOCAL cache — not when the server has it. Treating that
  // as "synced" would show a reassuring green tick while your words sat on the
  // device. waitForPendingWrites() is what actually resolves once the backend
  // has acknowledged every outstanding write, so that's what marks a sync.
  var SYNC_KEY = 'wordbox-last-sync';
  var syncState = 'idle';   // idle | pending | synced | offline

  function loadLastSync(){
    // Deliberately localStorage, never storageSet: writing this through the
    // normal path would be another Firestore write, which would mark another
    // pending write, which would write again. Straight to the device.
    try { return localStorage.getItem(SYNC_KEY); } catch (e) { return null; }
  }

  function markSynced(){
    syncState = 'synced';
    try { localStorage.setItem(SYNC_KEY, new Date().toISOString()); } catch (e) {}
    refreshSyncLine();
  }

  function markPending(){
    syncState = navigator.onLine ? 'pending' : 'offline';
    refreshSyncLine();
  }

  // Updates just the status line rather than re-rendering the view, so it can
  // never steal focus from the search box or a half-typed form.
  function refreshSyncLine(){
    var el = document.getElementById('sync-line');
    if (el) el.outerHTML = syncLineHtml();
  }

  function agoLabel(iso){
    if (!iso) return null;
    var secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (secs < 0) return 'just now';
    if (secs < 60) return 'just now';
    var mins = Math.floor(secs / 60);
    if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
    var days = Math.floor(hrs / 24);
    if (days < 30) return days + (days === 1 ? ' day ago' : ' days ago');
    return new Date(iso).toISOString().slice(0, 10);
  }

  // Short form of agoLabel — this now shares a cramped line with the word
  // count, so "2m ago" rather than "2 minutes ago".
  function agoShort(iso){
    if (!iso) return null;
    var secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (secs < 60) return 'just now';
    var mins = Math.floor(secs / 60);
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    var days = Math.floor(hrs / 24);
    if (days < 30) return days + 'd ago';
    return new Date(iso).toISOString().slice(0, 10);
  }

  function syncLineHtml(){
    var dot = 'ok', text;

    if (!useFirebase){
      dot = 'local';
      text = 'on this device';
    } else if (!navigator.onLine){
      dot = 'wait';
      var offAgo = agoShort(loadLastSync());
      text = offAgo ? 'offline \u00B7 synced ' + offAgo : 'offline';
    } else if (syncState === 'pending'){
      dot = 'wait';
      text = 'syncing\u2026';
    } else {
      var ago = agoShort(loadLastSync());
      text = ago ? 'synced ' + ago : 'not synced yet';
      if (!ago) dot = 'wait';
    }
    return '<span id="sync-line" class="sync-line"><span class="sync-dot ' + dot + '"></span>' +
      escapeHtml(text) + '</span>';
  }

  window.addEventListener('online',  refreshSyncLine);
  window.addEventListener('offline', refreshSyncLine);

  async function initFirebase(){
    var appMod = await import("https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js");
    var authMod = await import("https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js");
    var fsMod = await import("https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js");

    var app = appMod.initializeApp(FIREBASE_CONFIG);
    fbAuth = authMod.getAuth(app);
    fbDb = fsMod.getFirestore(app);
    fbDoc = fsMod.doc;
    fbGetDoc = fsMod.getDoc;
    fbSetDoc = fsMod.setDoc;
    fbSignIn = authMod.signInWithEmailAndPassword;
    fbSignOut = authMod.signOut;
    fbWaitForPendingWrites = fsMod.waitForPendingWrites;

    try { await authMod.setPersistence(fbAuth, authMod.browserLocalPersistence); } catch (e) { /* ignore */ }
    try { await fsMod.enableIndexedDbPersistence(fbDb); } catch (e) { /* e.g. multiple tabs open \u2014 offline cache still works in the active tab */ }

    authMod.onAuthStateChanged(fbAuth, function(user){
      if (user){
        currentUser = user;
        loadWords();
      } else {
        currentUser = null;
        renderLoginScreen();
      }
    });
  }

  function renderLoginScreen(errorMsg){
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="login-screen">' +
      '<h1>Wordbox</h1>' +
      '<p>Sign in to sync your words.</p>' +
      (errorMsg ? '<div class="login-error">' + escapeHtml(errorMsg) + '</div>' : '') +
      '<input id="login-email" type="email" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Email" autocomplete="username" />' +
      '<input id="login-password" type="password" placeholder="Password" autocomplete="current-password" />' +
      '<button class="primary" id="login-btn">Sign in</button>' +
      '</div>';
    document.getElementById('login-btn').addEventListener('click', function(){
      var email = document.getElementById('login-email').value.trim();
      var password = document.getElementById('login-password').value;
      fbSignIn(fbAuth, email, password).catch(function(){
        renderLoginScreen('Couldn\u2019t sign in \u2014 check your email and password.');
      });
    });
    var pwField = document.getElementById('login-password');
    pwField.addEventListener('keydown', function(e){
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
  }

  async function storageGet(key){
    if (useFirebase){
      try {
        var snap = await fbGetDoc(fbDoc(fbDb, 'wordbox', currentUser.uid));
        // fromCache === false means this came from the server, which is itself
        // proof the device is in sync right now.
        if (snap.metadata && snap.metadata.fromCache === false) markSynced();
        if (!snap.exists()) return null;
        var data = snap.data();
        return data[key] !== undefined ? data[key] : null;
      } catch (e) {
        return null;
      }
    }
    if (hasClaudeStorage){
      try {
        var res = await window.storage.get(key, false);
        return res && res.value ? res.value : null;
      } catch (e) {
        return null;
      }
    }
    try {
      return localStorage.getItem(LOCAL_PREFIX + key);
    } catch (e) {
      return null;
    }
  }

  async function storageSet(key, value){
    if (useFirebase){
      try {
        var fields = {};
        fields[key] = value;
        markPending();
        // Resolves once it's in the local cache — the word is safe on the
        // device at this point, offline or not.
        await fbSetDoc(fbDoc(fbDb, 'wordbox', currentUser.uid), fields, { merge: true });
        // Resolves only once the backend has acknowledged every pending
        // write. Offline, this simply never resolves, and the line keeps
        // saying so rather than claiming success.
        if (fbWaitForPendingWrites){
          fbWaitForPendingWrites(fbDb).then(markSynced).catch(function(){});
        }
      } catch (e) {
        console.error('Save failed', e);
      }
      return;
    }
    if (hasClaudeStorage){
      try {
        await window.storage.set(key, value, false);
      } catch (e) {
        console.error('Save failed', e);
      }
      return;
    }
    try {
      localStorage.setItem(LOCAL_PREFIX + key, value);
    } catch (e) {
      console.error('Save failed', e);
    }
  }

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function addDays(dateStr, n){
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function genId(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // Ten starter words, added only on a genuinely first run (see loadWords).
  // Meanings are all distinct so multiple choice has clean distractors.
  // Single place a word is created, so every path gets the same shape.
  // stats: nRight / nWrong counts, and `last` = date it was last answered.
  var WORD_TYPES = [
    ['noun', 'Noun'], ['verb', 'Verb'], ['adjective', 'Adjective'],
    ['adverb', 'Adverb'], ['preposition', 'Preposition'],
    ['phrase', 'Phrase'], ['other', 'Other']
  ];

  // Ukrainian dictionary forms are regular enough to guess from, and the
  // English gloss helps more than you'd expect — people write verbs as
  // "to walk". Deliberately conservative: it never guesses adverb, because
  // adverbs end in -о and so do neuter nouns (\u0434\u043E\u0431\u0440\u0435 vs \u0432\u0456\u043A\u043D\u043E), and a
  // confident wrong answer is worse than a default you can correct.
  // Prepositions are dropdown-only for the same reason: \u0432, \u043D\u0430, \u0434\u043E and \u0437 are
  // short and look like nothing in particular.
  function guessType(front, back){
    var f = normalize(front), b = normalize(back);
    // Terminal punctuation on either side means it's an utterance rather
    // than a word — \u0414\u043E\u0431\u0440\u043E\u0433\u043E \u0434\u043D\u044F! or \u042F\u043A \u0441\u043F\u0440\u0430\u0432\u0438? — even when it's a single word.
    if (/[!?]/.test(front) || /[!?]/.test(back)) return 'phrase';
    if (f.indexOf(' ') !== -1) return 'phrase';        // multi-word entry
    if (/^to\s+/.test(b)) return 'verb';               // English gloss
    if (/\u0442\u0438(\u0441\u044F|\u0441\u044C)?$/.test(f)) return 'verb';   // infinitive -\u0442\u0438 / -\u0442\u0438\u0441\u044F
    if (/(\u0438\u0439|\u0456\u0439)$/.test(f)) return 'adjective';    // masc. nom. sg.
    return 'noun';                                     // commonest, safest
  }

  function isValidType(t){
    return WORD_TYPES.some(function(o){ return o[0] === t; });
  }

  // Verb aspect. Stored as '' when unset, which is every verb saved before
  // this existed — there's no reliable way to guess it from the spelling.
  var ASPECTS = [['', 'Not set'], ['impf', 'Imperfective'], ['pf', 'Perfective']];

  function isValidAspect(a){ return a === 'impf' || a === 'pf'; }

  function aspectName(a){
    return a === 'pf' ? 'perfective' : a === 'impf' ? 'imperfective' : '';
  }

  // Aspect only means anything on a verb. A word that has since been
  // reclassified keeps nothing stale on its card.
  function aspectOf(w){
    return (w && w.type === 'verb' && isValidAspect(w.aspect)) ? w.aspect : '';
  }

  // Small italic line under the word on a lesson card.
  function cardAspectHtml(w){
    var a = aspectOf(w);
    return a ? '<div class="card-aspect">' + aspectName(a) + '</div>' : '';
  }

  function typeLabel(t){
    for (var i = 0; i < WORD_TYPES.length; i++) if (WORD_TYPES[i][0] === t) return WORD_TYPES[i][1];
    return 'Other';
  }

  function makeWord(front, back, notes, hint, type){
    return {
      id: genId(),
      front: (front || '').trim(),
      back: (back || '').trim(),
      notes: (notes || '').trim(),
      hint: (hint || '').trim(),
      type: isValidType(type) ? type : guessType(front, back),
      aspect: '',
      box: 1,
      due: todayStr(),
      created: todayStr(),
      nRight: 0,
      nWrong: 0,
      last: null,
      shelved: null
    };
  }

  // Words saved before hints and stats existed lack those fields, so fill
  // them in on load rather than guarding for undefined everywhere.
  function normalizeWord(w){
    return {
      id: w.id || genId(),
      front: w.front || '',
      back: w.back || '',
      notes: w.notes || '',
      hint: w.hint || '',
      // Words saved before types existed get classified on load.
      type: isValidType(w.type) ? w.type : guessType(w.front || '', w.back || ''),
      aspect: isValidAspect(w.aspect) ? w.aspect : '',
      box: (w.box >= 1 && w.box <= MAX_BOX) ? w.box : 1,
      due: w.due || todayStr(),
      // Words saved before this was tracked keep null rather than being
      // stamped with today's date, which would be a made-up answer. They
      // genuinely predate the others, and the sort treats them accordingly.
      created: w.created || null,
      nRight: w.nRight || 0,
      nWrong: w.nWrong || 0,
      last: w.last || null,
      // The date it went on the shelf, or null. Stored as a date rather than
      // a flag so unshelving can hand back exactly the wait that was left.
      shelved: w.shelved || null
    };
  }

  // Shelved words are out of lessons entirely: not scheduled, not in
  // practice, and not used as multiple-choice distractors either.
  function activeWords(){
    return state.words.filter(function(w){ return !w.shelved; });
  }

  function daysBetween(a, b){
    return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  }

  // Freezing means the clock stops too. A word shelved with five days to go
  // comes back with five days to go, rather than returning hugely overdue.
  function setShelved(w, on){
    if (on && !w.shelved){
      w.shelved = todayStr();
    } else if (!on && w.shelved){
      var gap = daysBetween(w.shelved, todayStr());
      if (gap > 0) w.due = addDays(w.due, gap);
      w.shelved = null;
    }
  }

  function accuracyOf(w){
    var total = w.nRight + w.nWrong;
    return total ? Math.round((w.nRight / total) * 100) : null;
  }

  function sinceLabel(dateStr){
    if (!dateStr) return 'not yet practised';
    var d = Math.round((new Date(todayStr() + 'T00:00:00') - new Date(dateStr + 'T00:00:00')) / 86400000);
    if (d <= 0) return 'today';
    if (d === 1) return 'yesterday';
    if (d < 30) return d + ' days ago';
    return dateStr;
  }

  function seedWords(){
    var pairs = [
      ['\u043F\u0440\u0438\u0432\u0456\u0442', 'hello', '', 'informal greeting'],
      ['\u0434\u044F\u043A\u0443\u044E', 'thank you', '', 'literally \u201CI thank\u201D'],
      ['\u0432\u043E\u0434\u0430', 'water', 'feminine', 'starts with \u0432'],
      ['\u0445\u043B\u0456\u0431', 'bread', 'masculine', '4 letters'],
      ['\u043A\u043D\u0438\u0433\u0430', 'book', 'feminine', 'related to \u201Ckniga\u201D in other Slavic languages'],
      ['\u0448\u043A\u043E\u043B\u0430', 'school', 'feminine', 'close to the English word'],
      ['\u0437\u0435\u043B\u0435\u043D\u0438\u0439', 'green', 'adjective, masculine form', 'ends in -\u0438\u0439'],
      ['\u0456\u043C\u2019\u044F', 'name', 'neuter; note the apostrophe', 'has an apostrophe'],
      ['\u0445\u043E\u0434\u0438\u0442\u0438', 'to walk', 'multidirectional / habitual', 'on foot'],
      ['\u0457\u0445\u0430\u0442\u0438', 'to ride', 'by vehicle, one direction', 'starts with \u0457'],
      ['\u0431\u0443\u0434\u0438\u043d\u043e\u043a', 'house', 'masculine', 'where you live'],
      ['\u043c\u0456\u0441\u0442\u043e', 'city', 'neuter', 'not \u043c\u0456\u0441\u0446\u0435 (place)'],
      ['\u0434\u0440\u0443\u0433', 'friend', 'masculine', 'one syllable'],
      ['\u0447\u0438\u0442\u0430\u0442\u0438', 'to read', 'imperfective', '-\u0430\u0442\u0438 verb'],
      ['\u0433\u043e\u0432\u043e\u0440\u0438\u0442\u0438', 'to speak', 'imperfective', '-\u0438\u0442\u0438 verb'],
      ['\u0432\u0435\u043b\u0438\u043a\u0438\u0439', 'big', 'adjective, masculine form', 'ends in -\u0438\u0439'],
      ['\u043d\u043e\u0432\u0438\u0439', 'new', 'adjective, masculine form', 'close to the English word'],
      ['\u0432\u0443\u043b\u0438\u0446\u044f', 'street', 'feminine', 'ends in -\u0446\u044f'],
      ['\u0434\u0435\u043d\u044c', 'day', 'masculine', 'three letters'],
      ['\u043c\u043e\u043b\u043e\u043a\u043e', 'milk', 'neuter', 'three \u043e\u0027s']
    ];
    return pairs.map(function(p){
      return makeWord(p[0], p[1], p[2], p[3] || '');
    });
  }

  async function loadWords(){
    var raw = await storageGet('words');
    // null means nothing was ever saved — a true first run, so seed.
    // '[]' means the list was saved and is empty (everything deleted),
    // which must stay empty rather than silently refilling itself.
    // Seeding saves once, at the end of loading. Saving here would also
    // write the (still empty) patterns before they've been read, and the
    // one-time pattern import below would then find "[]" and skip itself.
    var needsSave = false;
    if (raw === null || raw === undefined){
      state.words = seedWords();
      needsSave = true;
    } else {
      try {
        var parsed = JSON.parse(raw);
        state.words = Array.isArray(parsed) ? parsed.map(normalizeWord) : [];
      } catch (e) {
        state.words = [];
      }
    }
    // Streaks are progress, not settings — they belong with the words and
    // survive reloads. Before this they lived only in memory, so "best" reset
    // to zero on every launch and simply echoed the latest run.
    try {
      var st = JSON.parse((await storageGet('streaks')) || '{}');
      if (typeof st.current === 'number' && st.current >= 0) state.streak = st.current;
      if (typeof st.best === 'number' && st.best >= 0) state.bestStreak = st.best;
      // Repairs any record saved while best was still resetting each launch.
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      state.committedStreak = state.streak;
      state.committedBest = state.bestStreak;
      if (typeof st.day === 'number' && st.day >= 0) state.dayStreak = st.day;
      if (typeof st.bestDay === 'number' && st.bestDay >= 0) state.bestDayStreak = st.bestDay;
      if (typeof st.lastDay === 'string') state.lastLessonDay = st.lastDay;
      if (state.dayStreak > state.bestDayStreak) state.bestDayStreak = state.dayStreak;
    } catch (e) {
      // nothing saved yet
    }

    // Declension patterns. Same rule as the words: null means none were
    // ever saved, so this is the one-time import of the starter set (with
    // any progress the previous version kept separately). '[]' means they
    // were all deleted, and stays empty.
    var rawPatterns = await storageGet('patterns');
    if (rawPatterns === null || rawPatterns === undefined){
      var oldProgress = {};
      try { oldProgress = JSON.parse((await storageGet('decl')) || '{}') || {}; } catch (e) {}
      state.patterns = seedPatterns(oldProgress);
      needsSave = true;
    } else {
      try {
        var pp = JSON.parse(rawPatterns);
        state.patterns = Array.isArray(pp) ? pp.map(normalizePattern) : [];
      } catch (e) {
        state.patterns = [];
      }
    }

    // Settings live alongside the words, so a stale or unknown value from an
    // older version falls back to the default rather than breaking the list.
    try {
      var settings = JSON.parse((await storageGet('settings')) || '{}');
      if (isValidSort(settings.sortBy)) state.sortBy = settings.sortBy;
      if (typeof settings.soundOn === 'boolean') state.soundOn = settings.soundOn;
      if (typeof settings.speechOn === 'boolean') state.speechOn = settings.speechOn;
      if (typeof settings.blurOptions === 'boolean') state.blurOptions = settings.blurOptions;
      if (isValidDir(settings.sortDir)) state.sortDir = settings.sortDir;
      if (isValidDSort(settings.declSortBy)) state.declSortBy = settings.declSortBy;
      if (isValidDir(settings.declSortDir)) state.declSortDir = settings.declSortDir;
    } catch (e) {
      // no settings saved yet — keep the default
    }

    if (needsSave) persist();
    state.loaded = true;
    render();

  async function persistSettings(){

      sortBy: state.sortBy,
      sortDir: state.sortDir,
      soundOn: state.soundOn,
      speechOn: state.speechOn,
      blurOptions: state.blurOptions,
      declSortBy: state.declSortBy,
      declSortDir: state.declSortDir
    }));
  }

  async function persist(){
    // Words and streaks go in a single write. They both change on every
    // answer, and two storageSet calls would mean two Firestore round trips
    // per card.
    await storageSetMany({
      words: JSON.stringify(state.words),
      // Patterns travel in the same write, so a finished lesson of either
      // kind is one save.
      patterns: JSON.stringify(state.patterns),
      streaks: JSON.stringify({
        current: state.committedStreak,
        best: state.committedBest,
        day: state.dayStreak,
        bestDay: state.bestDayStreak,
        lastDay: state.lastLessonDay
      })
    });
  }

  async function storageSetMany(fields){
    if (useFirebase){
      try {
        markPending();
        await fbSetDoc(fbDoc(fbDb, 'wordbox', currentUser.uid), fields, { merge: true });
        if (fbWaitForPendingWrites){
          fbWaitForPendingWrites(fbDb).then(markSynced).catch(function(){});
        }
      } catch (e) {
        console.error('Save failed', e);
      }
      return;
    }
    var keys = Object.keys(fields);
    for (var i = 0; i < keys.length; i++){
      await storageSet(keys[i], fields[keys[i]]);
    }
  }

  // A lesson is a bounded slice of what's due — capped so a large backlog
  // doesn't turn into an endless session. `practice` ignores due dates so
  // there's still something to do when nothing is scheduled.
  //
  // Ordering is by how overdue a word is (oldest due date first), with box as
  // the tiebreaker. Sorting by box instead would starve mastered words: with a
  // standing backlog of box-1 words, a top-box word could stay overdue forever
  // and never be checked. It also means a word you just missed (due = today)
  // sorts last, so it waits its turn rather than crowding out the backlog.
  function buildQueue(practice){
    if (state.lessonKind === 'decl') return buildDeclQueue(practice);
    var t = todayStr();
    var pool;

    if (practice){
      // Extra practice draws at random from the whole library. Ordering by
      // due date here would serve the same ten words every time, since
      // nothing you do in practice mode changes the schedule.
      pool = activeWords();
      for (var i = pool.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
    } else {
      // Shuffled first, so that among words equally due (same day, same box)
      // the pick is random. The sort is stable, so without this they came up
      // in the order they were added to the library.
      pool = shuffle(activeWords().filter(function(w){ return w.due <= t; }));
      pool.sort(function(a, b){
        if (a.due !== b.due) return a.due < b.due ? -1 : 1;
        return a.box - b.box;
      });
    }

    // The sort only decides WHICH words make it into the lesson. The order
    // they come up in is shuffled again, so the lesson doesn't run oldest
    // due date first, box 1 before box 2, and so on.
    state.sessionQueue = shuffle(pool.slice(0, LESSON_SIZE))
      .map(function(w){ return { id: w.id, dir: pickMode(w) }; });
    state.lessonWordIds = state.sessionQueue.map(function(e){ return e.id; });
    state.answeredThisLesson = {};
    state.lessonMisses = {};
    state.parkedThisLesson = false;
    state.lessonTotal = state.sessionQueue.length;
    state.lessonCorrect = 0;
    state.lessonAnswered = 0;
  }

  // Same rules as the word queue: most overdue first, then lowest box.
  // Patterns are shuffled first so ties (e.g. all the brand-new ones) come up
  // in a mixed order instead of always starting with the Genitive.
  function buildDeclQueue(practice){
    var t = todayStr();
    var pool = shuffle(activePatterns().slice());
    if (!practice){
      pool = pool.filter(function(p){ return p.due <= t; });
      pool.sort(function(a, b){
        var pa = a, pb = b;
        if (pa.due !== pb.due) return pa.due < pb.due ? -1 : 1;
        return pa.box - pb.box;
      });
    }
    // As with words: the sort picks which patterns, the shuffle sets the order.
    state.sessionQueue = shuffle(pool.slice(0, LESSON_SIZE)).map(function(p){
      return { id: p.id, si: pickSentence(p, p.si) };
    });
    state.lessonWordIds = state.sessionQueue.map(function(e){ return e.id; });
    state.lessonDeclShown = [];
    state.answeredThisLesson = {};
    state.lessonMisses = {};
    state.parkedThisLesson = false;
    state.lessonTotal = state.sessionQueue.length;
    state.lessonCorrect = 0;
    state.lessonAnswered = 0;
  }

  // ---------- RENDER: HOME ----------
  function greetingLine(){
    var h = new Date().getHours();
    if (h < 5)  return 'Late one. Ready when you are.';

  function dueCount(){
    var t = todayStr();
    return activeWords().filter(function(w){ return w.due <= t; }).length;
  }

  function renderHome(){
    if (state.lessonReviewOpen) return renderLessonReview();
    if (state.lessonDone) return renderLessonSummary();

    // Two lesson types side by side, each count directly above its button.
    var due = dueCount();
    var dDue = declDueCount();
    var nActive = activeWords().length;
    var nPatterns = activePatterns().length;

    function earliest(items){
      return items.slice().sort(function(a, b){ return a.due < b.due ? -1 : 1; })[0];
    }
    function half(n, one, many, nextItem){
      var h = '<div class="due-half">';
      h += '<div class="due-num' + (n === 0 ? ' zero' : '') + '">' + n + '</div>';
      h += '<div class="due-label">' + (n === 1 ? one : many) + '</div>';
      if (n === 0 && nextItem) h += '<div class="due-next">next ' + untilLabel(nextItem.due) + '</div>';
      return h + '</div>';
    }
    // Primary when there is something due; otherwise a quieter button that
    // offers practice anyway (or points at the Library when there's nothing
    // to practise at all).
    function startBtn(kind, label, n, nAvail, emptySub, emptyAction){
      if (nAvail === 0){
        return '<button class="secondary start-btn" data-action="' + emptyAction + '" data-kind="' + kind + '">' +
          label + '<span class="start-sub">' + emptySub + '</span></button>';
      }
      if (n > 0){
        var size = Math.min(n, LESSON_SIZE);
        var sub = n > LESSON_SIZE ? size + ' of ' + n : size + ' card' + (size === 1 ? '' : 's');
        return '<button class="primary start-btn" data-action="start-lesson" data-kind="' + kind + '">' +
          label + '<span class="start-sub">' + sub + '</span></button>';
      }
      return '<button class="secondary start-btn" data-action="practice-anyway" data-kind="' + kind + '">' +
        label + '<span class="start-sub">practice anyway</span></button>';
    }

    var html = '<div class="home">';

    html += '<div class="due-hero split' + (due === 0 && dDue === 0 ? ' is-clear' : '') + '">';

    html += '<div class="due-divider"></div>';

    html += '</div>';

  function lessonHeaderHtml(){

  function uniqueRemaining(){
