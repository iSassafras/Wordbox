<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Wordbox" />
<meta name="theme-color" content="#0A0E15" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<title>Wordbox</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    /* Ukraine palette. Obsidian with a blue cast for the page, navy for
       raised surfaces, gold as the single accent. The flag's two colours
       do the two jobs the app already needed: chrome and emphasis. */
    --bg: #0A0E15;
    --bg-elevated: #16223A;
    --border: #22314D;
    --cream: #DDE4F0;
    --cream-dim: #8DA0C0;

    /* The flashcard stays warm cream — the one light surface in the app,
       and what makes the typing input and diff highlighting readable. */
    --paper: #F6F1E7;
    --paper-edge: #E7DFCC;
    --ink: #1B2430;
    --ink-soft: #5A6470;

    /* Gold, pulled slightly back from flag yellow (#FFD700), which vibrates
       against dark backgrounds at this much coverage. */
    --accent: #F2C233;
    --accent-soft: #FFD84D;
    --accent-bright: #FFE9A0;
    --accent-rgb: 242, 194, 51;
    --accent-soft-rgb: 255, 216, 77;
    --on-accent: #231A02;

    /* Azure. Reserved for focus and selection, so "where I am" reads
       differently from "this is the action". */
    --azure: #2E6FD9;
    --azure-soft: #4A8AE8;
    --azure-rgb: 46, 111, 217;

    /* Hero panel gradient stops. */
    --hero-blue: #1D3A6B;
    --hero-green: #17403A;

    /* Emerald rather than olive — warm greens go grey next to navy. */
    --success: #4EA772;
    --success-bg: #133024;
    --success-text: #A8E3BE;
    --success-bright: #5FC98A;
    --success-ink: #2E7A4B;
    --success-rgb: 78, 167, 114;

    /* Coral-leaning red. A true crimson beside blue and gold starts to
       look like a different flag entirely. */
    --error: #DB5B48;
    --error-bg: #3A1D1E;
    --error-text: #F7C3B8;
    --error-bright: #F08A72;
    --error-ink: #A63C2A;
    --error-rgb: 219, 91, 72;
    --on-error: #FFF1ED;

    --field-bg: #fff;
    --card-shadow: rgba(0, 0, 0, 0.38);

    --radius-card: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--cream);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  header {
    padding: 28px 20px 16px;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Lora', serif;
    font-size: 26px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }

  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--cream-dim);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 4px 20px 100px;
  }

  nav.tabs {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    display: flex;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }

  nav.tabs button {
    flex: 1;
    background: none;
    border: none;
    color: var(--cream-dim);
    font-family: inherit;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 0;
    cursor: pointer;
  }

  nav.tabs button.active {
    color: var(--accent-soft);
  }

  nav.tabs svg { width: 20px; height: 20px; }

  /* ---- Empty states ---- */
  .empty-state {
    margin-top: 40px;
    text-align: center;
    color: var(--cream-dim);
  }
  .empty-state .glyph {
    font-size: 34px;
    margin-bottom: 12px;
    opacity: 0.8;
  }
  .empty-state h2 {
    font-family: 'Lora', serif;
    font-size: 19px;
    color: var(--cream);
    margin: 0 0 6px;
    font-weight: 600;
  }
  .empty-state p {
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 18px;
  }

  /* ---- Buttons ---- */
  button.primary {
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 15px;
    padding: 13px 20px;
    border-radius: 12px;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--cream);
    border: 1px solid var(--border);
    font-family: inherit;
    font-weight: 500;
    font-size: 14px;
    padding: 11px 18px;
    border-radius: 12px;
    cursor: pointer;
  }
  button.text-btn {
    background: none;
    border: none;
    color: var(--accent-soft);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 0;
  }

  /* ---- Multiple choice options ---- */
  .option-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    margin-top: 16px;
  }
  .option-btn {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: 'Lora', serif;
    font-size: 16px;
    font-weight: 500;
    padding: 15px 16px;
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .option-btn .option-text { display: block; }
  .option-tag {
    display: block;
    margin-top: 4px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    opacity: 0.85;
  }
  .option-btn:active { transform: scale(0.98); }
  .option-btn[disabled] { cursor: default; }
  .option-btn.is-correct {
    background: var(--success-bg);
    border-color: var(--success);
    color: var(--success-text);
  }
  .option-btn.is-wrong {
    background: var(--error-bg);
    border-color: var(--error);
    color: var(--error-text);
  }
  .option-btn.is-dimmed { opacity: 0.4; }

  /* ---- Hidden options (recall first) ---- */
  .option-veil-wrap {
    position: relative;
    width: 100%;
  }
  .option-list.is-veiled { pointer-events: none; user-select: none; -webkit-user-select: none; }
  /* Blur only the words, so the buttons keep their crisp outlines and it's
     still clear how many options there are. */
  .option-list.is-veiled .option-text { filter: blur(8px); }
  .option-list.is-veiled .speak-btn { opacity: 0.35; }
  .reveal-btn {
    position: absolute;
    left: 50%;
    top: calc(50% + 8px);   /* centre on the options, past the list's top margin */
    transform: translate(-50%, -50%);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 999px;
    box-shadow: 0 6px 18px var(--card-shadow);
    cursor: pointer;
  }
  .reveal-btn svg { width: 18px; height: 18px; display: block; }
  .reveal-btn:active { transform: translate(-50%, -50%) scale(0.96); }
  .reveal-btn:focus-visible { outline: 2px solid var(--azure-soft); outline-offset: 2px; }

  .choice-card { min-height: 150px; }
  .next-btn { width: 100%; margin-top: 14px; }

  /* ---- Reactions & animations ---- */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-9px); }
    30% { transform: translateX(8px); }
    45% { transform: translateX(-6px); }
    60% { transform: translateX(4px); }
    80% { transform: translateX(-2px); }
  }
  .flashcard.shake { animation: shake 0.45s cubic-bezier(.36,.07,.19,.97); }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.035); }
    100% { transform: scale(1); }
  }
  .flashcard.pop { animation: pop 0.4s ease-out; }

  @keyframes cardEnter {
    0% { opacity: 0; transform: translateY(14px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .flashcard.card-enter { animation: cardEnter 0.32s ease-out; }

  @keyframes bannerIn {
    0% { opacity: 0; transform: translateY(-8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .feedback-banner {
    width: 100%;
    text-align: center;
    font-family: 'Lora', serif;
    font-size: 17px;
    font-weight: 600;
    padding: 11px 16px;
    border-radius: 12px;
    margin-bottom: 12px;
    animation: bannerIn 0.22s ease-out;
  }
  .feedback-banner.correct { background: var(--success-bg); color: var(--success-text); }
  .feedback-banner.wrong { background: var(--error-bg); color: var(--error-text); }

  @keyframes streakIn {
    0% { opacity: 0; transform: scale(0.85); }
    60% { transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }
  .streak-badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-soft);
    background: rgba(var(--accent-rgb), 0.13);
    border: 1px solid rgba(var(--accent-rgb), 0.3);
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
    animation: streakIn 0.3s ease-out;
  }
  .streak-badge.hot {
    color: var(--accent-bright);
    background: rgba(var(--accent-rgb), 0.22);
    border-color: rgba(var(--accent-soft-rgb), 0.55);
  }
  .streak-target { font-size: 12px; vertical-align: -1px; }

  .answer-compare {
    width: 100%;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--paper-edge);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .compare-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    text-align: left;
  }
  .compare-label {
    flex: 0 0 74px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }
  .compare-value {
    flex: 1;
    min-width: 0;
    font-family: 'Lora', serif;
    font-size: 17px;
    word-break: break-word;
  }
  .compare-value em { color: var(--ink-soft); font-size: 15px; }
  .compare-value.is-wrong { color: var(--error-ink); }
  .compare-value.is-right { color: var(--success-ink); font-weight: 600; }
  .compare-value mark {
    background: rgba(var(--error-rgb), 0.2);
    color: inherit;
    padding: 0 2px;
    border-radius: 3px;
  }
  .compare-value.is-right mark {
    background: rgba(var(--success-rgb), 0.28);
  }

  /* confetti */
  .confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
  }
  .confetti-layer i {
    position: absolute;
    top: 42%;
    display: block;
    opacity: 0;
    animation: confettiFly 1.1s cubic-bezier(.2,.6,.35,1) forwards;
  }
  @keyframes confettiFly {
    0%   { opacity: 1; transform: translate(0,0) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 190px)) rotate(520deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .flashcard.shake, .flashcard.pop, .flashcard.card-enter,
    .feedback-banner, .streak-badge { animation: none; }
    .confetti-layer { display: none; }
  }

  /* ---- Review card ---- */
  .review-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 14px;
  }


  .flashcard {
    width: 100%;
    min-height: 220px;
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius-card);
    box-shadow: 0 6px 0 var(--paper-edge), 0 14px 24px var(--card-shadow);
    padding: 30px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    position: relative;
  }

  .box-dots {
    position: absolute;
    top: 16px;
    left: 20px;
    display: flex;
    gap: 5px;
  }
  .box-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--paper-edge);
  }
  .box-dots span.filled { background: var(--accent); }

  .card-front {
    font-family: 'Lora', serif;
    font-size: 28px;
    font-weight: 600;
    line-height: 1.3;
  }
  /* English prompts are often phrases ("to go, to walk"), so give them a
     slightly smaller size than a single Ukrainian word needs. */
  .card-front.is-english { font-size: 24px; }

  /* Verb aspect: dictionary-style italic under the word. Spelled out rather
     than abbreviated — pf. and impf. are easy to misread at a glance. */
  .card-aspect {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .card-back {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--paper-edge);
    font-size: 18px;
    color: var(--ink-soft);
    width: 100%;
  }

  .card-notes {
    margin-top: 10px;
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .tap-hint {
    margin-top: 16px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .card-prompt-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .type-input {
    width: 100%;
    margin-top: 20px;
    background: var(--field-bg);
    border: 1px solid var(--paper-edge);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 17px;
    text-align: center;
    padding: 12px 14px;
    border-radius: 10px;
  }
  .type-input:focus {
    outline: 2px solid var(--azure);
    outline-offset: 1px;
  }

  .type-feedback {
    margin-top: 18px;
    font-size: 17px;
    font-weight: 500;
  }
  .type-feedback.correct { color: var(--success); }
  .type-feedback.incorrect { color: var(--error); }
  .type-feedback strong { font-family: 'Lora', serif; }

  .flashcard .primary {
    margin-top: 18px;
    width: 100%;
  }


  /* ---- Cards (manage) view ---- */
  .add-toggle {
    width: 100%;
    text-align: left;
    background: var(--bg-elevated);
    border: 1px dashed var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 14px;
    padding: 13px 16px;
    border-radius: 12px;
    cursor: pointer;
    margin: 12px 0 8px;
  }

  .add-form {
    background: var(--bg-elevated);
    border-radius: 12px;
    padding: 16px;
    margin: 12px 0;
  }
  .add-form label {
    display: block;
    font-size: 12px;
    color: var(--cream-dim);
    margin: 10px 0 4px;
  }
  .add-form label:first-child { margin-top: 0; }
  .add-form input, .add-form textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .add-form textarea { resize: vertical; min-height: 44px; }
  .type-select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
    -webkit-appearance: none;
    appearance: none;
  }
  /* Segmented control (verb aspect) */
  .seg {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    gap: 3px;
  }
  .seg-btn {
    flex: 1;
    min-width: 0;
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--cream-dim);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 4px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .seg-btn.on {
    background: rgba(var(--accent-rgb), 0.18);
    border-color: var(--accent);
    color: var(--accent-soft);
    font-weight: 600;
  }
  .seg-btn:focus-visible { outline: 2px solid var(--azure-soft); outline-offset: 1px; }
  .type-note {
    font-size: 11px;
    color: var(--cream-dim);
    opacity: 0.75;
    margin-top: 5px;
    line-height: 1.4;
  }
  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .word-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 2px;
    border-bottom: 1px solid var(--border);
  }
  .word-row .box-dots-inline {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex-shrink: 0;
  }
  .word-row .box-dots-inline span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--border);
  }
  .word-row .box-dots-inline span.filled { background: var(--accent); }
  .word-row .word-text { flex: 1; min-width: 0; }
  .word-row .front { font-family: 'Lora', serif; font-size: 16px; font-weight: 500; }
  .word-row .back { font-size: 13px; color: var(--cream-dim); margin-top: 1px; }
  .word-row .row-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    background: none; border: none; color: var(--cream-dim);
    cursor: pointer; padding: 6px;
  }
  .icon-btn svg { width: 17px; height: 17px; display: block; }
  .icon-btn.danger:hover { color: var(--error); }

  .search-bar {
    position: relative;
    margin-top: 14px;
    display: flex;
    align-items: center;
  }
  .search-icon {
    position: absolute;
    left: 12px;
    display: flex;
    color: var(--cream-dim);
    pointer-events: none;
  }
  .search-icon svg { width: 16px; height: 16px; display: block; }
  .search-bar input {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 14px;
    /* 16px gutter + 16px icon + 10px gap on the left; room for the ✕ right */
    padding: 10px 38px 10px 38px;
    border-radius: 10px;
  }
  .search-bar input:focus {
    outline: none;
    border-color: var(--azure);
  }
  .search-bar input:focus + .search-clear,
  .search-bar input:focus ~ .search-icon { color: var(--azure-soft); }
  .search-clear {
    position: absolute;
    right: 6px;
    background: none;
    border: none;
    color: var(--cream-dim);
    font-size: 13px;
    line-height: 1;
    padding: 8px;
    cursor: pointer;
  }

  .add-row {
    display: flex;
    gap: 8px;
    margin: 12px 0 8px;
  }
  .add-row .add-toggle {
    margin: 0;
    flex: 1;
    text-align: center;
    font-size: 13px;
    padding: 12px 8px;
  }
  /* The two ways in — the Library's main actions, so they wear the accent
     like every other primary button rather than the dashed outline. */
  .add-row .add-toggle.main {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }
  .add-row .add-toggle.main:active { background: var(--accent-soft); }
  .add-row .add-toggle.main:focus-visible { outline: 2px solid var(--azure-soft); outline-offset: 2px; }

  /* ---- Batch entry ---- */
  .batch-panel {
    background: var(--bg-elevated);
    border-radius: 12px;
    padding: 16px;
    margin: 12px 0;
  }
  .batch-step {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent-soft);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .batch-hint {
    font-size: 13px;
    color: var(--cream-dim);
    line-height: 1.45;
    margin: 0 0 12px;
  }
  .batch-hint em { color: var(--cream); font-style: normal; }
  .batch-note {
    background: rgba(var(--accent-rgb), 0.12);
    border: 1px solid rgba(var(--accent-rgb), 0.28);
    color: var(--accent-soft);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .batch-textarea {
    width: 100%;
    min-height: 170px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: 'Lora', serif;
    font-size: 16px;
    line-height: 1.6;
    padding: 12px 14px;
    border-radius: 8px;
    resize: vertical;
  }
  .batch-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .batch-word {
    font-family: 'Lora', serif;
    font-size: 16px;
    font-weight: 500;
    min-width: 0;
    word-break: break-word;
  }
  .batch-fields {
    display: flex;
    gap: 7px;
    align-items: center;
  }
  .batch-fields .batch-back-input { flex: 1; min-width: 0; }
  .batch-aspect { margin-top: 8px; }
  .batch-type-select {
    flex: 0 0 108px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream-dim);
    font-family: inherit;
    font-size: 13px;
    padding: 9px 8px;
    border-radius: 8px;
    -webkit-appearance: none;
    appearance: none;
  }
  .batch-back-input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 15px;
    padding: 9px 11px;
    border-radius: 8px;
  }

  .day-badge {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
    text-align: center;
    line-height: 1.35;
  }
  .day-badge.done {
    color: var(--accent-bright);
    background: rgba(var(--accent-rgb), 0.18);
    border: 1px solid rgba(var(--accent-soft-rgb), 0.45);
  }
  .day-badge.at-risk {
    color: var(--cream-dim);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    font-weight: 500;
  }
  .day-flame { font-size: 10px; }

  /* ---- Home screen ---- */
  .home {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 8px;
  }
  .due-hero {
    width: 100%;
    /* Blue base with gold glowing down from the top edge (the ::after
       below). Gold sits high on purpose: the number needs the light behind
       it, and the panel needs to settle into the chrome at its base. */
    background: linear-gradient(160deg, var(--hero-blue) 0%, var(--bg-elevated) 55%);
    border: 1px solid #2A3C5C;
    border-radius: 20px;
    padding: 30px 20px 26px;
    text-align: center;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }
  .due-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 8%, rgba(var(--accent-rgb), 0.30) 0%, rgba(var(--accent-rgb), 0.06) 42%, transparent 68%);
    pointer-events: none;
  }
  /* Nothing due: the whole panel shifts green rather than leaving a green
     number sitting on a gold glow. */
  .due-hero.is-clear {
    background: linear-gradient(160deg, var(--hero-green) 0%, var(--bg-elevated) 55%);
    border-color: #23404A;
  }
  .due-hero.is-clear::after {
    background: radial-gradient(circle at 50% 8%, rgba(var(--success-rgb), 0.28) 0%, rgba(var(--success-rgb), 0.05) 42%, transparent 68%);
  }
  .due-num {
    font-family: 'Lora', serif;
    font-size: 62px;
    font-weight: 600;
    line-height: 1;
    color: var(--accent-soft);
  }
  .due-hero.is-clear .due-num { color: var(--success); }
  .due-label {
    font-size: 13px;
    color: var(--cream-dim);
    margin-top: 8px;
    letter-spacing: 0.02em;
  }

  .start-btn {
    width: 100%;
    padding: 17px 20px;
    font-size: 17px;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    margin-bottom: 10px;
  }
  .start-sub {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    opacity: 0.7;
  }

  .home-clear {
    font-size: 13px;
    color: var(--cream-dim);
    text-align: center;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .home-stats {
    display: flex;
    width: 100%;
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .home-stat {
    flex: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .home-stat .n {
    font-family: 'Lora', serif;
    font-size: 21px;
    font-weight: 600;
  }
  .home-stat .l {
    font-size: 11px;
    color: var(--cream-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ---- Lesson summary ---- */
  .summary-card {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 20px 22px;
    text-align: center;
    margin-bottom: 18px;
  }
  .summary-glyph {
    font-size: 30px;
    color: var(--success);
    margin-bottom: 8px;
  }
  .summary-card h2 {
    font-family: 'Lora', serif;
    font-size: 24px;
    font-weight: 600;
    margin: 0;
  }
  .summary-sub {
    font-size: 12px;
    color: var(--cream-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 4px 0 18px;
  }
  .summary-grid {
    display: flex;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .summary-grid > div {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .summary-grid .n {
    font-family: 'Lora', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--accent-soft);
  }
  .summary-grid .l {
    font-size: 10px;
    color: var(--cream-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ---- Lesson chrome ---- */
  header.lesson-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 20px 14px;
  }
  .lesson-close {
    background: none;
    border: none;
    color: var(--cream-dim);
    font-size: 19px;
    line-height: 1;
    padding: 4px 2px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .progress-track {
    flex: 1;
    height: 9px;
    background: var(--bg-elevated);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.35s ease;
  }
  .progress-count {
    font-size: 12px;
    color: var(--cream-dim);
    flex-shrink: 0;
    min-width: 34px;
    text-align: right;
  }
  main.lesson-main { padding-bottom: 40px; }

  .word-stats {
    font-size: 12px;
    color: var(--cream-dim);
    margin-top: 5px;
    line-height: 1.45;
  }
  .stat-acc { font-weight: 600; color: var(--cream); }
  .stat-acc.good { color: var(--success-bright); }
  .stat-acc.poor { color: var(--error-bright); }
  /* ---- Sync status ---- */
  .sync-line {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .sync-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--cream-dim);
  }
  .sync-dot.ok    { background: var(--success); }
  .sync-dot.wait  { background: var(--accent); }
  .sync-dot.local { background: var(--cream-dim); }

  /* ---- Speak button ---- */
  .speak-btn {
    margin-top: 14px;
    background: none;
    border: 1px solid var(--paper-edge);
    color: var(--ink-soft);
    border-radius: 999px;
    width: 42px;
    height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .speak-btn:active { transform: scale(0.92); background: var(--paper-edge); }
  .speak-btn svg { width: 19px; height: 19px; display: block; }

  /* Variant for the option list, which sits on the dark background rather
     than on the cream card. */
  .speak-btn.on-dark {
    margin-top: 0;
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-color: var(--border);
    color: var(--cream-dim);
    background: var(--bg-elevated);
  }
  .speak-btn.on-dark:active { background: var(--border); }
  .speak-btn.on-dark svg { width: 17px; height: 17px; }

  /* Held for as long as the voice is actually speaking, driven by the
     utterance's own start/end events rather than a guessed duration. */
  @keyframes speakPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.45); }
    50%      { box-shadow: 0 0 0 5px rgba(var(--accent-rgb), 0); }
  }
  .speak-btn.speaking {
    border-color: var(--accent);
    color: var(--accent);
    animation: speakPulse 1.1s ease-out infinite;
  }
  .speak-btn.on-dark.speaking {
    border-color: var(--accent);
    color: var(--accent-soft);
    background: rgba(var(--accent-rgb), 0.14);
  }
  @media (prefers-reduced-motion: reduce) {
    .speak-btn.speaking { animation: none; }
  }

  .option-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }
  /* The option shrinks to leave room for the speaker beside it. */
  .option-row .option-btn { flex: 1; min-width: 0; }

  .tts-block {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .tts-block input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 9px;
    margin-top: 10px;
  }
  .tts-block .form-actions { margin-top: 10px; }

  .version-row {
    display: block;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    margin-top: 20px;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--cream-dim);
    opacity: 0.5;
  }

  .changelog {
    margin-top: 10px;
    padding: 12px 14px;
    background: var(--bg-elevated);
    border-radius: 10px;
    font-size: 12.5px;
    color: var(--cream-dim);
    line-height: 1.45;
  }
  .cl-entry + .cl-entry { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .cl-version {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-soft);
  }
  .changelog ul { margin: 4px 0 0; padding-left: 18px; }

  .pref-note {
    font-size: 11.5px;
    color: var(--cream-dim);
    line-height: 1.5;
    margin-top: 8px;
    padding: 9px 12px;
    background: var(--bg-elevated);
    border-radius: 8px;
  }

  /* ---- Loading ---- */
  .loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    padding: 0 32px;
    text-align: center;
  }
  .loader { display: flex; gap: 7px; margin-bottom: 22px; }
  .loader span {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounceDot 1.1s ease-in-out infinite;
  }
  .loader span:nth-child(2){ animation-delay: 0.15s; }
  .loader span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounceDot {
    0%, 70%, 100% { transform: translateY(0); opacity: 0.35; }
    35% { transform: translateY(-9px); opacity: 1; }
  }
  .loading-title {
    font-family: 'Lora', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--cream);
  }
  .loading-quote {
    margin-top: 10px;
    font-size: 13.5px;
    font-style: italic;
    color: var(--cream-dim);
    line-height: 1.5;
    max-width: 300px;
  }

  /* ---- Home stat icons ---- */
  .stat-icon {
    font-size: 14px;
    margin-right: 4px;
    vertical-align: 1px;
  }
  .stat-icon.cold { filter: grayscale(1); opacity: 0.4; }

  /* ---- Preference row / toggle ---- */
  .pref-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 14px;
  }
  .toggle {
    width: 46px; height: 27px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    position: relative;
    cursor: pointer;
    padding: 0;
    transition: background 0.18s ease, border-color 0.18s ease;
  }
  .toggle .knob {
    position: absolute;
    top: 2px; left: 2px;
    width: 21px; height: 21px;
    border-radius: 50%;
    background: var(--cream-dim);
    transition: transform 0.18s ease, background 0.18s ease;
  }
  .toggle.on { background: rgba(var(--accent-rgb), 0.3); border-color: var(--accent); }
  .toggle.on .knob { transform: translateX(19px); background: var(--accent-soft); }

  /* ---- Filters ---- */
  /* Active filters, shown as removable chips while the panel is closed,
     so a shortened list never looks like missing words. */
  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
  }
  .filter-chips .filter-chip { margin-top: 0; }
  .filter-chips .text-btn { font-size: 12px; padding: 4px 6px; }
  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-soft);
    background: rgba(var(--accent-rgb), 0.14);
    border: 1px solid rgba(var(--accent-rgb), 0.35);
    padding: 6px 8px 6px 12px;
    border-radius: 999px;
  }
  .filter-chip button {
    background: none;
    border: none;
    color: inherit;
    font-size: 13px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }

  .filter-btn {
    position: relative;
    flex: 0 0 42px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--cream-dim);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .filter-btn svg { width: 17px; height: 17px; display: block; }
  .filter-btn.has-filters { color: var(--accent-soft); }
  .filter-btn.open { border-color: var(--azure); color: var(--azure-soft); }
  .filter-btn:active { background: var(--bg); }
  .filter-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 11px;
    font-weight: 600;
    line-height: 18px;
    text-align: center;
  }
  .filter-panel {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px 14px 12px;
    margin-top: 8px;
  }
  .filter-group-label {
    font-size: 12px;
    color: var(--cream-dim);
    margin: 12px 0 6px;
  }
  .filter-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .fopt {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 13px;
    padding: 7px 11px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
  }
  .fopt .n { font-size: 11px; color: var(--cream-dim); }
  .fopt.on {
    background: rgba(var(--accent-rgb), 0.18);
    border-color: var(--accent);
    color: var(--accent-soft);
    font-weight: 600;
  }
  .fopt.on .n { color: var(--accent-soft); opacity: 0.8; }
  .fopt:disabled { opacity: 0.35; cursor: default; }
  .fopt:focus-visible { outline: 2px solid var(--azure-soft); outline-offset: 1px; }
  .filter-note {
    font-size: 11px;
    color: var(--cream-dim);
    opacity: 0.75;
    margin-top: 6px;
    line-height: 1.4;
  }
  .filter-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }

  /* ---- Jump to top / bottom ---- */
  /* Floats above the tab bar, lined up with the right edge of the 480px
     column on wide screens. Only rendered in the Library, and only shown
     once the list is over two screens long. */
  .jump-nav {
    position: fixed;
    right: max(12px, calc((100vw - 480px) / 2 + 12px));
    bottom: calc(59px + env(safe-area-inset-bottom) + 14px);
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 3px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 6px 18px var(--card-shadow);
    z-index: 20;
  }
  .jump-nav[hidden] { display: none; }
  /* Extra room at the end of the list, so the backup buttons can scroll
     clear of the floating buttons instead of sitting under them. */
  body.has-jump main { padding-bottom: 190px; }
  /* Out of the way while the keyboard is up. */
  body.typing .jump-nav { display: none; }
  .jump-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: none;
    border: none;
    color: var(--accent-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .jump-btn svg { width: 18px; height: 18px; display: block; }
  .jump-btn:active { background: var(--bg); }
  .jump-btn:disabled { color: var(--cream-dim); opacity: 0.3; cursor: default; }
  .jump-btn:focus-visible { outline: 2px solid var(--azure-soft); outline-offset: 1px; }

  /* ---- Shelved words ---- */
  .shelf-row { margin-top: 18px; }
  .shelf-note {
    font-size: 12px;
    color: var(--cream-dim);
    margin: 6px 0 4px;
    line-height: 1.4;
  }
  .word-entry.is-shelved .word-row .word-text .front,
  .word-entry.is-shelved .word-row .word-text .back,
  .word-entry.is-shelved .box-dots-inline { opacity: 0.45; }
  .shelf-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: var(--cream-dim);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 7px;
    line-height: 17px;
  }

  /* ---- Inline editing ---- */
  .word-entry { border-bottom: 1px solid var(--border); }
  .word-entry .word-row { border-bottom: none; }
  .word-entry.is-editing {
    background: rgba(var(--accent-rgb), 0.05);
    border-left: 2px solid var(--accent);
    border-radius: 0 10px 10px 0;
    padding-left: 10px;
    margin: 4px 0 8px;
  }
  .add-form.inline-form {
    background: transparent;
    /* Right inset mirrors the left one on .is-editing, so the fields, stat
       tiles and switch stop short of the panel's rounded edge instead of
       sitting flush against it. The row's own icons stay put, aligned with
       the rows above and below. */
    padding: 0 12px 14px 0;
    margin: 0;
  }
  .icon-btn.active { color: var(--accent-soft); }

  .lib-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 16px 0 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--cream-dim);
  }
  .lib-count { flex-shrink: 0; }

  /* ---- Read-only expanded row ---- */
  .ro-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    color: var(--cream);
    min-height: 42px;
  }
  .ro-field span { min-width: 0; word-break: break-word; }

  .field-with-speak {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .field-with-speak input { flex: 1; min-width: 0; }

  .speak-btn.small {
    width: 34px;
    height: 34px;
    margin-top: 0;
    flex-shrink: 0;
  }
  .speak-btn.small svg { width: 15px; height: 15px; }

  .wd-front .speak-btn.small { margin-left: 8px; vertical-align: middle; }

  /* ---- Delete confirmation ---- */
  .delete-confirm {
    background: var(--error-bg);
    border: 1px solid rgba(var(--error-rgb), 0.5);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 4px 0 10px;
    font-size: 13px;
    color: var(--error-text);
    line-height: 1.45;
  }
  .delete-confirm strong { font-family: 'Lora', serif; }
  .delete-confirm-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .delete-confirm-actions button {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 9px;
    cursor: pointer;
  }
  .danger-btn {
    background: var(--error);
    border: none;
    color: var(--on-error);
  }

  .stat-box .num .stat-icon { font-size: 15px; margin-right: 5px; }

  .chart-hint {
    font-size: 11px;
    color: var(--cream-dim);
    opacity: 0.7;
    margin-top: 8px;

  /* ---- Sort control ---- */

  /* ---- Stats on the edit screen ---- */

    font-size: 17px;
    font-weight: 600;

  .es-grid .n small { font-size: 11px; opacity: 0.5; font-weight: 400; }
  .es-grid .l {

  .es-line {

    color: var(--cream-dim);

  /* ---- Hints ---- */

  /* ---- End-of-lesson word review ---- */
  .review-list-head {

  .word-detail {

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .wd-front {
    font-family: 'Lora', serif;
    font-size: 19px;
    font-weight: 600;
  }
  .wd-dots { display: flex; gap: 4px; flex-shrink: 0; }

    display: block;
    width: 6px; height: 6px; border-radius: 50%;

  }
  .wd-dots span.filled { background: var(--accent); }
  .wd-back {
    font-size: 15px;
    color: var(--cream);
    margin-top: 2px;
  }
  .wd-aspect {
    font-family: 'Lora', serif;
    color: var(--cream-dim);
    margin-left: 4px;
  }
  .wd-line {
    font-size: 13px;
    color: var(--cream-dim);
    margin-top: 7px;
    line-height: 1.45;
  }
  .wd-line span {
    display: inline-block;
    min-width: 42px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent-soft);
    margin-right: 6px;
  }
  .wd-stats {
    font-size: 11px;
    color: var(--cream-dim);
    opacity: 0.8;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid var(--border);
  }

  .import-summary {
    display: flex;
    gap: 8px;
    margin: 4px 0 14px;
  }
  .import-summary > div {
    flex: 1;
    background: var(--bg);
    border-radius: 9px;
    padding: 10px 4px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .import-summary .n {
    font-family: 'Lora', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--accent-soft);
  }
  .import-summary .l {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--cream-dim);
  }
  .form-actions-stack {
    flex-direction: column;
  }
  .form-actions-stack button { width: 100%; }
  .form-actions-stack button:disabled { opacity: 0.45; cursor: default; }

  .backup-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .backup-row button { flex: 1; }

  .account-row {
    margin-top: 20px;
    font-size: 12px;
    color: var(--cream-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .login-screen {
    max-width: 320px;
    margin: 80px auto 0;
    padding: 0 20px;
    text-align: center;
  }
  .login-screen h1 {
    font-family: 'Lora', serif;
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 6px;
  }
  .login-screen p {
    font-size: 13px;
    color: var(--cream-dim);
    margin: 0 0 20px;
  }
  .login-screen input {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .login-screen button.primary {
    width: 100%;
    margin-top: 4px;
  }
  .login-error {
    background: var(--error-bg);
    color: var(--error-text);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 14px;
  }

  /* ---- Stats ---- */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  .stat-box {
    background: var(--bg-elevated);
    border-radius: 12px;
    padding: 16px;
  }
  .stat-box .num {
    font-family: 'Lora', serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--accent-soft);
  }
  .stat-box .label {
    font-size: 12px;
    color: var(--cream-dim);
    margin-top: 2px;
  }

  .box-chart {
    margin-top: 24px;
  }
  .box-chart h3 {
    font-family: 'Lora', serif;
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  .bar-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 3px;
    margin-bottom: 12px;
    width: 100%;
    background: none;
    border: none;
    padding: 3px 0;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }
  .bar-row:disabled { cursor: default; opacity: 0.45; }
  .bar-row:not(:disabled):active .bar-track { background: var(--border); }
  .bar-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .bar-note {
    font-size: 10.5px;
    color: var(--cream-dim);
    opacity: 0.75;
    letter-spacing: 0.02em;
    padding-left: 44px;
  }
  .box-chart-sub {
    font-size: 12px;
    color: var(--cream-dim);
    line-height: 1.5;
    margin: -4px 0 16px;
  }
  .bar-row .bar-label {
    font-size: 12px;
    color: var(--cream-dim);
    width: 44px;
    flex-shrink: 0;
  }
  /* These are <span>s because they sit inside a <button>, where <div> isn't
     valid. Inline elements ignore width and height, so both need an explicit
     display — without it the fill collapses and the bar looks empty. */
  .bar-track {
    display: block;
    flex: 1;
    background: var(--bg-elevated);
    border-radius: 6px;
    height: 14px;
    overflow: hidden;
  }
  .bar-fill {
    display: block;
    height: 100%;
    min-width: 3px;
    background: var(--accent);
    border-radius: 6px;
    transition: width 0.3s ease;
  }
  .bar-row .bar-count {
    font-size: 12px;
    color: var(--cream-dim);
    width: 20px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ---- Two lesson types on the home screen ---- */
  /* The hero splits in two, each count sitting directly above its button. */
  .due-hero.split {
    display: flex;
    align-items: stretch;
    padding: 24px 8px 20px;
  }
  .due-half { flex: 1; min-width: 0; }
  .due-divider {
    width: 1px;
    margin: 6px 0;
    background: rgba(221, 228, 240, 0.12);
  }
  .due-hero.split .due-num { font-size: 50px; }
  /* Nothing due on one side: that number alone goes green. */
  .due-num.zero { color: var(--success); }
  .due-next {
    font-size: 11px;
    color: var(--cream-dim);
    opacity: 0.8;
    margin-top: 4px;
  }
  .start-row {
    display: flex;
    gap: 10px;
    width: 100%;
    margin-bottom: 10px;
  }
  .start-row .start-btn {
    flex: 1;
    min-width: 0;
    margin-bottom: 0;
    padding: 15px 8px;
    font-size: 16px;
  }

  /* Vocab | Declension switch at the top of Library and Profile. */
  .kind-switch { margin: 4px 0 8px; }
  .kind-switch .seg-btn { font-size: 14px; padding: 9px 4px; }

  /* ---- Declension card ---- */
  .card-front.decl-en { font-size: 21px; line-height: 1.35; }
  .decl-frame {
    margin-top: 16px;
    font-family: 'Lora', serif;
    font-size: 19px;
    line-height: 1.55;
    color: var(--ink);
  }
  .decl-gap {
    display: inline-block;
    min-width: 76px;
    border-bottom: 2px solid var(--ink-soft);
    margin: 0;
    line-height: 1.2;
  }
  .decl-gap.filled {
    min-width: 0;
    border-bottom-color: var(--success);
    color: var(--success-ink);
    font-weight: 600;
  }
  .decl-base {
    margin-top: 8px;
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
  }
  /* Tapping the dictionary forms on a lesson card switches italics off and
     on again, for when the Cyrillic italics are hard to read. */
  .decl-base[data-action="toggle-base-italic"] {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .decl-base.upright { font-style: normal; }

  /* ---- Declension library ---- */
  .case-head {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent-soft);
    margin: 22px 0 2px;
  }
  .case-head span { color: var(--cream-dim); text-transform: none; letter-spacing: 0; margin-left: 4px; }
  .pattern-detail { padding: 0 12px 14px 0; }
  .pattern-sent {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .pattern-sent .ps-text { flex: 1; min-width: 0; }
  .ps-uk { font-family: 'Lora', serif; font-size: 15px; line-height: 1.4; }
  .ps-uk strong { color: var(--accent-soft); font-weight: 600; }
  .ps-en { font-size: 12px; color: var(--cream-dim); margin-top: 2px; }
  .pattern-detail .pref-row { margin-top: 12px; }
  .ro-empty { color: var(--cream-dim); font-style: italic; }
  .sent-list .pattern-sent:first-child { border-top: none; }
  .sent-list { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 2px 10px; }
  .sent-list .es-note { margin: 8px 0; }
  .sent-list .sent-form { padding-right: 0 !important; }
  .pd-head, .import-part-head {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent-soft);
    margin: 4px 0 2px;
  }
  .import-part-head { margin: 14px 0 8px; }
  .import-part-head:first-of-type { margin-top: 2px; }
  .pattern-sent .icon-btn { padding: 4px; margin-top: 4px; }
  .pattern-sent .icon-btn svg { width: 15px; height: 15px; }
  .pattern-detail .add-row { margin: 10px 0 4px; }
  .pattern-detail .add-row .add-toggle { font-size: 12.5px; padding: 10px 6px; }
  .ps-en em { font-family: 'Lora', serif; }
  .sent-form { border-top: 1px solid var(--border); padding-top: 12px !important; }
  .sent-form .batch-textarea { font-size: 14px; min-height: 130px; }
  .batch-textarea.pat-batch { font-size: 14px; min-height: 240px; }
  .copy-prompt-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .copy-prompt-btn svg { width: 15px; height: 15px; display: block; }
  .copy-prompt-btn:active { background: var(--bg); }
  .copy-prompt-btn.copied { border-color: var(--success); color: var(--success-text); }
  .copy-prompt-note { font-size: 11.5px; color: var(--cream-dim); opacity: 0.8; margin: 6px 0 12px; line-height: 1.4; }
  .batch-errors { color: var(--error-text); background: var(--error-bg); border-color: rgba(var(--error-rgb), 0.5); }
  .batch-errors ul { margin: 6px 0 0; padding-left: 18px; }
  .pb-group { border-top: 1px solid var(--border); padding: 12px 0 4px; }
  .pb-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pb-name { font-family: 'Lora', serif; font-size: 16px; font-weight: 600; }
  .pb-tag {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--cream-dim); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
  }
  .pb-tag.is-new { color: var(--accent-soft); border-color: rgba(var(--accent-rgb), 0.45); }
  .pb-meaning { font-size: 12.5px; color: var(--cream-dim); margin: 3px 0 4px; }
  .pb-group .pattern-sent { border-top: none; padding: 6px 0; }
  .form-actions button:disabled { opacity: 0.45; cursor: default; }

  /* Live preview of a sentence card while adding or editing one. */
  .sent-preview-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--cream-dim);
    margin: 14px 0 6px;
  }
  .sent-preview {
    background: var(--paper);
    color: var(--ink);
    border-radius: 12px;
    padding: 14px 14px 12px;
    text-align: center;
  }
  .sp-en { font-family: 'Lora', serif; font-weight: 600; font-size: 16px; line-height: 1.35; }
  .sp-en em, .sp-uk em { font-weight: 400; color: var(--ink-soft); }
  .sp-uk { font-family: 'Lora', serif; font-size: 16px; line-height: 1.55; margin-top: 8px; }
  .sp-uk .decl-gap { min-width: 60px; }
  .sp-answer { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .sp-answer strong { color: var(--success-ink); }
  .sent-preview .decl-base { font-size: 13px; margin-top: 4px; }
  .form-error {
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--error-text);
    background: var(--error-bg);
    border-radius: 8px;
    padding: 7px 10px;
  }
</style>

<body>
<div id="app"></div>

<!-- Loaded before the app. Classic (non-module) script, so it always runs
     first, and a missing file just 404s harmlessly instead of breaking. -->
<script src="config.js"></script>
<script type="module">
(function(){
  var state = {
    words: [],
    view: 'home',
    sessionQueue: [],
    sessionActive: false,
    lessonTotal: 0,
    lessonCorrect: 0,
    lessonAnswered: 0,
    lessonDone: false,
    lessonWordIds: [],
    answeredThisLesson: {},
    lessonMisses: {},
    wordsSnapshot: null,
    parkedThisLesson: false,
    lessonReviewOpen: false,
    revealed: false,
    formOpen: false,
    editingId: null,
    expandedId: null,
    confirmDeleteId: null,
    search: '',
    loaded: false,
    showLoader: false,
    typedValue: '',
    checked: false,
    wasCorrect: null,
    feedback: null,
    typedReaction: null,
    chosenOption: null,
    hintShown: false,
    // Hide-the-options mode: the setting itself, and whether this card's
    // options have been uncovered yet (reset for every new card).
    blurOptions: false,
    optionsRevealed: false,
    sortBy: 'practised',
    sortDir: 'desc',
    // Library filters. Kept while the app is open, not saved, so a fresh
    // launch always starts on the full list.
    filters: { boxes: [], types: [], aspect: '', status: '' },
    filterOpen: false,
    soundOn: true,
    speechOn: true,
    importPreview: null,
    batchOpen: false,
    batchStep: 1,
    batchItems: [],
    batchSkipped: 0,
    batchRaw: '',
    streak: 0,
    bestStreak: 0,
    committedStreak: 0,
    committedBest: 0,
    dayStreak: 0,
    bestDayStreak: 0,
    lastLessonDay: null,
    changelogOpen: false,
    // Which kind of lesson is running: 'vocab' (words) or 'decl'
    // (preposition + declension sentences).
    lessonKind: 'vocab',
    // Which side Library and Profile show. One setting for both tabs, so
    // switching in one carries over to the other.
    libKind: 'vocab',
    // Declension patterns, with their sentences and progress. Library data,
    // like the words: added, edited and deleted in the Library.
    patterns: [],
    patternsSnapshot: null,
    lessonDeclShown: [],
    declExpanded: null,
    // Pattern library sort and filters, mirroring the word list.
    declSortBy: 'case',
    declSortDir: 'asc',
    declFilters: { boxes: [], cases: [], status: '' },
    declFilterOpen: false,
    declSearch: '',
    // Pattern form: null, 'new', or the id being edited.
    patEditing: null,
    patConfirmDelete: null,
    // Sentence form inside an open pattern: { pid, idx } (idx -1 = new).
    sentEditing: null,
    sentConfirmDelete: null,
    // Add several sentences: the pattern id, the text, and a note on
    // lines that couldn't be added.
    sentBatchPid: null,
    sentBatchRaw: '',
    sentBatchNote: '',
    // Add several patterns: open?, step 1 (paste) or 2 (preview), the text.
    patBatchOpen: false,
    patDraft: null,
    // The copy being edited: sentences, last-shown index and shelf switch.
    patWork: null,
    patBatchStep: 1,
    patBatchRaw: ''
  };

  // ---------- VERSION & CHANGELOG ----------
  // When releasing: bump APP_VERSION and add an entry at the TOP of
  // CHANGELOG with the same version. The same lines can be pasted into the
  // GitHub commit description. Shown under "What's new" on the Profile tab.
  var APP_VERSION = '2026-11-10c';

  var CHANGELOG = [
    { v: '2026-11-10c', changes: [
      'Words AI prompt: also takes English words to translate, a Ukrainian text or screenshot, or a topic',
      'Words AI prompt: perfective verbs switch to their imperfective partner, reflexive verbs keep -ся, adverbs become adjectives where one exists, close meanings share a line (швидкий = fast, quick)',
      'Words AI prompt: casual everyday Ukrainian, no Russian words or surzhyk, natural English, spelling checked in both languages',
      'All AI prompts: corrections listed as original → corrected, and no silent guessing'
    ]},
    { v: '2026-11-10b', changes: [
      'Declension: tap the adjective and noun under the sentence to switch the italics off; tap again to switch them back on. Each new card starts in italics'
    ]},
    { v: '2026-11-10a', changes: [
      'Declension: a card you get wrong comes back later in the lesson with exactly the same sentence',
      'Declension: after a wrong answer, the card also shows the adjective and noun in their dictionary forms'
    ]},
    { v: '2026-10-29i', changes: [
      'Lessons are less predictable: among entries that are equally due, the pick is random, and the cards in a lesson come up in random order. Most overdue entries still get picked first'
    ]},
    { v: '2026-10-29h', changes: [
      'Library and Profile use the same wording for words and patterns: “entries”'
    ]},
    { v: '2026-10-29g', changes: [
      'Editing a pattern works like editing a word: changes to its sentences and the shelf switch are a draft until you tap Save changes, and Cancel undoes all of them',
      'Save changes also takes a sentence that is still open in its form, or lines still in the paste box'
    ]},
    { v: '2026-10-29f', changes: [
      'Pattern library: sort (case, last practised, accuracy, box, preposition, date added) and filters (box, case, status), like the word list',
      'Tapping a pattern shows everything read-only, like a word: preposition, case, meaning, accepted spellings, note, sentences and progress. Edit turns the same view into the form'
    ]},
    { v: '2026-10-29e', changes: [

  var LOADING_QUOTES = [
