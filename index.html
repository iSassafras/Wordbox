      '</div>';

    if (!state.patterns.length){
      html += '<div class="lib-meta"><span class="lib-count">0 patterns</span>' + syncLineHtml() + '</div>';
      html += '<div class="empty-state">' +
        '<div class="glyph">&#9679;&#9675;&#9679;</div>' +
        '<h2>No patterns yet</h2>' +
        '<p>Add your own, or load the 39 built-in ones.</p>' +
        '<button class="secondary" data-action="load-sample-patterns">Load sample patterns</button>' +
        '</div>' + backupHtml;
      return html;
    }

    html += '<div class="search-bar">' +
      '<span class="search-icon">' + ICONS.search + '</span>' +
      '<input id="decl-search-input" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Search patterns and sentences" value="' + escapeHtml(state.declSearch) + '" />' +
      (state.declSearch ? '<button class="search-clear" data-action="clear-decl-search" aria-label="Clear search">✕</button>' : '') +
      '</div>';

    var dirDesc = state.declSortDir === 'desc';
    var nF = declFilterCount();
    html += '<div class="sort-bar">' +
      '<span class="sort-icon">' + ICONS.sort + '</span>' +
      '<select id="decl-sort-select" aria-label="Sort by">';
    DSORT_FIELDS.forEach(function(o){
      html += '<option value="' + o[0] + '"' + (state.declSortBy === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    });
    html += '</select>';
    html += '<button class="sort-dir" data-action="toggle-dsort-dir" aria-label="' +
      (dirDesc ? 'Descending — tap for ascending' : 'Ascending — tap for descending') + '">' +
      (dirDesc ? ICONS.arrowDown : ICONS.arrowUp) + '</button>';
    html += '<button class="filter-btn' + (nF ? ' has-filters' : '') + (state.declFilterOpen ? ' open' : '') +
      '" data-action="toggle-dfilter-panel" aria-expanded="' + (state.declFilterOpen ? 'true' : 'false') +
      '" aria-label="Filters' + (nF ? ' (' + nF + ' active)' : '') + '">' + ICONS.filter +
      (nF ? '<span class="filter-badge">' + nF + '</span>' : '') + '</button>';
    html += '</div>';
    html += state.declFilterOpen ? declFilterPanelHtml() : declFilterChipsHtml();

    var total = state.patterns.length;
    var shelved = state.patterns.filter(function(p){ return p.shelved; }).length;
    var list = sortPatterns(state.patterns.filter(function(p){ return patMatchesFilters(p, null); }));

    html += '<div class="lib-meta"><span class="lib-count">' +
      (list.length === total ? total : list.length + ' of ' + total) + (total === 1 ? ' pattern' : ' patterns') +
      (shelved ? ', ' + shelved + ' shelved' : '') + '</span>' + syncLineHtml() + '</div>';

    if (!list.length){
      html += '<div class="empty-state"><p>' +
        (nF ? (state.declSearch ? 'No patterns match your search and filters.' : 'No patterns match these filters.')
            : 'No patterns match your search.') + '</p>' +
        (nF ? '<button class="secondary" data-action="dclear-filters">Clear filters</button>' : '') + '</div>';
      return html + backupHtml;
    }

    if (state.declSortBy === 'case'){
      // Headings follow the sort direction, so descending starts at Locative.
      var order = state.declSortDir === 'desc' ? DECL_CASE_ORDER.slice().reverse() : DECL_CASE_ORDER;
      order.forEach(function(c){
        var group = list.filter(function(p){ return p.c === c; });
        if (!group.length) return;
        html += '<div class="case-head">' + DECL_CASES[c].en + '<span>' + DECL_CASES[c].uk + '</span></div>';
        group.forEach(function(p){ html += patternEntryHtml(p); });
      });
    } else {
      list.forEach(function(p){ html += patternEntryHtml(p); });
    }
    return html + backupHtml;
  }

  // Sentence list inside an open pattern. Read-only shows each sentence with
  // its speaker; editing adds the edit and delete buttons and the add row.
  function patternSentencesHtml(p, editing){
    var html = '<label>Sentences (' + p.s.length + ')</label>';
    html += '<div class="sent-list">';
    var se = editing && state.sentEditing && state.sentEditing.pid === p.id ? state.sentEditing : null;
    var sd = editing && state.sentConfirmDelete && state.sentConfirmDelete.pid === p.id ? state.sentConfirmDelete.idx : -2;
    if (!p.s.length && !se && state.sentBatchPid !== p.id){
      html += '<div class="es-note">No sentences yet. ' + (editing ? 'Add one' : 'Tap Edit to add one') +
        ' so this pattern can come up in lessons.</div>';
    }
    p.s.forEach(function(s, i){
      if (se && se.idx === i){ html += renderSentenceForm(s); return; }
      var sent = parseSentence(s);
      html += '<div class="pattern-sent"><div class="ps-text"><div class="ps-uk">' +
        (sent ? sentenceHtml(sent) : escapeHtml(s.uk)) + '</div>' +
        '<div class="ps-en">' + escapeHtml(s.en) + (s.base ? ' · <em>' + escapeHtml(s.base) + '</em>' : '') + '</div></div>' +
        (sent ? speakBtn(sent.full, 'on-dark small') : '') +
        (editing
          ? '<button class="icon-btn" data-action="edit-sentence" data-id="' + p.id + '" data-idx="' + i + '" aria-label="Edit sentence">' + ICONS.edit + '</button>' +
            '<button class="icon-btn danger" data-action="ask-delete-sentence" data-id="' + p.id + '" data-idx="' + i + '" aria-label="Delete sentence">' + ICONS.trash + '</button>'
          : '') +
        '</div>';
      if (sd === i){
        html += '<div class="delete-confirm"><span>Delete this sentence?</span>' +
          '<div class="delete-confirm-actions">' +
          '<button class="danger-btn" data-action="delete-sentence" data-id="' + p.id + '" data-idx="' + i + '">Delete</button>' +
          '<button class="secondary" data-action="cancel-delete-sentence">Keep</button>' +
          '</div></div>';
      }
    });
    if (editing){
      if (se && se.idx === -1) html += renderSentenceForm(null);
      else if (state.sentBatchPid === p.id) html += renderSentBatch();
      else if (!se){
        html += '<div class="add-row">' +
          '<button class="add-toggle" data-action="add-sentence" data-id="' + p.id + '">+ Add a sentence</button>' +
          '<button class="add-toggle" data-action="open-sent-batch" data-id="' + p.id + '">+ Add several</button>' +
          '</div>';
      }
    }
    html += '</div>';
    return html;
  }

  function patternProgressHtml(p, editing){
    var acc = accuracyOf(p);
    var html = '<div class="edit-stats">';
    html += '<div class="es-head">Progress</div>';
    html += '<div class="es-grid">';
    html += '<div><span class="n">' + p.box + '<small>/' + MAX_BOX + '</small></span><span class="l">box</span></div>';
    html += '<div><span class="n">' + (acc === null ? '—' : acc + '%') + '</span><span class="l">accuracy</span></div>';
    html += '<div><span class="n">' + p.nRight + '</span><span class="l">right</span></div>';
    html += '<div><span class="n">' + p.nWrong + '</span><span class="l">wrong</span></div>';
    html += '</div>';
    html += '<div class="es-line">Added: ' + escapeHtml(p.created ? sinceLabel(p.created) : 'before this was tracked') + '</div>';
    html += '<div class="es-line">Last practised: ' + escapeHtml(sinceLabel(p.last)) + '</div>';
    if (p.shelved) html += '<div class="es-line">Shelved: ' + escapeHtml(sinceLabel(p.shelved)) + ' — not in lessons</div>';
    else if (!p.s.length) html += '<div class="es-line">Not in lessons until it has a sentence</div>';
    else html += '<div class="es-line">Next due: ' + escapeHtml(p.due <= todayStr() ? 'now' : p.due) + '</div>';
    if (editing) html += '<div class="es-note">Editing the pattern or its sentences keeps all of this intact.</div>';
    html += '</div>';
    return html;
  }

  function patternEntryHtml(p){
    var editing = state.patEditing === p.id;
    var open = editing || state.declExpanded === p.id;
    var confirming = state.patConfirmDelete === p.id;
    var html = '<div class="word-entry' + (open ? ' is-editing' : '') + (p.shelved ? ' is-shelved' : '') + '">';
    html += '<div class="word-row" data-action="toggle-pattern" data-id="' + p.id + '">';
    html += '<div class="box-dots-inline">' + boxDots(p.box, 'filled', '', null) + '</div>';
    html += '<div class="word-text"><div class="front">' + escapeHtml(patternLabel(p)) + '</div>' +
      '<div class="back">' + escapeHtml(p.meaning) + '</div>';
    var meta = patRowMeta(p);
    if (p.shelved) meta = '<span class="shelf-tag">shelved</span>' + (meta ? ' ' + meta : '');
    if (meta) html += '<div class="word-stats">' + meta + '</div>';
    html += '</div>';
    html += '<div class="row-actions">';
    html += '<button class="icon-btn' + (editing ? ' active' : '') + '" data-action="edit-pattern" data-id="' + p.id + '" aria-label="Edit pattern">' + ICONS.edit + '</button>';
    html += '<button class="icon-btn danger' + (confirming ? ' active' : '') + '" data-action="ask-delete-pattern" data-id="' + p.id + '" aria-label="Delete pattern">' + ICONS.trash + '</button>';
    html += '</div></div>';

    if (confirming){
      html += '<div class="delete-confirm">' +
        '<span>Delete <strong>' + escapeHtml(patternLabel(p)) + '</strong> and its ' + p.s.length +
        (p.s.length === 1 ? ' sentence' : ' sentences') + '? Its progress goes too.</span>' +
        '<div class="delete-confirm-actions">' +
        '<button class="danger-btn" data-action="delete-pattern" data-id="' + p.id + '">Delete</button>' +
        '<button class="secondary" data-action="cancel-delete-pattern">Keep</button>' +
        '</div></div>';
    }

    if (!open) return html + '</div>';

    // Same layout open or editing, like a word: the fields, the sentences,
    // then progress. Editing swaps the fields for inputs and adds the
    // sentence buttons; nothing moves.
    html += '<div class="add-form inline-form">';
    if (editing){
      html += patternFieldsHtml(p);
    } else {
      html += '<label>Preposition</label><div class="ro-field"><span>' + escapeHtml(p.prep) + '</span></div>';
      html += '<label>Case</label><div class="ro-field"><span>' + DECL_CASES[p.c].en + ' · ' + DECL_CASES[p.c].uk + '</span></div>';
      html += '<label>Meaning</label><div class="ro-field"><span>' + (p.meaning ? escapeHtml(p.meaning) : '<em class="ro-empty">none</em>') + '</span></div>';
      html += '<label>Accepted spellings</label><div class="ro-field"><span>' + escapeHtml(p.accept.join(', ')) + '</span></div>';
      if (p.note) html += '<label>Note</label><div class="ro-field"><span>' + escapeHtml(p.note) + '</span></div>';
    }
    var wk = (editing && state.patWork && state.patWork.id === p.id) ? state.patWork : null;
    html += patternSentencesHtml(wk ? { id: p.id, s: wk.s } : p, editing);
    if (editing){
      var shelfOn = wk ? wk.shelvedOn : !!p.shelved;
      html += '<div class="pref-row shelf-row"><span>Shelve this pattern</span>' +
        '<button type="button" class="toggle' + (shelfOn ? ' on' : '') + '" data-action="toggle-pattern-shelf" data-id="' + p.id +
        '" aria-pressed="' + (shelfOn ? 'true' : 'false') + '"><span class="knob"></span></button></div>';
      html += '<div class="shelf-note">Won’t come up in lessons until you unshelve it. Box, stats and due date are frozen.</div>';
      html += '<div class="form-actions">';
      html += '<button class="primary" data-action="save-pattern">Save changes</button>';
      html += '<button class="secondary" data-action="cancel-pattern">Cancel</button>';
      html += '</div>';
    } else {
      html += '<div class="form-actions"><button class="secondary" data-action="edit-pattern" data-id="' + p.id + '">Edit</button></div>';
    }
    html += patternProgressHtml(p, editing);
    html += '</div>';
    return html + '</div>';
  }

  function renderCards(){
    if (state.importPreview) return renderImportPreview();
    if (state.batchOpen) return renderBatch();
    if (state.libKind === 'decl') return renderDeclLibrary();
    var html = kindSwitchHtml();

    // The add form still belongs at the top — there's no row to anchor it to.
    // Editing anchors to its own row further down instead.
    var addingNew = state.formOpen && !state.editingId;
    if (addingNew){
      html += renderWordForm(null);
    } else {
      html += '<div class="add-row">';
      html += '<button class="add-toggle main" data-action="open-form">+ Add a word</button>';
      html += '<button class="add-toggle main" data-action="open-batch">+ Add several</button>';
      html += '</div>';
    }

    var backupHtml = '<div class="backup-row">' +
      '<button class="secondary" data-action="export-backup">Export backup</button>' +
      '<button class="secondary" data-action="import-backup">Import backup</button>' +
      '<input type="file" id="import-file-input" accept="application/json,.json" style="display:none" />' +
      '</div>';

    if (state.words.length === 0){
      html += '<div class="empty-state">' +
        '<div class="glyph">&#9679;&#9675;&#9679;</div>' +
        '<h2>No words yet</h2>' +
        '<p>Everything you add lands here, then gets scheduled into review automatically.</p>' +
        '<button class="secondary" data-action="load-samples">Load sample words</button>' +
        '</div>' + backupHtml;
      // The switch stays on top, above the count line.
      html = kindSwitchHtml() + '<div class="lib-meta"><span class="lib-count">0 words</span>' +
        syncLineHtml() + '</div>' + html.slice(kindSwitchHtml().length);
      return html;
    }

    html += '<div class="search-bar">' +
      '<span class="search-icon">' + ICONS.search + '</span>' +
      '<input id="search-input" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Search words" value="' + escapeHtml(state.search) + '" />' +
      (state.search ? '<button class="search-clear" data-action="clear-search" aria-label="Clear search">\u2715</button>' : '') +
      '</div>';
    var dirDesc = state.sortDir === 'desc';
    var nFilters = activeFilterCount();
    html += '<div class="sort-bar">' +
      '<span class="sort-icon">' + ICONS.sort + '</span>' +
      '<select id="sort-select" aria-label="Sort by">';
    SORT_FIELDS.forEach(function(o){
      html += '<option value="' + o[0] + '"' + (state.sortBy === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    });
    html += '</select>';
    html += '<button class="sort-dir" data-action="toggle-sort-dir" aria-label="' +
      (dirDesc ? 'Descending \u2014 tap for ascending' : 'Ascending \u2014 tap for descending') +
      '" title="' + (dirDesc ? 'Descending' : 'Ascending') + '">' +
      (dirDesc ? ICONS.arrowDown : ICONS.arrowUp) + '</button>';
    html += '<button class="filter-btn' + (nFilters ? ' has-filters' : '') + (state.filterOpen ? ' open' : '') +
      '" data-action="toggle-filter-panel" aria-expanded="' + (state.filterOpen ? 'true' : 'false') +
      '" aria-label="Filters' + (nFilters ? ' (' + nFilters + ' active)' : '') + '">' + ICONS.filter +
      (nFilters ? '<span class="filter-badge">' + nFilters + '</span>' : '') + '</button>';
    html += '</div>';
    html += state.filterOpen ? filterPanelHtml() : filterChipsHtml();

    var list = sortWords(state.words.filter(function(w){ return matchesFilters(w, null); }));

    html += '<div class="lib-meta"><span class="lib-count">' +
      (list.length === state.words.length
        ? state.words.length + (state.words.length === 1 ? ' word' : ' words')
        : list.length + ' of ' + state.words.length + ' words') +
      (function(){
        var n = state.words.length - activeWords().length;
        return n ? ', ' + n + ' shelved' : '';
      })() +
      '</span>' + syncLineHtml() + '</div>';

    if (list.length === 0){
      html += '<div class="empty-state"><p>' +
        (nFilters ? (state.search ? 'No words match your search and filters.' : 'No words match these filters.')
                  : 'No words match your search.') + '</p>' +
        (nFilters ? '<button class="secondary" data-action="clear-filters">Clear filters</button>' : '') +
        '</div>';
    } else {
      list.forEach(function(w){
        var isEditing = state.editingId === w.id;
        var isOpen = isEditing || state.expandedId === w.id;
        var confirming = state.confirmDeleteId === w.id;
        html += '<div class="word-entry' + (isOpen ? ' is-editing' : '') + (w.shelved ? ' is-shelved' : '') + '">';
        // The row itself toggles the expanded view. Taps on the pencil or bin
        // resolve to those buttons first, since the handler walks up from the
        // tapped element and finds the nearest data-action.
        html += '<div class="word-row" data-action="toggle-word" data-id="' + w.id + '">';
        html += '<div class="box-dots-inline">' + boxDots(w.box, 'filled', '', null) + '</div>';
        html += '<div class="word-text"><div class="front">' + escapeHtml(w.front) + '</div><div class="back">' + escapeHtml(w.back) + '</div>';
        // The line under each word reports whatever you're sorting by, so
        // the list answers the question you're currently asking of it rather
        // than showing every statistic at once.
        var meta = rowMeta(w);
        if (w.shelved){
          meta = '<span class="shelf-tag">shelved</span>' + (meta ? ' ' + meta : '');
        }
        if (meta) html += '<div class="word-stats">' + meta + '</div>';
        html += '</div>';
        html += '<div class="row-actions">';
        html += '<button class="icon-btn' + (isEditing ? ' active' : '') + '" data-action="edit-word" data-id="' + w.id + '">' + ICONS.edit + '</button>';
        html += '<button class="icon-btn danger' + (confirming ? ' active' : '') + '" data-action="ask-delete" data-id="' + w.id + '">' + ICONS.trash + '</button>';
        html += '</div></div>';

        if (confirming){
          html += '<div class="delete-confirm">' +
            '<span>Delete <strong>' + escapeHtml(w.front) + '</strong>? Its progress goes too.</span>' +
            '<div class="delete-confirm-actions">' +
            '<button class="danger-btn" data-action="delete-word" data-id="' + w.id + '">Delete</button>' +
            '<button class="secondary" data-action="cancel-delete">Keep</button>' +
            '</div></div>';
        }

        if (isEditing) html += renderWordForm(w, false);
        else if (isOpen) html += renderWordForm(w, true);
        html += '</div>';
      });
    }
    html += backupHtml;
    return html;
  }

  // ---------- RENDER: STATS ----------
  // Written from the same constants the scheduler uses, so these can't fall
  // out of step with what the app actually does.
  function boxNote(n){
    if (n === 1) return 'new or missed \u00B7 back tomorrow';
    var d = INTERVALS[n];
    var note = 'after ' + d + (d === 1 ? ' day' : ' days');
    if (n >= TYPING_FROM_BOX) note += ' \u00B7 typing only';
    if (n === MAX_BOX) note += ' \u00B7 mastered';
    return note;
  }

  function renderStats(){
    var counts = [];
    for (var c = 0; c < MAX_BOX; c++) counts.push(0);
    state.words.forEach(function(w){ counts[w.box - 1]++; });
    // Bars are a share of the whole vocabulary, not of the fullest box.
    // Scaling to the largest box made every chart look the same — the biggest
    // bar was always full — and turned a one-word difference into a dramatic
    // gap. As a share, the bars flatten as words spread up the ladder, which
    // is what progress actually looks like.
    var totalWords = Math.max(state.words.length, 1);

    // Only the all-time records live here. The live figures — due today, the
    // running day streak, the current run of correct answers — are all on the
    // home screen, and repeating them just splits your attention.
    var html = '<div class="stat-grid">';
    html += '<div class="stat-box"><div class="num">' +
      '<span class="stat-icon' + (state.bestDayStreak > 0 ? '' : ' cold') + '">\uD83D\uDD25</span>' +
      state.bestDayStreak + '</div><div class="label">Longest day streak</div></div>';
    html += '<div class="stat-box"><div class="num">' +
      '<span class="stat-icon' + (state.bestStreak > 0 ? '' : ' cold') + '">\uD83C\uDFAF</span>' +
      state.bestStreak + '</div><div class="label">Best in a row</div></div>';
    html += '</div>';

    // The streak records above are shared by both lesson types; only the
    // box chart differs, so the switch sits right above it.
    html += '<div style="margin-top:22px">' + kindSwitchHtml() + '</div>';
    if (state.libKind === 'decl'){
      var dCounts = [];
      for (var dc = 0; dc < MAX_BOX; dc++) dCounts.push(0);
      state.patterns.forEach(function(p){ dCounts[p.box - 1]++; });
      html += '<div class="box-chart" style="margin-top:12px"><h3>Entries per box</h3>' +
        '<p class="box-chart-sub">Each correct answer on schedule moves an entry up one box, and the next review is pushed further out. A miss sends it back to box 1.</p>';
      for (var di = 0; di < MAX_BOX; di++){
        var dShare = dCounts[di] / Math.max(state.patterns.length, 1);
        var dPct = dCounts[di] === 0 ? 0 : Math.max(2, Math.round(dShare * 100));
        var dNote = di === 0 ? 'new or missed · back tomorrow'
          : 'after ' + INTERVALS[di + 1] + (INTERVALS[di + 1] === 1 ? ' day' : ' days') + (di + 1 === MAX_BOX ? ' · mastered' : '');
        html += '<button class="bar-row" data-action="filter-decl-box" data-box="' + (di + 1) + '"' +
          (dCounts[di] === 0 ? ' disabled' : '') + '>' +
          '<span class="bar-top"><span class="bar-label">Box ' + (di + 1) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + dPct + '%"></span></span>' +
          '<span class="bar-count">' + dCounts[di] + '</span></span>' +
          '<span class="bar-note">' + (dCounts[di] === 0 ? '' : Math.round(dShare * 100) + '% · ') + dNote + '</span>' +
          '</button>';
      }
      html += '<div class="chart-hint">Tap a box to see those entries</div></div>';
    } else {
    html += '<div class="box-chart" style="margin-top:12px"><h3>Entries per box</h3>' +
      '<p class="box-chart-sub">Each correct answer on schedule moves an entry up one box, and the next review is pushed further out. A miss sends it back to box 1.</p>';
    for (var i = 0; i < MAX_BOX; i++){
      var share = counts[i] / totalWords;
      // A non-zero box always shows a sliver, so one word out of 200 is still
      // visible rather than rounding away to an empty track.
      var pct = counts[i] === 0 ? 0 : Math.max(2, Math.round(share * 100));
      html += '<button class="bar-row" data-action="filter-box" data-box="' + (i+1) + '"' +
        (counts[i] === 0 ? ' disabled' : '') + '>' +
        '<span class="bar-top">' +
          '<span class="bar-label">Box ' + (i+1) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
          '<span class="bar-count">' + counts[i] + '</span>' +
        '</span>' +
        '<span class="bar-note">' +
          (counts[i] === 0 ? '' : Math.round(share * 100) + '% \u00B7 ') +
          boxNote(i + 1) + '</span>' +
        '</button>';
    }
    html += '<div class="chart-hint">Tap a box to see those entries</div>';
    html += '</div>';
    }
    html += '<div class="pref-row"><span>Sound effects</span>' +
      '<button class="toggle' + (state.soundOn ? ' on' : '') + '" data-action="toggle-sound">' +
      '<span class="knob"></span></button></div>';

    html += '<div class="pref-row"><span>Hide answer options</span>' +
      '<button class="toggle' + (state.blurOptions ? ' on' : '') + '" data-action="toggle-blur-options" ' +
      'aria-pressed="' + (state.blurOptions ? 'true' : 'false') + '">' +
      '<span class="knob"></span></button></div>';
    html += '<div class="pref-note">Multiple-choice options start blurred. Try to recall the ' +
      'answer first, then tap <strong>Show answers</strong> to pick it.</div>';

    if ('speechSynthesis' in window){
      html += '<div class="pref-row"><span>Speak Ukrainian</span>' +
        '<button class="toggle' + (state.speechOn ? ' on' : '') + '" data-action="toggle-speech">' +
        '<span class="knob"></span></button></div>';
      // Said plainly rather than letting a wrong-language voice sound broken.
      if (state.speechOn && voicesReady && !ukVoices.length){
        html += '<div class="pref-note">No Ukrainian voice found on this device, so words may be ' +
          'read with the wrong accent. Add one in Settings \u203A Accessibility \u203A ' +
          'Spoken Content \u203A Voices \u203A Ukrainian.</div>';
      } else if (state.speechOn && ukVoices.length){
        var q = voiceQualityLabel();
        var note = 'Using <strong>' + escapeHtml(ukVoices[0].name || 'unnamed') + '</strong> \u2014 ' +
          q + ' quality' +
          (ukVoices.length > 1 ? ', and ' + (ukVoices.length - 1) + ' more of the same tier picked between at random' : '') + '.';
        if (q === 'standard'){
          note += ' A better one can be downloaded free in Settings \u203A Accessibility \u203A ' +
            'Spoken Content \u203A Voices \u203A Ukrainian \u2014 choose Premium or Enhanced. ' +
            'The app will use it automatically.';
        }
        html += '<div class="pref-note">' + note + '</div>';
      }
    }

    if (state.speechOn) ensureVoices();
    if ('speechSynthesis' in window || getTtsKey()){
      var hasKey = !!getTtsKey();
      html += '<div class="tts-block">';
      html += '<div class="es-head">Google voice (optional)</div>';
      if (hasKey){
        html += '<div class="pref-note">A key is set on this device, so words are read by ' +
          'Google\u2019s Ukrainian voice. Each word is synthesised once and cached, so it costs ' +
          'nothing after the first play and works offline afterwards.</div>';
        html += '<div class="form-actions">';
        html += '<button class="secondary" data-action="clear-tts-key">Remove key</button>';
        html += '</div>';
      } else {
        html += '<div class="pref-note">Paste a Google Cloud Text-to-Speech API key for a ' +
          'better voice than the system one. Stored on this device only \u2014 never in the ' +
          'repository and never synced. Leave empty to keep using the system voice.</div>';
        html += '<input id="tts-key-input" type="password" autocomplete="off" autocapitalize="none" ' +
          'autocorrect="off" spellcheck="false" placeholder="API key" />';
        html += '<div class="form-actions">';
        html += '<button class="primary" data-action="save-tts-key">Save key</button>';
        html += '</div>';
      }
      html += '</div>';
    }

    html += '<button class="version-row" data-action="toggle-changelog">Wordbox \u00B7 ' + APP_VERSION +
      ' \u00B7 ' + (state.changelogOpen ? 'hide changes' : 'what\u2019s new') + '</button>';
    if (state.changelogOpen){
      html += '<div class="changelog">';
      CHANGELOG.forEach(function(entry){
        html += '<div class="cl-entry"><div class="cl-version">' + escapeHtml(entry.v) + '</div><ul>';
        entry.changes.forEach(function(c){ html += '<li>' + escapeHtml(c) + '</li>'; });
        html += '</ul></div>';
      });
      html += '</div>';
    }

    if (useFirebase && currentUser){
      html += '<div class="account-row">Signed in as ' + escapeHtml(currentUser.email) + '<button class="text-btn" data-action="sign-out">Sign out</button></div>';
    }
    return html;
  }

  // ---------- MAIN RENDER ----------
  function render(){
    var app = document.getElementById('app');
    if (!state.loaded){
      // Held back for a moment by the timer below: a local-only load finishes
      // in a few milliseconds, and a loader that flashes for one frame is
      // worse than none at all.
      if (!state.showLoader){ app.innerHTML = ''; return; }
      app.innerHTML =
        '<div class="loading-screen">' +
        '<div class="loader"><span></span><span></span><span></span></div>' +
        '<div class="loading-title">Opening your box\u2026</div>' +
        '<div class="loading-quote">' + escapeHtml(LOADING_QUOTE) + '</div>' +
        '</div>';
      return;
    }

    var html;
    if (state.sessionActive){
      // Lesson mode gets its own chrome: progress instead of a title, and no
      // tab bar, so there's one thing to do and one way out.
      html = '<header class="lesson-header">' + lessonHeaderHtml() + '</header>';
      html += '<main class="lesson-main">' + renderLesson() + '</main>';
    } else {
      var titleMap = {
        home: ['Wordbox', greetingLine()],
        cards: ['Library', 'Add, edit, or remove entries'],
        stats: ['Profile', 'Your progress so far']
      };
      var t = titleMap[state.view] || titleMap.home;

      var body = '';
      if (state.view === 'home') body = renderHome();
      else if (state.view === 'cards') body = renderCards();
      else body = renderStats();

      html = '<header><h1>' + t[0] + '</h1><p>' + t[1] + '</p></header>';
      html += '<main>' + body + '</main>';
      html += '<nav class="tabs">' +
        tabBtn('home', ICONS.home, 'Home') +
        tabBtn('cards', ICONS.cards, 'Library') +
        tabBtn('stats', ICONS.profile, 'Profile') +
        '</nav>';
      // The list itself only: not the import preview or Add several.
      if (state.view === 'cards' && !state.importPreview && !state.batchOpen) html += jumpNavHtml();
    }

    app.innerHTML = html;
    updateJumpNav();

    var searchInput = document.getElementById('search-input');
    if (searchInput){
      searchInput.addEventListener('input', function(e){
        state.search = e.target.value;
        render();
        var el = document.getElementById('search-input');
        if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
      });
    }

    var dSort = document.getElementById('decl-sort-select');
    if (dSort){
      dSort.addEventListener('change', function(e){
        if (!isValidDSort(e.target.value)) return;
        state.declSortBy = e.target.value;
        state.declSortDir = DSORT_DEFAULT_DIR[state.declSortBy] || 'asc';
        persistSettings();
        render();
      });
    }

    var declSearch = document.getElementById('decl-search-input');
    if (declSearch){
      declSearch.addEventListener('input', function(e){
        state.declSearch = e.target.value;
        render();
        var el2 = document.getElementById('decl-search-input');
        if (el2) { el2.focus(); el2.selectionStart = el2.selectionEnd = el2.value.length; }
      });
    }

    // Live preview under the sentence form. Only the preview is redrawn, so
    // the fields keep their text and focus.
    var sEn = document.getElementById('f-s-en');
    if (sEn){
      var sUk = document.getElementById('f-s-uk'), sBase = document.getElementById('f-s-base');
      var redraw = function(){
        var box = document.getElementById('s-preview');
        if (box) box.innerHTML = sentPreviewHtml(sEn.value, sUk.value, sBase.value);
      };
      [sEn, sUk, sBase].forEach(function(f){ f.addEventListener('input', redraw); });
    }

    var typedInput = document.getElementById('typed-input');
    if (typedInput){
      typedInput.focus();
      typedInput.selectionStart = typedInput.selectionEnd = typedInput.value.length;
      typedInput.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){
          e.preventDefault();
          document.querySelector('[data-action="check-typed"]').click();
        }
      });
    }

    var sortSelect = document.getElementById('sort-select');
    if (sortSelect){
      sortSelect.addEventListener('change', function(e){
        if (!isValidSort(e.target.value)) return;
        state.sortBy = e.target.value;
        // Snap to the direction that field is most useful in, so picking
        // "Word" doesn't land you in \u042F \u2192 \u0410 because of a previous choice.
        state.sortDir = SORT_DEFAULT_DIR[state.sortBy] || 'asc';
        persistSettings();
        render();
      });
    }

    // Same live guess on the single-word form. Only for a new word, and only
    // until the dropdown is set by hand.
    var fType = document.getElementById('f-type');
    if (fType){
      var syncAspect = function(){
        var wrap = document.getElementById('f-aspect-wrap');
        if (wrap) wrap.hidden = (fType.value !== 'verb');
      };
      fType.addEventListener('change', function(){ fType.setAttribute('data-touched', '1'); syncAspect(); });
      var reguess = function(){
        if (fType.getAttribute('data-touched') === '1') return;
        var fr = document.getElementById('f-front'), bk = document.getElementById('f-back');
        fType.value = guessType(fr ? fr.value : '', bk ? bk.value : '');
        syncAspect();
      };
      syncAspect();
      ['f-front', 'f-back'].forEach(function(id){
        var el = document.getElementById(id);
        if (el) el.addEventListener('input', reguess);
      });
    }

    // Typing "to walk" should flip the type to Verb — but only while the
    // dropdown is still showing a guess. Once it's been set by hand, leave
    // it alone.
    var backInputs = document.querySelectorAll('.batch-back-input');
    for (var bi = 0; bi < backInputs.length; bi++){
      backInputs[bi].addEventListener('input', function(e){
        var idx = e.target.getAttribute('data-idx');
        var sel = document.querySelector('.batch-type-select[data-idx="' + idx + '"]');
        if (!sel || sel.getAttribute('data-touched') === '1') return;
        var item = state.batchItems[parseInt(idx, 10)];
        if (item) sel.value = guessType(item.front, e.target.value);
        syncBatchAspect(sel);
      });
    }
    var typeSelects = document.querySelectorAll('.batch-type-select');
    for (var ti = 0; ti < typeSelects.length; ti++){
      typeSelects[ti].addEventListener('change', function(e){
        e.target.setAttribute('data-touched', '1');
        syncBatchAspect(e.target);
      });
    }

    var importInput = document.getElementById('import-file-input');
    if (importInput){
      importInput.addEventListener('change', function(e){
        if (e.target.files && e.target.files[0]){
          importBackupFromFile(e.target.files[0]);
        }
        e.target.value = '';
      });
    }
  }

  // ---------- JUMP TO TOP / BOTTOM ----------
  function jumpNavHtml(){
    return '<div class="jump-nav" id="jump-nav" hidden>' +
      '<button class="jump-btn" data-action="jump-top" aria-label="Jump to top">' + ICONS.toTop + '</button>' +
      '<button class="jump-btn" data-action="jump-bottom" aria-label="Jump to bottom">' + ICONS.toBottom + '</button>' +
      '</div>';
  }

  // Shown only when the page is over two screens tall; each arrow is dimmed
  // when you're already at its end.
  // Where "jump to bottom" lands: the backup buttons resting just above the
  // floating buttons, rather than the very end of the page. Aiming at a
  // real element keeps it right whatever the screen size, safe area or
  // spacing below the list.
  function jumpBottomTarget(){
    var se = document.scrollingElement || document.documentElement;
    var max = Math.max(0, se.scrollHeight - window.innerHeight);
    var row = document.querySelector('main .backup-row');
    var nav = document.getElementById('jump-nav');
    if (!row || !nav || nav.hidden) return max;
    var y = window.scrollY || se.scrollTop;
    var target = y + row.getBoundingClientRect().bottom - (nav.getBoundingClientRect().top - 12);
    return Math.max(0, Math.min(max, Math.round(target)));
  }

  function updateJumpNav(){
    // A re-render can remove a focused field without a focusout, so the
    // typing flag is re-checked here rather than trusted.
    document.body.classList.toggle('typing', isTypingField(document.activeElement));
    var nav = document.getElementById('jump-nav');
    if (!nav){ document.body.classList.remove('has-jump'); return; }
    var se = document.scrollingElement || document.documentElement;
    var vh = window.innerHeight;
    var long = se.scrollHeight > vh * 2;
    nav.hidden = !long;
    document.body.classList.toggle('has-jump', long);
    if (!long) return;
    var y = window.scrollY || se.scrollTop;
    nav.querySelector('[data-action="jump-top"]').disabled = y < 40;
    nav.querySelector('[data-action="jump-bottom"]').disabled = y >= jumpBottomTarget() - 4;
  }

  function jumpTo(top){
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    try { window.scrollTo({ top: top, behavior: reduce ? 'auto' : 'smooth' }); }
    catch (e) { window.scrollTo(0, top); }
  }

  window.addEventListener('scroll', updateJumpNav, { passive: true });
  window.addEventListener('resize', updateJumpNav);

  // Hide the jump buttons while typing, so they don't float over the
  // keyboard or a field.
  function isTypingField(el){
    return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT');
  }
  document.addEventListener('focusin', function(e){
    if (isTypingField(e.target)) document.body.classList.add('typing');
  });
  document.addEventListener('focusout', function(e){
    if (isTypingField(e.target)) document.body.classList.remove('typing');
  });

  function tabBtn(id, icon, label){
    return '<button class="' + (state.view === id ? 'active' : '') + '" data-action="switch-view" data-view="' + id + '">' + icon + '<span>' + label + '</span></button>';
  }

  // ---------- EVENTS ----------
  document.getElementById('app').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    // Unsaved pattern fields survive taps elsewhere in the open pattern
    // (sentence buttons re-render the list); Save and Cancel decide for real.
    if (state.patEditing && action !== 'save-pattern' && action !== 'cancel-pattern' && document.getElementById('f-p-prep')){
      state.patDraft = {
        id: state.patEditing,
        prep: document.getElementById('f-p-prep').value,
        c: document.getElementById('f-p-case').value,
        meaning: document.getElementById('f-p-meaning').value,
        accept: document.getElementById('f-p-accept').value,
        note: document.getElementById('f-p-note').value
      };
    }

    if (action === 'switch-view'){
      // Filters stay while you switch tabs; only the panel closes.
      state.filterOpen = false;
      state.declFilterOpen = false;
      state.expandedId = null;
      state.confirmDeleteId = null;
      state.view = el.getAttribute('data-view');
      stopPatternEdit();
      state.patBatchOpen = false;
      state.formOpen = false;
      state.batchOpen = false;
      state.editingId = null;
      state.lessonDone = false;
      state.lessonReviewOpen = false;
      render();
    }
    else if (action === 'start-lesson'){
      startLesson(false, el.getAttribute('data-kind'));
    }
    else if (action === 'practice-anyway'){
      startLesson(true, el.getAttribute('data-kind'));
    }
    else if (action === 'set-kind'){
      state.libKind = el.getAttribute('data-kind') === 'decl' ? 'decl' : 'vocab';
      stopPatternEdit();
      state.declFilterOpen = false;
      state.filterOpen = false;
      state.expandedId = null;
      state.editingId = null;
      state.formOpen = false;
      state.confirmDeleteId = null;
      render();
    }
    else if (action === 'open-library'){
      state.libKind = el.getAttribute('data-kind') === 'decl' ? 'decl' : 'vocab';
      state.view = 'cards';
      state.lessonDone = false;
      render();
    }
    else if (action === 'toggle-pattern'){
      var pid = el.getAttribute('data-id');
      // Tapping another pattern while one is being edited closes the editor
      // without saving, as with words.
      if (state.patEditing && state.patEditing !== pid) stopPatternEdit();
      state.declExpanded = (state.declExpanded === pid && state.patEditing !== pid) ? null : pid;
      if (state.patEditing !== pid) closeDeclForms();
      render();
    }
    else if (action === 'toggle-pattern-shelf'){
      // Part of the draft: applied on Save, undone by Cancel.
      if (state.patWork){ state.patWork.shelvedOn = !state.patWork.shelvedOn; render(); }
    }
    else if (action === 'open-pattern-form'){
      stopPatternEdit();
      state.patEditing = 'new';
      state.declExpanded = null;
      render();
      var fp = document.getElementById('f-p-prep');
      if (fp) fp.focus();
    }
    else if (action === 'edit-pattern'){
      var epId = el.getAttribute('data-id');
      var wasEditing = state.patEditing === epId;
      stopPatternEdit();
      if (!wasEditing) startPatternEdit(epId);
      state.declExpanded = wasEditing ? null : epId;
      render();
    }
    else if (action === 'cancel-pattern'){
      // Discards everything since Edit: fields, sentences and the shelf.
      stopPatternEdit();
      render();
    }
    else if (action === 'save-pattern'){
      var pPrepEl = document.getElementById('f-p-prep');
      var pPrep = pPrepEl.value.trim();
      if (!pPrep){ pPrepEl.focus(); return; }

      // Save takes whatever is still open below, too: a half-finished
      // sentence or pasted lines. If either has a problem, it's shown there
      // and nothing is saved yet.
      if (state.patWork && !absorbOpenSentenceForms()) return;

      var pAccept = prepVariants(pPrep);
      document.getElementById('f-p-accept').value.split(',').forEach(function(x){
        x = x.trim();
        if (x && pAccept.map(normalize).indexOf(normalize(x)) === -1) pAccept.push(x);
      });
      var pFields = {
        prep: pPrep,
        c: document.getElementById('f-p-case').value,
        accept: pAccept,
        meaning: document.getElementById('f-p-meaning').value.trim(),
        note: document.getElementById('f-p-note').value.trim()
      };
      if (state.patEditing === 'new'){
        var np = normalizePattern(Object.assign(pFields, { created: todayStr() }));
        state.patterns.push(np);
        state.declSearch = '';
        state.declFilters = { boxes: [], cases: [], status: '' };
        persist();
        // Straight into editing it, ready for its first sentence.
        stopPatternEdit();
        startPatternEdit(np.id);
        state.declExpanded = np.id;
        state.sentEditing = { pid: np.id, idx: -1 };
        render();
        var fsEn = document.getElementById('f-s-en');
        if (fsEn) fsEn.focus();
        return;
      }
      var ep = patternById(state.patEditing);
      var wk = state.patWork;
      if (ep && wk){
        ep.prep = pFields.prep; ep.c = DECL_CASES[pFields.c] ? pFields.c : ep.c;
        ep.accept = pFields.accept; ep.meaning = pFields.meaning; ep.note = pFields.note;
        ep.s = wk.s;
        ep.si = wk.si;
        setShelved(ep, wk.shelvedOn);
      }
      stopPatternEdit();
      persist();
      render();
    }
    else if (action === 'ask-delete-pattern'){
      var dpId = el.getAttribute('data-id');
      state.patConfirmDelete = state.patConfirmDelete === dpId ? null : dpId;
      render();
    }
    else if (action === 'cancel-delete-pattern'){
      state.patConfirmDelete = null;
      render();
    }
    else if (action === 'delete-pattern'){
      var delP = el.getAttribute('data-id');
      state.patterns = state.patterns.filter(function(x){ return x.id !== delP; });
      if (state.declExpanded === delP) state.declExpanded = null;
      if (state.patEditing === delP) stopPatternEdit();
      closeDeclForms();
      persist();
      render();
    }
    else if (action === 'add-sentence' || action === 'edit-sentence'){
      closeDeclForms();
      state.sentEditing = { pid: el.getAttribute('data-id'),
        idx: action === 'add-sentence' ? -1 : parseInt(el.getAttribute('data-idx'), 10) };
      render();
      var fse = document.getElementById('f-s-en');
      if (fse) fse.focus();
    }
    else if (action === 'cancel-sentence'){
      state.sentEditing = null;
      render();
    }
    else if (action === 'save-sentence'){
      if (applySentenceForm()) render();
    }
    else if (action === 'ask-delete-sentence'){
      var dsP = el.getAttribute('data-id'), dsI = parseInt(el.getAttribute('data-idx'), 10);
      var same = state.sentConfirmDelete && state.sentConfirmDelete.pid === dsP && state.sentConfirmDelete.idx === dsI;
      closeDeclForms();
      state.sentConfirmDelete = same ? null : { pid: dsP, idx: dsI };
      render();
    }
    else if (action === 'cancel-delete-sentence'){
      state.sentConfirmDelete = null;
      render();
    }
    else if (action === 'delete-sentence'){
      var dsp = state.patWork;
      var dsi = parseInt(el.getAttribute('data-idx'), 10);
      if (dsp && dsi >= 0 && dsi < dsp.s.length){
        dsp.s.splice(dsi, 1);
        // Keep "shown last time" pointing at the same sentence, or nothing.
        if (dsp.si === dsi) dsp.si = -1;
        else if (dsp.si > dsi) dsp.si--;
      }
      state.sentConfirmDelete = null;
      render();
    }
    else if (action === 'open-sent-batch'){
      closeDeclForms();
      state.sentBatchPid = el.getAttribute('data-id');
      render();
      var sbi = document.getElementById('sent-batch-input');
      if (sbi) sbi.focus();
    }
    else if (action === 'cancel-sent-batch'){
      state.sentBatchPid = null;
      state.sentBatchRaw = '';
      state.sentBatchNote = '';
      render();
    }
    else if (action === 'save-sent-batch'){
      applySentBatch();
      render();
    }
    else if (action === 'copy-prompt'){
      var pk = el.getAttribute('data-kind');
      var ptext = pk === 'words' ? promptForWords()
        : pk === 'patterns' ? promptForPatterns()
        : promptForSentences(state.patWork || patternById(el.getAttribute('data-id')) || normalizePattern({}));
      // Feedback on the button itself, without a re-render: that would
      // throw away whatever is already typed in the box below.
      var label = el.querySelector('span');
      copyText(ptext).then(function(ok){
        if (label) label.textContent = ok ? 'Copied ✓' : 'Couldn’t copy';
        el.classList.toggle('copied', ok);
        setTimeout(function(){
          if (label) label.textContent = 'Copy AI prompt';
          el.classList.remove('copied');
        }, 2200);
      });
    }
    else if (action === 'open-pat-batch'){
      stopPatternEdit();
      state.patBatchOpen = true;
      state.patBatchStep = 1;
      state.patBatchRaw = '';
      render();
      var pbi = document.getElementById('pat-batch-input');
      if (pbi) pbi.focus();
    }
    else if (action === 'cancel-pat-batch'){
      state.patBatchOpen = false;
      state.patBatchRaw = '';
      render();
    }
    else if (action === 'pat-batch-next'){
      var pbt = document.getElementById('pat-batch-input');
      state.patBatchRaw = pbt ? pbt.value : '';
      if (!state.patBatchRaw.trim()) return;
      state.patBatchStep = 2;
      render();
      window.scrollTo(0, 0);
    }
    else if (action === 'pat-batch-back'){
      // The pasted text is kept, so Back is only for fixing it.
      state.patBatchStep = 1;
      render();
    }
    else if (action === 'pat-batch-save'){
      var pbr = parsePatternBatch(state.patBatchRaw);
      pbr.groups.forEach(function(g){
        if (g.existing){
          g.sentences.forEach(function(x){ g.existing.s.push(x); });
          g.accept.forEach(function(a){
            if (g.existing.accept.map(normalize).indexOf(normalize(a)) === -1) g.existing.accept.push(a);
          });
        } else {
          state.patterns.push(normalizePattern({ prep: g.prep, c: g.c, meaning: g.meaning, accept: g.accept,
            note: g.note, s: g.sentences, created: todayStr() }));
        }
      });
      state.patBatchOpen = false;
      state.patBatchRaw = '';
      state.declSearch = '';
      state.declFilters = { boxes: [], cases: [], status: '' };
      persist();
      render();
    }
    else if (action === 'toggle-dfilter-panel'){
      state.declFilterOpen = !state.declFilterOpen;
      render();
    }
    else if (action === 'dfilter-toggle'){
      var dg = el.getAttribute('data-group'), dv = el.getAttribute('data-value');
      var df = state.declFilters;
      if (dg === 'boxes' || dg === 'cases'){
        if (dg === 'boxes') dv = parseInt(dv, 10);
        var di = df[dg].indexOf(dv);
        if (di === -1) df[dg].push(dv); else df[dg].splice(di, 1);
      } else if (dg === 'status'){
        df.status = (df.status === dv) ? '' : dv;
      }
      render();
    }
    else if (action === 'dclear-filter-group'){
      var dcg = el.getAttribute('data-group');
      if (dcg === 'status') state.declFilters.status = '';
      else state.declFilters[dcg] = [];
      render();
    }
    else if (action === 'dclear-filters'){
      state.declFilters = { boxes: [], cases: [], status: '' };
      render();
    }
    else if (action === 'toggle-dsort-dir'){
      state.declSortDir = state.declSortDir === 'desc' ? 'asc' : 'desc';
      persistSettings();
      render();
    }
    else if (action === 'clear-decl-search'){
      state.declSearch = '';
      render();
    }
    else if (action === 'load-sample-patterns'){
      // Only offered when there are no patterns at all.
      state.patterns = seedPatterns(null);
      persist();
      render();
    }
    else if (action === 'filter-decl-box'){
      // Drill-down from the Profile chart: that box alone, nothing else.
      state.declFilters = { boxes: [parseInt(el.getAttribute('data-box'), 10)], cases: [], status: '' };
      state.declFilterOpen = false;
      state.declSearch = '';
      state.libKind = 'decl';
      state.declExpanded = null;
      state.view = 'cards';
      render();
    }
    else if (action === 'end-lesson'){
      endLesson(false);
    }
    else if (action === 'dismiss-summary'){
      state.lessonDone = false;
      state.lessonReviewOpen = false;
      render();
    }
    else if (action === 'filter-box'){
      // Drill-down from the Profile chart: that box alone, nothing else.
      state.filters = { boxes: [parseInt(el.getAttribute('data-box'), 10)], types: [], aspect: '', status: '' };
      state.libKind = 'vocab';
      state.filterOpen = false;
      state.view = 'cards';
      state.formOpen = false;
      state.batchOpen = false;
      state.search = '';
      render();
    }
    else if (action === 'clear-search'){
      state.search = '';
      render();
    }
    else if (action === 'jump-top'){
      jumpTo(0);
    }
    else if (action === 'jump-bottom'){
      jumpTo(jumpBottomTarget());
    }
    else if (action === 'toggle-filter-panel'){
      state.filterOpen = !state.filterOpen;
      render();
    }
    else if (action === 'filter-toggle'){
      var fg = el.getAttribute('data-group'), fv = el.getAttribute('data-value');
      var ff = state.filters;
      if (fg === 'boxes' || fg === 'types'){
        if (fg === 'boxes') fv = parseInt(fv, 10);
        var fi = ff[fg].indexOf(fv);
        if (fi === -1) ff[fg].push(fv); else ff[fg].splice(fi, 1);
        // Aspect has no meaning once Verb is no longer picked.
        if (fg === 'types' && ff.types.indexOf('verb') === -1) ff.aspect = '';
      } else if (fg === 'aspect' || fg === 'status'){
        ff[fg] = (ff[fg] === fv) ? '' : fv;   // tap again to deselect
      }
      render();
    }
    else if (action === 'clear-filter-group'){
      var cg = el.getAttribute('data-group');
      if (cg === 'boxes' || cg === 'types') state.filters[cg] = [];
      else if (cg === 'aspect' || cg === 'status') state.filters[cg] = '';
      if (cg === 'types') state.filters.aspect = '';
      render();
    }
    else if (action === 'clear-filters'){
      state.filters = { boxes: [], types: [], aspect: '', status: '' };
      render();
    }
    else if (action === 'speak'){
      speakUkrainian(el.getAttribute('data-text'));
    }
    else if (action === 'toggle-speech'){
      state.speechOn = !state.speechOn;
      persistSettings();
      render();
      if (state.speechOn) speakUkrainian('\u0434\u043E\u0431\u0440\u0435');   // "good"
    }
    else if (action === 'save-tts-key'){
      var kEl = document.getElementById('tts-key-input');
      var kVal = kEl ? kEl.value.trim() : '';
      if (!kVal) return;
      setTtsKey(kVal);
      render();
      speakUkrainian('\u0434\u043E\u0431\u0440\u0435');   // "good" — proves it works
    }
    else if (action === 'clear-tts-key'){
      setTtsKey('');
      render();
    }
    else if (action === 'toggle-sound'){
      state.soundOn = !state.soundOn;
      persistSettings();
      if (state.soundOn) soundCorrect();
      render();
    }
    else if (action === 'toggle-blur-options'){
      state.blurOptions = !state.blurOptions;
      persistSettings();
      render();
    }
    else if (action === 'reveal-options'){
      state.optionsRevealed = true;
      render();
    }
    else if (action === 'goto-cards'){
      state.view = 'cards';
      state.libKind = 'vocab';
      state.formOpen = true;
      state.lessonDone = false;
      render();
    }
    else if (action === 'show-hint'){
      // Capture what's typed first — revealing the hint re-renders the card.
      var hintInput = document.getElementById('typed-input');
      if (hintInput) state.typedValue = hintInput.value;
      state.hintShown = true;
      render();
    }
    else if (action === 'toggle-base-italic'){
      // Flips the class in place instead of re-rendering, so whatever is
      // typed in the answer field stays put.
      state.baseUpright = !state.baseUpright;
      el.classList.toggle('upright', state.baseUpright);
    }
    else if (action === 'open-lesson-review'){
      state.lessonReviewOpen = true;
      render();
    }
    else if (action === 'toggle-changelog'){
      state.changelogOpen = !state.changelogOpen;
      render();
    }
    else if (action === 'close-lesson-review'){
      state.lessonReviewOpen = false;
      render();
    }
    else if (action === 'check-typed'){
      var input = document.getElementById('typed-input');
      var entryT = state.sessionQueue[0];
      state.typedValue = input ? input.value : '';
      if (state.lessonKind === 'decl'){
        var pT = patternById(entryT.id);
        state.wasCorrect = gradeDecl(state.typedValue, pT, parseSentence(pT.s[entryT.si]));
      } else {
        var wordT = state.words.find(function(x){ return x.id === entryT.id; });
        state.wasCorrect = normalizeTyped(state.typedValue) === normalizeTyped(wordT.front);
      }
      state.checked = true;
      scoreStreak(state.wasCorrect);
      state.typedReaction = reactionFor(state.wasCorrect);
      render();
      if (state.wasCorrect){ soundCorrect(); burstConfetti(); autoAdvance(); }
      else { soundWrong(); }
    }
    else if (action === 'choose-option'){
      if (state.chosenOption !== null) return;
      var idx = parseInt(el.getAttribute('data-index'), 10);
      var entryC = state.sessionQueue[0];
      var wordC = state.words.find(function(x){ return x.id === entryC.id; });
      state.chosenOption = idx;
      var cField = entryC.dir === 'choice-en' ? 'back' : 'front';
      state.wasCorrect = normalize(entryC.options[idx]) === normalize(wordC[cField]);
      scoreStreak(state.wasCorrect);
      state.feedback = { type: state.wasCorrect ? 'correct' : 'wrong', message: reactionFor(state.wasCorrect) };
      render();
      if (state.wasCorrect){ soundCorrect(); burstConfetti(); autoAdvance(); }
      else { soundWrong(); }
    }
    else if (action === 'next-card'){
      applyAnswer(state.wasCorrect);
    }
    else if (action === 'open-form'){
      state.formOpen = true;
      state.editingId = null;
      render();
      var f = document.getElementById('f-front');
      if (f) f.focus();
    }
    else if (action === 'cancel-form'){
      state.formOpen = false;
      state.editingId = null;
      render();
    }
    else if (action === 'toggle-word'){
      var tId = el.getAttribute('data-id');
      state.expandedId = (state.expandedId === tId && !state.editingId) ? null : tId;
      state.editingId = null;
      state.formOpen = false;
      state.confirmDeleteId = null;
      render();
    }
    else if (action === 'edit-word'){
      var wantId = el.getAttribute('data-id');
      // Tapping the pencil on the row already being edited closes it again.
      if (state.editingId === wantId){
        state.editingId = null;
        state.formOpen = false;
        state.expandedId = null;
      } else {
        state.editingId = wantId;
        state.expandedId = wantId;
        state.formOpen = true;
      }
      state.confirmDeleteId = null;
      render();
    }
    else if (action === 'ask-delete'){
      var dId = el.getAttribute('data-id');
      state.confirmDeleteId = state.confirmDeleteId === dId ? null : dId;
      render();
    }
    else if (action === 'cancel-delete'){
      state.confirmDeleteId = null;
      render();
    }
    else if (action === 'delete-word'){
      var id = el.getAttribute('data-id');
      state.words = state.words.filter(function(w){ return w.id !== id; });
      state.confirmDeleteId = null;
      if (state.expandedId === id) state.expandedId = null;
      if (state.editingId === id){ state.editingId = null; state.formOpen = false; }
      persist();
      render();
    }
    else if (action === 'set-aspect-draft'){
      // DOM only, like the shelf toggle: applied on Save, undone by Cancel.
      var seg = el.parentNode;
      seg.setAttribute('data-value', el.getAttribute('data-value'));
      seg.querySelectorAll('.seg-btn').forEach(function(b){
        var on = (b === el);
        b.classList.toggle('on', on);
        b.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    }
    else if (action === 'toggle-shelf-draft'){
      // DOM only: a re-render would throw away whatever is typed in the form.
      var on = !el.classList.contains('on');
      el.classList.toggle('on', on);
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    else if (action === 'save-word'){
      var front = document.getElementById('f-front').value.trim();
      var back = document.getElementById('f-back').value.trim();
      var notes = document.getElementById('f-notes').value.trim();
      var hint = document.getElementById('f-hint').value.trim();
      var typeEl = document.getElementById('f-type');
      // An untouched dropdown means you never expressed a preference, so let
      // makeWord guess from the final text rather than banking the default.
      var type = (typeEl && typeEl.getAttribute('data-touched') === '1') ? typeEl.value : '';
      var aspectEl = document.getElementById('f-aspect');
      var aspect = aspectEl ? aspectEl.getAttribute('data-value') : '';
      if (!isValidAspect(aspect)) aspect = '';
      if (!front || !back){ return; }

      if (state.editingId){
        // Editing keeps the word's box, due date and stats untouched.
        var w2 = state.words.find(function(x){ return x.id === state.editingId; });
        w2.front = front; w2.back = back; w2.notes = notes; w2.hint = hint;
        // Only overwrite when the dropdown was actually changed; an
        // untouched one must not silently reclassify an existing word.
        if (isValidType(type)) w2.type = type;
        // Cleared when the word is no longer a verb, so nothing stale
        // reappears if it's ever switched back.
        w2.aspect = (w2.type === 'verb') ? aspect : '';
        var shelfEl = document.getElementById('f-shelved');
        if (shelfEl) setShelved(w2, shelfEl.classList.contains('on'));
      } else {
        var nw = makeWord(front, back, notes, hint, type);
        if (nw.type === 'verb') nw.aspect = aspect;
        state.words.push(nw);
      }
      state.formOpen = false;
      state.editingId = null;
      persist();
      render();
    }
    else if (action === 'open-batch'){
      state.batchOpen = true;
      state.batchStep = 1;
      state.batchItems = [];
      state.batchSkipped = 0;
      state.batchRaw = '';
      state.formOpen = false;
      render();
      var bi = document.getElementById('batch-input');
      if (bi) bi.focus();
    }
    else if (action === 'cancel-batch'){
      state.batchOpen = false;
      state.batchRaw = '';
      state.batchItems = [];
      render();
    }
    else if (action === 'batch-next'){
      var ta = document.getElementById('batch-input');
      state.batchRaw = ta ? ta.value : '';
      var parsed = parseBatchLines(state.batchRaw);
      state.batchItems = parsed.items;
      state.batchSkipped = parsed.skipped;
      state.batchStep = 2;
      render();
    }
    else if (action === 'batch-back'){
      // Keep whatever meanings were typed so Back isn't destructive.
      captureBatchMeanings();
      state.batchStep = 1;
      render();
    }
    else if (action === 'batch-save'){
      captureBatchMeanings();
      var added = 0;
      state.batchItems.forEach(function(item){
        if (!item.front.trim() || !item.back.trim()) return;
        var bw = makeWord(item.front, item.back, '', '', item.type || '');
        if (bw.type === 'verb' && isValidAspect(item.aspect)) bw.aspect = item.aspect;
        state.words.push(bw);
        added++;
      });
      state.batchOpen = false;
      state.batchItems = [];
      state.batchRaw = '';
      persist();
      render();
    }
    else if (action === 'toggle-sort-dir'){
      state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
      persistSettings();
      render();
    }
    else if (action === 'load-samples'){
      // Only offered from the empty state, so nothing can be overwritten.
      state.words = seedWords();
      persist();
      render();
    }
    else if (action === 'import-merge'){
      var imp = state.importPreview;
      if (imp.w) state.words = state.words.concat(imp.w.fresh);
      if (imp.p) state.patterns = state.patterns.concat(imp.p.fresh);
      state.importPreview = null;
      persist();
      render();
    }
    else if (action === 'import-replace'){
      var imr = state.importPreview;
      if (imr.w) state.words = imr.w.all;
      if (imr.p) state.patterns = imr.p.all;
      state.importPreview = null;
      persist();
      render();
    }
    else if (action === 'import-cancel'){
      state.importPreview = null;
      render();
    }
    else if (action === 'export-backup'){
      exportBackup();
    }
    else if (action === 'import-backup'){
      var fileInput = document.getElementById('import-file-input');
      if (fileInput) fileInput.click();
    }
    else if (action === 'sign-out'){
      if (fbSignOut) fbSignOut(fbAuth);
    }
  });

  // ---------- EDITING A PATTERN ----------
  // Edit works on a copy, like a word's form: fields, sentences and the
  // shelf switch all change the copy, Save changes writes it back in one go,
  // and Cancel (or tapping away) throws it away.
  function startPatternEdit(id){
    var p = patternById(id);
    if (!p) return;
    state.patEditing = id;
    state.patDraft = null;
    state.patWork = { id: id, s: JSON.parse(JSON.stringify(p.s)), si: p.si, shelvedOn: !!p.shelved };
  }

  function stopPatternEdit(){
    state.patEditing = null;
    state.patDraft = null;
    state.patWork = null;
    closeDeclForms();
  }

  // The open sentence form into the copy. Returns false (with the problem
  // shown in the preview) if it can't be used yet.
  function applySentenceForm(){
    var se = state.sentEditing, wk = state.patWork;
    if (!se || !wk) return true;
    var sNew = {
      en: document.getElementById('f-s-en').value.trim(),
      uk: document.getElementById('f-s-uk').value.trim(),
      base: document.getElementById('f-s-base').value.trim()
    };
    var why = !sNew.en ? 'Add the English sentence.' : !sNew.uk ? 'Add the Ukrainian sentence.' : gapProblem(sNew.uk);
    if (why){
      // Shown without a re-render, which would throw away what's typed.
      var prev = document.getElementById('s-preview');
      if (prev) prev.innerHTML = sentPreviewHtml(sNew.en, sNew.uk, sNew.base).replace(/<div class="form-error">.*?<\/div>$/, '') +
        '<div class="form-error">' + escapeHtml(why) + '</div>';
      return false;
    }
    if (se.idx === -1) wk.s.push(sNew);
    else wk.s[se.idx] = sNew;
    state.sentEditing = null;
    return true;
  }

  // Pasted lines into the copy. Lines that don't work stay in the box with
  // the reason; returns false if any are left.
  function applySentBatch(){
    var wk = state.patWork;
    var ta = document.getElementById('sent-batch-input');
    if (!wk || !ta) return true;
    var parsed = parseSentBatch(ta.value);
    parsed.good.forEach(function(x){ wk.s.push(x); });
    if (parsed.bad.length){
      state.sentBatchRaw = parsed.bad.map(function(b){ return b.line; }).join('\n');
      state.sentBatchNote = (parsed.good.length ? 'Added ' + parsed.good.length + '. ' : '') +
        'Still to fix: ' + parsed.bad.map(function(b){ return b.why; }).join('; ') + '.';
      return false;
    }
    state.sentBatchPid = null;
    state.sentBatchRaw = '';
    state.sentBatchNote = '';
    return true;
  }

  // Before Save: anything still typed into a sentence form or the paste box
  // goes in too, so Save really does save everything on screen. An untouched
  // empty form is just closed.
  function absorbOpenSentenceForms(){
    if (state.sentEditing){
      var en = document.getElementById('f-s-en'), uk = document.getElementById('f-s-uk');
      var blank = en && uk && !en.value.trim() && !uk.value.trim();
      if (blank) state.sentEditing = null;
      else if (!applySentenceForm()) return false;
    }
    if (state.sentBatchPid){
      var ta = document.getElementById('sent-batch-input');
      if (ta && !ta.value.trim()){
        state.sentBatchPid = null; state.sentBatchRaw = ''; state.sentBatchNote = '';
      } else if (!applySentBatch()){
        state.sentBatchNote += ' Fix or remove these lines, then Save changes again.';
        render();
        return false;
      }
    }
    return true;
  }

  // Shuts any open sentence or delete prompt inside the declension list, so
  // only one thing is ever being edited at a time.
  function closeDeclForms(){
    state.sentEditing = null;
    state.sentConfirmDelete = null;
    state.sentBatchPid = null;
    state.sentBatchRaw = '';
    state.sentBatchNote = '';
    state.patConfirmDelete = null;
  }

  function downloadJson(obj, name){
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Same pattern = same preposition and case, however it's spaced or accented.
  function patternKey(p){
    return p.c + '\u0000' + normalize(p.prep).replace(/\s*\/\s*/g, '/');
  }

  // A word is "the same word" if both sides match after normalising — so
  // case, spacing, stress marks and apostrophe style don't create phantom
  // duplicates. Front alone isn't enough: a word can legitimately appear
  // twice with different meanings.
  function pairKey(w){
    return normalize(w.front) + '\u0000' + normalize(w.back);
  }

  // ---------- BACKUP ----------
  // One file for the whole library: words and declension patterns, each with
  // their progress. Streaks and settings aren't included; they live in the
  // synced data. Older backups (a plain list of words, or of patterns) still
  // import, and only touch the part of the library they contain.
  function exportBackup(){
    downloadJson({
      app: 'wordbox',
      backup: 2,
      version: APP_VERSION,
      exported: todayStr(),
      words: state.words,
      patterns: state.patterns
    }, 'wordbox-backup-' + todayStr() + '.json');
  }

  function looksLikePatterns(arr){
    return arr.some(function(x){ return x && typeof x === 'object' && ('prep' in x) && ('c' in x); });
  }

  // Counts for one half of the preview: what's in the file, what's new,
  // what's already in the library.
  function importPart(list, normalizeFn, usable, keyFn, current){
    var all = list.map(normalizeFn).filter(usable);
    var seen = {}, deduped = [];
    all.forEach(function(x){ var k = keyFn(x); if (!seen[k]){ seen[k] = true; deduped.push(x); } });
    var have = {};
    current.forEach(function(x){ have[keyFn(x)] = true; });
    var fresh = deduped.filter(function(x){ return !have[keyFn(x)]; });
    return {
      all: deduped,
      fresh: fresh,
      alreadyHave: deduped.length - fresh.length,
      inFileDupes: all.length - deduped.length,
      skipped: list.length - all.length
    };
  }

  function importBackupFromFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e){ alert('That file isn’t valid JSON.'); return; }

      var words = null, patterns = null;
      if (Array.isArray(parsed)){
        if (looksLikePatterns(parsed)) patterns = parsed; else words = parsed;
      } else if (parsed && typeof parsed === 'object'){
        if (Array.isArray(parsed.words)) words = parsed.words;
        if (Array.isArray(parsed.patterns)) patterns = parsed.patterns;
      }
      if (!words && !patterns){ alert('That doesn’t look like a Wordbox backup.'); return; }

      var w = words ? importPart(words, normalizeWord, function(x){ return x.front && x.back; }, pairKey, state.words) : null;
      var p = patterns ? importPart(patterns, normalizePattern, function(x){ return !!x.prep; }, patternKey, state.patterns) : null;
      if ((!w || !w.all.length) && (!p || !p.all.length)){ alert('Nothing usable in that file.'); return; }

      state.importPreview = { w: w, p: p };
      render();
    };
    reader.readAsText(file);
  }

  function renderImportPreview(){
    var ip = state.importPreview;
    var html = '<div class="batch-panel">';
    html += '<div class="batch-step">Import backup</div>';

    function part(title, x, unit, skippedWhy){
      var h = '<div class="import-part-head">' + title + '</div>';
      if (!x){
        return h + '<p class="batch-hint">Not in this file, so your ' + unit + ' stay as they are.</p>';
      }
      h += '<div class="import-summary">';
      h += '<div><span class="n">' + x.all.length + '</span><span class="l">in file</span></div>';
      h += '<div><span class="n">' + x.fresh.length + '</span><span class="l">new</span></div>';
      h += '<div><span class="n">' + x.alreadyHave + '</span><span class="l">already have</span></div>';
      h += '</div>';
      var notes = [];
      if (x.inFileDupes) notes.push(x.inFileDupes + ' repeated inside the file');
      if (x.skipped) notes.push(x.skipped + ' ' + skippedWhy);
      if (notes.length) h += '<div class="batch-note">Ignored: ' + notes.join('; ') + '.</div>';
      return h;
    }
    html += part('Words', ip.w, 'words', 'missing a word or meaning');
    html += part('Declension patterns', ip.p, 'patterns', 'without a preposition');

    var nFresh = (ip.w ? ip.w.fresh.length : 0) + (ip.p ? ip.p.fresh.length : 0);
    var replaced = [];
    if (ip.w) replaced.push('words');
    if (ip.p) replaced.push('patterns');

    html += '<p class="batch-hint"><strong>Add new only</strong> keeps everything you have, with its boxes and statistics, ' +
      'and brings in just what the file has that you don’t. A pattern you already have (same preposition and case) is left as it is.<br><br>' +
      '<strong>Replace</strong> discards your current ' + replaced.join(' and ') +
      ' and restores the file exactly — use this when recovering a backup.' +
      (replaced.length === 1 ? ' Your ' + (ip.w ? 'patterns' : 'words') + ' aren’t touched.' : '') + '</p>';

    html += '<div class="form-actions form-actions-stack">';
    html += '<button class="primary" data-action="import-merge"' + (nFresh ? '' : ' disabled') + '>' +
      (nFresh ? 'Add new only (' + nFresh + ')' : 'Nothing new to add') + '</button>';
    html += '<button class="secondary" data-action="import-replace">Replace ' + replaced.join(' and ') + '</button>';
    html += '<button class="secondary" data-action="import-cancel">Cancel</button>';
    html += '</div></div>';
    return html;
  }

  // Only the status line is rewritten, so this can't disturb a form,
  // the search box, or a lesson in progress.
  setInterval(function(){
    if (state.view === 'cards' && !state.sessionActive) refreshSyncLine();
  }, 30000);

  // initVoices() is NOT called here any more. It queries speechSynthesis,
  // and on iOS that can spin up the speech audio session — enough to pause
  // whatever else is playing, just from opening the app. It now runs only
  // when speech is actually wanted.

  // Nothing rendered anything before loading finished, which made the loading
  // screen unreachable — and left a blank screen during the Firebase auth and
  // fetch, which can take a second or two. Render immediately, and bring in
  // the loader only if the wait is long enough to be worth explaining.
  render();
  setTimeout(function(){
    if (!state.loaded){
      state.showLoader = true;
      render();
    }
  }, 150);

  if (useFirebase){
    // If the SDK can't be fetched (offline before it's been cached, or a
    // blocked network) the import rejects and the app would otherwise render
    // nothing at all. Show what happened instead of a blank screen — and
    // don't silently fall back to local storage, which would present an
    // empty word list and risk edits that never reach the synced copy.
    initFirebase().catch(function(){
      document.getElementById('app').innerHTML =
        '<div class="login-screen">' +
        '<h1>Wordbox</h1>' +
        '<p>Couldn\u2019t reach the sync service. Check your connection and try again.</p>' +
        '<button class="primary" onclick="location.reload()">Retry</button>' +
        '</div>';
    });
  } else {
    loadWords();
  }
})();
</script>
</body>
</html>
