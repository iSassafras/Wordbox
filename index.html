<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Wordbox" />
<meta name="theme-color" content="#24343B" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<title>Wordbox</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #24343B;
    --bg-elevated: #2E4149;
    --paper: #F6F1E7;
    --paper-edge: #E7DFCC;
    --ink: #202B2F;
    --ink-soft: #5C6B70;
    --cream: #EDE6D6;
    --cream-dim: #A9B7BA;
    --accent: #C9A227;
    --accent-soft: #E3C55A;
    --success: #6B8F6F;
    --success-bg: #33413A;
    --error: #B5533C;
    --error-bg: #43332E;
    --border: #3C4F57;
    --radius-card: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--cream);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  header {
    padding: 28px 20px 16px;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Lora', serif;
    font-size: 26px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }

  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--cream-dim);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 4px 20px 100px;
  }

  nav.tabs {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    display: flex;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }

  nav.tabs button {
    flex: 1;
    background: none;
    border: none;
    color: var(--cream-dim);
    font-family: inherit;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 0;
    cursor: pointer;
  }

  nav.tabs button.active {
    color: var(--accent-soft);
  }

  nav.tabs svg { width: 20px; height: 20px; }

  /* ---- Empty states ---- */
  .empty-state {
    margin-top: 40px;
    text-align: center;
    color: var(--cream-dim);
  }
  .empty-state .glyph {
    font-size: 34px;
    margin-bottom: 12px;
    opacity: 0.8;
  }
  .empty-state h2 {
    font-family: 'Lora', serif;
    font-size: 19px;
    color: var(--cream);
    margin: 0 0 6px;
    font-weight: 600;
  }
  .empty-state p {
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 18px;
  }

  /* ---- Buttons ---- */
  button.primary {
    background: var(--accent);
    color: #241C05;
    border: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 15px;
    padding: 13px 20px;
    border-radius: 12px;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--cream);
    border: 1px solid var(--border);
    font-family: inherit;
    font-weight: 500;
    font-size: 14px;
    padding: 11px 18px;
    border-radius: 12px;
    cursor: pointer;
  }
  button.text-btn {
    background: none;
    border: none;
    color: var(--accent-soft);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 0;
  }

  /* ---- Multiple choice options ---- */
  .option-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    margin-top: 16px;
  }
  .option-btn {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: 'Lora', serif;
    font-size: 16px;
    font-weight: 500;
    padding: 15px 16px;
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .option-btn .option-text { display: block; }
  .option-tag {
    display: block;
    margin-top: 4px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    opacity: 0.85;
  }
  .option-btn:active { transform: scale(0.98); }
  .option-btn[disabled] { cursor: default; }
  .option-btn.is-correct {
    background: var(--success-bg);
    border-color: var(--success);
    color: #C9E0CE;
  }
  .option-btn.is-wrong {
    background: var(--error-bg);
    border-color: var(--error);
    color: #F0C4B6;
  }
  .option-btn.is-dimmed { opacity: 0.4; }

  .choice-card { min-height: 150px; }
  .next-btn { width: 100%; margin-top: 14px; }

  /* ---- Reactions & animations ---- */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-9px); }
    30% { transform: translateX(8px); }
    45% { transform: translateX(-6px); }
    60% { transform: translateX(4px); }
    80% { transform: translateX(-2px); }
  }
  .flashcard.shake { animation: shake 0.45s cubic-bezier(.36,.07,.19,.97); }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.035); }
    100% { transform: scale(1); }
  }
  .flashcard.pop { animation: pop 0.4s ease-out; }

  @keyframes cardEnter {
    0% { opacity: 0; transform: translateY(14px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .flashcard.card-enter { animation: cardEnter 0.32s ease-out; }

  @keyframes bannerIn {
    0% { opacity: 0; transform: translateY(-8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .feedback-banner {
    width: 100%;
    text-align: center;
    font-family: 'Lora', serif;
    font-size: 17px;
    font-weight: 600;
    padding: 11px 16px;
    border-radius: 12px;
    margin-bottom: 12px;
    animation: bannerIn 0.22s ease-out;
  }
  .feedback-banner.correct { background: var(--success-bg); color: #C9E0CE; }
  .feedback-banner.wrong { background: var(--error-bg); color: #F0C4B6; }

  @keyframes streakIn {
    0% { opacity: 0; transform: scale(0.85); }
    60% { transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }
  .streak-badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-soft);
    background: rgba(201, 162, 39, 0.13);
    border: 1px solid rgba(201, 162, 39, 0.3);
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
    animation: streakIn 0.3s ease-out;
  }
  .streak-badge.hot {
    color: #FFD98A;
    background: rgba(201, 162, 39, 0.22);
    border-color: rgba(227, 197, 90, 0.55);
  }
  .streak-flame { font-size: 9px; vertical-align: 1px; }

  .answer-compare {
    width: 100%;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--paper-edge);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .compare-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    text-align: left;
  }
  .compare-label {
    flex: 0 0 74px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }
  .compare-value {
    flex: 1;
    min-width: 0;
    font-family: 'Lora', serif;
    font-size: 17px;
    word-break: break-word;
  }
  .compare-value em { color: var(--ink-soft); font-size: 15px; }
  .compare-value.is-wrong { color: #9C4630; }
  .compare-value.is-right { color: #3F6B48; font-weight: 600; }
  .compare-value mark {
    background: rgba(181, 83, 60, 0.2);
    color: inherit;
    padding: 0 2px;
    border-radius: 3px;
  }
  .compare-value.is-right mark {
    background: rgba(107, 143, 111, 0.28);
  }

  /* confetti */
  .confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
  }
  .confetti-layer i {
    position: absolute;
    top: 42%;
    display: block;
    opacity: 0;
    animation: confettiFly 1.1s cubic-bezier(.2,.6,.35,1) forwards;
  }
  @keyframes confettiFly {
    0%   { opacity: 1; transform: translate(0,0) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 190px)) rotate(520deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .flashcard.shake, .flashcard.pop, .flashcard.card-enter,
    .feedback-banner, .streak-badge { animation: none; }
    .confetti-layer { display: none; }
  }

  /* ---- Review card ---- */
  .review-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 14px;
  }

  .queue-count {
    font-size: 13px;
    color: var(--cream-dim);
    margin-bottom: 16px;
  }

  .flashcard {
    width: 100%;
    min-height: 220px;
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius-card);
    box-shadow: 0 6px 0 var(--paper-edge), 0 14px 24px rgba(0,0,0,0.28);
    padding: 30px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    position: relative;
  }

  .box-dots {
    position: absolute;
    top: 16px;
    left: 20px;
    display: flex;
    gap: 5px;
  }
  .box-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--paper-edge);
  }
  .box-dots span.filled { background: var(--accent); }

  .card-front {
    font-family: 'Lora', serif;
    font-size: 28px;
    font-weight: 600;
    line-height: 1.3;
  }

  .card-back {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--paper-edge);
    font-size: 18px;
    color: var(--ink-soft);
    width: 100%;
  }

  .card-notes {
    margin-top: 10px;
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .tap-hint {
    margin-top: 16px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .card-prompt-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .type-input {
    width: 100%;
    margin-top: 20px;
    background: #fff;
    border: 1px solid var(--paper-edge);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 17px;
    text-align: center;
    padding: 12px 14px;
    border-radius: 10px;
  }
  .type-input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .type-feedback {
    margin-top: 18px;
    font-size: 17px;
    font-weight: 500;
  }
  .type-feedback.correct { color: var(--success); }
  .type-feedback.incorrect { color: var(--error); }
  .type-feedback strong { font-family: 'Lora', serif; }

  .flashcard .primary {
    margin-top: 18px;
    width: 100%;
  }


  /* ---- Cards (manage) view ---- */
  .add-toggle {
    width: 100%;
    text-align: left;
    background: var(--bg-elevated);
    border: 1px dashed var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 14px;
    padding: 13px 16px;
    border-radius: 12px;
    cursor: pointer;
    margin: 12px 0 8px;
  }

  .add-form {
    background: var(--bg-elevated);
    border-radius: 12px;
    padding: 16px;
    margin: 12px 0;
  }
  .add-form label {
    display: block;
    font-size: 12px;
    color: var(--cream-dim);
    margin: 10px 0 4px;
  }
  .add-form label:first-child { margin-top: 0; }
  .add-form input, .add-form textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .add-form textarea { resize: vertical; min-height: 44px; }
  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .word-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 2px;
    border-bottom: 1px solid var(--border);
  }
  .word-row .box-dots-inline {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex-shrink: 0;
  }
  .word-row .box-dots-inline span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--border);
  }
  .word-row .box-dots-inline span.filled { background: var(--accent); }
  .word-row .word-text { flex: 1; min-width: 0; }
  .word-row .front { font-family: 'Lora', serif; font-size: 16px; font-weight: 500; }
  .word-row .back { font-size: 13px; color: var(--cream-dim); margin-top: 1px; }
  .word-row .row-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    background: none; border: none; color: var(--cream-dim);
    cursor: pointer; padding: 6px;
  }
  .icon-btn svg { width: 17px; height: 17px; display: block; }
  .icon-btn.danger:hover { color: var(--error); }

  .search-bar {
    margin-top: 14px;
  }
  .search-bar input {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 10px;
  }

  .add-row {
    display: flex;
    gap: 8px;
    margin: 12px 0 8px;
  }
  .add-row .add-toggle {
    margin: 0;
    flex: 1;
    text-align: center;
    font-size: 13px;
    padding: 12px 8px;
  }

  /* ---- Batch entry ---- */
  .batch-panel {
    background: var(--bg-elevated);
    border-radius: 12px;
    padding: 16px;
    margin: 12px 0;
  }
  .batch-step {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent-soft);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .batch-hint {
    font-size: 13px;
    color: var(--cream-dim);
    line-height: 1.45;
    margin: 0 0 12px;
  }
  .batch-hint em { color: var(--cream); font-style: normal; }
  .batch-note {
    background: rgba(201, 162, 39, 0.12);
    border: 1px solid rgba(201, 162, 39, 0.28);
    color: var(--accent-soft);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .batch-textarea {
    width: 100%;
    min-height: 170px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: 'Lora', serif;
    font-size: 16px;
    line-height: 1.6;
    padding: 12px 14px;
    border-radius: 8px;
    resize: vertical;
  }
  .batch-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .batch-word {
    font-family: 'Lora', serif;
    font-size: 15px;
    font-weight: 500;
    flex: 0 0 40%;
    min-width: 0;
    word-break: break-word;
  }
  .batch-back-input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 15px;
    padding: 9px 11px;
    border-radius: 8px;
  }

  /* ---- Home screen ---- */
  .home {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 8px;
  }
  .due-hero {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px 20px 26px;
    text-align: center;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }
  .due-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(201,162,39,0.16), transparent 62%);
    pointer-events: none;
  }
  .due-hero.is-clear::after {
    background: radial-gradient(circle at 50% 0%, rgba(107,143,111,0.16), transparent 62%);
  }
  .due-num {
    font-family: 'Lora', serif;
    font-size: 62px;
    font-weight: 600;
    line-height: 1;
    color: var(--accent-soft);
  }
  .due-hero.is-clear .due-num { color: var(--success); }
  .due-label {
    font-size: 13px;
    color: var(--cream-dim);
    margin-top: 8px;
    letter-spacing: 0.02em;
  }

  .start-btn {
    width: 100%;
    padding: 17px 20px;
    font-size: 17px;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    margin-bottom: 10px;
  }
  .start-sub {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    opacity: 0.7;
  }

  .home-clear {
    font-size: 13px;
    color: var(--cream-dim);
    text-align: center;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .home-stats {
    display: flex;
    width: 100%;
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .home-stat {
    flex: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .home-stat .n {
    font-family: 'Lora', serif;
    font-size: 21px;
    font-weight: 600;
  }
  .home-stat .l {
    font-size: 11px;
    color: var(--cream-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ---- Lesson summary ---- */
  .summary-card {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 20px 22px;
    text-align: center;
    margin-bottom: 18px;
  }
  .summary-glyph {
    font-size: 30px;
    color: var(--success);
    margin-bottom: 8px;
  }
  .summary-card h2 {
    font-family: 'Lora', serif;
    font-size: 24px;
    font-weight: 600;
    margin: 0;
  }
  .summary-sub {
    font-size: 12px;
    color: var(--cream-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 4px 0 18px;
  }
  .summary-grid {
    display: flex;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .summary-grid > div {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .summary-grid .n {
    font-family: 'Lora', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--accent-soft);
  }
  .summary-grid .l {
    font-size: 10px;
    color: var(--cream-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ---- Lesson chrome ---- */
  header.lesson-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 20px 14px;
  }
  .lesson-close {
    background: none;
    border: none;
    color: var(--cream-dim);
    font-size: 19px;
    line-height: 1;
    padding: 4px 2px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .progress-track {
    flex: 1;
    height: 9px;
    background: var(--bg-elevated);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.35s ease;
  }
  .progress-count {
    font-size: 12px;
    color: var(--cream-dim);
    flex-shrink: 0;
    min-width: 34px;
    text-align: right;
  }
  main.lesson-main { padding-bottom: 40px; }

  .word-stats {
    font-size: 12px;
    color: var(--cream-dim);
    margin-top: 5px;
    line-height: 1.45;
  }
  .stat-acc { font-weight: 600; color: var(--cream); }
  .stat-acc.good { color: #8FBF95; }
  .stat-acc.poor { color: #E09274; }
  /* ---- Sync status ---- */
  .sync-line {
    display: flex;

  .wd-dots span {

</style>
</head>
<body>
<div id="app"></div>

<!-- Loaded before the app. Classic (non-module) script, so it always runs
     first, and a missing file just 404s harmlessly instead of breaking. -->
<script src="config.js"></script>
<script type="module">
(function(){
  var state = {
    words: [],
    view: 'home',
    sessionQueue: [],
    sessionActive: false,
    lessonTotal: 0,
    lessonCorrect: 0,
    lessonAnswered: 0,
    lessonDone: false,
    lessonWordIds: [],
    lessonReviewOpen: false,
    revealed: false,
    formOpen: false,
    editingId: null,
    search: '',
    loaded: false,
    typedValue: '',
    checked: false,
    wasCorrect: null,
    feedback: null,
    typedReaction: null,
    chosenOption: null,
    hintShown: false,
    sampleNote: null,
    sortBy: 'practised',
    sortDir: 'desc',
    batchOpen: false,
    batchStep: 1,
    batchItems: [],
    batchSkipped: 0,
    batchRaw: '',
    streak: 0,
    bestStreak: 0
  };

  var CORRECT_MSGS = [
    'Nailed it!', 'Perfect!', 'Spot on!', 'Yes!', 'Too easy!',
    'You got it!', 'Sharp!', 'Locked in.', 'Clean.'
  ];
  var WRONG_MSGS = [
    'Not quite.', 'Close one.', 'Next time.', 'Almost had it.',
    'Tricky one.', 'It happens.', 'Keep at it.'
  ];
  var STREAK_MSGS = {
    3: 'Three in a row!',
    5: 'Five straight!',
    10: 'Ten! On fire.',
    20: 'Twenty. Unstoppable.'
  };

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function reactionFor(correct){
    if (!correct) return pick(WRONG_MSGS);
    if (STREAK_MSGS[state.streak]) return STREAK_MSGS[state.streak];
    return pick(CORRECT_MSGS);
  }

  // Lightweight confetti — spawns short-lived particles, no libraries.
  function burstConfetti(){
    var colors = ['#C9A227', '#E3C55A', '#6B8F6F', '#F6F1E7', '#8FB3C7'];
    var layer = document.createElement('div');
    layer.className = 'confetti-layer';
    for (var i = 0; i < 26; i++){
      var p = document.createElement('i');
      var angle = (Math.random() * 120 - 60);
      var dist = 90 + Math.random() * 130;
      p.style.background = colors[i % colors.length];
      p.style.left = (46 + Math.random() * 8) + '%';
      p.style.setProperty('--dx', Math.sin(angle * Math.PI / 180) * dist + 'px');
      p.style.setProperty('--dy', (-Math.abs(Math.cos(angle * Math.PI / 180)) * dist) + 'px');
      p.style.animationDelay = (Math.random() * 0.12) + 's';
      p.style.width = p.style.height = (5 + Math.random() * 5) + 'px';
      if (Math.random() > 0.5) p.style.borderRadius = '50%';
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 1400);
  }

  function resetCardState(){
    state.revealed = false;
    state.checked = false;
    state.wasCorrect = null;
    state.typedValue = '';
    state.typedReaction = null;
    state.chosenOption = null;
    state.hintShown = false;
  }

  // Correct answers move on by themselves once the celebration has played.
  var advanceTimer = null;
  function autoAdvance(){
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(function(){ applyAnswer(true); }, 950);
  }

  // Shared scoring path for both card types. Feedback is always shown at
  // answer time, so this just banks the result and moves on.
  function applyAnswer(correct){
    clearTimeout(advanceTimer);
    var entry = state.sessionQueue.shift();
    if (!entry) { render(); return; }
    var word = state.words.find(function(x){ return x.id === entry.id; });

    state.lessonAnswered++;
    word.last = todayStr();
    if (correct){
      state.lessonCorrect++;
      word.nRight++;
      word.box = Math.min(word.box + 1, 5);
      word.due = addDays(todayStr(), INTERVALS[word.box] || 14);
    } else {
      word.nWrong++;
      word.box = 1;
      word.due = todayStr();
      state.sessionQueue.push({ id: word.id, dir: pickMode() });
    }

    resetCardState();
    state.feedback = null;
    persist();

    if (state.sessionQueue.length === 0){
      endLesson(true);
      return;
    }
    render();
  }

  function endLesson(completed){
    clearTimeout(advanceTimer);
    state.sessionActive = false;
    state.lessonDone = completed && state.lessonAnswered > 0;
    state.sessionQueue = [];
    state.view = 'home';
    resetCardState();
    state.feedback = null;
    render();
  }

  function startLesson(practice){
    state.streak = 0;
    state.lessonDone = false;
    state.lessonReviewOpen = false;
    resetCardState();
    state.feedback = null;
    buildQueue(practice);
    if (state.sessionQueue.length === 0){ render(); return; }
    state.sessionActive = true;
    state.view = 'home';
    render();
  }

  // Streak is bumped before the reaction is chosen so milestone
  // messages ("Five straight!") land on the right answer.
  function scoreStreak(correct){
    if (correct){
      state.streak++;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    } else {
      state.streak = 0;
    }
  }

  var INTERVALS = { 2: 1, 3: 3, 4: 7, 5: 14 };
  var LESSON_SIZE = 10;

  // One learning mode that alternates at random per card:
  //   'typing' — shown the English, type the Ukrainian
  //   'choice' — shown the Ukrainian, pick the English from 3 options
  // Multiple choice needs two believable wrong answers drawn from the deck,
  // so it only kicks in once there are 3+ distinct meanings to draw from.
  function pickMode(){
    if (distinctMeaningCount() < 3) return 'typing';
    return Math.random() < 0.5 ? 'typing' : 'choice';
  }

  function distinctMeaningCount(){
    var seen = {};
    state.words.forEach(function(w){ seen[normalize(w.back)] = true; });
    return Object.keys(seen).length;
  }

  // Two distractors from other words, deduped by meaning so an option list
  // never shows the same English twice (real decks have synonyms).
  function buildOptions(word){
    var correct = word.back;
    var pool = [];
    var seen = {};
    seen[normalize(correct)] = true;
    state.words.forEach(function(w){
      var key = normalize(w.back);
      if (w.id === word.id || seen[key]) return;
      seen[key] = true;
      pool.push(w.back);
    });
    // shuffle pool, take 2
    for (var i = pool.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    var opts = pool.slice(0, 2);
    opts.push(correct);
    for (var k = opts.length - 1; k > 0; k--){
      var m = Math.floor(Math.random() * (k + 1));
      var tmp = opts[k]; opts[k] = opts[m]; opts[m] = tmp;
    }
    return opts;
  }

  // Comparison for typed answers. Beyond case and spacing, this handles two
  // things that come up constantly with Ukrainian:
  //   1. Stress marks (на́вчання) — dictionaries and textbooks add a combining
  //      acute you'd never type. Only U+0300/U+0301 are stripped; the breve in
  //      "й" and the diaeresis in "ї" are part of the letters and must stay.
  //   2. Apostrophes (ім'я, п'ять) — keyboards produce ' or ' or ʼ
  //      interchangeably, so they're all folded to one form.
  function normalize(s){
    return (s || '')
      .normalize('NFC')
      .replace(/[\u0300\u0301]/g, '')
      .replace(/[\u2018\u2019\u02BC\u055A\u0060\u00B4]/g, "'")
      .trim()
      .toLowerCase()
      .replace(/\s+/g, ' ');
  }

  // ---------- STORAGE (auto-detects environment) ----------
  // Inside Claude, window.storage persists per-user across sessions.
  // Opened as a plain file in a browser, there is no window.storage,
  // so we fall back to the browser's own localStorage instead.
  var hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
  var LOCAL_PREFIX = 'wordbox-';

  // ---------- SERVICE WORKER ----------
  // Only over http(s): registering from a file:// URL throws, and the
  // standalone copy of this file should keep working when opened directly.
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){
        // No offline support, but the app runs fine online.
      });
    });
  }

  // ---------- FIREBASE (optional cloud sync) ----------
  // Configuration lives in config.js, loaded just before this script, so the
  // only file you ever need to edit is that short one.
  // If config.js is missing (opening this file on its own), the tag 404s
  // harmlessly and the app runs fully local — Claude storage or localStorage,
  // no account, no internet.
  var FIREBASE_CONFIG = window.WORDBOX_CONFIG || { apiKey: '' };

  var useFirebase = !!FIREBASE_CONFIG.apiKey;
  var fbAuth = null, fbDb = null, fbDoc = null, fbGetDoc = null, fbSetDoc = null, fbSignIn = null, fbSignOut = null;
  var fbWaitForPendingWrites = null;
  var currentUser = null;

  // ---------- SYNC STATUS ----------
  // The honest bit: with offline persistence on, setDoc() resolves as soon as
  // the write hits the LOCAL cache — not when the server has it. Treating that
  // as "synced" would show a reassuring green tick while your words sat on the
  // device. waitForPendingWrites() is what actually resolves once the backend
  // has acknowledged every outstanding write, so that's what marks a sync.
  var SYNC_KEY = 'wordbox-last-sync';
  var syncState = 'idle';   // idle | pending | synced | offline

  function loadLastSync(){
    // Deliberately localStorage, never storageSet: writing this through the
    // normal path would be another Firestore write, which would mark another
    // pending write, which would write again. Straight to the device.
    try { return localStorage.getItem(SYNC_KEY); } catch (e) { return null; }
  }

  function markSynced(){
    syncState = 'synced';
    try { localStorage.setItem(SYNC_KEY, new Date().toISOString()); } catch (e) {}
    refreshSyncLine();
  }

  function markPending(){
    syncState = navigator.onLine ? 'pending' : 'offline';
    refreshSyncLine();
  }

  // Updates just the status line rather than re-rendering the view, so it can
  // never steal focus from the search box or a half-typed form.
  function refreshSyncLine(){
    var el = document.getElementById('sync-line');
    if (el) el.outerHTML = syncLineHtml();
  }

  function agoLabel(iso){
    if (!iso) return null;
    var secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (secs < 0) return 'just now';
    if (secs < 60) return 'just now';
    var mins = Math.floor(secs / 60);
    if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
    var days = Math.floor(hrs / 24);
    if (days < 30) return days + (days === 1 ? ' day ago' : ' days ago');
    return new Date(iso).toISOString().slice(0, 10);
  }

  function syncLineHtml(){
    var cls = 'sync-line', dot = 'ok', text;

    if (!useFirebase){
      dot = 'local';
      text = 'Saved on this device · sync not set up';
    } else if (!navigator.onLine){
      dot = 'wait';
      var offAgo = agoLabel(loadLastSync());
      text = 'Offline — changes will sync when you reconnect' +
        (offAgo ? ' · last synced ' + offAgo : '');
    } else if (syncState === 'pending'){
      dot = 'wait';
      text = 'Syncing…';
    } else {
      var ago = agoLabel(loadLastSync());
      text = ago ? 'Synced ' + ago : 'Not synced yet';
      if (!ago) dot = 'wait';
    }
    return '<div id="sync-line" class="' + cls + '"><span class="sync-dot ' + dot + '"></span>' +
      escapeHtml(text) + '</div>';
  }

  window.addEventListener('online',  refreshSyncLine);
  window.addEventListener('offline', refreshSyncLine);

  async function initFirebase(){
    var appMod = await import("https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js");
    var authMod = await import("https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js");
    var fsMod = await import("https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js");

    var app = appMod.initializeApp(FIREBASE_CONFIG);
    fbAuth = authMod.getAuth(app);
    fbDb = fsMod.getFirestore(app);
    fbDoc = fsMod.doc;
    fbGetDoc = fsMod.getDoc;
    fbSetDoc = fsMod.setDoc;
    fbSignIn = authMod.signInWithEmailAndPassword;
    fbSignOut = authMod.signOut;
    fbWaitForPendingWrites = fsMod.waitForPendingWrites;

    try { await authMod.setPersistence(fbAuth, authMod.browserLocalPersistence); } catch (e) { /* ignore */ }
    try { await fsMod.enableIndexedDbPersistence(fbDb); } catch (e) { /* e.g. multiple tabs open \u2014 offline cache still works in the active tab */ }

    authMod.onAuthStateChanged(fbAuth, function(user){
      if (user){
        currentUser = user;
        loadWords();
      } else {
        currentUser = null;
        renderLoginScreen();
      }
    });
  }

  function renderLoginScreen(errorMsg){
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="login-screen">' +
      '<h1>Wordbox</h1>' +
      '<p>Sign in to sync your words.</p>' +
      (errorMsg ? '<div class="login-error">' + escapeHtml(errorMsg) + '</div>' : '') +
      '<input id="login-email" type="email" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Email" autocomplete="username" />' +
      '<input id="login-password" type="password" placeholder="Password" autocomplete="current-password" />' +
      '<button class="primary" id="login-btn">Sign in</button>' +
      '</div>';
    document.getElementById('login-btn').addEventListener('click', function(){
      var email = document.getElementById('login-email').value.trim();
      var password = document.getElementById('login-password').value;
      fbSignIn(fbAuth, email, password).catch(function(){
        renderLoginScreen('Couldn\u2019t sign in \u2014 check your email and password.');
      });
    });
    var pwField = document.getElementById('login-password');
    pwField.addEventListener('keydown', function(e){
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
  }

  async function storageGet(key){
    if (useFirebase){
      try {
        var snap = await fbGetDoc(fbDoc(fbDb, 'wordbox', currentUser.uid));
        // fromCache === false means this came from the server, which is itself
        // proof the device is in sync right now.
        if (snap.metadata && snap.metadata.fromCache === false) markSynced();
        if (!snap.exists()) return null;
        var data = snap.data();
        return data[key] !== undefined ? data[key] : null;
      } catch (e) {
        return null;
      }
    }
    if (hasClaudeStorage){
      try {
        var res = await window.storage.get(key, false);
        return res && res.value ? res.value : null;
      } catch (e) {
        return null;
      }
    }
    try {
      return localStorage.getItem(LOCAL_PREFIX + key);
    } catch (e) {
      return null;
    }
  }

  async function storageSet(key, value){
    if (useFirebase){
      try {
        var fields = {};
        fields[key] = value;
        markPending();
        // Resolves once it's in the local cache — the word is safe on the
        // device at this point, offline or not.
        await fbSetDoc(fbDoc(fbDb, 'wordbox', currentUser.uid), fields, { merge: true });
        // Resolves only once the backend has acknowledged every pending
        // write. Offline, this simply never resolves, and the line keeps
        // saying so rather than claiming success.
        if (fbWaitForPendingWrites){
          fbWaitForPendingWrites(fbDb).then(markSynced).catch(function(){});
        }
      } catch (e) {
        console.error('Save failed', e);
      }
      return;
    }
    if (hasClaudeStorage){
      try {
        await window.storage.set(key, value, false);
      } catch (e) {
        console.error('Save failed', e);
      }
      return;
    }
    try {
      localStorage.setItem(LOCAL_PREFIX + key, value);
    } catch (e) {
      console.error('Save failed', e);
    }
  }

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function addDays(dateStr, n){
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function genId(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // Ten starter words, added only on a genuinely first run (see loadWords).
  // Meanings are all distinct so multiple choice has clean distractors.
  // Single place a word is created, so every path gets the same shape.
  // stats: nRight / nWrong counts, and `last` = date it was last answered.
  function makeWord(front, back, notes, hint){
    return {
      id: genId(),
      front: (front || '').trim(),
      back: (back || '').trim(),
      notes: (notes || '').trim(),
      hint: (hint || '').trim(),
      box: 1,
      due: todayStr(),
      nRight: 0,
      nWrong: 0,
      last: null
    };
  }

  // Words saved before hints and stats existed lack those fields, so fill
  // them in on load rather than guarding for undefined everywhere.
  function normalizeWord(w){
    return {
      id: w.id || genId(),
      front: w.front || '',
      back: w.back || '',
      notes: w.notes || '',
      hint: w.hint || '',
      box: (w.box >= 1 && w.box <= 5) ? w.box : 1,
      due: w.due || todayStr(),
      nRight: w.nRight || 0,
      nWrong: w.nWrong || 0,
      last: w.last || null
    };
  }

  function accuracyOf(w){
    var total = w.nRight + w.nWrong;
    return total ? Math.round((w.nRight / total) * 100) : null;
  }

  function sinceLabel(dateStr){
    if (!dateStr) return 'not yet practised';
    var d = Math.round((new Date(todayStr() + 'T00:00:00') - new Date(dateStr + 'T00:00:00')) / 86400000);
    if (d <= 0) return 'today';
    if (d === 1) return 'yesterday';
    if (d < 30) return d + ' days ago';
    return dateStr;
  }

    ];
    return pairs.map(function(p){

  async function loadWords(){
    var raw = await storageGet('words');
    // null means nothing was ever saved — a true first run, so seed.
    // '[]' means the list was saved and is empty (everything deleted),
    // which must stay empty rather than silently refilling itself.
    if (raw === null || raw === undefined){
      state.words = seedWords();
      persist();
    } else {
      try {
        var parsed = JSON.parse(raw);
        state.words = Array.isArray(parsed) ? parsed.map(normalizeWord) : [];
      } catch (e) {
        state.words = [];
      }
    }
    // Settings live alongside the words, so a stale or unknown value from an
    // older version falls back to the default rather than breaking the list.
    try {
      var settings = JSON.parse((await storageGet('settings')) || '{}');
      if (isValidSort(settings.sortBy)) state.sortBy = settings.sortBy;
      if (isValidDir(settings.sortDir)) state.sortDir = settings.sortDir;
    } catch (e) {
      // no settings saved yet — keep the default
    }

    state.loaded = true;
    render();
  }

  async function persistSettings(){
    await storageSet('settings', JSON.stringify({ sortBy: state.sortBy, sortDir: state.sortDir }));
  }

  async function persist(){
    await storageSet('words', JSON.stringify(state.words));
  }

  // A lesson is a bounded slice of what's due — capped so a large backlog
  // doesn't turn into an endless session. `practice` ignores due dates so
  // there's still something to do when nothing is scheduled.
  //
  // Ordering is by how overdue a word is (oldest due date first), with box as
  // the tiebreaker. Sorting by box instead would starve mastered words: with a
  // standing backlog of box-1 words, a box-5 word could stay overdue forever
  // and never be checked. It also means a word you just missed (due = today)
  // sorts last, so it waits its turn rather than crowding out the backlog.
  function buildQueue(practice){
    var t = todayStr();
    var pool = practice ? state.words.slice()
                        : state.words.filter(function(w){ return w.due <= t; });

    pool.sort(function(a, b){
      if (a.due !== b.due) return a.due < b.due ? -1 : 1;
      return a.box - b.box;
    });
    state.sessionQueue = pool.slice(0, LESSON_SIZE)
      .map(function(w){ return { id: w.id, dir: pickMode() }; });
    state.lessonWordIds = state.sessionQueue.map(function(e){ return e.id; });
    state.lessonTotal = state.sessionQueue.length;
    state.lessonCorrect = 0;
    state.lessonAnswered = 0;
  }

  function boxDots(box, filledClass, dotClass, container){
    var html = '';
    for (var i = 1; i <= 5; i++){
      html += '<span class="' + dotClass + (i <= box ? ' ' + filledClass : '') + '"></span>';
    }
    return html;
  }

  function lessonHeaderHtml(){
    var remaining = uniqueRemaining();
    var doneCount = Math.max(0, state.lessonTotal - remaining);
    var pct = state.lessonTotal ? Math.round((doneCount / state.lessonTotal) * 100) : 0;
    return '<button class="lesson-close" data-action="end-lesson" aria-label="End lesson">&#10005;</button>' +

      '<div class="progress-count">' + doneCount + '/' + state.lessonTotal + '</div>';

  function uniqueRemaining(){
    var seen = {};
    state.sessionQueue.forEach(function(e){ seen[e.id] = true; });

  // ---------- RENDER: LESSON ----------
  function renderLesson(){
    if (state.sessionQueue.length === 0){
      return '<div class="empty-state"><p>Wrapping up\u2026</p></div>';
    }

    var entry = state.sessionQueue[0];
    var w = state.words.find(function(x){ return x.id === entry.id; });

    if (entry.dir === 'choice'){
      // Generated once per card and cached on the queue entry — regenerating
      // per render would reshuffle the buttons under the user's finger.
      if (!entry.options) entry.options = buildOptions(w);
      return renderChoiceCard(w, entry.options);
    }
    return renderTypingCard(w);

  function renderChoiceCard(w, options){
    var answered = state.chosenOption !== null;
    var shakeClass = (answered && !state.wasCorrect) ? ' shake' : '';
    var popClass = (answered && state.wasCorrect) ? ' pop' : '';

    var html = '<div class="review-wrap">';

    html += '<div class="queue-count">' + state.sessionQueue.length + ' card' + (state.sessionQueue.length === 1 ? '' : 's') + ' due</div>';

    html += '<div class="card-front">' + escapeHtml(w.front) + '</div>';

    html += '</div>';

    html += '<div class="option-list">';
    options.forEach(function(opt, i){
      var cls = 'option-btn';
      var tag = '';
      if (answered){
        var isRight = normalize(opt) === normalize(w.back);
        var isMine = (i === state.chosenOption);
        if (isRight){
          cls += ' is-correct';
          tag = isMine ? 'your answer \u2713' : 'correct answer';

  // Character-level diff for a missed spelling: trims the shared prefix and
  // suffix and highlights what's left, so a single wrong letter stands out
  // instead of the whole word looking wrong.
  // Array.from (not split('')) so combining marks and any non-BMP characters
  // stay attached to their base letter.
  function diffPair(typed, correct){
    var A = Array.from(typed), B = Array.from(correct);
    var p = 0;
    while (p < A.length && p < B.length &&
           A[p].toLowerCase() === B[p].toLowerCase()) p++;
    var s = 0;
    while (s < A.length - p && s < B.length - p &&
           A[A.length - 1 - s].toLowerCase() === B[B.length - 1 - s].toLowerCase()) s++;
    return { a: markSpan(A, p, s), b: markSpan(B, p, s) };
  }

  function markSpan(arr, p, s){
    var head = arr.slice(0, p).join('');
    var mid  = arr.slice(p, arr.length - s).join('');
    var tail = arr.slice(arr.length - s).join('');
    return escapeHtml(head) +
      (mid ? '<mark>' + escapeHtml(mid) + '</mark>' : '') +
      escapeHtml(tail);
  }

  function renderTypingCard(w){
    var dotsHtml = boxDots(w.box, 'filled', '', null);

    var popClass = (state.checked && state.wasCorrect) ? ' pop' : '';
    var html = '<div class="review-wrap">';
    html += streakHtml();
    html += '<div class="queue-count">' + state.sessionQueue.length + ' card' + (state.sessionQueue.length === 1 ? '' : 's') + ' due</div>';
    html += feedbackHtml();
    html += '<div class="flashcard' + shakeClass + popClass + '">';
    html += '<div class="box-dots">' + dotsHtml + '</div>';
    html += '<div class="card-prompt-label">Type the Ukrainian</div>';
    html += '<div class="card-front">' + escapeHtml(w.back) + '</div>';

    if (!state.checked){
      html += '<input id="typed-input" class="type-input" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Type the word\u2026" value="' + escapeHtml(state.typedValue) + '" />';
      if (w.hint){

          html += '<button class="hint-btn" data-action="show-hint">Need a hint?</button>';

      html += '<div class="type-feedback ' + (state.wasCorrect ? 'correct' : 'incorrect') + '">';
      html += escapeHtml(state.typedReaction || (state.wasCorrect ? 'Correct!' : 'Not quite.'));
      html += '</div>';
      if (!state.wasCorrect){
        var typed = (state.typedValue || '').trim();

        html += '<div class="answer-compare">';
        html += '<div class="compare-row"><span class="compare-label">You typed</span>' +
          '<span class="compare-value is-wrong">' +
          (typed ? d.a : '<em>nothing</em>') + '</span></div>';
        html += '<div class="compare-row"><span class="compare-label">Correct</span>' +
          '<span class="compare-value is-right">' + d.b + '</span></div>';
        html += '</div>';
      }
      if (w.notes) html += '<div class="card-notes">' + escapeHtml(w.notes) + '</div>';
      // Correct answers auto-advance; misses wait so the spelling can sink in.
      if (!state.wasCorrect){
        html += '<button class="primary" data-action="next-card">Next card</button>';
      }
    }
    html += '</div></div>';
    return html;
  }

  function streakHtml(){
    if (state.streak < 2) return '';
    return '<div class="streak-badge' + (state.streak >= 5 ? ' hot' : '') + '">' +
      '<span class="streak-flame">\u25B2</span> ' + state.streak + ' in a row</div>';
  }

  function feedbackHtml(){
    if (!state.feedback) return '';
    return '<div class="feedback-banner ' + state.feedback.type + '">' +
      escapeHtml(state.feedback.message) + '</div>';
  }

  // Batch entry: step 1 collects Ukrainian, step 2 collects English, so the
  // keyboard only switches once per batch instead of twice per word.
  // Lines may also be pasted as pairs ("зелений = green"), in which case the
  // meaning is pre-filled and step 2 is just a review pass.
  // Separators are deliberately conservative — a bare comma or hyphen is left
  // alone, since meanings legitimately contain both ("to go, to walk").
  // Reads the meaning inputs straight from the DOM. Step 2 deliberately does
  // not re-render while typing, so the fields hold their own values and focus.
  function captureBatchMeanings(){
    document.querySelectorAll('.batch-back-input').forEach(function(inp){
      var i = parseInt(inp.getAttribute('data-idx'), 10);
      if (state.batchItems[i]) state.batchItems[i].back = inp.value;
    });
  }

  function parseBatchLines(raw){
    var existing = {};
    state.words.forEach(function(w){ existing[normalize(w.front)] = true; });

    var items = [], skipped = 0, seen = {};
    raw.split('\n').forEach(function(line){
      if (!line.trim()) return;
      var front = line, back = '';
      var m = line.match(/^(.*?)\s*(?:\t|\s=\s|=|\s[-–—]\s)\s*(.*)$/);
      if (m && m[1].trim() && m[2].trim()){
        front = m[1];
        back = m[2].trim();
      }
      front = front.trim();
      if (!front) return;
      var key = normalize(front);
      if (existing[key] || seen[key]){ skipped++; return; }
      seen[key] = true;
      items.push({ front: front, back: back });
    });
    return { items: items, skipped: skipped };
  }

  function renderBatch(){
    var html = '<div class="batch-panel">';

    if (state.batchStep === 1){
      html += '<div class="batch-step">Step 1 of 2 \u00B7 Ukrainian</div>';
      html += '<p class="batch-hint">One word per line. Paste pairs like <em>\u0437\u0435\u043B\u0435\u043D\u0438\u0439 = green</em> and the meanings fill in for you.</p>';
      html += '<textarea id="batch-input" class="batch-textarea" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="\u0437\u0435\u043B\u0435\u043D\u0438\u0439&#10;\u0441\u0438\u043D\u0456\u0439&#10;\u0436\u043E\u0432\u0442\u0438\u0439">' + escapeHtml(state.batchRaw) + '</textarea>';
      html += '<div class="form-actions">';
      html += '<button class="primary" data-action="batch-next">Next</button>';
      html += '<button class="secondary" data-action="cancel-batch">Cancel</button>';
      html += '</div></div>';
      return html;
    }

    html += '<div class="batch-step">Step 2 of 2 \u00B7 English</div>';
    if (state.batchSkipped){
      html += '<div class="batch-note">' + state.batchSkipped + ' skipped \u2014 already in your list.</div>';
    }
    if (state.batchItems.length === 0){
      html += '<p class="batch-hint">Nothing new to add.</p>';
      html += '<div class="form-actions"><button class="secondary" data-action="batch-back">Back</button></div></div>';
      return html;
    }
    html += '<p class="batch-hint">Fill in the meanings. Leave one blank to drop that word.</p>';
    state.batchItems.forEach(function(item, i){
      html += '<div class="batch-row">';
      html += '<div class="batch-word">' + escapeHtml(item.front) + '</div>';
      html += '<input class="batch-back-input" data-idx="' + i + '" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="meaning" value="' + escapeHtml(item.back) + '" />';
      html += '</div>';
    });
    html += '<div class="form-actions">';
    html += '<button class="primary" data-action="batch-save">Save ' + state.batchItems.length + ' word' + (state.batchItems.length === 1 ? '' : 's') + '</button>';
    html += '<button class="secondary" data-action="batch-back">Back</button>';
    html += '</div></div>';
    return html;
  }

  // ---------- RENDER: CARDS (manage) ----------
  // Ukrainian collation, so і/ї/є/ґ land in the right places rather than
  // being ordered by raw code point.
  function byName(a, b){
    return a.front.localeCompare(b.front, 'uk');
  }

  // Each field has one ascending comparator; direction is applied by
  // negating it, so asc/desc can never disagree about ordering.
  function cmpField(a, b, field){
    if (field === 'meaning') return a.back.localeCompare(b.back, 'en');
    if (field === 'box')     return a.box - b.box;
    if (field === 'accuracy') return accuracyOf(a) - accuracyOf(b);
    if (field === 'practised') return a.last < b.last ? -1 : a.last > b.last ? 1 : 0;
    return byName(a, b);
  }

  // Only these two can be missing data — a word never practised has no
  // accuracy and no date.
  function hasData(w, field){
    if (field === 'accuracy')  return (w.nRight + w.nWrong) > 0;
    if (field === 'practised') return !!w.last;
    return true;
  }

  var SORT_FIELDS = [
    ['practised', 'Last practised'],
    ['accuracy',  'Accuracy'],
    ['box',       'Box'],
    ['word',      'Word'],
    ['meaning',   'Meaning']
  ];

  // The direction each field is most useful in when you first pick it:
  // newest practice first, but weakest and lowest-box first.
  var SORT_DEFAULT_DIR = {
    practised: 'desc',
    accuracy:  'asc',
    box:       'asc',
    word:      'asc',
    meaning:   'asc'
  };

  function isValidSort(v){
    return SORT_FIELDS.some(function(o){ return o[0] === v; });
  }
  function isValidDir(v){
    return v === 'asc' || v === 'desc';
  }

  function sortWords(list){
    var field = isValidSort(state.sortBy) ? state.sortBy : 'practised';
    var dir = state.sortDir === 'desc' ? -1 : 1;

    // Words with no history are parked at the end either way. Flipping the
    // direction shouldn't promote them to the top, since "no data" is not a
    // score of zero.
    var scored = [], unscored = [];
    list.forEach(function(w){
      (hasData(w, field) ? scored : unscored).push(w);
    });

    scored.sort(function(a, b){
      return (dir * cmpField(a, b, field)) || byName(a, b);
    });
    unscored.sort(byName);
    return scored.concat(unscored);
  }

  function renderCards(){
    if (state.batchOpen) return renderBatch();
    var html = syncLineHtml();

    if (!state.formOpen){
      html += '<div class="add-row">';
      html += '<button class="add-toggle" data-action="open-form">+ Add a word</button>';
      html += '<button class="add-toggle" data-action="open-batch">+ Add several</button>';
      html += '</div>';
    } else {
      var editing = state.editingId ? state.words.find(function(w){ return w.id === state.editingId; }) : null;
      html += '<div class="add-form">';
      html += '<label>Word / phrase</label><input id="f-front" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" value="' + (editing ? escapeHtml(editing.front) : '') + '" placeholder="e.g. \u0437\u0435\u043B\u0435\u043D\u0438\u0439" />';
      html += '<label>Meaning</label><input id="f-back" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" value="' + (editing ? escapeHtml(editing.back) : '') + '" placeholder="e.g. green" />';
      html += '<label>Hint (optional)</label><input id="f-hint" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" value="' + (editing ? escapeHtml(editing.hint || '') : '') + '" placeholder="a nudge, shown on request during a lesson" />';
      html += '<label>Notes (optional)</label><textarea id="f-notes" autocorrect="off" spellcheck="false" placeholder="gender, example sentence, etc.">' + (editing ? escapeHtml(editing.notes || '') : '') + '</textarea>';
      html += '<div class="form-actions">';
      html += '<button class="primary" data-action="save-word">' + (editing ? 'Save changes' : 'Add word') + '</button>';
      html += '<button class="secondary" data-action="cancel-form">Cancel</button>';
      html += '</div>';
      if (editing){
        var eAcc = accuracyOf(editing);
        html += '<div class="edit-stats">';
        html += '<div class="es-head">Progress</div>';
        html += '<div class="es-grid">';
        html += '<div><span class="n">' + editing.box + '<small>/5</small></span><span class="l">box</span></div>';
        html += '<div><span class="n">' + (eAcc === null ? '\u2014' : eAcc + '%') + '</span><span class="l">accuracy</span></div>';
        html += '<div><span class="n">' + editing.nRight + '</span><span class="l">right</span></div>';
        html += '<div><span class="n">' + editing.nWrong + '</span><span class="l">wrong</span></div>';
        html += '</div>';
        html += '<div class="es-line">Last practised: ' + escapeHtml(sinceLabel(editing.last)) + '</div>';
        html += '<div class="es-line">Next due: ' + escapeHtml(editing.due <= todayStr() ? 'now' : editing.due) + '</div>';
        html += '<div class="es-note">Editing the text keeps all of this intact.</div>';
        html += '</div>';
      }
      html += '</div>';
    }

    var backupHtml = '<div class="backup-row">' +
      '<button class="secondary" data-action="export-words">Export backup</button>' +
      '<button class="secondary" data-action="import-words">Import backup</button>' +
      '<input type="file" id="import-file-input" accept="application/json,.json" style="display:none" />' +
      '</div>' +
      '<div class="samples-row"><button class="text-btn" data-action="add-samples">Add any missing sample words</button>' +
      (state.sampleNote ? '<div class="sample-note">' + escapeHtml(state.sampleNote) + '</div>' : '') +
      '</div>';

    if (state.words.length === 0){
      html += '<div class="empty-state">' +
        '<div class="glyph">&#9679;&#9675;&#9679;</div>' +
        '<h2>No words yet</h2>' +
        '<p>Everything you add lands here, then gets scheduled into review automatically.</p>' +
        '<button class="secondary" data-action="load-samples">Load sample words</button>' +
        '</div>' + backupHtml;
      return html;
    }

    html += '<div class="search-bar"><input id="search-input" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Search words" value="' + escapeHtml(state.search) + '" /></div>';
    var dirDesc = state.sortDir === 'desc';
    html += '<div class="sort-bar"><select id="sort-select" aria-label="Sort by">';
    SORT_FIELDS.forEach(function(o){
      html += '<option value="' + o[0] + '"' + (state.sortBy === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    });
    html += '</select>';
    html += '<button class="sort-dir" data-action="toggle-sort-dir" aria-label="' +
      (dirDesc ? 'Descending \u2014 tap for ascending' : 'Ascending \u2014 tap for descending') +
      '" title="' + (dirDesc ? 'Descending' : 'Ascending') + '">' +
      (dirDesc ? ICONS.arrowDown : ICONS.arrowUp) + '</button>';
    html += '</div>';

    var list = sortWords(state.words.filter(function(w){
      if (!state.search) return true;
      var q = state.search.toLowerCase();
      return w.front.toLowerCase().indexOf(q) !== -1 || w.back.toLowerCase().indexOf(q) !== -1;
    }));

    if (list.length === 0){
      html += '<div class="empty-state"><p>No words match your search.</p></div>';
    } else {
      list.forEach(function(w){
        html += '<div class="word-row">';
        html += '<div class="box-dots-inline">' + boxDots(w.box, 'filled', '', null) + '</div>';
        html += '<div class="word-text"><div class="front">' + escapeHtml(w.front) + '</div><div class="back">' + escapeHtml(w.back) + '</div>';
        // Always rendered — a word with no history says so, rather than the
        // line silently disappearing and looking like stats aren't tracked.
        var acc = accuracyOf(w);
        html += '<div class="word-stats">';
        if (acc === null){
          html += 'not practised yet';
        } else {
          html += '<span class="stat-acc' + (acc >= 80 ? ' good' : acc < 50 ? ' poor' : '') + '">' + acc + '%</span>' +
            ' \u00B7 ' + w.nRight + ' right, ' + w.nWrong + ' wrong' +
            ' \u00B7 ' + sinceLabel(w.last);
        }
        html += '</div>';
        html += '</div>';
        html += '<div class="row-actions">';
        html += '<button class="icon-btn" data-action="edit-word" data-id="' + w.id + '">' + ICONS.edit + '</button>';
        html += '<button class="icon-btn danger" data-action="delete-word" data-id="' + w.id + '">' + ICONS.trash + '</button>';
        html += '</div></div>';
      });
    }
    html += backupHtml;
    return html;
  }

  // ---------- RENDER: STATS ----------
  function renderStats(){
    var total = state.words.length;
    var dueCount = state.words.filter(function(w){ return w.due <= todayStr(); }).length;
    var counts = [0,0,0,0,0];
    state.words.forEach(function(w){ counts[w.box - 1]++; });
    var max = Math.max.apply(null, counts.concat([1]));

    var html = '<div class="stat-grid">';
    html += '<div class="stat-box"><div class="num">' + total + '</div><div class="label">Words total</div></div>';
    html += '<div class="stat-box"><div class="num">' + dueCount + '</div><div class="label">Due today</div></div>';
    html += '<div class="stat-box"><div class="num">' + state.bestStreak + '</div><div class="label">Best streak today</div></div>';
    html += '<div class="stat-box"><div class="num">' + counts[4] + '</div><div class="label">Mastered</div></div>';
    html += '</div>';

    html += '<div class="box-chart"><h3>Words per box</h3>';
    for (var i = 0; i < 5; i++){
      var pct = Math.round((counts[i] / max) * 100);
      html += '<div class="bar-row">' +
        '<div class="bar-label">Box ' + (i+1) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="bar-count">' + counts[i] + '</div>' +
        '</div>';
    }
    html += '</div>';
    if (useFirebase && currentUser){
      html += '<div class="account-row">Signed in as ' + escapeHtml(currentUser.email) + '<button class="text-btn" data-action="sign-out">Sign out</button></div>';
    }
    return html;
  }

  // ---------- MAIN RENDER ----------
  function render(){
    var app = document.getElementById('app');
    if (!state.loaded){
      app.innerHTML = '<div style="padding:40px 20px;color:#A9B7BA;font-family:IBM Plex Sans, sans-serif;">Opening your box…</div>';
      return;
    }

    var html;
    if (state.sessionActive){
      // Lesson mode gets its own chrome: progress instead of a title, and no
      // tab bar, so there's one thing to do and one way out.
      html = '<header class="lesson-header">' + lessonHeaderHtml() + '</header>';
      html += '<main class="lesson-main">' + renderLesson() + '</main>';
    } else {
      var titleMap = {
        home: ['Wordbox', greetingLine()],
        cards: ['Your words', 'Add, edit, or remove entries'],
        stats: ['Stats', 'How your box is filling up']
      };
      var t = titleMap[state.view] || titleMap.home;

      var body = '';
      if (state.view === 'home') body = renderHome();
      else if (state.view === 'cards') body = renderCards();
      else body = renderStats();

      html = '<header><h1>' + t[0] + '</h1><p>' + t[1] + '</p></header>';
      html += '<main>' + body + '</main>';
      html += '<nav class="tabs">' +
        tabBtn('home', ICONS.home, 'Home') +
        tabBtn('cards', ICONS.cards, 'Words') +
        tabBtn('stats', ICONS.stats, 'Stats') +
        '</nav>';
    }

    app.innerHTML = html;

    var searchInput = document.getElementById('search-input');
    if (searchInput){
      searchInput.addEventListener('input', function(e){
        state.search = e.target.value;
        render();
        var el = document.getElementById('search-input');
        if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
      });
    }

    var typedInput = document.getElementById('typed-input');
    if (typedInput){
      typedInput.focus();
      typedInput.selectionStart = typedInput.selectionEnd = typedInput.value.length;
      typedInput.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){
          e.preventDefault();
          document.querySelector('[data-action="check-typed"]').click();
        }
      });
    }

    var sortSelect = document.getElementById('sort-select');
    if (sortSelect){
      sortSelect.addEventListener('change', function(e){
        if (!isValidSort(e.target.value)) return;
        state.sortBy = e.target.value;
        // Snap to the direction that field is most useful in, so picking
        // "Word" doesn't land you in \u042F \u2192 \u0410 because of a previous choice.
        state.sortDir = SORT_DEFAULT_DIR[state.sortBy] || 'asc';
        persistSettings();
        render();
      });
    }

    var importInput = document.getElementById('import-file-input');
    if (importInput){
      importInput.addEventListener('change', function(e){
        if (e.target.files && e.target.files[0]){
          importWordsFromFile(e.target.files[0]);
        }
        e.target.value = '';
      });
    }
  }

  function tabBtn(id, icon, label){
    return '<button class="' + (state.view === id ? 'active' : '') + '" data-action="switch-view" data-view="' + id + '">' + icon + '<span>' + label + '</span></button>';
  }

  // ---------- EVENTS ----------
  document.getElementById('app').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    if (action === 'switch-view'){
      state.view = el.getAttribute('data-view');
      state.formOpen = false;
      state.batchOpen = false;
      state.editingId = null;
      state.lessonDone = false;
      state.lessonReviewOpen = false;
      render();
    }
    else if (action === 'start-lesson'){
      startLesson(false);
    }
    else if (action === 'practice-anyway'){
      startLesson(true);
    }
    else if (action === 'end-lesson'){
      endLesson(false);
    }
    else if (action === 'dismiss-summary'){
      state.lessonDone = false;
      state.lessonReviewOpen = false;
      render();
    }
    else if (action === 'goto-cards'){
      state.view = 'cards';
      state.formOpen = true;
      state.lessonDone = false;
      render();
    }
    else if (action === 'show-hint'){
      // Capture what's typed first — revealing the hint re-renders the card.
      var hintInput = document.getElementById('typed-input');
      if (hintInput) state.typedValue = hintInput.value;
      state.hintShown = true;
      render();
    }
    else if (action === 'open-lesson-review'){
      state.lessonReviewOpen = true;
      render();
    }
    else if (action === 'close-lesson-review'){
      state.lessonReviewOpen = false;
      render();
    }
    else if (action === 'check-typed'){
      var input = document.getElementById('typed-input');
      var entryT = state.sessionQueue[0];
      var wordT = state.words.find(function(x){ return x.id === entryT.id; });
      state.typedValue = input ? input.value : '';
      state.wasCorrect = normalize(state.typedValue) === normalize(wordT.front);
      state.checked = true;
      scoreStreak(state.wasCorrect);
      state.typedReaction = reactionFor(state.wasCorrect);
      render();
      if (state.wasCorrect){
        burstConfetti();
        autoAdvance();
      }
    }
    else if (action === 'choose-option'){
      if (state.chosenOption !== null) return;
      var idx = parseInt(el.getAttribute('data-index'), 10);
      var entryC = state.sessionQueue[0];
      var wordC = state.words.find(function(x){ return x.id === entryC.id; });
      state.chosenOption = idx;
      state.wasCorrect = normalize(entryC.options[idx]) === normalize(wordC.back);
      scoreStreak(state.wasCorrect);
      state.feedback = { type: state.wasCorrect ? 'correct' : 'wrong', message: reactionFor(state.wasCorrect) };
      render();
      if (state.wasCorrect){
        burstConfetti();
        autoAdvance();
      }
    }
    else if (action === 'next-card'){
      applyAnswer(state.wasCorrect);
    }
    else if (action === 'open-form'){
      state.formOpen = true;
      state.editingId = null;
      render();
      var f = document.getElementById('f-front');
      if (f) f.focus();
    }
    else if (action === 'cancel-form'){
      state.formOpen = false;
      state.editingId = null;
      render();
    }
    else if (action === 'edit-word'){
      state.editingId = el.getAttribute('data-id');
      state.formOpen = true;
      render();
    }
    else if (action === 'delete-word'){
      var id = el.getAttribute('data-id');
      state.words = state.words.filter(function(w){ return w.id !== id; });
      persist();
      render();
    }
    else if (action === 'save-word'){
      var front = document.getElementById('f-front').value.trim();
      var back = document.getElementById('f-back').value.trim();
      var notes = document.getElementById('f-notes').value.trim();
      var hint = document.getElementById('f-hint').value.trim();
      if (!front || !back){ return; }

      if (state.editingId){
        // Editing keeps the word's box, due date and stats untouched.
        var w2 = state.words.find(function(x){ return x.id === state.editingId; });
        w2.front = front; w2.back = back; w2.notes = notes; w2.hint = hint;
      } else {
        state.words.push(makeWord(front, back, notes, hint));
      }
      state.formOpen = false;
      state.editingId = null;
      persist();
      render();
    }
    else if (action === 'open-batch'){
      state.batchOpen = true;
      state.batchStep = 1;
      state.batchItems = [];
      state.batchSkipped = 0;
      state.batchRaw = '';
      state.formOpen = false;
      render();
      var bi = document.getElementById('batch-input');
      if (bi) bi.focus();
    }
    else if (action === 'cancel-batch'){
      state.batchOpen = false;
      state.batchRaw = '';
      state.batchItems = [];
      render();
    }
    else if (action === 'batch-next'){
      var ta = document.getElementById('batch-input');
      state.batchRaw = ta ? ta.value : '';
      var parsed = parseBatchLines(state.batchRaw);
      state.batchItems = parsed.items;
      state.batchSkipped = parsed.skipped;
      state.batchStep = 2;
      render();
    }
    else if (action === 'batch-back'){
      // Keep whatever meanings were typed so Back isn't destructive.
      captureBatchMeanings();
      state.batchStep = 1;
      render();
    }
    else if (action === 'batch-save'){
      captureBatchMeanings();
      var added = 0;
      state.batchItems.forEach(function(item){
        if (!item.front.trim() || !item.back.trim()) return;
        state.words.push(makeWord(item.front, item.back, '', ''));
        added++;
      });
      state.batchOpen = false;
      state.batchItems = [];
      state.batchRaw = '';
      persist();
      render();
    }
    else if (action === 'toggle-sort-dir'){
      state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
      persistSettings();
      render();
    }
    else if (action === 'add-samples'){
      // Tops up rather than replacing: only samples whose word isn't already
      // in the deck get added, so existing progress and edits are untouched.
      var have = {};
      state.words.forEach(function(w){ have[normalize(w.front)] = true; });
      var addedCount = 0;
      seedWords().forEach(function(sw){
        if (have[normalize(sw.front)]) return;
        state.words.push(sw);
        addedCount++;
      });
      if (addedCount) persist();
      state.sampleNote = addedCount
        ? addedCount + ' sample word' + (addedCount === 1 ? '' : 's') + ' added.'
        : 'All sample words are already in your list.';
      render();
      setTimeout(function(){ state.sampleNote = null; render(); }, 2600);
    }
    else if (action === 'load-samples'){
      // Only offered from the empty state, so nothing can be overwritten.
      state.words = seedWords();
      persist();
      render();
    }
    else if (action === 'export-words'){
      exportWords();
    }
    else if (action === 'import-words'){
      var fileInput = document.getElementById('import-file-input');
      if (fileInput) fileInput.click();
    }
    else if (action === 'sign-out'){
      if (fbSignOut) fbSignOut(fbAuth);
    }
  });

  function exportWords(){
    var data = JSON.stringify(state.words, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'wordbox-words.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importWordsFromFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch (e){
        alert('That file isn\u2019t valid JSON.');
        return;
      }
      if (!Array.isArray(parsed)){
        alert('Expected a JSON array of words.');
        return;
      }
      if (state.words.length > 0){
        var ok = confirm('Importing will replace your current ' + state.words.length + ' word' + (state.words.length === 1 ? '' : 's') + '. Continue?');
        if (!ok) return;
      }
      state.words = parsed.map(normalizeWord)
        .filter(function(w){ return w.front && w.back; });
      persist();
      render();
    };
    reader.readAsText(file);
  }

  // Only the status line is rewritten, so this can't disturb a form,
  // the search box, or a lesson in progress.
  setInterval(function(){
    if (state.view === 'cards' && !state.sessionActive) refreshSyncLine();
  }, 30000);

  if (useFirebase){
    // If the SDK can't be fetched (offline before it's been cached, or a
    // blocked network) the import rejects and the app would otherwise render
    // nothing at all. Show what happened instead of a blank screen — and
    // don't silently fall back to local storage, which would present an
    // empty word list and risk edits that never reach the synced copy.
    initFirebase().catch(function(){
      document.getElementById('app').innerHTML =
        '<div class="login-screen">' +
        '<h1>Wordbox</h1>' +
        '<p>Couldn\u2019t reach the sync service. Check your connection and try again.</p>' +
        '<button class="primary" onclick="location.reload()">Retry</button>' +
        '</div>';
    });
  } else {
    loadWords();
  }
})();
</script>
</body>
</html>
