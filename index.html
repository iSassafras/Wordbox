<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Wordbox" />
<meta name="theme-color" content="#24343B" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<title>Wordbox</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #24343B;
    --bg-elevated: #2E4149;
    --paper: #F6F1E7;
    --paper-edge: #E7DFCC;
    --ink: #202B2F;
    --ink-soft: #5C6B70;
    --cream: #EDE6D6;
    --cream-dim: #A9B7BA;
    --accent: #C9A227;
    --accent-soft: #E3C55A;
    --success: #6B8F6F;
    --success-bg: #33413A;
    --error: #B5533C;
    --error-bg: #43332E;
    --border: #3C4F57;
    --radius-card: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--cream);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  header {
    padding: 28px 20px 16px;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Lora', serif;
    font-size: 26px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }

  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--cream-dim);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 4px 20px 100px;
  }

  nav.tabs {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    display: flex;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }

  nav.tabs button {
    flex: 1;
    background: none;
    border: none;
    color: var(--cream-dim);
    font-family: inherit;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 0;
    cursor: pointer;
  }

  nav.tabs button.active {
    color: var(--accent-soft);
  }

  nav.tabs svg { width: 20px; height: 20px; }

  /* ---- Empty states ---- */
  .empty-state {
    margin-top: 40px;
    text-align: center;
    color: var(--cream-dim);
  }
  .empty-state .glyph {
    font-size: 34px;
    margin-bottom: 12px;
    opacity: 0.8;
  }
  .empty-state h2 {
    font-family: 'Lora', serif;
    font-size: 19px;
    color: var(--cream);
    margin: 0 0 6px;
    font-weight: 600;
  }
  .empty-state p {
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 18px;
  }

  /* ---- Buttons ---- */
  button.primary {
    background: var(--accent);
    color: #241C05;
    border: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 15px;
    padding: 13px 20px;
    border-radius: 12px;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--cream);
    border: 1px solid var(--border);
    font-family: inherit;
    font-weight: 500;
    font-size: 14px;
    padding: 11px 18px;
    border-radius: 12px;
    cursor: pointer;
  }
  button.text-btn {
    background: none;
    border: none;
    color: var(--accent-soft);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 0;
  }

  /* ---- Multiple choice options ---- */
  .option-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    margin-top: 16px;
  }
  .option-btn {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: 'Lora', serif;
    font-size: 16px;
    font-weight: 500;
    padding: 15px 16px;
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .option-btn .option-text { display: block; }
  .option-tag {
    display: block;
    margin-top: 4px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    opacity: 0.85;
  }
  .option-btn:active { transform: scale(0.98); }
  .option-btn[disabled] { cursor: default; }
  .option-btn.is-correct {
    background: var(--success-bg);
    border-color: var(--success);
    color: #C9E0CE;
  }
  .option-btn.is-wrong {
    background: var(--error-bg);
    border-color: var(--error);
    color: #F0C4B6;
  }
  .option-btn.is-dimmed { opacity: 0.4; }

  .choice-card { min-height: 150px; }
  .next-btn { width: 100%; margin-top: 14px; }

  /* ---- Reactions & animations ---- */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-9px); }
    30% { transform: translateX(8px); }
    45% { transform: translateX(-6px); }
    60% { transform: translateX(4px); }
    80% { transform: translateX(-2px); }
  }
  .flashcard.shake { animation: shake 0.45s cubic-bezier(.36,.07,.19,.97); }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.035); }
    100% { transform: scale(1); }
  }
  .flashcard.pop { animation: pop 0.4s ease-out; }

  @keyframes cardEnter {
    0% { opacity: 0; transform: translateY(14px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .flashcard.card-enter { animation: cardEnter 0.32s ease-out; }

  @keyframes bannerIn {
    0% { opacity: 0; transform: translateY(-8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .feedback-banner {
    width: 100%;
    text-align: center;
    font-family: 'Lora', serif;
    font-size: 17px;
    font-weight: 600;
    padding: 11px 16px;
    border-radius: 12px;
    margin-bottom: 12px;
    animation: bannerIn 0.22s ease-out;
  }
  .feedback-banner.correct { background: var(--success-bg); color: #C9E0CE; }
  .feedback-banner.wrong { background: var(--error-bg); color: #F0C4B6; }

  @keyframes streakIn {
    0% { opacity: 0; transform: scale(0.85); }
    60% { transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }
  .streak-badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-soft);
    background: rgba(201, 162, 39, 0.13);
    border: 1px solid rgba(201, 162, 39, 0.3);
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
    animation: streakIn 0.3s ease-out;
  }
  .streak-badge.hot {
    color: #FFD98A;
    background: rgba(201, 162, 39, 0.22);
    border-color: rgba(227, 197, 90, 0.55);
  }
  .streak-target { font-size: 12px; vertical-align: -1px; }

  .answer-compare {
    width: 100%;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--paper-edge);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .compare-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    text-align: left;
  }
  .compare-label {
    flex: 0 0 74px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }
  .compare-value {
    flex: 1;
    min-width: 0;
    font-family: 'Lora', serif;
    font-size: 17px;
    word-break: break-word;
  }
  .compare-value em { color: var(--ink-soft); font-size: 15px; }
  .compare-value.is-wrong { color: #9C4630; }
  .compare-value.is-right { color: #3F6B48; font-weight: 600; }
  .compare-value mark {
    background: rgba(181, 83, 60, 0.2);
    color: inherit;
    padding: 0 2px;
    border-radius: 3px;
  }
  .compare-value.is-right mark {
    background: rgba(107, 143, 111, 0.28);
  }

  /* confetti */
  .confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
  }
  .confetti-layer i {
    position: absolute;
    top: 42%;
    display: block;
    opacity: 0;
    animation: confettiFly 1.1s cubic-bezier(.2,.6,.35,1) forwards;
  }
  @keyframes confettiFly {
    0%   { opacity: 1; transform: translate(0,0) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 190px)) rotate(520deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .flashcard.shake, .flashcard.pop, .flashcard.card-enter,
    .feedback-banner, .streak-badge { animation: none; }
    .confetti-layer { display: none; }
  }

  /* ---- Review card ---- */
  .review-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 14px;
  }


  .flashcard {
    width: 100%;
    min-height: 220px;
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius-card);
    box-shadow: 0 6px 0 var(--paper-edge), 0 14px 24px rgba(0,0,0,0.28);
    padding: 30px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    position: relative;
  }

  .box-dots {
    position: absolute;
    top: 16px;
    left: 20px;
    display: flex;
    gap: 5px;
  }
  .box-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--paper-edge);
  }
  .box-dots span.filled { background: var(--accent); }

  .card-front {
    font-family: 'Lora', serif;
    font-size: 28px;
    font-weight: 600;
    line-height: 1.3;
  }
  /* English prompts are often phrases ("to go, to walk"), so give them a
     slightly smaller size than a single Ukrainian word needs. */
  .card-front.is-english { font-size: 24px; }

  .card-back {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--paper-edge);
    font-size: 18px;
    color: var(--ink-soft);
    width: 100%;
  }

  .card-notes {
    margin-top: 10px;
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .tap-hint {
    margin-top: 16px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .card-prompt-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .type-input {
    width: 100%;
    margin-top: 20px;
    background: #fff;
    border: 1px solid var(--paper-edge);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 17px;
    text-align: center;
    padding: 12px 14px;
    border-radius: 10px;
  }
  .type-input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .type-feedback {
    margin-top: 18px;
    font-size: 17px;
    font-weight: 500;
  }
  .type-feedback.correct { color: var(--success); }
  .type-feedback.incorrect { color: var(--error); }
  .type-feedback strong { font-family: 'Lora', serif; }

  .flashcard .primary {
    margin-top: 18px;
    width: 100%;
  }


  /* ---- Cards (manage) view ---- */
  .add-toggle {
    width: 100%;
    text-align: left;
    background: var(--bg-elevated);
    border: 1px dashed var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 14px;
    padding: 13px 16px;
    border-radius: 12px;
    cursor: pointer;
    margin: 12px 0 8px;
  }

  .add-form {
    background: var(--bg-elevated);
    border-radius: 12px;
    padding: 16px;
    margin: 12px 0;
  }
  .add-form label {
    display: block;
    font-size: 12px;
    color: var(--cream-dim);
    margin: 10px 0 4px;
  }
  .add-form label:first-child { margin-top: 0; }
  .add-form input, .add-form textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .add-form textarea { resize: vertical; min-height: 44px; }
  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .word-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 2px;
    border-bottom: 1px solid var(--border);
  }
  .word-row .box-dots-inline {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex-shrink: 0;
  }
  .word-row .box-dots-inline span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--border);
  }
  .word-row .box-dots-inline span.filled { background: var(--accent); }
  .word-row .word-text { flex: 1; min-width: 0; }
  .word-row .front { font-family: 'Lora', serif; font-size: 16px; font-weight: 500; }
  .word-row .back { font-size: 13px; color: var(--cream-dim); margin-top: 1px; }
  .word-row .row-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    background: none; border: none; color: var(--cream-dim);
    cursor: pointer; padding: 6px;
  }
  .icon-btn svg { width: 17px; height: 17px; display: block; }
  .icon-btn.danger:hover { color: var(--error); }

  .search-bar {
    position: relative;
    margin-top: 14px;
    display: flex;
    align-items: center;
  }
  .search-icon {
    position: absolute;
    left: 12px;
    display: flex;
    color: var(--cream-dim);
    pointer-events: none;
  }
  .search-icon svg { width: 16px; height: 16px; display: block; }
  .search-bar input {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 14px;
    /* 16px gutter + 16px icon + 10px gap on the left; room for the ✕ right */
    padding: 10px 38px 10px 38px;
    border-radius: 10px;
  }
  .search-bar input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .search-bar input:focus + .search-clear,
  .search-bar input:focus ~ .search-icon { color: var(--accent-soft); }
  .search-clear {
    position: absolute;
    right: 6px;
    background: none;
    border: none;
    color: var(--cream-dim);
    font-size: 13px;
    line-height: 1;
    padding: 8px;
    cursor: pointer;
  }

  .add-row {
    display: flex;
    gap: 8px;
    margin: 12px 0 8px;
  }
  .add-row .add-toggle {
    margin: 0;
    flex: 1;
    text-align: center;
    font-size: 13px;
    padding: 12px 8px;
  }

  /* ---- Batch entry ---- */
  .batch-panel {
    background: var(--bg-elevated);
    border-radius: 12px;
    padding: 16px;
    margin: 12px 0;
  }
  .batch-step {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent-soft);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .batch-hint {
    font-size: 13px;
    color: var(--cream-dim);
    line-height: 1.45;
    margin: 0 0 12px;
  }
  .batch-hint em { color: var(--cream); font-style: normal; }
  .batch-note {
    background: rgba(201, 162, 39, 0.12);
    border: 1px solid rgba(201, 162, 39, 0.28);
    color: var(--accent-soft);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .batch-textarea {
    width: 100%;
    min-height: 170px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: 'Lora', serif;
    font-size: 16px;
    line-height: 1.6;
    padding: 12px 14px;
    border-radius: 8px;
    resize: vertical;
  }
  .batch-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .batch-word {
    font-family: 'Lora', serif;
    font-size: 15px;
    font-weight: 500;
    flex: 0 0 40%;
    min-width: 0;
    word-break: break-word;
  }
  .batch-back-input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 15px;
    padding: 9px 11px;
    border-radius: 8px;
  }

  .day-badge {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
    text-align: center;
    line-height: 1.35;
  }
  .day-badge.done {
    color: #FFD98A;
    background: rgba(201, 162, 39, 0.18);
    border: 1px solid rgba(227, 197, 90, 0.45);
  }
  .day-badge.at-risk {
    color: var(--cream-dim);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    font-weight: 500;
  }
  .day-flame { font-size: 10px; }

  /* ---- Home screen ---- */
  .home {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 8px;
  }
  .due-hero {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px 20px 26px;
    text-align: center;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }
  .due-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(201,162,39,0.16), transparent 62%);
    pointer-events: none;
  }
  .due-hero.is-clear::after {
    background: radial-gradient(circle at 50% 0%, rgba(107,143,111,0.16), transparent 62%);
  }
  .due-num {
    font-family: 'Lora', serif;
    font-size: 62px;
    font-weight: 600;
    line-height: 1;
    color: var(--accent-soft);
  }
  .due-hero.is-clear .due-num { color: var(--success); }
  .due-label {
    font-size: 13px;
    color: var(--cream-dim);
    margin-top: 8px;
    letter-spacing: 0.02em;
  }

  .start-btn {
    width: 100%;
    padding: 17px 20px;
    font-size: 17px;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    margin-bottom: 10px;
  }
  .start-sub {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    opacity: 0.7;
  }

  .home-clear {
    font-size: 13px;
    color: var(--cream-dim);
    text-align: center;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .home-stats {
    display: flex;
    width: 100%;
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .home-stat {
    flex: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .home-stat .n {
    font-family: 'Lora', serif;
    font-size: 21px;
    font-weight: 600;
  }
  .home-stat .l {
    font-size: 11px;
    color: var(--cream-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ---- Lesson summary ---- */
  .summary-card {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 20px 22px;
    text-align: center;
    margin-bottom: 18px;
  }
  .summary-glyph {
    font-size: 30px;
    color: var(--success);
    margin-bottom: 8px;
  }
  .summary-card h2 {
    font-family: 'Lora', serif;
    font-size: 24px;
    font-weight: 600;
    margin: 0;
  }
  .summary-sub {
    font-size: 12px;
    color: var(--cream-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 4px 0 18px;
  }
  .summary-grid {
    display: flex;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .summary-grid > div {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .summary-grid .n {
    font-family: 'Lora', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--accent-soft);
  }
  .summary-grid .l {
    font-size: 10px;
    color: var(--cream-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ---- Lesson chrome ---- */
  header.lesson-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 20px 14px;
  }
  .lesson-close {
    background: none;
    border: none;
    color: var(--cream-dim);
    font-size: 19px;
    line-height: 1;
    padding: 4px 2px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .progress-track {
    flex: 1;
    height: 9px;
    background: var(--bg-elevated);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.35s ease;
  }
  .progress-count {
    font-size: 12px;
    color: var(--cream-dim);
    flex-shrink: 0;
    min-width: 34px;
    text-align: right;
  }
  main.lesson-main { padding-bottom: 40px; }

  .word-stats {
    font-size: 12px;
    color: var(--cream-dim);
    margin-top: 5px;
    line-height: 1.45;
  }
  .stat-acc { font-weight: 600; color: var(--cream); }
  .stat-acc.good { color: #8FBF95; }
  .stat-acc.poor { color: #E09274; }
  /* ---- Sync status ---- */
  .sync-line {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .sync-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--cream-dim);
  }
  .sync-dot.ok    { background: var(--success); }
  .sync-dot.wait  { background: var(--accent); }
  .sync-dot.local { background: var(--cream-dim); }

  /* ---- Speak button ---- */
  .speak-btn {
    margin-top: 14px;
    background: none;
    border: 1px solid var(--paper-edge);
    color: var(--ink-soft);
    border-radius: 999px;
    width: 42px;
    height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .speak-btn:active { transform: scale(0.92); background: var(--paper-edge); }
  .speak-btn svg { width: 19px; height: 19px; display: block; }

  /* Variant for the option list, which sits on the dark background rather
     than on the cream card. */
  .speak-btn.on-dark {
    margin-top: 0;
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-color: var(--border);
    color: var(--cream-dim);
    background: var(--bg-elevated);
  }
  .speak-btn.on-dark:active { background: var(--border); }
  .speak-btn.on-dark svg { width: 17px; height: 17px; }

  /* Held for as long as the voice is actually speaking, driven by the
     utterance's own start/end events rather than a guessed duration. */
  @keyframes speakPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201, 162, 39, 0.45); }
    50%      { box-shadow: 0 0 0 5px rgba(201, 162, 39, 0); }
  }
  .speak-btn.speaking {
    border-color: var(--accent);
    color: var(--accent);
    animation: speakPulse 1.1s ease-out infinite;
  }
  .speak-btn.on-dark.speaking {
    border-color: var(--accent);
    color: var(--accent-soft);
    background: rgba(201, 162, 39, 0.14);
  }
  @media (prefers-reduced-motion: reduce) {
    .speak-btn.speaking { animation: none; }
  }

  .option-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }
  /* The option shrinks to leave room for the speaker beside it. */
  .option-row .option-btn { flex: 1; min-width: 0; }

  .tts-block {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .tts-block input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 9px;
    margin-top: 10px;
  }
  .tts-block .form-actions { margin-top: 10px; }

  .pref-note {
    font-size: 11.5px;
    color: var(--cream-dim);
    line-height: 1.5;
    margin-top: 8px;
    padding: 9px 12px;
    background: var(--bg-elevated);
    border-radius: 8px;
  }

  /* ---- Loading ---- */
  .loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    padding: 0 32px;
    text-align: center;
  }
  .loader { display: flex; gap: 7px; margin-bottom: 22px; }
  .loader span {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounceDot 1.1s ease-in-out infinite;
  }
  .loader span:nth-child(2){ animation-delay: 0.15s; }
  .loader span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounceDot {
    0%, 70%, 100% { transform: translateY(0); opacity: 0.35; }
    35% { transform: translateY(-9px); opacity: 1; }
  }
  .loading-title {
    font-family: 'Lora', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--cream);
  }
  .loading-quote {
    margin-top: 10px;
    font-size: 13.5px;
    font-style: italic;
    color: var(--cream-dim);

  /* ---- Home stat icons ---- */
  .stat-icon {
    font-size: 14px;
    margin-right: 4px;
    vertical-align: 1px;
  }
  .stat-icon.cold { filter: grayscale(1); opacity: 0.4; }

  /* ---- Preference row / toggle ---- */
  .pref-row {
    display: flex;
    align-items: center;

    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--border);

  }
  .toggle {
    width: 46px; height: 27px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);

    cursor: pointer;
    padding: 0;
    transition: background 0.18s ease, border-color 0.18s ease;
  }
  .toggle .knob {

    top: 2px; left: 2px;

  }
  .toggle.on { background: rgba(201,162,39,0.3); border-color: var(--accent); }
  .toggle.on .knob { transform: translateX(19px); background: var(--accent-soft); }

  /* ---- Filter chip ---- */
  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-soft);

    background: none;
    border: none;
    color: inherit;
    font-size: 13px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }

  /* ---- Inline editing ---- */
  .word-entry { border-bottom: 1px solid var(--border); }
  .word-entry .word-row { border-bottom: none; }
  .word-entry.is-editing {
    background: rgba(201, 162, 39, 0.05);
    border-left: 2px solid var(--accent);
    border-radius: 0 10px 10px 0;
    padding-left: 10px;
    margin: 4px 0 8px;
  }
  .add-form.inline-form {
    background: transparent;
    padding: 0 0 14px;
    margin: 0;
  }
  .icon-btn.active { color: var(--accent-soft); }

  .lib-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 16px 0 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--cream-dim);
  }
  .lib-count { flex-shrink: 0; }

  /* ---- Read-only expanded row ---- */
  .ro-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    color: var(--cream);
    min-height: 42px;
  }
  .ro-field span { min-width: 0; word-break: break-word; }

  .field-with-speak {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .field-with-speak input { flex: 1; min-width: 0; }

  .speak-btn.small {
    width: 34px;
    height: 34px;
    margin-top: 0;
    flex-shrink: 0;
  }
  .speak-btn.small svg { width: 15px; height: 15px; }

  .wd-front .speak-btn.small { margin-left: 8px; vertical-align: middle; }

  /* ---- Delete confirmation ---- */
  .delete-confirm {
    background: var(--error-bg);
    border: 1px solid rgba(181, 83, 60, 0.5);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 4px 0 10px;
    font-size: 13px;
    color: #F0C4B6;
    line-height: 1.45;
  }
  .delete-confirm strong { font-family: 'Lora', serif; }
  .delete-confirm-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .delete-confirm-actions button {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 9px;
    cursor: pointer;
  }
  .danger-btn {
    background: var(--error);
    border: none;
    color: #FFF3EF;
  }

  .stat-box .num .stat-icon { font-size: 15px; margin-right: 5px; }

  .chart-hint {
    font-size: 11px;
    color: var(--cream-dim);
    opacity: 0.7;
    margin-top: 8px;
    text-align: center;
  }

  /* ---- Sort control ---- */
  .sort-bar {
    position: relative;
    display: flex;
    align-items: stretch;
    gap: 8px;
    margin-top: 10px;
  }
  .sort-icon {
    position: absolute;
    left: 12px;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    color: var(--cream-dim);
    pointer-events: none;   /* tapping it still opens the select */
  }
  .sort-icon svg { width: 15px; height: 15px; display: block; }
  .sort-bar select {
    flex: 1;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 14px;
    padding: 9px 12px 9px 36px;
    border-radius: 10px;
    -webkit-appearance: none;
    appearance: none;
  }
  .sort-dir {
    flex: 0 0 42px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--accent-soft);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .sort-dir svg { width: 17px; height: 17px; }
  .sort-dir:active { background: var(--bg); }

  /* ---- Stats on the edit screen ---- */
  .edit-stats {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .es-head {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent-soft);
    margin-bottom: 12px;
  }
  .es-grid {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .es-grid > div {
    flex: 1;
    background: var(--bg);
    border-radius: 9px;
    padding: 9px 4px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .es-grid .n {
    font-family: 'Lora', serif;
    font-size: 17px;
    font-weight: 600;
  }
  .es-grid .n small { font-size: 11px; opacity: 0.5; font-weight: 400; }
  .es-grid .l {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--cream-dim);
  }
  .es-line {
    font-size: 12px;
    color: var(--cream-dim);
    margin-top: 3px;
  }
  .es-note {
    font-size: 11px;
    color: var(--cream-dim);
    opacity: 0.65;
    font-style: italic;
    margin-top: 8px;
  }

  /* ---- Hints ---- */
  .hint-btn {
    margin-top: 12px;
    background: none;
    border: 1px dashed var(--paper-edge);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 9px;
    cursor: pointer;
  }
  .hint-text {
    margin-top: 12px;
    background: rgba(201, 162, 39, 0.16);
    border: 1px solid rgba(201, 162, 39, 0.35);
    color: var(--ink);
    font-size: 14px;
    font-style: italic;
    padding: 9px 13px;
    border-radius: 9px;
  }

  /* ---- End-of-lesson word review ---- */
  .review-list-head {
    width: 100%;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--cream-dim);
    margin-bottom: 12px;
  }
  .word-detail {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .wd-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .wd-front {
    font-family: 'Lora', serif;
    font-size: 19px;
    font-weight: 600;
  }
  .wd-dots { display: flex; gap: 4px; flex-shrink: 0; }
  .wd-dots span {
    display: block;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--border);
  }
  .wd-dots span.filled { background: var(--accent); }
  .wd-back {
    font-size: 15px;
    color: var(--cream);
    margin-top: 2px;
  }
  .wd-line {
    font-size: 13px;
    color: var(--cream-dim);
    margin-top: 7px;
    line-height: 1.45;
  }
  .wd-line span {
    display: inline-block;
    min-width: 42px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent-soft);
    margin-right: 6px;
  }
  .wd-stats {
    font-size: 11px;
    color: var(--cream-dim);
    opacity: 0.8;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid var(--border);
  }

  .samples-row {
    margin-top: 14px;
    text-align: center;
  }
  .sample-note {
    margin-top: 8px;
    font-size: 12px;
    color: var(--accent-soft);
    background: rgba(201, 162, 39, 0.12);
    border-radius: 8px;
    padding: 7px 12px;
  }

  .import-summary {
    display: flex;
    gap: 8px;

  .import-summary > div {
    flex: 1;
    background: var(--bg);
    border-radius: 9px;
    padding: 10px 4px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .import-summary .n {
    font-family: 'Lora', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--accent-soft);
  }
  .import-summary .l {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--cream-dim);
  }
  .form-actions-stack {
    flex-direction: column;
  }
  .form-actions-stack button { width: 100%; }
  .form-actions-stack button:disabled { opacity: 0.45; cursor: default; }

  .backup-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .backup-row button { flex: 1; }

  .account-row {
    margin-top: 20px;
    font-size: 12px;
    color: var(--cream-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .login-screen {
    max-width: 320px;
    margin: 80px auto 0;
    padding: 0 20px;
    text-align: center;
  }
  .login-screen h1 {
    font-family: 'Lora', serif;
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 6px;
  }
  .login-screen p {
    font-size: 13px;
    color: var(--cream-dim);
    margin: 0 0 20px;
  }
  .login-screen input {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: inherit;
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .login-screen button.primary {
    width: 100%;
    margin-top: 4px;
  }
  .login-error {
    background: var(--error-bg);
    color: #F0C4B6;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 14px;
  }

  /* ---- Stats ---- */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  .stat-box {
    background: var(--bg-elevated);
    border-radius: 12px;
    padding: 16px;
  }
  .stat-box .num {
    font-family: 'Lora', serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--accent-soft);
  }
  .stat-box .label {
    font-size: 12px;
    color: var(--cream-dim);
    margin-top: 2px;
  }

  .box-chart {
    margin-top: 24px;
  }
  .box-chart h3 {
    font-family: 'Lora', serif;
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  .bar-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 3px;
    margin-bottom: 12px;
    width: 100%;
    background: none;
    border: none;
    padding: 3px 0;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }
  .bar-row:disabled { cursor: default; opacity: 0.45; }
  .bar-row:not(:disabled):active .bar-track { background: var(--border); }
  .bar-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .bar-note {
    font-size: 10.5px;
    color: var(--cream-dim);
    opacity: 0.75;
    letter-spacing: 0.02em;
    padding-left: 44px;
  }
  .box-chart-sub {
    font-size: 12px;
    color: var(--cream-dim);
    line-height: 1.5;
    margin: -4px 0 16px;
  }
  .bar-row .bar-label {
    font-size: 12px;
    color: var(--cream-dim);
    width: 44px;
    flex-shrink: 0;
  }
  /* These are <span>s because they sit inside a <button>, where <div> isn't
     valid. Inline elements ignore width and height, so both need an explicit
     display — without it the fill collapses and the bar looks empty. */
  .bar-track {
    display: block;
    flex: 1;
    background: var(--bg-elevated);
    border-radius: 6px;
    height: 14px;
    overflow: hidden;
  }
  .bar-fill {
    display: block;
    height: 100%;
    min-width: 3px;
    background: var(--accent);
    border-radius: 6px;
    transition: width 0.3s ease;
  }
  .bar-row .bar-count {
    font-size: 12px;
    color: var(--cream-dim);
    width: 20px;
    text-align: right;
    flex-shrink: 0;
  }
</style>

<div id="app"></div>

<!-- Loaded before the app. Classic (non-module) script, so it always runs
     first, and a missing file just 404s harmlessly instead of breaking. -->
<script src="config.js"></script>
<script type="module">
(function(){
  var state = {
    words: [],
    view: 'home',
    sessionQueue: [],
    sessionActive: false,
    lessonTotal: 0,
    lessonCorrect: 0,
    lessonAnswered: 0,
    lessonDone: false,
    lessonWordIds: [],
    answeredThisLesson: {},
    lessonMisses: {},
    wordsSnapshot: null,
    parkedThisLesson: false,
    lessonReviewOpen: false,
    revealed: false,
    formOpen: false,
    editingId: null,
    expandedId: null,
    confirmDeleteId: null,
    search: '',
    loaded: false,
    typedValue: '',
    checked: false,
    wasCorrect: null,
    feedback: null,
    typedReaction: null,
    chosenOption: null,
    hintShown: false,
    sampleNote: null,
    sortBy: 'practised',
    sortDir: 'desc',
    boxFilter: null,
    soundOn: true,
    speechOn: true,
    importPreview: null,
    batchOpen: false,
    batchStep: 1,
    batchItems: [],
    batchSkipped: 0,
    batchRaw: '',
    streak: 0,
    bestStreak: 0,
    committedStreak: 0,
    committedBest: 0,
    dayStreak: 0,
    bestDayStreak: 0,
    lastLessonDay: null
  };

  var LOADING_QUOTES = [
    'Perfective or imperfective? Yes.',
    'The apostrophe in \u0456\u043C\u2019\u044F is load-bearing.',
    '\u0456 and \u0438 are different letters. Your thumbs disagree.',
    'Seven cases. One brain. We move.',
    'Memorising is 90% repetition and 10% stubbornness.',
    'Somewhere a verb is changing aspect without telling you.',
    'Shuffling the cards, licking the envelope.',
    'Two words looked identical. Only one was right.',
    'Forgetting is part of the method. Allegedly.',
    'Warming up the box\u2026',
    'You already know more than yesterday.',
    'The genitive plural is a personality test.'
  ];
  var LOADING_QUOTE = LOADING_QUOTES[Math.floor(Math.random() * LOADING_QUOTES.length)];

  var CORRECT_MSGS = [
    'Nailed it!', 'Perfect!', 'Spot on!', 'Yes!', 'Too easy!',
    'You got it!', 'Sharp!', 'Locked in.', 'Clean.'
  ];
  var WRONG_MSGS = [
    'Not quite.', 'Close one.', 'Next time.', 'Almost had it.',
    'Tricky one.', 'It happens.', 'Keep at it.'
  ];
  var STREAK_MSGS = {
    3: 'Three in a row!',
    5: 'Five straight!',
    10: 'Ten! On fire.',
    20: 'Twenty. Unstoppable.'
  };

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  // ---------- SOUND ----------
  // Tones are synthesised with the Web Audio API rather than shipped as audio
  // files: nothing extra to upload, nothing extra to cache, and it stays
  // silent until you've actually tapped something (iOS won't start an audio
  // context before a user gesture anyway).
  var audioCtx = null;
  var audioUnlocked = false;

  // iOS silences Web Audio when the ringer switch is on mute — but not HTML5
  // <audio> elements. Two fixes, applied together:
  //   1. navigator.audioSession (Safari 16.4+) declares this as playback
  //      audio, which the mute switch then leaves alone.
  //   2. On older iOS, playing a scrap of silent <audio> alongside moves Web
  //      Audio onto the media channel. Ugly, but it's the standard remedy.
  var SILENT_WAV = 'data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';

  function unlockAudio(){
    if (audioUnlocked) return;
    audioUnlocked = true;
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
    } catch (e) {}
    try {
      // A silent utterance during the gesture unlocks speech for later
      // automatic calls, which would otherwise be blocked outside a tap.
      if ('speechSynthesis' in window){
        var prime = new SpeechSynthesisUtterance(' ');
        prime.volume = 0;
        window.speechSynthesis.speak(prime);
      }
    } catch (e) {}
    try {
      var el = document.createElement('audio');
      el.setAttribute('x-webkit-airplay', 'deny');   // keep it out of AirPlay
      el.preload = 'auto';
      el.loop = true;
      el.volume = 0.02;
      el.src = SILENT_WAV;
      var p = el.play();
      if (p && p.catch) p.catch(function(){});
    } catch (e) {}
  }

  // Must run inside a real gesture, so hang it off the first tap anywhere.
  document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
  document.addEventListener('click', unlockAudio, { once: true });

  function playSeq(steps){
    if (!state.soundOn) return;
    try {
      unlockAudio();
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t0 = audioCtx.currentTime;
      steps.forEach(function(st){
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = st.type || 'sine';
        osc.frequency.setValueAtTime(st.f, t0 + st.at);
        // Ramped rather than switched on, so it doesn't click.
        gain.gain.setValueAtTime(0.0001, t0 + st.at);
        gain.gain.exponentialRampToValueAtTime(st.v || 0.14, t0 + st.at + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + st.at + st.d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0 + st.at);
        osc.stop(t0 + st.at + st.d + 0.03);
      });
    } catch (e) {
      // Audio is a nicety; never let it break an answer.
    }
  }

  // ---------- SPEECH ----------
  // Uses the browser's own voices (SpeechSynthesis). Nothing to download, no
  // API, works offline — but which voices exist is entirely up to the device,
  // so everything here degrades quietly if Ukrainian isn't installed.
  // How many Ukrainian voices exist is entirely up to the device. iOS often
  // ships just one; a desktop may have several. Collect all of them and pick
  // at random per utterance, so hearing a word twice doesn't always sound
  // identical — useful for not tying a word to one particular voice.
  var ukVoices = [];
  var voicesReady = false;

  // Higher-quality voices are downloaded separately on iOS, so a device can
  // end up with both the compact default and an Enhanced or Premium version
  // of the same language. The Web Speech API exposes no quality field, but
  // Apple puts the tier in the voice name, so rank on that and keep only the
  // best tier present — otherwise a random pick would serve the robotic one
  // half the time.
  // Rank on voiceURI first. Apple's identifiers look like
  // "com.apple.voice.enhanced.uk-UA.Lesya" and are stable regardless of the
  // phone's display language. The visible name is localised — on a German
  // device the enhanced voice reads "Erweitert" — so matching English words
  // in the name alone silently fails and the compact voice wins.
  function voiceRank(v){
    var id = ((v.voiceURI || '') + ' ' + (v.name || '')).toLowerCase();
    if (id.indexOf('premium') !== -1) return 3;
    if (id.indexOf('enhanced') !== -1) return 2;
    return 1;   // compact / default
  }

  function findUkrainianVoices(){
    if (!('speechSynthesis' in window)) return [];
    var voices = window.speechSynthesis.getVoices() || [];
    if (!voices.length) return [];
    voicesReady = true;

    var uk = voices.filter(function(v){
      return (v.lang || '').toLowerCase().indexOf('uk') === 0;   // uk-UA
    });
    if (!uk.length) return [];

    var best = Math.max.apply(null, uk.map(voiceRank));
    // Several voices of the same tier still get picked between at random.
    return uk.filter(function(v){ return voiceRank(v) === best; });
  }

  function voiceQualityLabel(){
    if (!ukVoices.length) return null;
    var r = voiceRank(ukVoices[0]);
    return r === 3 ? 'premium' : r === 2 ? 'enhanced' : 'standard';
  }

  function initVoices(){
    if (!('speechSynthesis' in window)) return;

    function refresh(){
      var before = ukVoices.length ? voiceRank(ukVoices[0]) : 0;
      ukVoices = findUkrainianVoices();
      var after = ukVoices.length ? voiceRank(ukVoices[0]) : 0;
      // Repaint the Profile if a better voice turned up while it was open.
      if (after !== before && state.loaded && state.view === 'stats') render();
    }

    refresh();
    window.speechSynthesis.onvoiceschanged = refresh;

    // Keep looking for the full window rather than stopping at the first hit.
    // The built-in compact voice is there immediately; a downloaded Enhanced
    // one can register a beat later, and stopping early would lock in the
    // worse of the two.
    var tries = 0;
    var t = setInterval(function(){
      refresh();
      if (tries++ > 14) clearInterval(t);   // ~6 seconds
    }, 400);
  }

  function canSpeak(){
    return state.speechOn && ('speechSynthesis' in window);
  }

  // Which text is being spoken right now. Held in a variable rather than only
  // as a DOM class so the highlight survives a re-render mid-sentence.
  var speakingText = null;
  var speakingTimeout = null;

  function paintSpeaking(){
    var btns = document.querySelectorAll('.speak-btn');
    for (var i = 0; i < btns.length; i++){
      var match = speakingText !== null && btns[i].getAttribute('data-text') === speakingText;
      btns[i].classList.toggle('speaking', match);
    }
  }

  function setSpeaking(text){
    speakingText = text;
    paintSpeaking();
    clearTimeout(speakingTimeout);
    if (text !== null){
      // onend isn't perfectly reliable on iOS, so make sure the highlight
      // can't get stuck on forever.
      speakingTimeout = setTimeout(function(){ setSpeaking(null); }, 12000);
    }
  }

  // ---------- GOOGLE CLOUD TTS (optional) ----------
  // The key lives in localStorage on this device only. It is deliberately NOT
  // written to config.js (which is public in the repo) and NOT synced to
  // Firestore (which would copy it to every device and into the database).
  var TTS_KEY_STORE = 'wordbox-tts-key';
  var TTS_VOICE = 'uk-UA-Wavenet-A';

  function getTtsKey(){
    try { return localStorage.getItem(TTS_KEY_STORE) || ''; } catch (e) { return ''; }
  }
  function setTtsKey(v){
    try {
      if (v) localStorage.setItem(TTS_KEY_STORE, v);
      else localStorage.removeItem(TTS_KEY_STORE);
    } catch (e) {}
  }

  // Audio is cached permanently, keyed by the word. Each word therefore costs
  // one synthesis request in its lifetime — without this the free allowance
  // would be spent re-generating the same twenty words every lesson.
  var audioDbPromise = null;
  function audioDb(){
    if (audioDbPromise) return audioDbPromise;
    audioDbPromise = new Promise(function(resolve, reject){
      if (!('indexedDB' in window)) return reject();
      var req = indexedDB.open('wordbox-audio', 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore('clips'); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(); };
    }).catch(function(){ return null; });
    return audioDbPromise;
  }

  async function cachedClip(key){
    var db = await audioDb();
    if (!db) return null;
    return new Promise(function(resolve){
      try {
        var r = db.transaction('clips', 'readonly').objectStore('clips').get(key);
        r.onsuccess = function(){ resolve(r.result || null); };
        r.onerror = function(){ resolve(null); };
      } catch (e) { resolve(null); }
    });
  }

  async function storeClip(key, dataUrl){
    var db = await audioDb();
    if (!db) return;
    try { db.transaction('clips', 'readwrite').objectStore('clips').put(dataUrl, key); } catch (e) {}
  }

  var ttsAudio = null;

  function playClip(dataUrl, text){
    try {
      if (ttsAudio){ ttsAudio.pause(); ttsAudio = null; }
      ttsAudio = new Audio(dataUrl);
      ttsAudio.onplay  = function(){ setSpeaking(text); };
      ttsAudio.onended = function(){ setSpeaking(null); };
      ttsAudio.onerror = function(){ setSpeaking(null); speakSystem(text); };
      var p = ttsAudio.play();
      if (p && p.catch) p.catch(function(){ setSpeaking(null); speakSystem(text); });
      return true;
    } catch (e) {
      return false;
    }
  }

  async function speakGoogle(text){
    var cacheKey = TTS_VOICE + '|' + text;
    var hit = await cachedClip(cacheKey);
    if (hit){ playClip(hit, text); return true; }

    if (!navigator.onLine) return false;
    var key = getTtsKey();
    if (!key) return false;

    try {
      var res = await fetch('https://texttospeech.googleapis.com/v1/text:synthesize?key=' + encodeURIComponent(key), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          input: { text: text },
          voice: { languageCode: 'uk-UA', name: TTS_VOICE },
          audioConfig: { audioEncoding: 'MP3', speakingRate: 0.9 }
        })
      });
      if (!res.ok) return false;
      var data = await res.json();
      if (!data.audioContent) return false;
      var url = 'data:audio/mp3;base64,' + data.audioContent;
      storeClip(cacheKey, url);
      playClip(url, text);
      return true;
    } catch (e) {
      return false;   // network, CORS, bad key — fall back quietly
    }
  }

  function speakUkrainian(text){
    if (!canSpeak() || !text) return;

    // No key means no Google path at all, so speak immediately and
    // SYNCHRONOUSLY. This matters more than it looks: iOS only permits
    // speechSynthesis.speak() from inside a user gesture, and awaiting the
    // cache lookup first would push the call into a promise continuation,
    // where iOS silently refuses it.
    if (!getTtsKey()){
      speakSystem(text);
      return;
    }

    // With a key, the async path is fine — Google audio plays through an
    // <audio> element, which the earlier unlock already cleared for
    // programmatic playback.
    speakGoogle(text).then(function(ok){ if (!ok) speakSystem(text); });
  }

  function speakSystem(text){
    if (!canSpeak() || !text) return;
    try {
      unlockAudio();
      window.speechSynthesis.cancel();   // queued calls otherwise stack up
      setSpeaking(null);                 // drop any highlight from the last one
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'uk-UA';
      // Random pick when the device has more than one; with a single voice
      // this simply always selects it.
      if (ukVoices.length) u.voice = ukVoices[Math.floor(Math.random() * ukVoices.length)];
      u.rate = 0.9;                      // a shade slow, it's for learning
      u.onstart = function(){ setSpeaking(text); };
      u.onend   = function(){ setSpeaking(null); };
      u.onerror = function(){ setSpeaking(null); };
      window.speechSynthesis.speak(u);
    } catch (e) {
      setSpeaking(null);
      // Speech is a nicety; never let it interrupt a lesson.
    }
  }

  function speakBtn(text, variant){
    if (!canSpeak()) return '';
    return '<button class="speak-btn' + (variant ? ' ' + variant : '') +
      (speakingText !== null && text === speakingText ? ' speaking' : '') +
      '" data-action="speak" data-text="' + escapeHtml(text) +
      '" aria-label="Hear it">' + ICONS.speaker + '</button>';
  }

  function soundCorrect(){
    playSeq([{ f: 659, at: 0, d: 0.10 }, { f: 988, at: 0.085, d: 0.16 }]);
  }
  function soundWrong(){
    playSeq([{ f: 196, at: 0, d: 0.18, type: 'triangle', v: 0.11 }]);
  }

  function reactionFor(correct){
    if (!correct){
      if (state.parkedThisLesson){
        state.parkedThisLesson = false;
        return 'Parking that one for today.';
      }
      return pick(WRONG_MSGS);
    }
    if (STREAK_MSGS[state.streak]) return STREAK_MSGS[state.streak];
    return pick(CORRECT_MSGS);
  }

  // Lightweight confetti — spawns short-lived particles, no libraries.
  function burstConfetti(){
    var colors = ['#C9A227', '#E3C55A', '#6B8F6F', '#F6F1E7', '#8FB3C7'];
    var layer = document.createElement('div');
    layer.className = 'confetti-layer';
    for (var i = 0; i < 26; i++){
      var p = document.createElement('i');
      var angle = (Math.random() * 120 - 60);
      var dist = 90 + Math.random() * 130;
      p.style.background = colors[i % colors.length];
      p.style.left = (46 + Math.random() * 8) + '%';
      p.style.setProperty('--dx', Math.sin(angle * Math.PI / 180) * dist + 'px');
      p.style.setProperty('--dy', (-Math.abs(Math.cos(angle * Math.PI / 180)) * dist) + 'px');
      p.style.animationDelay = (Math.random() * 0.12) + 's';
      p.style.width = p.style.height = (5 + Math.random() * 5) + 'px';
      if (Math.random() > 0.5) p.style.borderRadius = '50%';
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 1400);
  }

  function resetCardState(){
    state.revealed = false;
    state.checked = false;
    state.wasCorrect = null;
    state.typedValue = '';
    state.typedReaction = null;
    state.chosenOption = null;
    state.hintShown = false;
  }

  // Correct answers move on by themselves once the celebration has played.
  var advanceTimer = null;
  function autoAdvance(){
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(function(){ applyAnswer(true); }, 950);
  }

  // Shared scoring path for both card types. Feedback is always shown at
  // answer time, so this just banks the result and moves on.
  function applyAnswer(correct){
    clearTimeout(advanceTimer);
    var entry = state.sessionQueue.shift();
    if (!entry) { render(); return; }
    var word = state.words.find(function(x){ return x.id === entry.id; });

    // Two guards keep the boxes meaningful. Spaced repetition only tests
    // anything if the interval has actually elapsed, so:
    //
    //   1. A box only moves on the FIRST answer for that word in a lesson.
    //      Otherwise missing a word, seeing it again on the retry and getting
    //      it right would promote it — a miss would cost nothing.
    //   2. Promotion also requires the word to have been genuinely due.
    //      "Practice anyway" pulls words early; drilling one five times in an
    //      afternoon shouldn't walk it up to box 5.
    //
    // Demotion is deliberately not conditional on either. Getting a word
    // wrong is real evidence you don't know it, whenever it happens.
    var firstAnswerThisLesson = !state.answeredThisLesson[entry.id];
    state.answeredThisLesson[entry.id] = true;
    var wasDue = word.due <= todayStr();

    state.lessonAnswered++;
    word.last = todayStr();

    if (correct){
      state.lessonCorrect++;
      word.nRight++;
      if (firstAnswerThisLesson && wasDue){
        word.box = Math.min(word.box + 1, 5);
        word.due = addDays(todayStr(), INTERVALS[word.box] || 14);
      }
    } else {
      word.nWrong++;
      if (firstAnswerThisLesson){
        word.box = 1;
        // Tomorrow, not today: the card still comes back later in THIS lesson
        // for practice (the queue ignores due dates), but it can't be scored
        // again until the interval has actually passed.
        word.due = addDays(todayStr(), 1);
      }
      // Three misses in one lesson means it isn't going in today. Cycling it
      // round a fourth time just pads the lesson and sours the session; it's
      // already reset to box 1 and due tomorrow.
      state.lessonMisses[word.id] = (state.lessonMisses[word.id] || 0) + 1;
      if (state.lessonMisses[word.id] < 3){
        state.sessionQueue.push({ id: word.id, dir: pickMode(word) });
      } else {
        state.parkedThisLesson = true;
      }
    }

    resetCardState();
    state.feedback = null;
    // Deliberately no persist() here. Progress is banked once, at the end of
    // the lesson — so quitting halfway, or the app being killed mid-lesson,
    // leaves your words exactly as they were. It also turns a ten-card lesson
    // into one write instead of ten.

    if (state.sessionQueue.length === 0){
      endLesson(true);
      return;
    }
    render();
  }

  function endLesson(completed){
    clearTimeout(advanceTimer);
    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
    setSpeaking(null);
    // Only a lesson carried through to the end extends the day streak.
    // Bailing out with the X doesn't count.
    if (completed && state.lessonAnswered > 0){
      // Banked only now: word boxes, due dates, per-word counts, the answer
      // streak and the day streak all commit together in a single write.
      state.committedStreak = state.streak;
      state.committedBest = state.bestStreak;
      registerLessonDay();
      state.wordsSnapshot = null;
      persist();
    } else {
      // Abandoned. Restore the words to how they were when the lesson began
      // and put the streak back to the last banked figure. Nothing was
      // written during the lesson, so storage already holds the right data
      // and there's nothing to save.
      if (state.wordsSnapshot){
        state.words = state.wordsSnapshot.map(normalizeWord);
        state.wordsSnapshot = null;
      }
      state.streak = state.committedStreak;
      state.bestStreak = state.committedBest;
    }
    state.sessionActive = false;
    state.lessonDone = completed && state.lessonAnswered > 0;
    state.sessionQueue = [];
    state.view = 'home';
    resetCardState();
    state.feedback = null;
    render();
  }

  function startLesson(practice){
    // The streak deliberately carries over. It counts consecutive correct
    // answers, and ending a lesson isn't a wrong answer.
    state.lessonDone = false;
    state.lessonReviewOpen = false;
    resetCardState();
    state.feedback = null;
    buildQueue(practice);
    if (state.sessionQueue.length === 0){ render(); return; }
    // Everything a lesson changes — boxes, due dates, counts — is applied to
    // the live copy but not written anywhere until the lesson is finished.
    // This snapshot is what an abandoned lesson rolls back to.
    state.wordsSnapshot = JSON.parse(JSON.stringify(state.words));
    state.sessionActive = true;
    state.view = 'home';
    render();
  }

  // A day streak counts consecutive CALENDAR DAYS with a finished lesson —
  // separate from the answer streak, which counts consecutive correct cards.
  function yesterdayStr(){ return addDays(todayStr(), -1); }

  // The stored number is only meaningful next to the day it was last touched.
  // If that day is neither today nor yesterday the run is over, so report 0
  // rather than a stale figure that would claim a streak you've already lost.
  function liveDayStreak(){
    if (!state.lastLessonDay) return 0;
    if (state.lastLessonDay === todayStr() || state.lastLessonDay === yesterdayStr()){
      return state.dayStreak;
    }
    return 0;
  }

  function doneToday(){ return state.lastLessonDay === todayStr(); }

  function registerLessonDay(){
    var today = todayStr();
    if (state.lastLessonDay === today) return;      // already counted today
    if (state.lastLessonDay === yesterdayStr()) state.dayStreak += 1;
    else state.dayStreak = 1;                        // first day, or run broken
    state.lastLessonDay = today;
    if (state.dayStreak > state.bestDayStreak) state.bestDayStreak = state.dayStreak;
  }

  // Streak is bumped before the reaction is chosen so milestone
  // messages ("Five straight!") land on the right answer.
  function scoreStreak(correct){
    if (correct){
      state.streak++;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    } else {
      state.streak = 0;
    }
  }

  var INTERVALS = { 2: 1, 3: 3, 4: 7, 5: 14 };
  var LESSON_SIZE = 10;

  // One learning mode that alternates at random per card:
  //   'typing' — shown the English, type the Ukrainian
  //   'choice' — shown the Ukrainian, pick the English from 3 options
  // Multiple choice needs two believable wrong answers drawn from the deck,
  // so it only kicks in once there are 3+ distinct meanings to draw from.
  // Three card types:
  //   'choice-en'  Ukrainian shown, pick the English   (any box)
  //   'choice-uk'  English shown, pick the Ukrainian   (boxes 1-2 only)
  //   'typing'     English shown, type the Ukrainian   (box 3+ only)
  //
  // Recall is much harder than recognition, so producing the spelling from
  // scratch is held back until a word has already survived a few reviews.
  // From box 3 onward it replaces the multiple-choice version of that
  // direction outright rather than alternating with it.
  var TYPING_FROM_BOX = 3;

  function pickMode(word){
    var pool = [];
    if (distinctCount('back') >= 3)  pool.push('choice-en');
    if (word.box >= TYPING_FROM_BOX) pool.push('typing');
    else if (distinctCount('front') >= 3) pool.push('choice-uk');
    // A deck of one or two words can't produce distractors, so typing is all
    // that's left regardless of box.
    if (!pool.length) return 'typing';
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function distinctCount(field){
    var seen = {};
    state.words.forEach(function(w){ seen[normalize(w[field])] = true; });
    return Object.keys(seen).length;
  }

  // Two distractors from other words, deduped by meaning so an option list
  // never shows the same English twice (real decks have synonyms).
  // field is 'back' (English options) or 'front' (Ukrainian options).
  function buildOptions(word, field){
    var correct = word[field];
    var pool = [];
    var seen = {};
    seen[normalize(correct)] = true;
    state.words.forEach(function(w){
      var key = normalize(w[field]);
      if (w.id === word.id || seen[key]) return;
      seen[key] = true;
      pool.push(w[field]);
    });
    // shuffle pool, take 2
    for (var i = pool.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    var opts = pool.slice(0, 2);
    opts.push(correct);
    for (var k = opts.length - 1; k > 0; k--){
      var m = Math.floor(Math.random() * (k + 1));
      var tmp = opts[k]; opts[k] = opts[m]; opts[m] = tmp;
    }
    return opts;
  }

  // Comparison for typed answers. Beyond case and spacing, this handles two
  // things that come up constantly with Ukrainian:
  //   1. Stress marks (на́вчання) — dictionaries and textbooks add a combining
  //      acute you'd never type. Only U+0300/U+0301 are stripped; the breve in
  //      "й" and the diaeresis in "ї" are part of the letters and must stay.
  //   2. Apostrophes (ім'я, п'ять) — keyboards produce ' or ' or ʼ
  //      interchangeably, so they're all folded to one form.
  function normalize(s){
    return (s || '')
      .normalize('NFC')
      .replace(/[\u0300\u0301]/g, '')
      .replace(/[\u2018\u2019\u02BC\u055A\u0060\u00B4]/g, "'")
      .trim()
      .toLowerCase()
      .replace(/\s+/g, ' ');
  }

  // ---------- STORAGE (auto-detects environment) ----------
  // Inside Claude, window.storage persists per-user across sessions.
  // Opened as a plain file in a browser, there is no window.storage,
  // so we fall back to the browser's own localStorage instead.
  var hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
  var LOCAL_PREFIX = 'wordbox-';

  // ---------- SERVICE WORKER ----------
  // Only over http(s): registering from a file:// URL throws, and the
  // standalone copy of this file should keep working when opened directly.
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){
        // No offline support, but the app runs fine online.
      });
    });
  }

  // ---------- FIREBASE (optional cloud sync) ----------
  // Configuration lives in config.js, loaded just before this script, so the
  // only file you ever need to edit is that short one.
  // If config.js is missing (opening this file on its own), the tag 404s
  // harmlessly and the app runs fully local — Claude storage or localStorage,
  // no account, no internet.
  var FIREBASE_CONFIG = window.WORDBOX_CONFIG || { apiKey: '' };

  var useFirebase = !!FIREBASE_CONFIG.apiKey;
  var fbAuth = null, fbDb = null, fbDoc = null, fbGetDoc = null, fbSetDoc = null, fbSignIn = null, fbSignOut = null;
  var fbWaitForPendingWrites = null;
  var currentUser = null;

  // ---------- SYNC STATUS ----------
  // The honest bit: with offline persistence on, setDoc() resolves as soon as
  // the write hits the LOCAL cache — not when the server has it. Treating that
  // as "synced" would show a reassuring green tick while your words sat on the
  // device. waitForPendingWrites() is what actually resolves once the backend
  // has acknowledged every outstanding write, so that's what marks a sync.
  var SYNC_KEY = 'wordbox-last-sync';
  var syncState = 'idle';   // idle | pending | synced | offline

  function loadLastSync(){
    // Deliberately localStorage, never storageSet: writing this through the
    // normal path would be another Firestore write, which would mark another
    // pending write, which would write again. Straight to the device.
    try { return localStorage.getItem(SYNC_KEY); } catch (e) { return null; }
  }

  function markSynced(){
    syncState = 'synced';
    try { localStorage.setItem(SYNC_KEY, new Date().toISOString()); } catch (e) {}
    refreshSyncLine();
  }

  function markPending(){
    syncState = navigator.onLine ? 'pending' : 'offline';
    refreshSyncLine();
  }

  // Updates just the status line rather than re-rendering the view, so it can
  // never steal focus from the search box or a half-typed form.
  function refreshSyncLine(){
    var el = document.getElementById('sync-line');
    if (el) el.outerHTML = syncLineHtml();
  }

  function agoLabel(iso){
    if (!iso) return null;
    var secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (secs < 0) return 'just now';
    if (secs < 60) return 'just now';
    var mins = Math.floor(secs / 60);
    if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
    var days = Math.floor(hrs / 24);
    if (days < 30) return days + (days === 1 ? ' day ago' : ' days ago');
    return new Date(iso).toISOString().slice(0, 10);
  }

  // Short form of agoLabel — this now shares a cramped line with the word
  // count, so "2m ago" rather than "2 minutes ago".
  function agoShort(iso){
    if (!iso) return null;
    var secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (secs < 60) return 'just now';
    var mins = Math.floor(secs / 60);
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    var days = Math.floor(hrs / 24);
    if (days < 30) return days + 'd ago';
    return new Date(iso).toISOString().slice(0, 10);
  }

  function syncLineHtml(){
    var dot = 'ok', text;

    if (!useFirebase){
      dot = 'local';
      text = 'on this device';
    } else if (!navigator.onLine){
      dot = 'wait';
      var offAgo = agoShort(loadLastSync());
      text = offAgo ? 'offline \u00B7 synced ' + offAgo : 'offline';
    } else if (syncState === 'pending'){
      dot = 'wait';
      text = 'syncing\u2026';
    } else {
      var ago = agoShort(loadLastSync());
      text = ago ? 'synced ' + ago : 'not synced yet';
      if (!ago) dot = 'wait';
    }
    return '<span id="sync-line" class="sync-line"><span class="sync-dot ' + dot + '"></span>' +
      escapeHtml(text) + '</span>';
  }

  window.addEventListener('online',  refreshSyncLine);
  window.addEventListener('offline', refreshSyncLine);

  async function initFirebase(){
    var appMod = await import("https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js");
    var authMod = await import("https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js");
    var fsMod = await import("https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js");

    var app = appMod.initializeApp(FIREBASE_CONFIG);
    fbAuth = authMod.getAuth(app);
    fbDb = fsMod.getFirestore(app);
    fbDoc = fsMod.doc;
    fbGetDoc = fsMod.getDoc;
    fbSetDoc = fsMod.setDoc;
    fbSignIn = authMod.signInWithEmailAndPassword;
    fbSignOut = authMod.signOut;
    fbWaitForPendingWrites = fsMod.waitForPendingWrites;

    try { await authMod.setPersistence(fbAuth, authMod.browserLocalPersistence); } catch (e) { /* ignore */ }
    try { await fsMod.enableIndexedDbPersistence(fbDb); } catch (e) { /* e.g. multiple tabs open \u2014 offline cache still works in the active tab */ }

    authMod.onAuthStateChanged(fbAuth, function(user){
      if (user){
        currentUser = user;
        loadWords();
      } else {
        currentUser = null;
        renderLoginScreen();
      }
    });
  }

      '<input id="login-password" type="password" placeholder="Password" autocomplete="current-password" />' +

  async function storageGet(key){
    if (useFirebase){
      try {
        var snap = await fbGetDoc(fbDoc(fbDb, 'wordbox', currentUser.uid));
        // fromCache === false means this came from the server, which is itself
        // proof the device is in sync right now.
        if (snap.metadata && snap.metadata.fromCache === false) markSynced();
        if (!snap.exists()) return null;
        var data = snap.data();
        return data[key] !== undefined ? data[key] : null;
      } catch (e) {
        return null;
      }
    }
    if (hasClaudeStorage){
      try {
        var res = await window.storage.get(key, false);
        return res && res.value ? res.value : null;
      } catch (e) {
        return null;
      }
    }
    try {
      return localStorage.getItem(LOCAL_PREFIX + key);
    } catch (e) {
      return null;
    }
  }

  async function storageSet(key, value){
    if (useFirebase){
      try {
        var fields = {};
        fields[key] = value;
        markPending();
        // Resolves once it's in the local cache — the word is safe on the
        // device at this point, offline or not.
        await fbSetDoc(fbDoc(fbDb, 'wordbox', currentUser.uid), fields, { merge: true });
        // Resolves only once the backend has acknowledged every pending
        // write. Offline, this simply never resolves, and the line keeps
        // saying so rather than claiming success.
        if (fbWaitForPendingWrites){
          fbWaitForPendingWrites(fbDb).then(markSynced).catch(function(){});
        }
      } catch (e) {
        console.error('Save failed', e);
      }
      return;
    }
    if (hasClaudeStorage){
      try {
        await window.storage.set(key, value, false);
      } catch (e) {
        console.error('Save failed', e);
      }
      return;
    }
    try {
      localStorage.setItem(LOCAL_PREFIX + key, value);
    } catch (e) {
      console.error('Save failed', e);
    }
  }

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function addDays(dateStr, n){
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function genId(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // Ten starter words, added only on a genuinely first run (see loadWords).
  // Meanings are all distinct so multiple choice has clean distractors.
  // Single place a word is created, so every path gets the same shape.
  // stats: nRight / nWrong counts, and `last` = date it was last answered.
  function makeWord(front, back, notes, hint){
    return {
      id: genId(),
      front: (front || '').trim(),
      back: (back || '').trim(),
      notes: (notes || '').trim(),
      hint: (hint || '').trim(),
      box: 1,
      due: todayStr(),
      created: todayStr(),
      nRight: 0,
      nWrong: 0,
      last: null
    };
  }

  // Words saved before hints and stats existed lack those fields, so fill
  // them in on load rather than guarding for undefined everywhere.
  function normalizeWord(w){
    return {
      id: w.id || genId(),
      front: w.front || '',
      back: w.back || '',
      notes: w.notes || '',
      hint: w.hint || '',
      box: (w.box >= 1 && w.box <= 5) ? w.box : 1,
      due: w.due || todayStr(),
      // Words saved before this was tracked keep null rather than being
      // stamped with today's date, which would be a made-up answer. They
      // genuinely predate the others, and the sort treats them accordingly.
      created: w.created || null,
      nRight: w.nRight || 0,
      nWrong: w.nWrong || 0,
      last: w.last || null
    };
  }

  function accuracyOf(w){
    var total = w.nRight + w.nWrong;
    return total ? Math.round((w.nRight / total) * 100) : null;
  }

  function sinceLabel(dateStr){
    if (!dateStr) return 'not yet practised';
    var d = Math.round((new Date(todayStr() + 'T00:00:00') - new Date(dateStr + 'T00:00:00')) / 86400000);
    if (d <= 0) return 'today';
    if (d === 1) return 'yesterday';
    if (d < 30) return d + ' days ago';
    return dateStr;
  }

      ['\u043c\u043e\u043b\u043e\u043a\u043e', 'milk', 'neuter', 'three \u043e\u0027s']
    ];
    return pairs.map(function(p){
