  async function loadWords(){
    var raw = await storageGet('words');
    // null means nothing was ever saved — a true first run, so seed.
    // '[]' means the list was saved and is empty (everything deleted),
    // which must stay empty rather than silently refilling itself.
    if (raw === null || raw === undefined){
      state.words = seedWords();
      persist();
    } else {
      try {
        var parsed = JSON.parse(raw);
        state.words = Array.isArray(parsed) ? parsed.map(normalizeWord) : [];
      } catch (e) {
        state.words = [];
      }
    }
    // Streaks are progress, not settings — they belong with the words and
    // survive reloads. Before this they lived only in memory, so "best" reset
    // to zero on every launch and simply echoed the latest run.
    try {
      var st = JSON.parse((await storageGet('streaks')) || '{}');
      if (typeof st.current === 'number' && st.current >= 0) state.streak = st.current;
      if (typeof st.best === 'number' && st.best >= 0) state.bestStreak = st.best;
      // Repairs any record saved while best was still resetting each launch.
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      state.committedStreak = state.streak;
      state.committedBest = state.bestStreak;
      if (typeof st.day === 'number' && st.day >= 0) state.dayStreak = st.day;
      if (typeof st.bestDay === 'number' && st.bestDay >= 0) state.bestDayStreak = st.bestDay;
      if (typeof st.lastDay === 'string') state.lastLessonDay = st.lastDay;
      if (state.dayStreak > state.bestDayStreak) state.bestDayStreak = state.dayStreak;
    } catch (e) {
      // nothing saved yet
    }

    // Settings live alongside the words, so a stale or unknown value from an
    // older version falls back to the default rather than breaking the list.
    try {
      var settings = JSON.parse((await storageGet('settings')) || '{}');
      if (isValidSort(settings.sortBy)) state.sortBy = settings.sortBy;
      if (typeof settings.soundOn === 'boolean') state.soundOn = settings.soundOn;
      if (typeof settings.speechOn === 'boolean') state.speechOn = settings.speechOn;
      if (isValidDir(settings.sortDir)) state.sortDir = settings.sortDir;
    } catch (e) {
      // no settings saved yet — keep the default
    }

    state.loaded = true;
    render();
  }

  async function persistSettings(){
    await storageSet('settings', JSON.stringify({
      sortBy: state.sortBy,
      sortDir: state.sortDir,
      soundOn: state.soundOn,
      speechOn: state.speechOn
    }));
  }

  async function persist(){
    // Words and streaks go in a single write. They both change on every
    // answer, and two storageSet calls would mean two Firestore round trips
    // per card.
    await storageSetMany({
      words: JSON.stringify(state.words),
      streaks: JSON.stringify({
        current: state.committedStreak,
        best: state.committedBest,
        day: state.dayStreak,
        bestDay: state.bestDayStreak,
        lastDay: state.lastLessonDay
      })
    });
  }

  async function storageSetMany(fields){
    if (useFirebase){
      try {
        markPending();
        await fbSetDoc(fbDoc(fbDb, 'wordbox', currentUser.uid), fields, { merge: true });
        if (fbWaitForPendingWrites){
          fbWaitForPendingWrites(fbDb).then(markSynced).catch(function(){});
        }
      } catch (e) {
        console.error('Save failed', e);
      }
      return;
    }
    var keys = Object.keys(fields);
    for (var i = 0; i < keys.length; i++){
      await storageSet(keys[i], fields[keys[i]]);
    }
  }

  // A lesson is a bounded slice of what's due — capped so a large backlog
  // doesn't turn into an endless session. `practice` ignores due dates so
  // there's still something to do when nothing is scheduled.
  //
  // Ordering is by how overdue a word is (oldest due date first), with box as
  // the tiebreaker. Sorting by box instead would starve mastered words: with a
  // standing backlog of box-1 words, a box-5 word could stay overdue forever
  // and never be checked. It also means a word you just missed (due = today)
  // sorts last, so it waits its turn rather than crowding out the backlog.
  function buildQueue(practice){
    var t = todayStr();
    var pool;

    if (practice){
      // Extra practice draws at random from the whole library. Ordering by
      // due date here would serve the same ten words every time, since
      // nothing you do in practice mode changes the schedule.
      pool = state.words.slice();
      for (var i = pool.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
    } else {
      pool = state.words.filter(function(w){ return w.due <= t; });
      pool.sort(function(a, b){
        if (a.due !== b.due) return a.due < b.due ? -1 : 1;
        return a.box - b.box;
      });
    }

    state.sessionQueue = pool.slice(0, LESSON_SIZE)
      .map(function(w){ return { id: w.id, dir: pickMode(w) }; });
    state.lessonWordIds = state.sessionQueue.map(function(e){ return e.id; });
    state.answeredThisLesson = {};
    state.lessonMisses = {};
    state.parkedThisLesson = false;
    state.lessonTotal = state.sessionQueue.length;
    state.lessonCorrect = 0;
    state.lessonAnswered = 0;
  }

  function dueCount(){
    var t = todayStr();
    return state.words.filter(function(w){ return w.due <= t; }).length;
  }

  function renderHome(){
    if (state.lessonReviewOpen) return renderLessonReview();
    if (state.lessonDone) return renderLessonSummary();

    if (state.words.length === 0){
      return '<div class="empty-state">' +
        '<div class="glyph">&#9679;&#9675;&#9679;</div>' +
        '<h2>Your box is empty</h2>' +
        '<p>Add some words and they\u2019ll be scheduled into lessons for you.</p>' +
        '<button class="primary" data-action="goto-cards">Add your first word</button>' +
        '</div>';
    }

    var due = dueCount();
    var lessonSize = Math.min(due, LESSON_SIZE);

    var html = '<div class="home">';

    html += '<div class="due-hero' + (due === 0 ? ' is-clear' : '') + '">';
    html += '<div class="due-num">' + due + '</div>';
    html += '<div class="due-label">' + (due === 1 ? 'word ready' : 'words ready') + '</div>';
    html += '</div>';

    if (due > 0){
      var sub = due > LESSON_SIZE
        ? lessonSize + ' of ' + due
        : lessonSize + ' card' + (lessonSize === 1 ? '' : 's');
      html += '<button class="primary start-btn" data-action="start-lesson">Start lesson' +
        '<span class="start-sub">' + sub + '</span></button>';
    } else {
      var next = state.words.slice().sort(function(a,b){ return a.due < b.due ? -1 : 1; })[0];
      html += '<div class="home-clear">All caught up.' +
        (next ? ' Next word is due ' + escapeHtml(next.due) + '.' : '') + '</div>';
      html += '<button class="secondary start-btn" data-action="practice-anyway">Practice anyway</button>';
    }

    html += '<div class="home-stats">';
    html += '<div class="home-stat"><span class="n">' +
      '<span class="stat-icon' + (doneToday() ? '' : ' cold') + '">\uD83D\uDD25</span>' +
      liveDayStreak() + '</span><span class="l">day streak</span></div>';
    var mastered = state.words.filter(function(w){ return w.box === 5; }).length;
    html += '<div class="home-stat"><span class="n">' +
      '<span class="stat-icon' + (mastered > 0 ? '' : ' cold') + '">\uD83C\uDFC6</span>' +
      mastered + '</span><span class="l">mastered</span></div>';
    // Greyed at zero, like the flame — the icon reflects whether the thing
    // it stands for is actually alive.
    html += '<div class="home-stat"><span class="n">' +
      '<span class="stat-icon' + (state.streak > 0 ? '' : ' cold') + '">\uD83C\uDFAF</span>' +
      state.streak + '</span><span class="l">correct in a row</span></div>';
    html += '</div>';

    html += '</div>';
    return html;
  }

  function renderLessonReview(){
    var words = state.lessonWordIds
      .map(function(id){ return state.words.find(function(w){ return w.id === id; }); })
      .filter(Boolean);

    var html = '<div class="home">';
    html += '<div class="review-list-head">Words from this lesson</div>';
    words.forEach(function(w){
      html += '<div class="word-detail">';
      html += '<div class="wd-top">';
      html += '<div class="wd-front">' + escapeHtml(w.front) +
        speakBtn(w.front, 'on-dark small') + '</div>';
      html += '<div class="wd-dots">' + boxDots(w.box, 'filled', '', null) + '</div>';
      html += '</div>';
      html += '<div class="wd-back">' + escapeHtml(w.back) + '</div>';
      if (w.hint)  html += '<div class="wd-line"><span>Hint</span>' + escapeHtml(w.hint) + '</div>';
      if (w.notes) html += '<div class="wd-line"><span>Notes</span>' + escapeHtml(w.notes) + '</div>';
      html += '</div>';
    });
    html += '<button class="secondary start-btn" data-action="close-lesson-review">Back</button>';
    html += '</div>';
    return html;
  }

  function renderLessonSummary(){
    var total = state.lessonAnswered;
    var correct = state.lessonCorrect;
    var pct = total ? Math.round((correct / total) * 100) : 0;
    var headline = pct === 100 ? 'Flawless.' : pct >= 70 ? 'Nice work.' : 'Good effort.';

    var html = '<div class="home">';
    html += '<div class="summary-card">';
    html += '<div class="summary-glyph">&#10003;</div>';
    html += '<h2>' + headline + '</h2>';
    html += '<p class="summary-sub">Lesson complete</p>';
    html += '<div class="summary-grid">';
    html += '<div><span class="n">' + correct + '/' + total + '</span><span class="l">correct</span></div>';
    html += '<div><span class="n">' + pct + '%</span><span class="l">accuracy</span></div>';
    html += '<div><span class="n">' + state.streak + '</span><span class="l">correct in a row</span></div>';
    html += '</div></div>';

    if (dueCount() > 0){
      html += '<button class="primary start-btn" data-action="start-lesson">Another lesson' +
        '<span class="start-sub">' + Math.min(dueCount(), LESSON_SIZE) + ' cards left</span></button>';
    }
    html += '<button class="secondary start-btn" data-action="open-lesson-review">Review these words</button>';
    html += '<button class="secondary start-btn" data-action="dismiss-summary">Done</button>';
    html += '</div>';
    return html;
  }

  function lessonHeaderHtml(){
    var remaining = uniqueRemaining();
    var doneCount = Math.max(0, state.lessonTotal - remaining);
    var pct = state.lessonTotal ? Math.round((doneCount / state.lessonTotal) * 100) : 0;
    return '<button class="lesson-close" data-action="end-lesson" aria-label="End lesson">&#10005;</button>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-count">' + doneCount + '/' + state.lessonTotal + '</div>';
  }

  function uniqueRemaining(){
    var seen = {};
    state.sessionQueue.forEach(function(e){ seen[e.id] = true; });
    return Object.keys(seen).length;
  }

  // ---------- RENDER: LESSON ----------
  function renderLesson(){
    if (state.sessionQueue.length === 0){
      return '<div class="empty-state"><p>Wrapping up\u2026</p></div>';
    }

    var entry = state.sessionQueue[0];
    var w = state.words.find(function(x){ return x.id === entry.id; });

    if (entry.dir === 'choice-en' || entry.dir === 'choice-uk'){
      var field = entry.dir === 'choice-en' ? 'back' : 'front';
      // Generated once per card and cached on the queue entry — regenerating
      // per render would reshuffle the buttons under the user's finger.
      if (!entry.options) entry.options = buildOptions(w, field);

      // Read the Ukrainian aloud when the card first appears. Flagged on the
      // queue entry so the many other renders (revealing an answer, the
      // sync line ticking) don't set it off again. A short delay lets the
      // card paint first, and means it doesn't collide with the correct or
      // wrong tone from the previous answer.
      if (entry.dir === 'choice-en' && !entry.spoken && canSpeak()){
        entry.spoken = true;
        setTimeout(function(){ speakUkrainian(w.front); }, 320);
      }

      return renderChoiceCard(w, entry.options, field);
    }
    return renderTypingCard(w);
  }

  // field is the side being ANSWERED: 'back' means the options are English
  // and the prompt is Ukrainian; 'front' is the other way round.
  function renderChoiceCard(w, options, field){
    var answered = state.chosenOption !== null;
    var promptText = field === 'back' ? w.front : w.back;
    var promptLabel = field === 'back' ? 'Which meaning?' : 'Which word?';
    var shakeClass = (answered && !state.wasCorrect) ? ' shake' : '';
    var popClass = (answered && state.wasCorrect) ? ' pop' : '';

    var html = '<div class="review-wrap">';
    html += streakHtml();
    html += feedbackHtml();
    html += '<div class="flashcard choice-card' + shakeClass + popClass + '">';
    html += '<div class="box-dots">' + boxDots(w.box, 'filled', '', null) + '</div>';
    html += '<div class="card-prompt-label">' + promptLabel + '</div>';
    html += '<div class="card-front' + (field === 'front' ? ' is-english' : '') + '">' +
      escapeHtml(promptText) + '</div>';
    // Only on cards where the Ukrainian is the prompt. When the options are
    // Ukrainian they each carry their own speaker instead.
    if (field === 'back') html += speakBtn(w.front);
    if (answered && w.notes) html += '<div class="card-notes">' + escapeHtml(w.notes) + '</div>';
    html += '</div>';

    html += '<div class="option-list">';
    options.forEach(function(opt, i){
      var cls = 'option-btn';
      var tag = '';
      if (answered){
        var isRight = normalize(opt) === normalize(w[field]);
        var isMine = (i === state.chosenOption);
        if (isRight){
          cls += ' is-correct';
          tag = isMine ? 'your answer \u2713' : 'correct answer';
        } else if (isMine){
          cls += ' is-wrong';
          tag = 'you chose';
        } else {
          cls += ' is-dimmed';
        }
      }
      var optBtn = '<button class="' + cls + '" data-action="choose-option" data-index="' + i + '"' +
        (answered ? ' disabled' : '') + '>' +
        '<span class="option-text">' + escapeHtml(opt) + '</span>' +
        (tag ? '<span class="option-tag">' + tag + '</span>' : '') +
        '</button>';

      // Ukrainian options get their own speaker on the left. Hearing them
      // before answering gives nothing away — all three are Ukrainian — and
      // makes the card double as listening practice.
      if (field === 'front' && canSpeak()){
        html += '<div class="option-row">' + speakBtn(opt, 'on-dark') + optBtn + '</div>';
      } else {
        html += optBtn;
      }
    });
    html += '</div>';

    if (answered && !state.wasCorrect){
      html += '<button class="primary next-btn" data-action="next-card">Next card</button>';
    }
    html += '</div>';
    return html;
  }

  // Character-level diff for a missed spelling: trims the shared prefix and
  // suffix and highlights what's left, so a single wrong letter stands out
  // instead of the whole word looking wrong.
  // Array.from (not split('')) so combining marks and any non-BMP characters
  // stay attached to their base letter.
  function diffPair(typed, correct){
    var A = Array.from(typed), B = Array.from(correct);
    var p = 0;
    while (p < A.length && p < B.length &&
           A[p].toLowerCase() === B[p].toLowerCase()) p++;
    var s = 0;
    while (s < A.length - p && s < B.length - p &&
           A[A.length - 1 - s].toLowerCase() === B[B.length - 1 - s].toLowerCase()) s++;
    return { a: markSpan(A, p, s), b: markSpan(B, p, s) };
  }

  function markSpan(arr, p, s){
    var head = arr.slice(0, p).join('');
    var mid  = arr.slice(p, arr.length - s).join('');
    var tail = arr.slice(arr.length - s).join('');
    return escapeHtml(head) +
      (mid ? '<mark>' + escapeHtml(mid) + '</mark>' : '') +
      escapeHtml(tail);
  }

  function renderTypingCard(w){
    var dotsHtml = boxDots(w.box, 'filled', '', null);
    var shakeClass = (state.checked && !state.wasCorrect) ? ' shake' : '';
    var popClass = (state.checked && state.wasCorrect) ? ' pop' : '';
    var html = '<div class="review-wrap">';
    html += streakHtml();
    html += feedbackHtml();
    html += '<div class="flashcard' + shakeClass + popClass + '">';
    html += '<div class="box-dots">' + dotsHtml + '</div>';
    html += '<div class="card-prompt-label">Type the Ukrainian</div>';
    html += '<div class="card-front">' + escapeHtml(w.back) + '</div>';

    if (!state.checked){
      html += '<input id="typed-input" class="type-input" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Type the word\u2026" value="' + escapeHtml(state.typedValue) + '" />';
      if (w.hint){
        if (state.hintShown){
          html += '<div class="hint-text">' + escapeHtml(w.hint) + '</div>';
        } else {
          html += '<button class="hint-btn" data-action="show-hint">Need a hint?</button>';
        }
      }
      html += '<button class="primary" data-action="check-typed">Check</button>';
    } else {
      html += '<div class="type-feedback ' + (state.wasCorrect ? 'correct' : 'incorrect') + '">';
      html += escapeHtml(state.typedReaction || (state.wasCorrect ? 'Correct!' : 'Not quite.'));
      html += '</div>';
      if (!state.wasCorrect){
        var typed = (state.typedValue || '').trim();
        var d = diffPair(typed, w.front);
        html += '<div class="answer-compare">';
        html += '<div class="compare-row"><span class="compare-label">You typed</span>' +
          '<span class="compare-value is-wrong">' +
          (typed ? d.a : '<em>nothing</em>') + '</span></div>';
        html += '<div class="compare-row"><span class="compare-label">Correct</span>' +
          '<span class="compare-value is-right">' + d.b + '</span></div>';
        html += '</div>';
      }
      html += speakBtn(w.front);
      if (w.notes) html += '<div class="card-notes">' + escapeHtml(w.notes) + '</div>';
      // Correct answers auto-advance; misses wait so the spelling can sink in.
      if (!state.wasCorrect){
        html += '<button class="primary" data-action="next-card">Next card</button>';
      }
    }
    html += '</div></div>';
    return html;
  }

  function streakHtml(){
    if (state.streak < 2) return '';
    return '<div class="streak-badge' + (state.streak >= 5 ? ' hot' : '') + '">' +
      '<span class="streak-target">\uD83C\uDFAF</span> ' + state.streak + ' correct in a row</div>';
  }

  function feedbackHtml(){
    if (!state.feedback) return '';
    return '<div class="feedback-banner ' + state.feedback.type + '">' +
      escapeHtml(state.feedback.message) + '</div>';
  }

  // Batch entry: step 1 collects Ukrainian, step 2 collects English, so the
  // keyboard only switches once per batch instead of twice per word.
  // Lines may also be pasted as pairs ("зелений = green"), in which case the
  // meaning is pre-filled and step 2 is just a review pass.
  // Separators are deliberately conservative — a bare comma or hyphen is left
  // alone, since meanings legitimately contain both ("to go, to walk").
  // Reads the meaning inputs straight from the DOM. Step 2 deliberately does
  // not re-render while typing, so the fields hold their own values and focus.
  function captureBatchMeanings(){
    document.querySelectorAll('.batch-back-input').forEach(function(inp){
      var i = parseInt(inp.getAttribute('data-idx'), 10);
      if (state.batchItems[i]) state.batchItems[i].back = inp.value;
    });
  }

  function parseBatchLines(raw){
    var existing = {};
    state.words.forEach(function(w){ existing[normalize(w.front)] = true; });

    var items = [], skipped = 0, seen = {};
    raw.split('\n').forEach(function(line){
      if (!line.trim()) return;
      var front = line, back = '';
      var m = line.match(/^(.*?)\s*(?:\t|\s=\s|=|\s[-–—]\s)\s*(.*)$/);
      if (m && m[1].trim() && m[2].trim()){
        front = m[1];
        back = m[2].trim();
      }
      front = front.trim();
      if (!front) return;
      var key = normalize(front);
      if (existing[key] || seen[key]){ skipped++; return; }
      seen[key] = true;
      items.push({ front: front, back: back });
    });
    return { items: items, skipped: skipped };
  }

  function renderBatch(){
    var html = '<div class="batch-panel">';

    if (state.batchStep === 1){
      html += '<div class="batch-step">Step 1 of 2 \u00B7 Ukrainian</div>';
      html += '<p class="batch-hint">One word per line. Paste pairs like <em>\u0437\u0435\u043B\u0435\u043D\u0438\u0439 = green</em> and the meanings fill in for you.</p>';
      html += '<textarea id="batch-input" class="batch-textarea" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="\u0437\u0435\u043B\u0435\u043D\u0438\u0439&#10;\u0441\u0438\u043D\u0456\u0439&#10;\u0436\u043E\u0432\u0442\u0438\u0439">' + escapeHtml(state.batchRaw) + '</textarea>';
      html += '<div class="form-actions">';
      html += '<button class="primary" data-action="batch-next">Next</button>';
      html += '<button class="secondary" data-action="cancel-batch">Cancel</button>';
      html += '</div></div>';
      return html;
    }

    html += '<div class="batch-step">Step 2 of 2 \u00B7 English</div>';
    if (state.batchSkipped){
      html += '<div class="batch-note">' + state.batchSkipped + ' skipped \u2014 already in your list.</div>';
    }
    if (state.batchItems.length === 0){
      html += '<p class="batch-hint">Nothing new to add.</p>';
      html += '<div class="form-actions"><button class="secondary" data-action="batch-back">Back</button></div></div>';
      return html;
    }
    html += '<p class="batch-hint">Fill in the meanings. Leave one blank to drop that word.</p>';
    state.batchItems.forEach(function(item, i){
      html += '<div class="batch-row">';
      html += '<div class="batch-word">' + escapeHtml(item.front) + '</div>';
      html += '<input class="batch-back-input" data-idx="' + i + '" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="meaning" value="' + escapeHtml(item.back) + '" />';
      html += '</div>';
    });
    html += '<div class="form-actions">';
    html += '<button class="primary" data-action="batch-save">Save ' + state.batchItems.length + ' word' + (state.batchItems.length === 1 ? '' : 's') + '</button>';
    html += '<button class="secondary" data-action="batch-back">Back</button>';
    html += '</div></div>';
    return html;
  }

  // ---------- RENDER: CARDS (manage) ----------
  // Ukrainian collation, so і/ї/є/ґ land in the right places rather than
  // being ordered by raw code point.
  function byName(a, b){
    return a.front.localeCompare(b.front, 'uk');
  }

  // Each field has one ascending comparator; direction is applied by
  // negating it, so asc/desc can never disagree about ordering.
  function cmpField(a, b, field){
    if (field === 'meaning') return a.back.localeCompare(b.back, 'en');
    if (field === 'box')     return a.box - b.box;
    if (field === 'accuracy') return accuracyOf(a) - accuracyOf(b);
    if (field === 'practised') return a.last < b.last ? -1 : a.last > b.last ? 1 : 0;
    if (field === 'added'){
      var ac = a.created || '', bc = b.created || '';   // '' sorts first = oldest
      return ac < bc ? -1 : ac > bc ? 1 : 0;
    }
    return byName(a, b);
  }

  // Only these two can be missing data — a word never practised has no
  // accuracy and no date.
  function hasData(w, field){
    if (field === 'accuracy')  return (w.nRight + w.nWrong) > 0;
    if (field === 'practised') return !!w.last;
    return true;
  }

  var SORT_FIELDS = [
    ['practised', 'Last practised'],
    ['accuracy',  'Accuracy'],
    ['box',       'Box'],
    ['word',      'Word'],
    ['meaning',   'Meaning'],
    ['added',     'Date added']
  ];

  // The direction each field is most useful in when you first pick it:
  // newest practice first, but weakest and lowest-box first.
  var SORT_DEFAULT_DIR = {
    practised: 'desc',
    accuracy:  'asc',
    box:       'asc',
    word:      'asc',
    meaning:   'asc',
    added:     'desc'
  };

  function isValidSort(v){
    return SORT_FIELDS.some(function(o){ return o[0] === v; });
  }
  function isValidDir(v){
    return v === 'asc' || v === 'desc';
  }

  function sortWords(list){
    var field = isValidSort(state.sortBy) ? state.sortBy : 'practised';
    var dir = state.sortDir === 'desc' ? -1 : 1;

    // Words with no history are parked at the end either way. Flipping the
    // direction shouldn't promote them to the top, since "no data" is not a
    // score of zero.
    var scored = [], unscored = [];
    list.forEach(function(w){
      (hasData(w, field) ? scored : unscored).push(w);
    });

    scored.sort(function(a, b){
      return (dir * cmpField(a, b, field)) || byName(a, b);
    });
    unscored.sort(byName);
    return scored.concat(unscored);
  }

  // One form, used in two places: at the top when adding a new word, and
  // expanded inline under a row when editing an existing one. Only ever one
  // is open at a time, so the field ids stay unique.
  // One function for three states — adding, editing, and the read-only view
  // you get by tapping a word. Sharing it guarantees the expanded row looks
  // identical whether or not you're editing; two functions would drift.
  function renderWordForm(word, readOnly){
    var html = '<div class="add-form' + (word ? ' inline-form' : '') + '">';

    if (readOnly){
      html += '<label>Word / phrase</label>' +
        '<div class="ro-field"><span>' + escapeHtml(word.front) + '</span>' +
        speakBtn(word.front, 'on-dark small') + '</div>';
      html += '<label>Meaning</label><div class="ro-field"><span>' + escapeHtml(word.back) + '</span></div>';
      if (word.hint)  html += '<label>Hint</label><div class="ro-field"><span>' + escapeHtml(word.hint) + '</span></div>';
      if (word.notes) html += '<label>Notes</label><div class="ro-field"><span>' + escapeHtml(word.notes) + '</span></div>';
      html += '<div class="form-actions">';
      html += '<button class="secondary" data-action="edit-word" data-id="' + word.id + '">Edit</button>';
      html += '</div>';
    } else {
      html += '<label>Word / phrase</label>';
      html += '<div class="field-with-speak">' +
        '<input id="f-front" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" value="' + (word ? escapeHtml(word.front) : '') + '" placeholder="e.g. \u0437\u0435\u043B\u0435\u043D\u0438\u0439" />' +
        (word ? speakBtn(word.front, 'on-dark small') : '') +
        '</div>';
      html += '<label>Meaning</label><input id="f-back" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" value="' + (word ? escapeHtml(word.back) : '') + '" placeholder="e.g. green" />';
      html += '<label>Hint (optional)</label><input id="f-hint" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" value="' + (word ? escapeHtml(word.hint || '') : '') + '" placeholder="a nudge, shown on request during a lesson" />';
      html += '<label>Notes (optional)</label><textarea id="f-notes" autocorrect="off" spellcheck="false" placeholder="gender, example sentence, etc.">' + (word ? escapeHtml(word.notes || '') : '') + '</textarea>';
      html += '<div class="form-actions">';
      html += '<button class="primary" data-action="save-word">' + (word ? 'Save changes' : 'Add word') + '</button>';
      html += '<button class="secondary" data-action="cancel-form">Cancel</button>';
      html += '</div>';
    }

    if (word){
      var eAcc = accuracyOf(word);
      html += '<div class="edit-stats">';
      html += '<div class="es-head">Progress</div>';
      html += '<div class="es-grid">';
      html += '<div><span class="n">' + word.box + '<small>/5</small></span><span class="l">box</span></div>';
      html += '<div><span class="n">' + (eAcc === null ? '\u2014' : eAcc + '%') + '</span><span class="l">accuracy</span></div>';
      html += '<div><span class="n">' + word.nRight + '</span><span class="l">right</span></div>';
      html += '<div><span class="n">' + word.nWrong + '</span><span class="l">wrong</span></div>';
      html += '</div>';
      html += '<div class="es-line">Added: ' +
        escapeHtml(word.created ? sinceLabel(word.created) : 'before this was tracked') + '</div>';
      html += '<div class="es-line">Last practised: ' + escapeHtml(sinceLabel(word.last)) + '</div>';
      html += '<div class="es-line">Next due: ' + escapeHtml(word.due <= todayStr() ? 'now' : word.due) + '</div>';
      if (!readOnly) html += '<div class="es-note">Editing the text keeps all of this intact.</div>';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  // How long until a word is next due. Counterpart to sinceLabel, which
  // looks backwards.
  function untilLabel(dateStr){
    if (!dateStr) return 'due now';
    var d = Math.round((new Date(dateStr + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
    if (d <= 0) return 'due now';
    if (d === 1) return 'due tomorrow';
    if (d < 30) return 'due in ' + d + ' days';
    return 'due ' + dateStr;
  }

  // The line under each word reports whatever you're sorting by, so the list
  // answers the question you're currently asking of it.
  function rowMeta(w){
    var acc = accuracyOf(w);
    switch (state.sortBy){
      case 'accuracy':
        if (acc === null) return 'not practised yet';
        return '<span class="stat-acc' + (acc >= 80 ? ' good' : acc < 50 ? ' poor' : '') + '">' +
          acc + '%</span> \u00B7 ' + w.nRight + ' right, ' + w.nWrong + ' wrong';
      case 'practised':
        return w.last ? 'practised ' + sinceLabel(w.last) : 'not practised yet';
      case 'box':
        return 'box ' + w.box + ' \u00B7 ' + untilLabel(w.due);
      case 'added':
        return w.created ? 'added ' + sinceLabel(w.created) : 'added before this was tracked';
      default:
        // Sorting by word or meaning is browsing, not reviewing — both are
        // already on the row, so there's nothing useful to add.
        return '';
    }
  }

  function renderCards(){
    if (state.importPreview) return renderImportPreview();
    if (state.batchOpen) return renderBatch();
    var html = '';

    // The add form still belongs at the top — there's no row to anchor it to.
    // Editing anchors to its own row further down instead.
    var addingNew = state.formOpen && !state.editingId;
    if (addingNew){
      html += renderWordForm(null);
    } else {
      html += '<div class="add-row">';
      html += '<button class="add-toggle" data-action="open-form">+ Add a word</button>';
      html += '<button class="add-toggle" data-action="open-batch">+ Add several</button>';
      html += '</div>';
    }

    var backupHtml = '<div class="backup-row">' +
      '<button class="secondary" data-action="export-words">Export backup</button>' +
      '<button class="secondary" data-action="import-words">Import backup</button>' +
      '<input type="file" id="import-file-input" accept="application/json,.json" style="display:none" />' +
      '</div>' +
      '<div class="samples-row"><button class="text-btn" data-action="add-samples">Add any missing sample words</button>' +
      (state.sampleNote ? '<div class="sample-note">' + escapeHtml(state.sampleNote) + '</div>' : '') +
      '</div>';

    if (state.words.length === 0){
      html += '<div class="empty-state">' +
        '<div class="glyph">&#9679;&#9675;&#9679;</div>' +
        '<h2>No words yet</h2>' +
        '<p>Everything you add lands here, then gets scheduled into review automatically.</p>' +
        '<button class="secondary" data-action="load-samples">Load sample words</button>' +
        '</div>' + backupHtml;
      html = '<div class="lib-meta"><span class="lib-count">0 words</span>' +
        syncLineHtml() + '</div>' + html;
      return html;
    }

    html += '<div class="search-bar">' +
      '<span class="search-icon">' + ICONS.search + '</span>' +
      '<input id="search-input" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Search words" value="' + escapeHtml(state.search) + '" />' +
      (state.search ? '<button class="search-clear" data-action="clear-search" aria-label="Clear search">\u2715</button>' : '') +
      '</div>';
    var dirDesc = state.sortDir === 'desc';
    if (state.boxFilter){
      html += '<div class="filter-chip">Box ' + state.boxFilter +
        ' only <button data-action="clear-box-filter" aria-label="Clear filter">\u2715</button></div>';
    }
    html += '<div class="sort-bar">' +
      '<span class="sort-icon">' + ICONS.sort + '</span>' +
      '<select id="sort-select" aria-label="Sort by">';
    SORT_FIELDS.forEach(function(o){
      html += '<option value="' + o[0] + '"' + (state.sortBy === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    });
    html += '</select>';
    html += '<button class="sort-dir" data-action="toggle-sort-dir" aria-label="' +
      (dirDesc ? 'Descending \u2014 tap for ascending' : 'Ascending \u2014 tap for descending') +
      '" title="' + (dirDesc ? 'Descending' : 'Ascending') + '">' +
      (dirDesc ? ICONS.arrowDown : ICONS.arrowUp) + '</button>';
    html += '</div>';

    var list = sortWords(state.words.filter(function(w){
      if (state.boxFilter && w.box !== state.boxFilter) return false;
      if (!state.search) return true;
      var q = state.search.toLowerCase();
      return w.front.toLowerCase().indexOf(q) !== -1 || w.back.toLowerCase().indexOf(q) !== -1;
    }));

    html += '<div class="lib-meta"><span class="lib-count">' +
      (list.length === state.words.length
        ? state.words.length + (state.words.length === 1 ? ' word' : ' words')
        : list.length + ' of ' + state.words.length + ' words') +
      '</span>' + syncLineHtml() + '</div>';

    if (list.length === 0){
      html += '<div class="empty-state"><p>No words match your search.</p></div>';
    } else {
      list.forEach(function(w){
        var isEditing = state.editingId === w.id;
        var isOpen = isEditing || state.expandedId === w.id;
        var confirming = state.confirmDeleteId === w.id;
        html += '<div class="word-entry' + (isOpen ? ' is-editing' : '') + '">';
        // The row itself toggles the expanded view. Taps on the pencil or bin
        // resolve to those buttons first, since the handler walks up from the
        // tapped element and finds the nearest data-action.
        html += '<div class="word-row" data-action="toggle-word" data-id="' + w.id + '">';
        html += '<div class="box-dots-inline">' + boxDots(w.box, 'filled', '', null) + '</div>';
        html += '<div class="word-text"><div class="front">' + escapeHtml(w.front) + '</div><div class="back">' + escapeHtml(w.back) + '</div>';
        // The line under each word reports whatever you're sorting by, so
        // the list answers the question you're currently asking of it rather
        // than showing every statistic at once.
        var meta = rowMeta(w);
        if (meta) html += '<div class="word-stats">' + meta + '</div>';
        html += '</div>';
        html += '<div class="row-actions">';
        html += '<button class="icon-btn' + (isEditing ? ' active' : '') + '" data-action="edit-word" data-id="' + w.id + '">' + ICONS.edit + '</button>';
        html += '<button class="icon-btn danger' + (confirming ? ' active' : '') + '" data-action="ask-delete" data-id="' + w.id + '">' + ICONS.trash + '</button>';
        html += '</div></div>';

        if (confirming){
          html += '<div class="delete-confirm">' +
            '<span>Delete <strong>' + escapeHtml(w.front) + '</strong>? Its progress goes too.</span>' +
            '<div class="delete-confirm-actions">' +
            '<button class="danger-btn" data-action="delete-word" data-id="' + w.id + '">Delete</button>' +
            '<button class="secondary" data-action="cancel-delete">Keep</button>' +
            '</div></div>';
        }

        if (isEditing) html += renderWordForm(w, false);
        else if (isOpen) html += renderWordForm(w, true);
        html += '</div>';
      });
    }
    html += backupHtml;
    return html;
  }

  // ---------- RENDER: STATS ----------
  // Written from the same constants the scheduler uses, so these can't fall
  // out of step with what the app actually does.
  function boxNote(n){
    if (n === 1) return 'new or missed \u00B7 back tomorrow';
    var d = INTERVALS[n];
    var note = 'after ' + d + (d === 1 ? ' day' : ' days');
    if (n === TYPING_FROM_BOX) note += ' \u00B7 typing starts';
    if (n === 5) note += ' \u00B7 mastered';
    return note;
  }

  function renderStats(){
    var counts = [0,0,0,0,0];
    state.words.forEach(function(w){ counts[w.box - 1]++; });
    // Bars are a share of the whole vocabulary, not of the fullest box.
    // Scaling to the largest box made every chart look the same — the biggest
    // bar was always full — and turned a one-word difference into a dramatic
    // gap. As a share, the bars flatten as words spread up the ladder, which
    // is what progress actually looks like.
    var totalWords = Math.max(state.words.length, 1);

    // Only the all-time records live here. The live figures — due today, the
    // running day streak, the current run of correct answers — are all on the
    // home screen, and repeating them just splits your attention.
    var html = '<div class="stat-grid">';
    html += '<div class="stat-box"><div class="num">' +
      '<span class="stat-icon' + (state.bestDayStreak > 0 ? '' : ' cold') + '">\uD83D\uDD25</span>' +
      state.bestDayStreak + '</div><div class="label">Longest day streak</div></div>';
    html += '<div class="stat-box"><div class="num">' +
      '<span class="stat-icon' + (state.bestStreak > 0 ? '' : ' cold') + '">\uD83C\uDFAF</span>' +
      state.bestStreak + '</div><div class="label">Best in a row</div></div>';
    html += '</div>';

    html += '<div class="box-chart"><h3>Words per box</h3>' +
      '<p class="box-chart-sub">Each correct answer on schedule moves a word up one box, and the next review is pushed further out. A miss sends it back to box 1.</p>';
    for (var i = 0; i < 5; i++){
      var share = counts[i] / totalWords;
      // A non-zero box always shows a sliver, so one word out of 200 is still
      // visible rather than rounding away to an empty track.
      var pct = counts[i] === 0 ? 0 : Math.max(2, Math.round(share * 100));
      html += '<button class="bar-row" data-action="filter-box" data-box="' + (i+1) + '"' +
        (counts[i] === 0 ? ' disabled' : '') + '>' +
        '<span class="bar-top">' +
          '<span class="bar-label">Box ' + (i+1) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
          '<span class="bar-count">' + counts[i] + '</span>' +
        '</span>' +
        '<span class="bar-note">' +
          (counts[i] === 0 ? '' : Math.round(share * 100) + '% \u00B7 ') +
          boxNote(i + 1) + '</span>' +
        '</button>';
    }
    html += '<div class="chart-hint">Tap a box to see those words</div>';
    html += '</div>';
    html += '<div class="pref-row"><span>Sound effects</span>' +
      '<button class="toggle' + (state.soundOn ? ' on' : '') + '" data-action="toggle-sound">' +
      '<span class="knob"></span></button></div>';

    if ('speechSynthesis' in window){
      html += '<div class="pref-row"><span>Speak Ukrainian</span>' +
        '<button class="toggle' + (state.speechOn ? ' on' : '') + '" data-action="toggle-speech">' +
        '<span class="knob"></span></button></div>';
      // Said plainly rather than letting a wrong-language voice sound broken.
      if (state.speechOn && voicesReady && !ukVoices.length){
        html += '<div class="pref-note">No Ukrainian voice found on this device, so words may be ' +
          'read with the wrong accent. Add one in Settings \u203A Accessibility \u203A ' +
          'Spoken Content \u203A Voices \u203A Ukrainian.</div>';
      } else if (state.speechOn && ukVoices.length){
        var q = voiceQualityLabel();
        var note = 'Using <strong>' + escapeHtml(ukVoices[0].name || 'unnamed') + '</strong> \u2014 ' +
          q + ' quality' +
          (ukVoices.length > 1 ? ', and ' + (ukVoices.length - 1) + ' more of the same tier picked between at random' : '') + '.';
        if (q === 'standard'){
          note += ' A better one can be downloaded free in Settings \u203A Accessibility \u203A ' +
            'Spoken Content \u203A Voices \u203A Ukrainian \u2014 choose Premium or Enhanced. ' +
            'The app will use it automatically.';
        }
        html += '<div class="pref-note">' + note + '</div>';
      }
    }

    if ('speechSynthesis' in window || getTtsKey()){
      var hasKey = !!getTtsKey();
      html += '<div class="tts-block">';
      html += '<div class="es-head">Google voice (optional)</div>';
      if (hasKey){
        html += '<div class="pref-note">A key is set on this device, so words are read by ' +
          'Google\u2019s Ukrainian voice. Each word is synthesised once and cached, so it costs ' +
          'nothing after the first play and works offline afterwards.</div>';
        html += '<div class="form-actions">';
        html += '<button class="secondary" data-action="clear-tts-key">Remove key</button>';
        html += '</div>';
      } else {
        html += '<div class="pref-note">Paste a Google Cloud Text-to-Speech API key for a ' +
          'better voice than the system one. Stored on this device only \u2014 never in the ' +
          'repository and never synced. Leave empty to keep using the system voice.</div>';
        html += '<input id="tts-key-input" type="password" autocomplete="off" autocapitalize="none" ' +
          'autocorrect="off" spellcheck="false" placeholder="API key" />';
        html += '<div class="form-actions">';
        html += '<button class="primary" data-action="save-tts-key">Save key</button>';
        html += '</div>';
      }
      html += '</div>';
    }

    if (useFirebase && currentUser){
      html += '<div class="account-row">Signed in as ' + escapeHtml(currentUser.email) + '<button class="text-btn" data-action="sign-out">Sign out</button></div>';
    }
    return html;
  }

  // ---------- MAIN RENDER ----------
  function render(){
    var app = document.getElementById('app');
    if (!state.loaded){
      app.innerHTML =
        '<div class="loading-screen">' +
        '<div class="loader"><span></span><span></span><span></span></div>' +
        '<div class="loading-title">Opening your box\u2026</div>' +
        '<div class="loading-quote">' + escapeHtml(LOADING_QUOTE) + '</div>' +
        '</div>';
      return;
    }

    var html;
    if (state.sessionActive){
      // Lesson mode gets its own chrome: progress instead of a title, and no
      // tab bar, so there's one thing to do and one way out.
      html = '<header class="lesson-header">' + lessonHeaderHtml() + '</header>';
      html += '<main class="lesson-main">' + renderLesson() + '</main>';
    } else {
      var titleMap = {
        home: ['Wordbox', greetingLine()],
        cards: ['Library', 'Add, edit, or remove entries'],
        stats: ['Profile', 'Your progress so far']
      };
      var t = titleMap[state.view] || titleMap.home;

      var body = '';
      if (state.view === 'home') body = renderHome();
      else if (state.view === 'cards') body = renderCards();
      else body = renderStats();

      html = '<header><h1>' + t[0] + '</h1><p>' + t[1] + '</p></header>';
      html += '<main>' + body + '</main>';
      html += '<nav class="tabs">' +
        tabBtn('home', ICONS.home, 'Home') +
        tabBtn('cards', ICONS.cards, 'Library') +
        tabBtn('stats', ICONS.profile, 'Profile') +
        '</nav>';
    }

    app.innerHTML = html;

    var searchInput = document.getElementById('search-input');
    if (searchInput){
      searchInput.addEventListener('input', function(e){
        state.search = e.target.value;
        render();
        var el = document.getElementById('search-input');
        if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
      });
    }

    var typedInput = document.getElementById('typed-input');
    if (typedInput){
      typedInput.focus();
      typedInput.selectionStart = typedInput.selectionEnd = typedInput.value.length;
      typedInput.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){
          e.preventDefault();
          document.querySelector('[data-action="check-typed"]').click();
        }
      });
    }

    var sortSelect = document.getElementById('sort-select');
    if (sortSelect){
      sortSelect.addEventListener('change', function(e){
        if (!isValidSort(e.target.value)) return;
        state.sortBy = e.target.value;
        // Snap to the direction that field is most useful in, so picking
        // "Word" doesn't land you in \u042F \u2192 \u0410 because of a previous choice.
        state.sortDir = SORT_DEFAULT_DIR[state.sortBy] || 'asc';
        persistSettings();
        render();
      });
    }

    var importInput = document.getElementById('import-file-input');
    if (importInput){
      importInput.addEventListener('change', function(e){
        if (e.target.files && e.target.files[0]){
          importWordsFromFile(e.target.files[0]);
        }
        e.target.value = '';
      });
    }
  }

  function tabBtn(id, icon, label){
    return '<button class="' + (state.view === id ? 'active' : '') + '" data-action="switch-view" data-view="' + id + '">' + icon + '<span>' + label + '</span></button>';
  }

  // ---------- EVENTS ----------
  document.getElementById('app').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    if (action === 'switch-view'){
      // The box filter is a temporary drill-down from Profile, not a saved
      // view. Leaving the Library drops it.
      state.boxFilter = null;
      state.expandedId = null;
      state.confirmDeleteId = null;
      state.view = el.getAttribute('data-view');
      state.formOpen = false;
      state.batchOpen = false;
      state.editingId = null;
      state.lessonDone = false;
      state.lessonReviewOpen = false;
      render();
    }
    else if (action === 'start-lesson'){
      startLesson(false);
    }
    else if (action === 'practice-anyway'){
      startLesson(true);
    }
    else if (action === 'end-lesson'){
      endLesson(false);
    }
    else if (action === 'dismiss-summary'){
      state.lessonDone = false;
      state.lessonReviewOpen = false;
      render();
    }
    else if (action === 'filter-box'){
      state.boxFilter = parseInt(el.getAttribute('data-box'), 10);
      state.view = 'cards';
      state.formOpen = false;
      state.batchOpen = false;
      state.search = '';
      render();
    }
    else if (action === 'clear-search'){
      state.search = '';
      render();
    }
    else if (action === 'clear-box-filter'){
      state.boxFilter = null;
      render();
    }
    else if (action === 'speak'){
      speakUkrainian(el.getAttribute('data-text'));
    }
    else if (action === 'toggle-speech'){
      state.speechOn = !state.speechOn;
      persistSettings();
      render();
      if (state.speechOn) speakUkrainian('\u0434\u043E\u0431\u0440\u0435');   // "good"
    }
    else if (action === 'save-tts-key'){
      var kEl = document.getElementById('tts-key-input');
      var kVal = kEl ? kEl.value.trim() : '';
      if (!kVal) return;
      setTtsKey(kVal);
      render();
      speakUkrainian('\u0434\u043E\u0431\u0440\u0435');   // "good" — proves it works
    }
    else if (action === 'clear-tts-key'){
      setTtsKey('');
      render();
    }
    else if (action === 'toggle-sound'){
      state.soundOn = !state.soundOn;
      persistSettings();
      if (state.soundOn) soundCorrect();
      render();
    }
    else if (action === 'goto-cards'){
      state.view = 'cards';
      state.formOpen = true;
      state.lessonDone = false;
      render();
    }
    else if (action === 'show-hint'){
      // Capture what's typed first — revealing the hint re-renders the card.
      var hintInput = document.getElementById('typed-input');
      if (hintInput) state.typedValue = hintInput.value;
      state.hintShown = true;
      render();
    }
    else if (action === 'open-lesson-review'){
      state.lessonReviewOpen = true;
      render();
    }
    else if (action === 'close-lesson-review'){
      state.lessonReviewOpen = false;
      render();
    }
    else if (action === 'check-typed'){
      var input = document.getElementById('typed-input');
      var entryT = state.sessionQueue[0];
      var wordT = state.words.find(function(x){ return x.id === entryT.id; });
      state.typedValue = input ? input.value : '';
      state.wasCorrect = normalize(state.typedValue) === normalize(wordT.front);
      state.checked = true;
      scoreStreak(state.wasCorrect);
      state.typedReaction = reactionFor(state.wasCorrect);
      render();
      if (state.wasCorrect){ soundCorrect(); burstConfetti(); autoAdvance(); }
      else { soundWrong(); }
    }
    else if (action === 'choose-option'){
      if (state.chosenOption !== null) return;
      var idx = parseInt(el.getAttribute('data-index'), 10);
      var entryC = state.sessionQueue[0];
      var wordC = state.words.find(function(x){ return x.id === entryC.id; });
      state.chosenOption = idx;
      var cField = entryC.dir === 'choice-en' ? 'back' : 'front';
      state.wasCorrect = normalize(entryC.options[idx]) === normalize(wordC[cField]);
      scoreStreak(state.wasCorrect);
      state.feedback = { type: state.wasCorrect ? 'correct' : 'wrong', message: reactionFor(state.wasCorrect) };
      render();
      if (state.wasCorrect){ soundCorrect(); burstConfetti(); autoAdvance(); }
      else { soundWrong(); }
    }
    else if (action === 'next-card'){
      applyAnswer(state.wasCorrect);
    }
    else if (action === 'open-form'){
      state.formOpen = true;
      state.editingId = null;
      render();
      var f = document.getElementById('f-front');
      if (f) f.focus();
    }
    else if (action === 'cancel-form'){
      state.formOpen = false;
      state.editingId = null;
      render();
    }
    else if (action === 'toggle-word'){
      var tId = el.getAttribute('data-id');
      state.expandedId = (state.expandedId === tId && !state.editingId) ? null : tId;
      state.editingId = null;
      state.formOpen = false;
      state.confirmDeleteId = null;
      render();
    }
    else if (action === 'edit-word'){
      var wantId = el.getAttribute('data-id');
      // Tapping the pencil on the row already being edited closes it again.
      if (state.editingId === wantId){
        state.editingId = null;
        state.formOpen = false;
        state.expandedId = null;
      } else {
        state.editingId = wantId;
        state.expandedId = wantId;
        state.formOpen = true;
      }
      state.confirmDeleteId = null;
      render();
    }
    else if (action === 'ask-delete'){
      var dId = el.getAttribute('data-id');
      state.confirmDeleteId = state.confirmDeleteId === dId ? null : dId;
      render();
    }
    else if (action === 'cancel-delete'){
      state.confirmDeleteId = null;
      render();
    }
    else if (action === 'delete-word'){
      var id = el.getAttribute('data-id');
      state.words = state.words.filter(function(w){ return w.id !== id; });
      state.confirmDeleteId = null;
      if (state.expandedId === id) state.expandedId = null;
      if (state.editingId === id){ state.editingId = null; state.formOpen = false; }
      persist();
      render();
    }
    else if (action === 'save-word'){
      var front = document.getElementById('f-front').value.trim();
      var back = document.getElementById('f-back').value.trim();
      var notes = document.getElementById('f-notes').value.trim();
      var hint = document.getElementById('f-hint').value.trim();
      if (!front || !back){ return; }

      if (state.editingId){
        // Editing keeps the word's box, due date and stats untouched.
        var w2 = state.words.find(function(x){ return x.id === state.editingId; });
        w2.front = front; w2.back = back; w2.notes = notes; w2.hint = hint;
      } else {
        state.words.push(makeWord(front, back, notes, hint));
      }
      state.formOpen = false;
      state.editingId = null;
      persist();
      render();
    }
    else if (action === 'open-batch'){
      state.batchOpen = true;
      state.batchStep = 1;
      state.batchItems = [];
      state.batchSkipped = 0;
      state.batchRaw = '';
      state.formOpen = false;
      render();
      var bi = document.getElementById('batch-input');
      if (bi) bi.focus();
    }
    else if (action === 'cancel-batch'){
      state.batchOpen = false;
      state.batchRaw = '';
      state.batchItems = [];
      render();
    }
    else if (action === 'batch-next'){
      var ta = document.getElementById('batch-input');
      state.batchRaw = ta ? ta.value : '';
      var parsed = parseBatchLines(state.batchRaw);
      state.batchItems = parsed.items;
      state.batchSkipped = parsed.skipped;
      state.batchStep = 2;
      render();
    }
    else if (action === 'batch-back'){
      // Keep whatever meanings were typed so Back isn't destructive.
      captureBatchMeanings();
      state.batchStep = 1;
      render();
    }
    else if (action === 'batch-save'){
      captureBatchMeanings();
      var added = 0;
      state.batchItems.forEach(function(item){
        if (!item.front.trim() || !item.back.trim()) return;
        state.words.push(makeWord(item.front, item.back, '', ''));
        added++;
      });
      state.batchOpen = false;
      state.batchItems = [];
      state.batchRaw = '';
      persist();
      render();
    }
    else if (action === 'toggle-sort-dir'){
      state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
      persistSettings();
      render();
    }
    else if (action === 'add-samples'){
      // Tops up rather than replacing: only samples whose word isn't already
      // in the deck get added, so existing progress and edits are untouched.
      var have = {};
      state.words.forEach(function(w){ have[normalize(w.front)] = true; });
      var addedCount = 0;
      seedWords().forEach(function(sw){
        if (have[normalize(sw.front)]) return;
        state.words.push(sw);
        addedCount++;
      });
      if (addedCount) persist();
      state.sampleNote = addedCount
        ? addedCount + ' sample word' + (addedCount === 1 ? '' : 's') + ' added.'
        : 'All sample words are already in your list.';
      render();
      setTimeout(function(){ state.sampleNote = null; render(); }, 2600);
    }
    else if (action === 'load-samples'){
      // Only offered from the empty state, so nothing can be overwritten.
      state.words = seedWords();
      persist();
      render();
    }
    else if (action === 'import-merge'){
      state.words = state.words.concat(state.importPreview.fresh);
      state.importPreview = null;
      persist();
      render();
    }
    else if (action === 'import-replace'){
      state.words = state.importPreview.all;
      state.importPreview = null;
      persist();
      render();
    }
    else if (action === 'import-cancel'){
      state.importPreview = null;
      render();
    }
    else if (action === 'export-words'){
      exportWords();
    }
    else if (action === 'import-words'){
      var fileInput = document.getElementById('import-file-input');
      if (fileInput) fileInput.click();
    }
    else if (action === 'sign-out'){
      if (fbSignOut) fbSignOut(fbAuth);
    }
  });

  function exportWords(){
    var data = JSON.stringify(state.words, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'wordbox-words.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // A word is "the same word" if both sides match after normalising — so
  // case, spacing, stress marks and apostrophe style don't create phantom
  // duplicates. Front alone isn't enough: a word can legitimately appear
  // twice with different meanings.
  function pairKey(w){
    return normalize(w.front) + '\u0000' + normalize(w.back);
  }

  function importWordsFromFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch (e){
        alert('That file isn\u2019t valid JSON.');
        return;
      }
      if (!Array.isArray(parsed)){
        alert('Expected a JSON array of words.');
        return;
      }

      var all = parsed.map(normalizeWord).filter(function(w){ return w.front && w.back; });
      if (!all.length){
        alert('No usable words in that file.');
        return;
      }

      // Duplicates inside the file itself count too — a backup merged from
      // two sources can easily contain the same pair twice.
      var seenInFile = {}, deduped = [];
      all.forEach(function(w){
        var k = pairKey(w);
        if (seenInFile[k]) return;
        seenInFile[k] = true;
        deduped.push(w);
      });

      var have = {};
      state.words.forEach(function(w){ have[pairKey(w)] = true; });
      var fresh = deduped.filter(function(w){ return !have[pairKey(w)]; });

      state.importPreview = {
        all: deduped,
        fresh: fresh,
        alreadyHave: deduped.length - fresh.length,
        inFileDupes: all.length - deduped.length,
        skipped: parsed.length - all.length
      };
      render();
    };
    reader.readAsText(file);
  }

  function renderImportPreview(){
    var p = state.importPreview;
    var html = '<div class="batch-panel">';
    html += '<div class="batch-step">Import backup</div>';

    html += '<div class="import-summary">';
    html += '<div><span class="n">' + p.all.length + '</span><span class="l">in file</span></div>';
    html += '<div><span class="n">' + p.fresh.length + '</span><span class="l">new</span></div>';
    html += '<div><span class="n">' + p.alreadyHave + '</span><span class="l">already have</span></div>';
    html += '</div>';

    var notes = [];
    if (p.inFileDupes) notes.push(p.inFileDupes + ' repeated inside the file');
    if (p.skipped) notes.push(p.skipped + ' entry' + (p.skipped === 1 ? '' : 'ies') + ' missing a word or meaning');
    if (notes.length) html += '<div class="batch-note">Ignored: ' + notes.join('; ') + '.</div>';

    if (state.words.length === 0){
      html += '<p class="batch-hint">Your library is empty, so everything in the file will be added.</p>';
      html += '<div class="form-actions">';
      html += '<button class="primary" data-action="import-replace">Import ' + p.all.length + ' words</button>';
      html += '<button class="secondary" data-action="import-cancel">Cancel</button>';
      html += '</div></div>';
      return html;
    }

    html += '<p class="batch-hint"><strong>Add new only</strong> keeps your ' + state.words.length +
      ' existing words untouched, along with their boxes and statistics, and brings in just the ' +
      p.fresh.length + ' the file has that you don\u2019t.<br><br>' +
      '<strong>Replace everything</strong> discards your current library and restores the file exactly \u2014 ' +
      'use this when recovering a backup.</p>';

    html += '<div class="form-actions form-actions-stack">';
    html += '<button class="primary" data-action="import-merge"' + (p.fresh.length ? '' : ' disabled') + '>' +
      (p.fresh.length ? 'Add ' + p.fresh.length + ' new word' + (p.fresh.length === 1 ? '' : 's') : 'Nothing new to add') +
      '</button>';
    html += '<button class="secondary" data-action="import-replace">Replace everything (' + p.all.length + ')</button>';
    html += '<button class="secondary" data-action="import-cancel">Cancel</button>';
    html += '</div></div>';
    return html;
  }

  // Only the status line is rewritten, so this can't disturb a form,
  // the search box, or a lesson in progress.
  setInterval(function(){
    if (state.view === 'cards' && !state.sessionActive) refreshSyncLine();
  }, 30000);

  initVoices();

  if (useFirebase){
    // If the SDK can't be fetched (offline before it's been cached, or a
    // blocked network) the import rejects and the app would otherwise render
    // nothing at all. Show what happened instead of a blank screen — and
    // don't silently fall back to local storage, which would present an
    // empty word list and risk edits that never reach the synced copy.
    initFirebase().catch(function(){
      document.getElementById('app').innerHTML =
        '<div class="login-screen">' +
        '<h1>Wordbox</h1>' +
        '<p>Couldn\u2019t reach the sync service. Check your connection and try again.</p>' +
        '<button class="primary" onclick="location.reload()">Retry</button>' +
        '</div>';
    });
  } else {
    loadWords();
  }
})();
</script>
</body>
</html>
