  // ---------- RENDER: LESSON ----------
  function renderLesson(){
    if (state.sessionQueue.length === 0){
      return '<div class="empty-state"><p>Wrapping up\u2026</p></div>';
    }

    var entry = state.sessionQueue[0];
    if (state.lessonKind === 'decl') return renderDeclCard(entry);
    var w = state.words.find(function(x){ return x.id === entry.id; });

    if (entry.dir === 'choice-en' || entry.dir === 'choice-uk'){
      var field = entry.dir === 'choice-en' ? 'back' : 'front';
      // Generated once per card and cached on the queue entry — regenerating
      // per render would reshuffle the buttons under the user's finger.
      if (!entry.options) entry.options = buildOptions(w, field);

      // Read the Ukrainian aloud when the card first appears. Flagged on the
      // queue entry so the many other renders (revealing an answer, the
      // sync line ticking) don't set it off again. A short delay lets the
      // card paint first, and means it doesn't collide with the correct or
      // wrong tone from the previous answer.
      if (entry.dir === 'choice-en' && !entry.spoken && canSpeak()){
        entry.spoken = true;
        setTimeout(function(){ speakUkrainian(w.front); }, 320);
      }

      return renderChoiceCard(w, entry.options, field);
    }
    return renderTypingCard(w);
  }

  // field is the side being ANSWERED: 'back' means the options are English
  // and the prompt is Ukrainian; 'front' is the other way round.
  function renderChoiceCard(w, options, field){
    var answered = state.chosenOption !== null;
    var promptText = field === 'back' ? w.front : w.back;
    var promptLabel = field === 'back' ? 'Which meaning?' : 'Which word?';
    var shakeClass = (answered && !state.wasCorrect) ? ' shake' : '';
    var popClass = (answered && state.wasCorrect) ? ' pop' : '';

    var html = '<div class="review-wrap">';
    html += streakHtml();
    html += feedbackHtml();
    html += '<div class="flashcard choice-card' + shakeClass + popClass + '">';
    html += '<div class="box-dots">' + boxDots(w.box, 'filled', '', null) + '</div>';
    html += '<div class="card-prompt-label">' + promptLabel + '</div>';
    html += '<div class="card-front' + (field === 'front' ? ' is-english' : '') + '">' +
      escapeHtml(promptText) + '</div>';
    html += cardAspectHtml(w);
    // Only on cards where the Ukrainian is the prompt. When the options are
    // Ukrainian they each carry their own speaker instead.
    if (field === 'back') html += speakBtn(w.front);
    // Hint only while the question is open; once answered, notes take over.
    if (!answered && w.hint){
      if (state.hintShown){
        html += '<div class="hint-text">' + escapeHtml(w.hint) + '</div>';
      } else {
        html += '<button class="hint-btn" data-action="show-hint">Need a hint?</button>';
      }
    }
    if (answered && w.notes) html += '<div class="card-notes">' + escapeHtml(w.notes) + '</div>';
    html += '</div>';

    // With "Hide answer options" on, the options start blurred and can't be
    // tapped (or heard) until the reveal button uncovers them, so the answer
    // has to be recalled first rather than recognised.
    var veiled = state.blurOptions && !state.optionsRevealed && !answered;
    if (veiled) html += '<div class="option-veil-wrap">';
    html += '<div class="option-list' + (veiled ? ' is-veiled" inert aria-hidden="true' : '') + '">';
    options.forEach(function(opt, i){
      var cls = 'option-btn';
      var tag = '';
      if (answered){
        var isRight = normalize(opt) === normalize(w[field]);
        var isMine = (i === state.chosenOption);
        if (isRight){
          cls += ' is-correct';
          tag = isMine ? 'your answer \u2713' : 'correct answer';
        } else if (isMine){
          cls += ' is-wrong';
          tag = 'you chose';
        } else {
          cls += ' is-dimmed';
        }
      }
      var optBtn = '<button class="' + cls + '" data-action="choose-option" data-index="' + i + '"' +
        ((answered || veiled) ? ' disabled' : '') + '>' +
        '<span class="option-text">' + escapeHtml(opt) + '</span>' +
        (tag ? '<span class="option-tag">' + tag + '</span>' : '') +
        '</button>';

      // Ukrainian options get their own speaker on the left. Hearing them
      // before answering gives nothing away — all three are Ukrainian — and
      // makes the card double as listening practice.
      if (field === 'front' && canSpeak()){
        html += '<div class="option-row">' + speakBtn(opt, 'on-dark') + optBtn + '</div>';
      } else {
        html += optBtn;
      }
    });
    html += '</div>';
    if (veiled){
      html += '<button class="reveal-btn" data-action="reveal-options">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>' +
        'Show answers</button>';
      html += '</div>';
    }

    if (answered && !state.wasCorrect){
      html += '<button class="primary next-btn" data-action="next-card">Next card</button>';
    }
    html += '</div>';
    return html;
  }

  // Character-level diff for a missed spelling: trims the shared prefix and
  // suffix and highlights what's left, so a single wrong letter stands out
  // instead of the whole word looking wrong.
  // Array.from (not split('')) so combining marks and any non-BMP characters
  // stay attached to their base letter.
  // Characters are compared the way the answer itself is graded, so nothing
  // the grader forgives \u2014 case, apostrophe variant, stress mark \u2014 is ever
  // highlighted as though it were the mistake.
  function sameChar(x, y){
    return normalize(x) === normalize(y);
  }

  // Splits into characters as they are seen rather than as they are stored: a
  // letter keeps the combining marks that follow it, so the accent in \u043D\u0430\u0301
  // is part of that letter and never diffed as a character of its own.
  function chars(str){
    var out = [];
    Array.from(str).forEach(function(c){
      if (out.length && /[\u0300-\u036F]/.test(c)) out[out.length - 1] += c;
      else out.push(c);
    });
    return out;
  }

  function diffPair(typed, correct){
    var A = chars(typed), B = chars(correct);
    var p = 0;
    while (p < A.length && p < B.length && sameChar(A[p], B[p])) p++;
    var s = 0;
    while (s < A.length - p && s < B.length - p &&
           sameChar(A[A.length - 1 - s], B[B.length - 1 - s])) s++;
    return { a: markSpan(A, p, s), b: markSpan(B, p, s) };
  }

  function markSpan(arr, p, s){
    var head = arr.slice(0, p).join('');
    var mid  = arr.slice(p, arr.length - s).join('');
    var tail = arr.slice(arr.length - s).join('');
    return escapeHtml(head) +
      (mid ? '<mark>' + escapeHtml(mid) + '</mark>' : '') +
      escapeHtml(tail);
  }

  function renderTypingCard(w){
    var dotsHtml = boxDots(w.box, 'filled', '', null);
    var shakeClass = (state.checked && !state.wasCorrect) ? ' shake' : '';
    var popClass = (state.checked && state.wasCorrect) ? ' pop' : '';
    var html = '<div class="review-wrap">';
    html += streakHtml();
    html += feedbackHtml();
    html += '<div class="flashcard' + shakeClass + popClass + '">';
    html += '<div class="box-dots">' + dotsHtml + '</div>';
    html += '<div class="card-prompt-label">Type the Ukrainian</div>';
    html += '<div class="card-front">' + escapeHtml(w.back) + '</div>';
    html += cardAspectHtml(w);

    if (!state.checked){
      html += '<input id="typed-input" class="type-input" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Type the word\u2026" value="' + escapeHtml(state.typedValue) + '" />';
      if (w.hint){
        if (state.hintShown){
          html += '<div class="hint-text">' + escapeHtml(w.hint) + '</div>';
        } else {
          html += '<button class="hint-btn" data-action="show-hint">Need a hint?</button>';
        }
      }
      html += '<button class="primary" data-action="check-typed">Check</button>';
    } else {
      html += '<div class="type-feedback ' + (state.wasCorrect ? 'correct' : 'incorrect') + '">';
      html += escapeHtml(state.typedReaction || (state.wasCorrect ? 'Correct!' : 'Not quite.'));
      html += '</div>';
      if (!state.wasCorrect){
        var typed = (state.typedValue || '').trim();
        var d = diffPair(typed, w.front);
        html += '<div class="answer-compare">';
        html += '<div class="compare-row"><span class="compare-label">You typed</span>' +
          '<span class="compare-value is-wrong">' +
          (typed ? d.a : '<em>nothing</em>') + '</span></div>';
        html += '<div class="compare-row"><span class="compare-label">Correct</span>' +
          '<span class="compare-value is-right">' + d.b + '</span></div>';
        html += '</div>';
      }
      html += speakBtn(w.front);
      if (w.notes) html += '<div class="card-notes">' + escapeHtml(w.notes) + '</div>';
      // Correct answers auto-advance; misses wait so the spelling can sink in.
      if (!state.wasCorrect){
        html += '<button class="primary" data-action="next-card">Next card</button>';
      }
    }
    html += '</div></div>';
    return html;
  }

  // Declension card: English sentence, the Ukrainian with a gap, and the
  // dictionary forms of the adjective and noun underneath. You type the
  // preposition + adjective + noun into the gap.
  function renderDeclCard(entry){
    var p = patternById(entry.id);
    var prog = p;
    var sent = parseSentence(p.s[entry.si]);
    var shakeClass = (state.checked && !state.wasCorrect) ? ' shake' : '';
    var popClass = (state.checked && state.wasCorrect) ? ' pop' : '';

    var html = '<div class="review-wrap">';
    html += streakHtml();
    html += feedbackHtml();
    html += '<div class="flashcard' + shakeClass + popClass + '">';
    html += '<div class="box-dots">' + boxDots(prog.box, 'filled', '', null) + '</div>';
    html += '<div class="card-prompt-label">Fill the gap</div>';
    html += '<div class="card-front is-english decl-en">' + escapeHtml(sent.en) + '</div>';

    // Before answering the gap is a blank line; afterwards it holds the
    // correct answer, so the finished sentence reads as a whole.
    html += '<div class="decl-frame">' + escapeHtml(sent.pre) +
      (state.checked
        ? '<span class="decl-gap filled">' + escapeHtml(sent.answers[0]) + '</span>'
        : '<span class="decl-gap">&nbsp;</span>') +
      escapeHtml(sent.post) + '</div>';

    // The dictionary forms sit under the gap on a new card, and stay there
    // after a wrong answer so you can see what the correct form was built from.
    if (!state.checked || !state.wasCorrect){
      html += '<div class="decl-base' + (state.baseUpright ? ' upright' : '') +
        '" data-action="toggle-base-italic">' + escapeHtml(sent.base) + '</div>';
    }

    if (!state.checked){
      html += '<input id="typed-input" class="type-input" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Preposition + adjective + noun…" value="' + escapeHtml(state.typedValue) + '" />';
      if (state.hintShown){
        html += '<div class="hint-text">' + escapeHtml(patternLabel(p)) + '</div>';
      } else {
        html += '<button class="hint-btn" data-action="show-hint">Need a hint?</button>';
      }
      html += '<button class="primary" data-action="check-typed">Check</button>';
    } else {
      html += '<div class="type-feedback ' + (state.wasCorrect ? 'correct' : 'incorrect') + '">';
      html += escapeHtml(state.typedReaction || (state.wasCorrect ? 'Correct!' : 'Not quite.'));
      html += '</div>';
      if (!state.wasCorrect){
        var typed = (state.typedValue || '').trim();
        var d = diffPair(typed, sent.answers[0]);
        html += '<div class="answer-compare">';
        html += '<div class="compare-row"><span class="compare-label">You typed</span>' +
          '<span class="compare-value is-wrong">' + (typed ? d.a : '<em>nothing</em>') + '</span></div>';
        html += '<div class="compare-row"><span class="compare-label">Correct</span>' +
          '<span class="compare-value is-right">' + d.b + '</span></div>';
        html += '</div>';
      }
      html += speakBtn(sent.full);
      html += '<div class="card-notes">' + escapeHtml(patternLabel(p)) + ' · ' + escapeHtml(p.meaning) +
        (p.note ? ' · ' + escapeHtml(p.note) : '') + '</div>';
      if (!state.wasCorrect){
        html += '<button class="primary" data-action="next-card">Next card</button>';
      }
    }
    html += '</div></div>';
    return html;
  }

  function streakHtml(){
    if (state.streak < 2) return '';
    return '<div class="streak-badge' + (state.streak >= 5 ? ' hot' : '') + '">' +
      '<span class="streak-target">\uD83C\uDFAF</span> ' + state.streak + ' correct in a row</div>';
  }

  function feedbackHtml(){
    if (!state.feedback) return '';
    return '<div class="feedback-banner ' + state.feedback.type + '">' +
      escapeHtml(state.feedback.message) + '</div>';
  }

  // Batch entry: step 1 collects Ukrainian, step 2 collects English, so the
  // keyboard only switches once per batch instead of twice per word.
  // Lines may also be pasted as pairs ("зелений = green"), in which case the
  // meaning is pre-filled and step 2 is just a review pass.
  // Separators are deliberately conservative — a bare comma or hyphen is left
  // alone, since meanings legitimately contain both ("to go, to walk").
  // Reads the meaning inputs straight from the DOM. Step 2 deliberately does
  // not re-render while typing, so the fields hold their own values and focus.
  function captureBatchMeanings(){
    document.querySelectorAll('.batch-back-input').forEach(function(inp){
      var i = parseInt(inp.getAttribute('data-idx'), 10);
      if (state.batchItems[i]) state.batchItems[i].back = inp.value;
    });
    document.querySelectorAll('.batch-type-select').forEach(function(sel){
      var i = parseInt(sel.getAttribute('data-idx'), 10);
      // Only a type set by hand is kept. An untouched dropdown is just a
      // guess, and must stay free to change if the line is edited after Back.
      if (state.batchItems[i]) state.batchItems[i].type = (sel.getAttribute('data-touched') === '1') ? sel.value : '';
    });
    document.querySelectorAll('.batch-aspect .seg').forEach(function(seg){
      var i = parseInt(seg.getAttribute('data-idx'), 10);
      var a = seg.getAttribute('data-value');
      if (state.batchItems[i]) state.batchItems[i].aspect = isValidAspect(a) ? a : '';
    });
  }

  // Aspect markers in a pasted line: (pf.) / (impf.) and their longer
  // spellings, plus the Ukrainian dictionary forms (\u0434\u043E\u043A.) / (\u043D\u0435\u0434\u043E\u043A.).
  // Brackets are required, so a meaning that happens to contain these
  // letters is never touched. Allowed on either side of the =.
  var ASPECT_MARK = /\s*\(\s*(pf|perf|perfective|impf|ipf|imperf|imperfective|\u0434\u043E\u043A|\u043D\u0435\u0434\u043E\u043A)\s*\.?\s*\)/gi;

  function takeAspectMark(text, found){
    return text.replace(ASPECT_MARK, function(_, tag){
      var t = tag.toLowerCase();
      found.aspect = (t === 'pf' || t === 'perf' || t === 'perfective' || t === '\u0434\u043E\u043A') ? 'pf' : 'impf';
      return '';
    }).trim();
  }

  function syncBatchAspect(sel){
    var row = sel.closest('.batch-row');
    var wrap = row && row.querySelector('.batch-aspect');
    if (wrap) wrap.hidden = (sel.value !== 'verb');
  }

  function parseBatchLines(raw){
    var existing = {};
    state.words.forEach(function(w){ existing[normalize(w.front)] = true; });

    var previous = {};
    state.batchItems.forEach(function(it){ previous[normalize(it.front)] = it; });

    var items = [], skipped = 0, seen = {};
    raw.split('\n').forEach(function(line){
      if (!line.trim()) return;
      var front = line, back = '';
      var m = line.match(/^(.*?)\s*(?:\t|\s=\s|=|\s[-–—]\s)\s*(.*)$/);
      if (m && m[1].trim() && m[2].trim()){
        front = m[1];
        back = m[2].trim();
      }
      var found = { aspect: '' };
      front = takeAspectMark(front, found);
      back = takeAspectMark(back, found);
      if (!front) return;
      var key = normalize(front);
      if (existing[key] || seen[key]){ skipped++; return; }
      seen[key] = true;
      var item = { front: front, back: back };
      // A marker only makes sense on a verb, so it settles the type too.
      if (found.aspect){ item.type = 'verb'; item.aspect = found.aspect; }
      // Coming back from step 2: keep what was filled in there for any line
      // that's still in the list, unless the line itself now says otherwise.
      var prev = previous[key];
      if (prev){
        if (!item.back && prev.back) item.back = prev.back;
        if (!item.type && prev.type) item.type = prev.type;
        if (!item.aspect && prev.aspect) item.aspect = prev.aspect;
      }
      items.push(item);
    });
    return { items: items, skipped: skipped };
  }

  function renderBatch(){
    var html = '<div class="batch-panel">';

    if (state.batchStep === 1){
      html += '<div class="batch-step">Step 1 of 2 \u00B7 Ukrainian</div>';
      html += promptButtonHtml('words');
      html += '<p class="batch-hint">One word per line. Paste pairs like <em>\u0437\u0435\u043B\u0435\u043D\u0438\u0439 = green</em> and the meanings fill in for you. Mark a verb\u2019s aspect with <em>(pf.)</em> or <em>(impf.)</em>.</p>';
      html += '<textarea id="batch-input" class="batch-textarea" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="\u0437\u0435\u043B\u0435\u043D\u0438\u0439&#10;\u0441\u0438\u043D\u0456\u0439&#10;\u0436\u043E\u0432\u0442\u0438\u0439">' + escapeHtml(state.batchRaw) + '</textarea>';
      html += '<div class="form-actions">';
      html += '<button class="primary" data-action="batch-next">Next</button>';
      html += '<button class="secondary" data-action="cancel-batch">Cancel</button>';
      html += '</div></div>';
      return html;
    }

    html += '<div class="batch-step">Step 2 of 2 \u00B7 English</div>';
    if (state.batchSkipped){
      html += '<div class="batch-note">' + state.batchSkipped + ' skipped \u2014 already in your list.</div>';
    }
    if (state.batchItems.length === 0){
      html += '<p class="batch-hint">Nothing new to add.</p>';
      html += '<div class="form-actions"><button class="secondary" data-action="batch-back">Back</button></div></div>';
      return html;
    }
    html += '<p class="batch-hint">Fill in the meanings. Leave one blank to drop that word.</p>';
    state.batchItems.forEach(function(item, i){
      var guessed = item.type || guessType(item.front, item.back);
      html += '<div class="batch-row">';
      html += '<div class="batch-word">' + escapeHtml(item.front) + '</div>';
      // Meaning and type share the second line rather than forming a literal
      // third column. Three side by side leaves about 120px for typing an
      // English meaning on a phone, which isn't usable.
      html += '<div class="batch-fields">';
      html += '<input class="batch-back-input" data-idx="' + i + '" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="meaning" value="' + escapeHtml(item.back) + '" />';
      html += '<select class="batch-type-select" data-idx="' + i + '" data-touched="' + (item.type ? '1' : '0') + '">';
      WORD_TYPES.forEach(function(o){
        html += '<option value="' + o[0] + '"' + (guessed === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      });
      html += '</select>';
      html += '</div>';
      // Shown only while the row's type is Verb, same as the single form.
      var a = isValidAspect(item.aspect) ? item.aspect : '';
      html += '<div class="batch-aspect"' + (guessed === 'verb' ? '' : ' hidden') + '>';
      html += '<div class="seg" role="radiogroup" aria-label="Aspect of ' + escapeHtml(item.front) + '" data-idx="' + i + '" data-value="' + a + '">';
      ASPECTS.forEach(function(o){
        var on = (o[0] === a);
        html += '<button type="button" class="seg-btn' + (on ? ' on' : '') + '" role="radio" aria-checked="' +
          (on ? 'true' : 'false') + '" data-action="set-aspect-draft" data-value="' + o[0] + '">' + o[1] + '</button>';
      });
      html += '</div></div>';
      html += '</div>';
    });
    html += '<div class="form-actions">';
    html += '<button class="primary" data-action="batch-save">Save ' + state.batchItems.length + ' word' + (state.batchItems.length === 1 ? '' : 's') + '</button>';
    html += '<button class="secondary" data-action="batch-back">Back</button>';
    html += '</div></div>';
    return html;
  }

  // ---------- RENDER: CARDS (manage) ----------
  // Ukrainian collation, so і/ї/є/ґ land in the right places rather than
  // being ordered by raw code point.
  function byName(a, b){
    return a.front.localeCompare(b.front, 'uk');
  }

  // Each field has one ascending comparator; direction is applied by
  // negating it, so asc/desc can never disagree about ordering.
  function cmpField(a, b, field){
    if (field === 'meaning') return a.back.localeCompare(b.back, 'en');
    if (field === 'box')     return a.box - b.box;
    if (field === 'accuracy') return accuracyOf(a) - accuracyOf(b);
    if (field === 'practised') return a.last < b.last ? -1 : a.last > b.last ? 1 : 0;
    if (field === 'added'){
      var ac = a.created || '', bc = b.created || '';   // '' sorts first = oldest
      return ac < bc ? -1 : ac > bc ? 1 : 0;
    }
    return byName(a, b);
  }

  // Only these two can be missing data — a word never practised has no
  // accuracy and no date.
  function hasData(w, field){
    if (field === 'accuracy')  return (w.nRight + w.nWrong) > 0;
    if (field === 'practised') return !!w.last;
    return true;
  }

  var SORT_FIELDS = [
    ['practised', 'Last practised'],
    ['accuracy',  'Accuracy'],
    ['box',       'Box'],
    ['word',      'Word'],
    ['meaning',   'Meaning'],
    ['added',     'Date added']
  ];

  // The direction each field is most useful in when you first pick it:
  // newest practice first, but weakest and lowest-box first.
  var SORT_DEFAULT_DIR = {
    practised: 'desc',
    accuracy:  'asc',
    box:       'asc',
    word:      'asc',
    meaning:   'asc',
    added:     'desc'
  };

  function isValidSort(v){
    return SORT_FIELDS.some(function(o){ return o[0] === v; });
  }
  function isValidDir(v){
    return v === 'asc' || v === 'desc';
  }

  function sortWords(list){
    var field = isValidSort(state.sortBy) ? state.sortBy : 'practised';
    var dir = state.sortDir === 'desc' ? -1 : 1;

    // Words with no history are parked at the end either way. Flipping the
    // direction shouldn't promote them to the top, since "no data" is not a
    // score of zero.
    var scored = [], unscored = [];
    list.forEach(function(w){
      (hasData(w, field) ? scored : unscored).push(w);
    });

    scored.sort(function(a, b){
      return (dir * cmpField(a, b, field)) || byName(a, b);
    });
    unscored.sort(byName);
    return scored.concat(unscored);
  }

  // One form, used in two places: at the top when adding a new word, and
  // expanded inline under a row when editing an existing one. Only ever one
  // is open at a time, so the field ids stay unique.
  // One function for three states — adding, editing, and the read-only view
  // you get by tapping a word. Sharing it guarantees the expanded row looks
  // identical whether or not you're editing; two functions would drift.
  function renderWordForm(word, readOnly){
    var html = '<div class="add-form' + (word ? ' inline-form' : '') + '">';

    if (readOnly){
      html += '<label>Word / phrase</label>' +
        '<div class="ro-field"><span>' + escapeHtml(word.front) + '</span>' +
        speakBtn(word.front, 'on-dark small') + '</div>';
      html += '<label>Meaning</label><div class="ro-field"><span>' + escapeHtml(word.back) + '</span></div>';
      html += '<label>Type</label><div class="ro-field"><span>' + typeLabel(word.type) + '</span></div>';
      if (aspectOf(word)) html += '<label>Aspect</label><div class="ro-field"><span>' +
        (aspectOf(word) === 'pf' ? 'Perfective' : 'Imperfective') + '</span></div>';
      if (word.hint)  html += '<label>Hint</label><div class="ro-field"><span>' + escapeHtml(word.hint) + '</span></div>';
      if (word.notes) html += '<label>Notes</label><div class="ro-field"><span>' + escapeHtml(word.notes) + '</span></div>';
      html += '<div class="form-actions">';
      html += '<button class="secondary" data-action="edit-word" data-id="' + word.id + '">Edit</button>';
      html += '</div>';
    } else {
      html += '<label>Word / phrase</label>';
      html += '<div class="field-with-speak">' +
        '<input id="f-front" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" value="' + (word ? escapeHtml(word.front) : '') + '" placeholder="e.g. \u0437\u0435\u043B\u0435\u043D\u0438\u0439" />' +
        (word ? speakBtn(word.front, 'on-dark small') : '') +
        '</div>';
      html += '<label>Meaning</label><input id="f-back" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" value="' + (word ? escapeHtml(word.back) : '') + '" placeholder="e.g. green" />';
      html += '<label>Type</label><select id="f-type" class="type-select" data-touched="' + (word ? '1' : '0') + '">';
      WORD_TYPES.forEach(function(o){
        var sel = word ? (word.type === o[0]) : (o[0] === 'noun');
        html += '<option value="' + o[0] + '"' + (sel ? ' selected' : '') + '>' + o[1] + '</option>';
      });
      html += '</select>';
      html += '<div class="type-note">Multiple-choice options are drawn from words of the same type.</div>';
      // Always rendered, shown only while Type says Verb, so switching the
      // dropdown back and forth doesn't lose the choice before Save.
      var curAspect = word ? aspectOf(word) : '';
      var typeNow = word ? word.type : 'noun';
      html += '<div id="f-aspect-wrap"' + (typeNow === 'verb' ? '' : ' hidden') + '>';
      html += '<label>Aspect</label>';
      html += '<div id="f-aspect" class="seg" role="radiogroup" aria-label="Aspect" data-value="' + curAspect + '">';
      ASPECTS.forEach(function(o){
        var on = (o[0] === curAspect);
        html += '<button type="button" class="seg-btn' + (on ? ' on' : '') + '" role="radio" aria-checked="' +
          (on ? 'true' : 'false') + '" data-action="set-aspect-draft" data-value="' + o[0] + '">' + o[1] + '</button>';
      });
      html += '</div></div>';
      html += '<label>Hint (optional)</label><input id="f-hint" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" value="' + (word ? escapeHtml(word.hint || '') : '') + '" placeholder="before you answer: a clue, never the word itself" />';
      html += '<label>Notes (optional)</label><textarea id="f-notes" autocorrect="off" spellcheck="false" placeholder="after you answer: gender, example sentence, usage">' + (word ? escapeHtml(word.notes || '') : '') + '</textarea>';
      if (word){
        // Applied on Save with the rest of the form, so Cancel undoes it too.
        html += '<div class="pref-row shelf-row"><span>Shelve this word</span>' +
          '<button type="button" id="f-shelved" class="toggle' + (word.shelved ? ' on' : '') +
          '" data-action="toggle-shelf-draft" aria-pressed="' + (word.shelved ? 'true' : 'false') + '">' +
          '<span class="knob"></span></button></div>';
        html += '<div class="shelf-note">Won\u2019t come up in lessons until you unshelve it. Box, stats and due date are frozen.</div>';
      }
      html += '<div class="form-actions">';
      html += '<button class="primary" data-action="save-word">' + (word ? 'Save changes' : 'Add word') + '</button>';
      html += '<button class="secondary" data-action="cancel-form">Cancel</button>';
      html += '</div>';
    }

    if (word){
      var eAcc = accuracyOf(word);
      html += '<div class="edit-stats">';
      html += '<div class="es-head">Progress</div>';
      html += '<div class="es-grid">';
      html += '<div><span class="n">' + word.box + '<small>/' + MAX_BOX + '</small></span><span class="l">box</span></div>';
      html += '<div><span class="n">' + (eAcc === null ? '\u2014' : eAcc + '%') + '</span><span class="l">accuracy</span></div>';
      html += '<div><span class="n">' + word.nRight + '</span><span class="l">right</span></div>';
      html += '<div><span class="n">' + word.nWrong + '</span><span class="l">wrong</span></div>';
      html += '</div>';
      html += '<div class="es-line">Added: ' +
        escapeHtml(word.created ? sinceLabel(word.created) : 'before this was tracked') + '</div>';
      html += '<div class="es-line">Last practised: ' + escapeHtml(sinceLabel(word.last)) + '</div>';
      if (word.shelved){
        html += '<div class="es-line">Shelved: ' + escapeHtml(sinceLabel(word.shelved)) + ' \u2014 not in lessons</div>';
      } else {
        html += '<div class="es-line">Next due: ' + escapeHtml(word.due <= todayStr() ? 'now' : word.due) + '</div>';
      }
      if (!readOnly) html += '<div class="es-note">Editing the text keeps all of this intact.</div>';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  // How long until a word is next due. Counterpart to sinceLabel, which
  // looks backwards.
  function untilLabel(dateStr){
    if (!dateStr) return 'due now';
    var d = Math.round((new Date(dateStr + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
    if (d <= 0) return 'due now';
    if (d === 1) return 'due tomorrow';
    if (d < 30) return 'due in ' + d + ' days';
    return 'due ' + dateStr;
  }

  // The line under each word reports whatever you're sorting by, so the list
  // answers the question you're currently asking of it.
  function rowMeta(w){
    var acc = accuracyOf(w);
    switch (state.sortBy){
      case 'accuracy':
        if (acc === null) return 'not practised yet';
        return '<span class="stat-acc' + (acc >= 80 ? ' good' : acc < 50 ? ' poor' : '') + '">' +
          acc + '%</span> \u00B7 ' + w.nRight + ' right, ' + w.nWrong + ' wrong';
      case 'practised':
        return w.last ? 'practised ' + sinceLabel(w.last) : 'not practised yet';
      case 'box':
        return 'box ' + w.box + (w.shelved ? '' : ' \u00B7 ' + untilLabel(w.due));
      case 'added':
        return w.created ? 'added ' + sinceLabel(w.created) : 'added before this was tracked';
      default:
        // Sorting by word or meaning is browsing, not reviewing — both are
        // already on the row, so there's nothing useful to add.
        return '';
    }
  }

  // ---------- LIBRARY FILTERS ----------
  // Four groups. Box and type allow several picks (box 1 or 2; nouns or
  // verbs); status and aspect are one at a time. Groups combine with AND.
  var STATUS_FILTERS = [
    ['due',     'Due now'],
    ['trouble', 'Trouble words'],
    ['new',     'Not practised yet'],
    ['active',  'In lessons'],
    ['shelved', 'Shelved']
  ];
  var ASPECT_FILTERS = [['impf', 'Imperfective'], ['pf', 'Perfective'], ['none', 'Not set']];

  // Trouble = answered at least this often, and right less than this share
  // of the time. The minimum keeps one unlucky miss from counting.
  var TROUBLE_MIN_ANSWERS = 3;
  var TROUBLE_MAX_ACCURACY = 60;

  function isTrouble(w){
    var n = w.nRight + w.nWrong;
    return n >= TROUBLE_MIN_ANSWERS && accuracyOf(w) < TROUBLE_MAX_ACCURACY;
  }

  function matchesStatus(w, st){
    if (st === 'due')     return !w.shelved && w.due <= todayStr();
    if (st === 'trouble') return isTrouble(w);
    if (st === 'new')     return (w.nRight + w.nWrong) === 0;
    if (st === 'active')  return !w.shelved;
    if (st === 'shelved') return !!w.shelved;
    return true;
  }

  // Aspect only narrows verbs; any other type picked alongside Verb still
  // shows in full.
  function matchesAspect(w, a){
    if (!a || w.type !== 'verb') return true;
    var wa = aspectOf(w);
    return a === 'none' ? !wa : wa === a;
  }

  function matchesSearch(w){
    if (!state.search) return true;
    // Normalised on both sides, so searching "\u043D\u0430\u0432\u0447\u0430\u043D\u043D\u044F" still finds a card
    // stored as "\u043D\u0430\u0301\u0432\u0447\u0430\u043D\u043D\u044F".
    var q = normalize(state.search);
    return normalize(w.front).indexOf(q) !== -1 || normalize(w.back).indexOf(q) !== -1;
  }

  // skip: leave one group out. Used for the counts on each option, so they
  // say how many words you'd see if you picked it, given everything else.
  function matchesFilters(w, skip){
    var f = state.filters;
    if (skip !== 'boxes'  && f.boxes.length && f.boxes.indexOf(w.box) === -1) return false;
    if (skip !== 'types'  && f.types.length && f.types.indexOf(w.type) === -1) return false;
    if (skip !== 'aspect' && !matchesAspect(w, f.aspect)) return false;
    if (skip !== 'status' && f.status && !matchesStatus(w, f.status)) return false;
    return matchesSearch(w);
  }

  function activeFilterCount(){
    var f = state.filters;
    return (f.boxes.length ? 1 : 0) + (f.types.length ? 1 : 0) + (f.aspect ? 1 : 0) + (f.status ? 1 : 0);
  }

  function labelFor(list, v){
    for (var i = 0; i < list.length; i++) if (list[i][0] === v) return list[i][1];
    return v;
  }

  function filterChipsHtml(){
    var f = state.filters;
    var chips = [];
    function chip(group, text){
      chips.push('<div class="filter-chip">' + escapeHtml(text) +
        ' <button data-action="clear-filter-group" data-group="' + group + '" aria-label="Remove filter: ' + escapeHtml(text) + '">\u2715</button></div>');
    }
    if (f.boxes.length)  chip('boxes', 'Box ' + f.boxes.slice().sort().join(', '));
    if (f.types.length)  chip('types', f.types.map(typeLabel).join(', '));
    if (f.aspect)        chip('aspect', labelFor(ASPECT_FILTERS, f.aspect));
    if (f.status)        chip('status', labelFor(STATUS_FILTERS, f.status));
    if (!chips.length) return '';
    if (chips.length > 1) chips.push('<button class="text-btn" data-action="clear-filters">Clear all</button>');
    return '<div class="filter-chips">' + chips.join('') + '</div>';
  }

  function filterOptHtml(group, value, label, on, n){
    return '<button type="button" class="fopt' + (on ? ' on' : '') + '" data-action="filter-toggle" data-group="' + group +
      '" data-value="' + value + '" aria-pressed="' + (on ? 'true' : 'false') + '"' +
      (n === 0 && !on ? ' disabled' : '') + '>' + label + '<span class="n">' + n + '</span></button>';
  }

  function filterPanelHtml(){
    var f = state.filters;
    function countFor(group, test){
      var n = 0;
      state.words.forEach(function(w){ if (matchesFilters(w, group) && test(w)) n++; });
      return n;
    }
    var html = '<div class="filter-panel">';

    html += '<div class="filter-group-label">Box</div><div class="filter-opts">';
    for (var b = 1; b <= MAX_BOX; b++){
      (function(b){
        html += filterOptHtml('boxes', b, String(b), f.boxes.indexOf(b) !== -1,
          countFor('boxes', function(w){ return w.box === b; }));
      })(b);
    }
    html += '</div>';

    html += '<div class="filter-group-label">Word type</div><div class="filter-opts">';
    WORD_TYPES.forEach(function(o){
      html += filterOptHtml('types', o[0], o[1], f.types.indexOf(o[0]) !== -1,
        countFor('types', function(w){ return w.type === o[0]; }));
    });
    html += '</div>';

    if (f.types.indexOf('verb') !== -1){
      html += '<div class="filter-group-label">Aspect</div><div class="filter-opts">';
      ASPECT_FILTERS.forEach(function(o){
        html += filterOptHtml('aspect', o[0], o[1], f.aspect === o[0],
          countFor('aspect', function(w){ return w.type === 'verb' && matchesAspect(w, o[0]); }));
      });
      html += '</div>';
      if (f.types.length > 1) html += '<div class="filter-note">Aspect only narrows the verbs.</div>';
    }

    html += '<div class="filter-group-label">Status</div><div class="filter-opts">';
    STATUS_FILTERS.forEach(function(o){
      html += filterOptHtml('status', o[0], o[1], f.status === o[0],
        countFor('status', function(w){ return matchesStatus(w, o[0]); }));
    });
    html += '</div>';
    html += '<div class="filter-note">Trouble words: answered ' + TROUBLE_MIN_ANSWERS +
      ' times or more, and right less than ' + TROUBLE_MAX_ACCURACY + '% of the time.</div>';

    html += '<div class="filter-actions">' +
      (activeFilterCount() ? '<button class="text-btn" data-action="clear-filters">Clear all</button>' : '<span></span>') +
      '<button class="secondary" data-action="toggle-filter-panel">Done</button></div>';
    html += '</div>';
    return html;
  }

  function kindSwitchHtml(){
    var k = state.libKind;
    return '<div class="seg kind-switch" role="radiogroup" aria-label="Show">' +
      '<button class="seg-btn' + (k === 'vocab' ? ' on' : '') + '" role="radio" aria-checked="' + (k === 'vocab') +
        '" data-action="set-kind" data-kind="vocab">Vocab</button>' +
      '<button class="seg-btn' + (k === 'decl' ? ' on' : '') + '" role="radio" aria-checked="' + (k === 'decl') +
        '" data-action="set-kind" data-kind="decl">Declension</button>' +
      '</div>';
  }

  // Mini card shown under the sentence form, updated as you type, so the
  // gap is visible exactly where the lesson will put it.
  function sentPreviewHtml(en, uk, base){
    var problem = uk.trim() ? gapProblem(uk) : '';
    var html = '<div class="sent-preview-label">Preview</div>';
    html += '<div class="sent-preview">';
    html += '<div class="sp-en">' + (en.trim() ? escapeHtml(en) : '<em>English sentence</em>') + '</div>';
    var sent = parseSentence({ en: en, uk: uk, base: base });
    if (sent){
      html += '<div class="sp-uk">' + escapeHtml(sent.pre) + '<span class="decl-gap">&nbsp;</span>' + escapeHtml(sent.post) + '</div>';
      html += '<div class="sp-answer">Answer: <strong>' + escapeHtml(sent.answers.join(' / ')) + '</strong></div>';
    } else {
      html += '<div class="sp-uk"><em>' + (uk.trim() ? escapeHtml(uk) : 'Ukrainian with the [gap]') + '</em></div>';
    }
    if (base.trim()) html += '<div class="decl-base">' + escapeHtml(base) + '</div>';
    html += '</div>';
    if (problem) html += '<div class="form-error">' + escapeHtml(problem) + '</div>';
    return html;
  }

  function renderSentenceForm(s){
    s = s || { en: '', uk: '', base: '' };
    var html = '<div class="add-form inline-form sent-form">';
    html += '<label for="f-s-en">English</label>';
    html += '<input id="f-s-en" type="text" autocomplete="off" placeholder="After a long day I rest." value="' + escapeHtml(s.en) + '" />';
    html += '<label for="f-s-uk">Ukrainian, with the part to type in [square brackets]</label>';
    html += '<input id="f-s-uk" type="text" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" placeholder="[Після довгого дня] я відпочиваю." value="' + escapeHtml(s.uk) + '" />';
    html += '<div class="type-note">A second right answer can go after a | inside the brackets: [доброму вчителеві|доброму вчителю]</div>';
    html += '<label for="f-s-base">Dictionary forms (optional)</label>';
    html += '<input id="f-s-base" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="довгий · день" value="' + escapeHtml(s.base) + '" />';
    html += '<div id="s-preview">' + sentPreviewHtml(s.en, s.uk, s.base) + '</div>';
    html += '<div class="form-actions">';
    html += '<button class="primary" data-action="save-sentence">OK</button>';
    html += '<button class="secondary" data-action="cancel-sentence">Cancel</button>';

    return html;
  }

  function renderSentBatch(){
    var html = '<div class="add-form inline-form sent-form">';
    html += '<p class="batch-hint">One sentence per line: <em>English = Ukrainian with [gap] = dictionary forms</em>. The forms are optional.</p>';
    html += promptButtonHtml('sentences', state.sentBatchPid);
    if (state.sentBatchNote) html += '<div class="batch-note">' + escapeHtml(state.sentBatchNote) + '</div>';
    html += '<textarea id="sent-batch-input" class="batch-textarea" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="After a long day I rest. = [Після довгого дня] я відпочиваю. = довгий · день">' +
      escapeHtml(state.sentBatchRaw) + '</textarea>';
    html += '<div class="form-actions">';
    html += '<button class="primary" data-action="save-sent-batch">Add sentences</button>';
    html += '<button class="secondary" data-action="cancel-sent-batch">Cancel</button>';
    html += '</div></div>';
    return html;
  }

  // Splits pasted lines into sentences. Lines that don't work stay behind,
  // with the reason, so they can be fixed and added again.
  function parseSentBatch(raw){
    var good = [], bad = [];
    raw.split('\n').forEach(function(line, n){
      if (!line.trim()) return;
      var parts = line.split(/\s*(?:\t|=)\s*/);
      var en = (parts[0] || '').trim(), uk = (parts[1] || '').trim(), base = parts.slice(2).join(' ').trim();
      var why = !uk ? 'needs English = Ukrainian' : !en ? 'no English' : gapProblem(uk);
      if (why) bad.push({ line: line, why: 'Line ' + (n + 1) + ': ' + why.replace(/\.$/, '') });
      else good.push({ en: en, uk: uk, base: base });
    });
    return { good: good, bad: bad };
  }

  // The pattern's own fields (no buttons). Shared by Add a pattern and by
  // editing an open pattern, so both look the same.
  function patternFieldsHtml(p){
    var isNew = !p;
    p = p || { prep: '', c: 'gen', accept: [], meaning: '', note: '' };
    // Only the extras: the variants in the Preposition field always count.
    var own = prepVariants(p.prep).map(normalize);
    var acceptShown = p.accept.filter(function(x){ return own.indexOf(normalize(x)) === -1; }).join(', ');
    // Typed but not yet saved: kept across the re-renders that adding or
    // editing a sentence causes while the pattern is open for editing.
    var d = state.patDraft;
    if (d && d.id === (isNew ? 'new' : p.id)){
      p = { prep: d.prep, c: d.c, accept: [], meaning: d.meaning, note: d.note };
      acceptShown = d.accept;
    }
    var html = '<label for="f-p-prep">Preposition</label>';
    html += '<input id="f-p-prep" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="у / в" value="' + escapeHtml(p.prep) + '" />';
    html += '<label for="f-p-case">Case</label>';
    html += '<select id="f-p-case" class="type-select">';
    DECL_CASE_ORDER.forEach(function(c){
      html += '<option value="' + c + '"' + (p.c === c ? ' selected' : '') + '>' + DECL_CASES[c].en + ' · ' + DECL_CASES[c].uk + '</option>';
    });
    html += '</select>';
    html += '<label for="f-p-meaning">Meaning</label>';
    html += '<input id="f-p-meaning" type="text" autocomplete="off" placeholder="in, at (where?)" value="' + escapeHtml(p.meaning) + '" />';
    html += '<label for="f-p-accept">Other accepted spellings (optional)</label>';
    html += '<input id="f-p-accept" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="e.g. із, зі" value="' + escapeHtml(acceptShown) + '" />';
    html += '<div class="type-note">Separated by commas. Any of them counts as right at the start of the gap. ' +
      'Variants written with / in the Preposition field (у / в) always count.</div>';
    html += '<label for="f-p-note">Note (optional)</label>';
    html += '<input id="f-p-note" type="text" autocomplete="off" placeholder="Shown after answering" value="' + escapeHtml(p.note) + '" />';
    return html;
  }

  // Add a pattern, at the top of the list.
  function renderPatternForm(){
    var html = '<div class="add-form">';
    html += patternFieldsHtml(null);
    html += '<div class="form-actions">';
    html += '<button class="primary" data-action="save-pattern">Add pattern</button>';
    html += '<button class="secondary" data-action="cancel-pattern">Cancel</button>';
    html += '</div></div>';
    return html;
  }

  // ---------- AI PROMPTS FOR "ADD SEVERAL" ----------
  // Each Add several panel has a button that copies one of these. Paste it
  // into any AI chat, add what you need at the end, and its answer comes
  // back in exactly the format the panel reads, checked against the
  // library's conventions.
  var PROMPT_CLOSE = [
    '',
    'Output:',
    '- Before the code block, list briefly anything you corrected or changed in my input (original → corrected) and anything you weren’t sure about or couldn’t translate reliably (or say “No corrections”). If you’re not sure, say so: never guess silently.',
    '- Then put the finished lines in ONE plain code block, with nothing else inside it: no numbering, no bullets, no headings, no comments.'
  ];

  var SENTENCE_RULES = [
    'Rules for every sentence:',
    '- Short, everyday and easy: simple vocabulary, about A2–B1 level, one clause where possible.',
    '- The gap contains exactly the preposition + one adjective + one noun, nothing else. The adjective and noun must be in the case that the preposition requires in that meaning.',
    '- Vary the noun across the sentences: masculine, feminine, neuter and plural.',
    '- The English must be a natural translation of the Ukrainian and must not give away which case is needed.',
    '- If two endings are both correct standard Ukrainian (e.g. dative -ові / -у: доброму вчителеві / доброму вчителю), put both inside the gap separated by |, the more common one first.',
    '- Use natural, modern standard Ukrainian. No Russianisms, no surzhyk. Prefer the forms Ukrainian style guides recommend.',
    '- Check the grammar of every sentence carefully, especially the case endings of the adjective and noun, and the choice of у / в and з / із / зі for euphony.',
    '- No stress marks. Use the Ukrainian apostrophe ’ (п’ять, дерев’яний).',
    '',
    'Sentence line format (one sentence per line):',
    'English sentence = Ukrainian sentence with the [gap in square brackets] = adjective · noun',
    '- Exactly one pair of square brackets per line, around the gap.',
    '- The last part gives the dictionary forms of the adjective and noun in the gap, separated by · : the adjective in the masculine nominative singular, the noun in the nominative singular (nouns that only exist in the plural, like двері or канікули, stay plural).',
    '- Use “ = ” (with spaces) only as the separator, never inside a sentence.'
  ];

  function promptForWords(){
    return [
      'You are helping me add Ukrainian vocabulary to my flashcard app (my reference language is English). Return the entries ready to paste into the app’s “Add several” box.',
      '',
      'I may give you:',
      '- Ukrainian words or phrases, with or without English meanings (possibly misspelled or in inflected forms)',
      '- English words I want translated into Ukrainian',
      '- a Ukrainian text or screenshot to pull vocabulary from',
      '- a topic (“15 words about cooking”)',
      '',
      'Check and correct each entry:',
      '- Fix any spelling and grammar mistakes, in the Ukrainian and in the English.',
      '- If I gave a meaning, check that it is right and fix it if not. If I didn’t, add a short, common English meaning. The English should sound natural, not like a literal translation.',
      '- Verbs: the infinitive (читати, not читаю). Prefer the imperfective: if I give a perfective verb, switch to its imperfective partner, unless the meanings differ or there isn’t one. Keep reflexive verbs with -ся (вчитися). Every verb line ends with (impf.) or (pf.). English verb meanings start with “to”.',
      '- Nouns: the nominative singular (nouns that only exist in the plural, like двері or гроші, stay plural).',
      '- Adjectives: the masculine nominative singular (зелений, not зелена).',
      '- Adverbs: turn them into the adjective when one exists (швидко → швидкий). Keep the adverb only if there is no matching adjective (завжди, тут).',
      '- Phrases and whole sentences are learned as they are, so the rules above don’t apply to them: just correct them. Each phrase must end with ? or ! (! for anything that isn’t a question): that is how the app recognises a phrase. If an entry works better as a phrase than as a single word, suggest that.',
      '- Use natural, modern standard Ukrainian, and prefer casual, everyday words over formal or bookish ones. No Russian words, no surzhyk. No stress marks. Use the Ukrainian apostrophe ’ (ім’я).',
      '- Several close English meanings can share a line, separated by commas (швидкий = fast, quick). If a word has two very different meanings, give the more common one and mention the other above the code block.',
      '',
      'Line format: ukrainian = english',
      '- Ukrainian always comes first, even when I give you English words. The divider is always “ = ” (space, equals sign, space).',
      '',
      'Example. My input: говорю, сказати, швидко, гарна, квартири, вчусь, як справи',
      'Your lines:',
      'говорити = to speak, to talk (impf.)',
      'казати = to say, to tell (impf.)',
      'швидкий = fast, quick',
      'гарний = beautiful, pretty, nice',
      'квартира = apartment, flat',
      'вчитися = to study, to learn (impf.)',
      'Як справи? = How are you?'
    ].concat(PROMPT_CLOSE, ['', 'Here is my list:', '']).join('\n');
  }

  function promptForSentences(p){
    var lines = [
      'You are helping me write practice sentences for my Ukrainian flashcard app. Each card shows a short English sentence and the Ukrainian translation with a gap; I type the missing preposition + adjective + noun, to practise the case endings.',
      '',
      'The pattern: ' + patternLabel(p) + (p.meaning ? ' (' + p.meaning + ')' : '') + '.'
    ];
    if (p.accept.length > 1) lines.push('Accepted spellings of the preposition: ' + p.accept.join(', ') + '.');
    if (p.note) lines.push('Note: ' + p.note);
    lines.push('', 'Write 4 new sentences for this pattern unless I ask for a different number, or check and reformat the sentences I give you (in Ukrainian, or in English for you to translate). First check that ' +
      (p.prep || 'the preposition') + ' really takes the ' + DECL_CASES[p.c].en + ' in this meaning, and tell me if not.', '');
    lines = lines.concat(SENTENCE_RULES);
    var ex = p.s.length ? p.s[0] : null;
    lines.push('', 'Example:', ex
      ? ex.en + ' = ' + ex.uk + (ex.base ? ' = ' + ex.base : '')
      : 'We walk along the wide river. = Ми гуляємо [вздовж широкої річки]. = широкий · річка');
    if (p.s.length > 1){
      lines.push('', 'Sentences I already have for this pattern (don’t repeat them or their adjective + noun pairs):');
      p.s.forEach(function(s){ lines.push(s.en + ' = ' + s.uk); });
    }
    return lines.concat(PROMPT_CLOSE, ['', 'What I need:', '']).join('\n');
  }

  function promptForPatterns(){
    var have = state.patterns.map(function(p){ return patternLabel(p); });
    var lines = [
      'You are helping me add preposition patterns to my Ukrainian flashcard app. A pattern is one preposition + the case it takes in one meaning. Each pattern has practice sentences: the card shows a short English sentence and the Ukrainian translation with a gap, and I type the missing preposition + adjective + noun, to practise the case endings.',
      '',
      'Write the patterns I ask for, each with 4 sentences unless I ask for a different number, or check and reformat the ones I give you.',
      '',
      'Pattern header line (one per pattern):',
      '# preposition + Case = English meaning | also: other spellings | note: short note',
      '- Case is exactly one of: Genitive, Dative, Accusative, Instrumental, Locative.',
      '- Spelling variants that alternate for euphony go in the preposition, separated by “ / ”: у / в, з / із / зі, о / об.',
      '- Synonyms that should also count as right go after “also:”, separated by commas (# біля + Genitive = near, next to | also: коло, близько).',
      '- “also” and “note” are optional; leave them out when there’s nothing to say. A note is shown after answering, so keep it to a few words.',
      '- The same preposition with two cases is two patterns (на + Accusative = onto (where to?) and на + Locative = on (where?)). Say “where to?” / “where?” in the meaning when that is the difference.',
      '- Check that the preposition really takes that case in that meaning in modern standard Ukrainian, and correct me if not (for example, по “along, around” takes the Locative, not the Dative).',
      '',
      'Under each header line, its sentences, one per line. Leave a blank line between patterns.',
      ''
    ].concat(SENTENCE_RULES, [
      '',
      'Example:',
      '# вздовж + Genitive = along | also: уздовж',
      'We walk along the wide river. = Ми гуляємо [вздовж широкої річки]. = широкий · річка',
      'Trees grow along the old road. = [Вздовж старої дороги] ростуть дерева. = старий · дорога',
      '',
      '# повз + Accusative = past',
      'We drove past the old church. = Ми проїхали [повз стару церкву]. = старий · церква'
    ]);
    if (have.length){
      lines.push('', 'Patterns I already have (if you add sentences to one of these, write its header exactly like this and they’ll be added to it):');
      lines.push(have.join('; '));
    }
    return lines.concat(PROMPT_CLOSE, ['', 'What I need:', '']).join('\n');
  }

  function promptButtonHtml(kind, pid){
    return '<button type="button" class="copy-prompt-btn" data-action="copy-prompt" data-kind="' + kind + '"' +
      (pid ? ' data-id="' + pid + '"' : '') + '>' + ICONS.clipboard +
      '<span>Copy AI prompt</span></button>' +
      '<div class="copy-prompt-note">Paste it into an AI chat, add what you need, and paste its answer back here.</div>';
  }

  // Clipboard API first; the hidden-textarea route covers older Safari and
  // anything opened over plain http.
  function copyText(text){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      return Promise.resolve(ok);
    }
    if (navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(text).then(function(){ return true; }, fallback);
    }
    return fallback();
  }

  // ---------- ADD SEVERAL PATTERNS ----------
  // One paste can hold any number of patterns with their sentences:
  //
  //   # вздовж + Genitive = along | also: уздовж | note: usually with places
  //   We walk along the wide river. = Ми гуляємо [вздовж широкої річки]. = широкий · річка
  //   Trees grow along the old road. = [Вздовж старої дороги] ростуть дерева. = старий · дорога
  //
  //   # повз + Accusative = past
  //   ...
  //
  // A # line starts a pattern; the lines under it are its sentences, in the
  // same format as a pattern's own Add several. A pattern you already have
  // (same preposition and case) isn't duplicated: its new sentences are
  // added to it, and its progress stays.
  function caseFromName(x){
    var n = normalize(x).replace(/\.$/, '');
    var map = [['gen', 'gen'], ['род', 'gen'], ['dat', 'dat'], ['дав', 'dat'],
      ['acc', 'acc'], ['зна', 'acc'], ['ins', 'ins'], ['ору', 'ins'],
      ['loc', 'loc'], ['prep', 'loc'], ['міс', 'loc']];
    for (var i = 0; i < map.length; i++) if (n.indexOf(map[i][0]) === 0) return map[i][1];
    return null;
  }

  function parsePatternHeader(line){
    var parts = line.replace(/^#+\s*/, '').split('|');
    var head = parts[0];
    var eq = head.indexOf('=');
    var left = (eq === -1 ? head : head.slice(0, eq)).trim();
    var meaning = eq === -1 ? '' : head.slice(eq + 1).trim();
    var plus = left.lastIndexOf('+');
    if (plus === -1) return { why: 'write it as # preposition + Case = meaning' };
    var prep = left.slice(0, plus).trim();
    var c = caseFromName(left.slice(plus + 1).trim());
    if (!prep) return { why: 'no preposition before the +' };
    if (!c) return { why: 'the case must be Genitive, Dative, Accusative, Instrumental or Locative' };
    var accept = prepVariants(prep), note = '';
    parts.slice(1).forEach(function(opt){
      var m = opt.match(/^\s*(also|note)\s*:\s*(.*)$/i);
      if (!m) return;
      if (m[1].toLowerCase() === 'note') note = m[2].trim();
      else m[2].split(',').forEach(function(a){
        a = a.trim();
        if (a && accept.map(normalize).indexOf(normalize(a)) === -1) accept.push(a);
      });
    });
    return { prep: prep, c: c, meaning: meaning, accept: accept, note: note };
  }

  function parsePatternBatch(raw){
    var groups = [], errors = [], cur = null, curBroken = false;
    raw.split('\n').forEach(function(line, n){
      if (!line.trim()) return;
      var where = 'Line ' + (n + 1) + ': ';
      if (/^\s*#/.test(line)){
        var h = parsePatternHeader(line.trim());
        if (h.why){ errors.push(where + h.why); cur = null; curBroken = true; return; }
        cur = h; cur.sentences = []; curBroken = false;
        groups.push(cur);
        return;
      }
      if (!cur){
        // Sentences under a header that couldn't be read are skipped quietly:
        // the header's own error already says what to fix.
        if (!curBroken) errors.push(where + 'a sentence before any # pattern line');
        return;
      }
      var r = parseSentBatch(line);
      if (r.bad.length) errors.push(where + r.bad[0].why.replace(/^Line \d+: /, ''));
      else cur.sentences.push(r.good[0]);
    });

    // Patterns named twice in one paste become one.
    var merged = [], byKey = {};
    groups.forEach(function(g){
      var k = patternKey(g);
      if (byKey[k]){
        byKey[k].sentences = byKey[k].sentences.concat(g.sentences);
        g.accept.forEach(function(a){ if (byKey[k].accept.indexOf(a) === -1) byKey[k].accept.push(a); });
        if (!byKey[k].meaning) byKey[k].meaning = g.meaning;
        if (!byKey[k].note) byKey[k].note = g.note;
      } else { byKey[k] = g; merged.push(g); }
    });

    // Match against the library, and drop sentences already there.
    merged.forEach(function(g){
      var have = {};
      g.existing = null;
      state.patterns.forEach(function(p){ if (patternKey(p) === patternKey(g)) g.existing = p; });
      if (g.existing) g.existing.s.forEach(function(s){ have[normalize(s.uk)] = true; });
      var kept = [];
      g.dupes = 0;
      g.sentences.forEach(function(s){
        var k = normalize(s.uk);
        if (have[k]) { g.dupes++; return; }
        have[k] = true; kept.push(s);
      });
      g.sentences = kept;
    });
    return { groups: merged, errors: errors };
  }

  function renderPatternBatch(){
    var html = '<div class="batch-panel">';
    if (state.patBatchStep === 1){
      html += '<div class="batch-step">Add several patterns \u00B7 Step 1 of 2</div>';
      html += promptButtonHtml('patterns');
      html += '<p class="batch-hint">Start each pattern with a line like ' +
        '<em># вздовж + Genitive = along | also: уздовж | note: …</em> ' +
        '(also and note are optional). Under it, one sentence per line: ' +
        '<em>English = Ukrainian with [gap] = forms</em>. A pattern you already have gets the new sentences added.</p>';
      html += '<textarea id="pat-batch-input" class="batch-textarea pat-batch" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="# вздовж + Genitive = along&#10;We walk along the river. = Ми гуляємо [вздовж широкої річки]. = широкий · річка">' +
        escapeHtml(state.patBatchRaw) + '</textarea>';
      html += '<div class="form-actions">';
      html += '<button class="primary" data-action="pat-batch-next">Next</button>';
      html += '<button class="secondary" data-action="cancel-pat-batch">Cancel</button>';
      html += '</div></div>';
      return html;
    }

    var res = parsePatternBatch(state.patBatchRaw);
    var nNew = 0, nExt = 0, nSent = 0, nDupes = 0;
    res.groups.forEach(function(g){
      if (g.existing){ if (g.sentences.length) nExt++; } else nNew++;
      nSent += g.sentences.length;
      nDupes += g.dupes;
    });
    html += '<div class="batch-step">Add several patterns · Step 2 of 2</div>';
    html += '<div class="import-summary">';
    html += '<div><span class="n">' + nNew + '</span><span class="l">new patterns</span></div>';
    html += '<div><span class="n">' + nExt + '</span><span class="l">added to</span></div>';
    html += '<div><span class="n">' + nSent + '</span><span class="l">sentences</span></div>';
    html += '</div>';
    if (res.errors.length){
      html += '<div class="batch-note batch-errors"><strong>' + res.errors.length +
        (res.errors.length === 1 ? ' line' : ' lines') + ' won’t be added.</strong> Go Back to fix ' +
        (res.errors.length === 1 ? 'it' : 'them') + ', or add the rest without.<ul>' +
        res.errors.map(function(e){ return '<li>' + escapeHtml(e) + '</li>'; }).join('') + '</ul></div>';
    }
    if (nDupes){
      html += '<div class="batch-note">' + nDupes + (nDupes === 1 ? ' sentence is' : ' sentences are') +
        ' already in your library and will be skipped.</div>';
    }
    res.groups.forEach(function(g){
      html += '<div class="pb-group">';
      html += '<div class="pb-head"><span class="pb-name">' + escapeHtml(patternLabel(g)) + '</span>' +
        '<span class="pb-tag' + (g.existing ? '' : ' is-new') + '">' + (g.existing ? 'already have' : 'new') + '</span></div>';
      if (g.meaning && !g.existing) html += '<div class="pb-meaning">' + escapeHtml(g.meaning) +
        (g.accept.length > 1 ? ' · accepts ' + escapeHtml(g.accept.join(', ')) : '') + '</div>';
      if (!g.sentences.length){
        html += '<div class="pb-meaning">' + (g.existing ? 'Nothing new to add.' : 'No sentences yet — it won’t be in lessons until you add some.') + '</div>';
      }
      g.sentences.forEach(function(s){
        var sent = parseSentence(s);
        html += '<div class="pattern-sent"><div class="ps-text"><div class="ps-uk">' + sentenceHtml(sent) + '</div>' +
          '<div class="ps-en">' + escapeHtml(s.en) + (s.base ? ' · <em>' + escapeHtml(s.base) + '</em>' : '') + '</div></div></div>';
      });
      html += '</div>';
    });
    var nothing = !nNew && !nSent;
    html += '<div class="form-actions">';
    html += '<button class="primary" data-action="pat-batch-save"' + (nothing ? ' disabled' : '') + '>' +
      (nothing ? 'Nothing to add' : 'Add') + '</button>';
    html += '<button class="secondary" data-action="pat-batch-back">Back</button>';
    html += '<button class="secondary" data-action="cancel-pat-batch">Cancel</button>';
    html += '</div></div>';
    return html;
  }

  function patternMatches(p, q){
    if (!q) return true;
    var hay = [p.prep, p.meaning, p.note, DECL_CASES[p.c].en, DECL_CASES[p.c].uk].concat(p.accept);
    p.s.forEach(function(s){ hay.push(s.en, s.uk.replace(/[\[\]|]/g, ' '), s.base); });
    return normalize(hay.join(' \u0000 ')).indexOf(q) !== -1;
  }

  // ---------- PATTERN LIBRARY: SORT & FILTER ----------
  // Same controls as the word list. Sorting by case keeps the case headings;
  // any other order is one flat list, since a heading per case would split it.
  var DSORT_FIELDS = [
    ['case',      'Case'],
    ['practised', 'Last practised'],
    ['accuracy',  'Accuracy'],
    ['box',       'Box'],
    ['prep',      'Preposition'],
    ['added',     'Date added']
  ];
  var DSORT_DEFAULT_DIR = { 'case': 'asc', practised: 'desc', accuracy: 'asc', box: 'asc', prep: 'asc', added: 'desc' };
  function isValidDSort(v){ return DSORT_FIELDS.some(function(o){ return o[0] === v; }); }

  var DSTATUS_FILTERS = [
    ['due',      'Due now'],
    ['trouble',  'Trouble patterns'],
    ['new',      'Not practised yet'],
    ['active',   'In lessons'],
    ['shelved',  'Shelved'],
    ['empty',    'No sentences']
  ];

  function patMatchesStatus(p, st){
    if (st === 'due')     return !p.shelved && p.s.length > 0 && p.due <= todayStr();
    if (st === 'trouble') return isTrouble(p);
    if (st === 'new')     return (p.nRight + p.nWrong) === 0;
    if (st === 'active')  return !p.shelved && p.s.length > 0;
    if (st === 'shelved') return !!p.shelved;
    if (st === 'empty')   return p.s.length === 0;
    return true;
  }

  function patMatchesFilters(p, skip){
    var f = state.declFilters;
    if (skip !== 'boxes' && f.boxes.length && f.boxes.indexOf(p.box) === -1) return false;
    if (skip !== 'cases' && f.cases.length && f.cases.indexOf(p.c) === -1) return false;
    if (skip !== 'status' && f.status && !patMatchesStatus(p, f.status)) return false;
    return patternMatches(p, normalize(state.declSearch));
  }

  function declFilterCount(){
    var f = state.declFilters;
    return (f.boxes.length ? 1 : 0) + (f.cases.length ? 1 : 0) + (f.status ? 1 : 0);
  }

  function patByName(a, b){
    return normalize(a.prep).localeCompare(normalize(b.prep), 'uk') ||
      DECL_CASE_ORDER.indexOf(a.c) - DECL_CASE_ORDER.indexOf(b.c);
  }

  function sortPatterns(list){
    var field = isValidDSort(state.declSortBy) ? state.declSortBy : 'case';
    var dir = state.declSortDir === 'desc' ? -1 : 1;
    function cmp(a, b){
      switch (field){
        case 'case':      return (DECL_CASE_ORDER.indexOf(a.c) - DECL_CASE_ORDER.indexOf(b.c)) || patByName(a, b);
        case 'practised': return a.last < b.last ? -1 : a.last > b.last ? 1 : 0;
        case 'accuracy':  return accuracyOf(a) - accuracyOf(b);
        case 'box':       return (a.box - b.box) || (a.due < b.due ? -1 : a.due > b.due ? 1 : 0);
        case 'prep':      return patByName(a, b);
        case 'added':     return (a.created || '') < (b.created || '') ? -1 : (a.created || '') > (b.created || '') ? 1 : 0;
      }
      return 0;
    }
    // As with words: no history parks at the end whichever way you sort.
    var scored = [], unscored = [];
    list.forEach(function(p){
      var has = field === 'accuracy' ? (p.nRight + p.nWrong) > 0 : field === 'practised' ? !!p.last : true;
      (has ? scored : unscored).push(p);
    });
    scored.sort(function(a, b){ return (dir * cmp(a, b)) || patByName(a, b); });
    unscored.sort(patByName);
    return scored.concat(unscored);
  }

  // The line under each pattern answers whatever you're sorting by.
  function patRowMeta(p){
    var acc = accuracyOf(p);
    var n = p.s.length + (p.s.length === 1 ? ' sentence' : ' sentences');
    if (!p.s.length) return '<span class="shelf-tag">no sentences yet</span>';
    switch (state.declSortBy){
      case 'accuracy':
        if (acc === null) return 'not practised yet';
        return '<span class="stat-acc' + (acc >= 80 ? ' good' : acc < 50 ? ' poor' : '') + '">' +
          acc + '%</span> · ' + p.nRight + ' right, ' + p.nWrong + ' wrong';
      case 'practised':
        return p.last ? 'practised ' + sinceLabel(p.last) : 'not practised yet';
      case 'box':
        return 'box ' + p.box + (p.shelved ? '' : ' · ' + untilLabel(p.due));
      case 'added':
        return p.created ? 'added ' + sinceLabel(p.created) : 'added before this was tracked';
      default:
        return (p.shelved ? '' : (p.last ? untilLabel(p.due) : 'new') + ' · ') + n;
    }
  }

  function dfilterOptHtml(group, value, label, on, n){
    return '<button type="button" class="fopt' + (on ? ' on' : '') + '" data-action="dfilter-toggle" data-group="' + group +
      '" data-value="' + value + '" aria-pressed="' + (on ? 'true' : 'false') + '"' +
      (n === 0 && !on ? ' disabled' : '') + '>' + label + '<span class="n">' + n + '</span></button>';
  }

  function declFilterPanelHtml(){
    var f = state.declFilters;
    function countFor(group, test){
      var n = 0;
      state.patterns.forEach(function(p){ if (patMatchesFilters(p, group) && test(p)) n++; });
      return n;
    }
    var html = '<div class="filter-panel">';
    html += '<div class="filter-group-label">Box</div><div class="filter-opts">';
    for (var b = 1; b <= MAX_BOX; b++){
      (function(b){
        html += dfilterOptHtml('boxes', b, String(b), f.boxes.indexOf(b) !== -1, countFor('boxes', function(p){ return p.box === b; }));
      })(b);
    }
    html += '</div>';
    html += '<div class="filter-group-label">Case</div><div class="filter-opts">';
    DECL_CASE_ORDER.forEach(function(c){
      html += dfilterOptHtml('cases', c, DECL_CASES[c].en, f.cases.indexOf(c) !== -1, countFor('cases', function(p){ return p.c === c; }));
    });
    html += '</div>';
    html += '<div class="filter-group-label">Status</div><div class="filter-opts">';
    DSTATUS_FILTERS.forEach(function(o){
      html += dfilterOptHtml('status', o[0], o[1], f.status === o[0], countFor('status', function(p){ return patMatchesStatus(p, o[0]); }));
    });
    html += '</div>';
    html += '<div class="filter-note">Trouble patterns: answered ' + TROUBLE_MIN_ANSWERS +
      ' times or more, and right less than ' + TROUBLE_MAX_ACCURACY + '% of the time.</div>';
    html += '<div class="filter-actions">' +
      (declFilterCount() ? '<button class="text-btn" data-action="dclear-filters">Clear all</button>' : '<span></span>') +
      '<button class="secondary" data-action="toggle-dfilter-panel">Done</button></div>';
    html += '</div>';
    return html;
  }

  function declFilterChipsHtml(){
    var f = state.declFilters, chips = [];
    function chip(group, text){
      chips.push('<div class="filter-chip">' + escapeHtml(text) +
        ' <button data-action="dclear-filter-group" data-group="' + group + '" aria-label="Remove filter: ' + escapeHtml(text) + '">✕</button></div>');
    }
    if (f.boxes.length) chip('boxes', 'Box ' + f.boxes.slice().sort().join(', '));
    if (f.cases.length) chip('cases', f.cases.map(function(c){ return DECL_CASES[c].en; }).join(', '));
    if (f.status)       chip('status', labelFor(DSTATUS_FILTERS, f.status));
    if (!chips.length) return '';
    if (chips.length > 1) chips.push('<button class="text-btn" data-action="dclear-filters">Clear all</button>');
    return '<div class="filter-chips">' + chips.join('') + '</div>';
  }

  function renderDeclLibrary(){
    if (state.patBatchOpen) return renderPatternBatch();
    var html = kindSwitchHtml();

    if (state.patEditing === 'new') html += renderPatternForm(null);
    else html += '<div class="add-row">' +
      '<button class="add-toggle main" data-action="open-pattern-form">+ Add a pattern</button>' +
      '<button class="add-toggle main" data-action="open-pat-batch">+ Add several</button></div>';

    var backupHtml = '<div class="backup-row">' +
      '<button class="secondary" data-action="export-backup">Export backup</button>' +
      '<button class="secondary" data-action="import-backup">Import backup</button>' +
